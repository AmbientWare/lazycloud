{{/*
Create HTTPRoute for each service that has HTTP ingress enabled
Only creates routes for HTTP protocol (default) - TCP/UDP handled separately
*/}}
{{- range $service := .Values.services }}
{{- if and $service.enabled $service.ingress $service.ingress.enabled $service.ports }}
{{- $protocol := $service.ingress.protocol | default "http" }}
{{- if eq $protocol "http" }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $service.name }}
  namespace: {{ include "lazycloud-compose.serviceNamespace" (dict "serviceName" $service.name "Values" $.Values "root" $) }}
  labels:
    {{- include "lazycloud-compose.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $service.name }}
    app.kubernetes.io/component: httproute
    lazycloud.dev/service: {{ $service.name }}
    {{- if $service.labels }}
    {{- toYaml $service.labels | nindent 4 }}
    {{- end }}
    {{- if $service.ingress.labels }}
    {{- toYaml $service.ingress.labels | nindent 4 }}
    {{- end }}
  annotations:
    {{- include "lazycloud-compose.annotations" $ | nindent 4 }}
    {{- if $service.annotations }}
    {{- toYaml $service.annotations | nindent 4 }}
    {{- end }}
    {{- if $service.ingress.annotations }}
    {{- toYaml $service.ingress.annotations | nindent 4 }}
    {{- end }}
spec:
  parentRefs:
    - name: {{ $.Values.gateway.name | default "lazycloud-gateway" }}
      namespace: {{ $.Values.gateway.namespace | default "envoy-gateway-system" }}
  hostnames:
    - {{ $service.ingress.hostname | quote }}
  rules:
    - matches:
        - path:
            type: {{ $service.ingress.pathType | default "PathPrefix" }}
            value: {{ $service.ingress.path | default "/" }}
      backendRefs:
        {{- $firstPort := index $service.ports 0 }}
        - name: {{ $service.name }}
          port: {{ $firstPort.port }}
{{- end }}
{{- end }}
{{- end }}
