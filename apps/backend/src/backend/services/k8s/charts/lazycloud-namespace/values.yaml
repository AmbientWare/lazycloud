# Default values for lazycloud-namespace chart
# This chart sets up a secure namespace for user deployments

# Namespace configuration
namespace:
  # Name is typically set via --namespace flag during install
  # But can be overridden here
  name: ""
  
  # Labels to apply to the namespace
  labels:
    "lazycloud.dev/managed": "true"
    "lazycloud.dev/type": "user-namespace"
    "lazycloud.dev/depot-registry": "true"
  
  # Annotations for the namespace
  annotations: {}

# Pod Security Standards
podSecurityStandards:
  enabled: true
  enforce: baseline  # Options: privileged, baseline, restricted
  enforceVersion: latest
  audit: baseline
  auditVersion: latest
  warn: baseline
  warnVersion: latest

# Resource Quota for the entire namespace
# Modal-style: No CPU/memory quotas (users pay per usage), only object limits to prevent abuse
# These are fallback defaults - actual quotas are calculated dynamically from subscription features
resourceQuota:
  enabled: true
  # No CPU/memory quotas - users pay for what they use (usage-based billing)
  # Only object limits to prevent resource exhaustion/abuse
  # If resourceQuota.objects is provided dynamically, these defaults are ignored
  objects:
    pods: "50"  # Fallback default
    services: "10"  # Fallback default
    persistentvolumeclaims: "10"  # Fallback default (EBS/EFS)
    configmaps: "500"
    secrets: "500"
    count/deployments.apps: "5"  # Fallback default
    count/ingresses.networking.k8s.io: "10"  # Fallback default

# Default NetworkPolicy for namespace isolation
networkPolicy:
  enabled: true
  # Create a default deny-all policy
  defaultDenyAll: true
  # Allow DNS lookups
  allowDNS: true
  # Allow access to Kubernetes API (not recommended)
  allowKubeAPI: false
  # Additional allowed namespaces
  allowedNamespaces: []
  # Block cloud metadata services
  blockMetadataServices: true

# LimitRange for default container limits
limitRange:
  enabled: true
  limits:
    # Default limits for containers
    default:
      cpu: "2"
      memory: "2Gi"
      ephemeral-storage: "2Gi"
    # Default requests for containers
    defaultRequest:
      cpu: "125m"
      memory: "512Mi"
      ephemeral-storage: "1Gi"
    # Maximum limits
    max:
      cpu: "8"
      memory: "16Gi"
      ephemeral-storage: "256Gi"
    # Minimum limits
    min:
      cpu: "125m"
      memory: "128Mi"
      ephemeral-storage: "512Mi"

# ServiceAccount for the namespace
serviceAccount:
  create: true
  name: "restricted-sa"
  # No permissions by default
  automountServiceAccountToken: false

# RBAC settings
rbac:
  create: true
  # Create a ClusterRole that explicitly denies access
  createDenyRole: true