{{- if .Values.networkPolicy.enabled }}
{{- if .Values.networkPolicy.defaultDenyAll }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ .Values.namespace.name | default .Release.Namespace }}
  labels:
    {{- include "lazycloud-namespace.labels" . | nindent 4 }}
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  {{- if or .Values.networkPolicy.allowDNS .Values.networkPolicy.allowKubeAPI }}
  egress:
  {{- if .Values.networkPolicy.allowDNS }}
  # Allow DNS resolution
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    - podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  {{- end }}
  {{- if .Values.networkPolicy.allowKubeAPI }}
  # Allow Kubernetes API access (not recommended)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: TCP
      port: 443
  {{- end }}
  {{- end }}
{{- end }}

{{- if .Values.networkPolicy.blockMetadataServices }}
---
apiVersion: networking.k8s.io/v1  
kind: NetworkPolicy
metadata:
  name: block-metadata-services
  namespace: {{ .Values.namespace.name | default .Release.Namespace }}
  labels:
    {{- include "lazycloud-namespace.labels" . | nindent 4 }}
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  # Block cloud metadata services
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 169.254.169.254/32  # AWS/GCP/Hetzner metadata
        - 169.254.169.123/32  # Azure metadata
        - 100.100.100.200/32  # Alibaba Cloud metadata
{{- end }}
{{- end }}