[project]
name = "backend"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.41.5",
    "cachetools>=6.2.2",
    "dotenv>=0.9.9",
    "fastapi>=0.122.0",
    "kubernetes>=34.1.0",
    "loguru>=0.7.3",
    "models",
    "polar-sdk>=0.28.0",
    "pyyaml>=6.0.3",
    "api_requests",
    "responses",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.44",
    "sse-starlette>=3.0.3",
    "tenacity>=9.1.2",
    "uvicorn>=0.38.0",
    "kubernetes-asyncio>=33.3.0",
    "petname>=2.6",
    "resend>=2.19.0",
    "alembic>=1.17.2",
    "sentry-sdk[fastapi]>=2.46.0",
    "pyjwt[crypto]>=2.10.1",
    "saq[redis]>=0.26.1",
    "redis>=6.4.0",
    "asyncpg>=0.31.0",
    "configs",
]

[tool.uv.sources]
models = { workspace = true }
responses = { workspace = true }
api_requests = { workspace = true }
configs = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.408",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-env>=1.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "asyncio: mark test as async (auto-applied by pytest-asyncio)",
    "billing: billing flow tests",
]
env = [
    "DATABASE_URL=postgresql+asyncpg://lc_dev:password@localhost:6432/postgres",
    "REDIS_URL=redis://localhost:6379",
]

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportArgumentType = "warning"
reportReturnType = "warning"
reportAttributeAccessIssue = "warning"
reportOptionalMemberAccess = "warning"
reportCallIssue = "error"  # missing arguments
reportGeneralTypeIssues = "warning"  # kubernetes-asyncio has poor stubs
