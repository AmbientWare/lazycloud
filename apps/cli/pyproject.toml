[project]
name = "cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "api-requests",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "loguru>=0.7.3",
    "models",
    "pydantic-settings>=2.12.0",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.3",
    "responses",
    "textual>=6.6.0",
    "typer>=0.19.2",
]

[project.scripts]
lazycloud = "cli.commands:main_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli"]

[tool.uv.sources]
api-requests = { workspace = true }
responses = { workspace = true }
models = { workspace = true }

[dependency-groups]
dev = [
    "textual-dev>=1.8.0",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests requiring full stack",
]
