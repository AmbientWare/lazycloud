[project]
name = "cli"
version = "0.1.0"
description = "Full LazyCloud CLI."
requires-python = ">=3.12"
dependencies = [
    "agent",
    "database",
    "identity",
    "lazycloud-shared==0.1.0",
    "lazycloud==0.1.0",
    "pydantic>=2.8,<3",
    "rich>=13,<14",
    "typer>=0.26.7",
]

[project.scripts]
lazycloud-admin = "cli.main:start"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
