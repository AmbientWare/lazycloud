[project]
name = "lazycloud"
version = "0.1.13"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "api-requests",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "loguru>=0.7.3",
    "models",
    "platformdirs>=4.5.0",
    "pydantic-settings>=2.12.0",
    "pyfiglet>=1.0.4",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "responses",
    "textual>=6.6.0",
    "tomli>=2.3.0",
    "typer>=0.19.2",
]

[project.scripts]
lazycloud = "cli.commands:main_cli"
cli-logs = "cli.utils.logging:watch_logs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli"]

[tool.uv.sources]
api-requests = { workspace = true }
responses = { workspace = true }
models = { workspace = true }

[dependency-groups]
dev = [
    "textual-dev>=1.8.0",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.0",
    "pyinstaller>=6.17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 10
markers = [
    "e2e: end-to-end tests requiring full stack",
    "unit: fast unit tests with no external dependencies",
]

[tool.coverage.run]
source = ["src/cli"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
precision = 2
