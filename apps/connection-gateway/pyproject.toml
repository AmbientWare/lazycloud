[project]
name = "connection-gateway-app"
version = "0.1.0"
description = "Authenticated outbound agent connection gateway for LazyCloud."
requires-python = ">=3.12"
dependencies = [
    "compute",
    "coordination",
    "cryptography>=50,<51",
    "database",
    "gateway",
    "grpcio>=1.76,<2",
    "httpx>=0.27,<1",
    "identity",
    "lazycloud-shared==0.1.0",
    "networking",
    "observability",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2,<3",
]

[project.scripts]
lazycloud-connection-gateway = "connection_gateway_app.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
