package: api
output: openapi.gen.go
generate:
  std-http-server: true
  strict-server: true
  embedded-spec: true
additional-imports:
  - package: github.com/AmbientWare/lazycloud/internal/apitypes
    alias: .
output-options:
  nullable-type: true
  # The API host serves these path routes outside the operation router; see
  # workloadRoutes.
  exclude-operation-ids:
    - requestEndpointPath
    - requestEndpointPathVersion
    - requestAsgiPath
    - requestAsgiPathVersion
