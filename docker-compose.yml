networks:
  lazycloud:
    external: true

volumes:
  pg-data:
  redis-data:
  prefect-data:
  prefect-task-storage:
  localstack-data:

x-backend-volumes: &backend-volumes
  - ./apps/backend:/workspace/apps/backend
  - ./packages:/workspace/packages
  - ./pyproject.toml:/workspace/pyproject.toml
  - ./uv.lock:/workspace/uv.lock
  - "${HOME}/.kube/config-docker:/root/.kube/config:ro"
  - "${HOME}/.minikube:/root/.minikube:ro"
  - prefect-task-storage:/task-storage

services:
  api:
    networks:
      - lazycloud
    image: lazycloud-api:latest
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
      target: api
    links:
      - "localstack:localhost.localstack.cloud"
    volumes: *backend-volumes
    env_file:
      - .env
    working_dir: /workspace/apps/backend
    command: ["uv", "run", "--no-sync", "uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - 8000:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      db-migration:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      prefect-server:
        condition: service_started

  prefect-worker:
    networks:
      - lazycloud
    image: lazycloud-worker:latest
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
      target: prefect-worker
    volumes: *backend-volumes
    env_file:
      - .env
    working_dir: /workspace/apps/backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-migration:
        condition: service_completed_successfully
      prefect-server:
        condition: service_started

  prefect-server:
    image: prefecthq/prefect:3-latest
    networks:
      - lazycloud
    command: ["prefect", "server", "start"]
    volumes:
      - prefect-data:/root/.prefect
    env_file:
      - .env
    ports:
      - 4200:4200

  db-migration:
    networks:
      - lazycloud
    image: lazycloud-api:latest
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
      target: api
    volumes: *backend-volumes
    env_file:
      - .env
    working_dir: /workspace/apps/backend
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    networks:
      - lazycloud
    env_file:
      - .env
    environment:
      POSTGRES_KEEPALIVES: 1
      POSTGRES_KEEPALIVES_IDLE: 60
      POSTGRES_KEEPALIVES_INTERVAL: 10
      POSTGRES_KEEPALIVES_COUNT: 3
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lc_dev -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - 5432:5432

  redis:
    image: redis:latest
    networks:
      - lazycloud
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    labels:
      lazycloud.ignore: "true"
    image: localstack/localstack-pro:latest
    container_name: lazycloud-localstack
    networks:
      lazycloud:
        aliases:
          - 000000000000.dkr.ecr.us-east-1.localhost
    ports:
      - "127.0.0.1:4566:4566"
      - "127.0.0.1:4510-4559:4510-4559"
    env_file:
      - ./apps/backend/.env
    environment:
      DEBUG: 0
      DOCKER_HOST: unix:///var/run/docker.sock
      EKS_LOADBALANCER_PORT: 8081
      EKS_K8S_PROVIDER: local
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./scripts/setup_localstack_iam.sh:/etc/localstack/init/ready.d/setup_iam.sh"
      - "./scripts/setup_eks_cluster.sh:/etc/localstack/init/ready.d/setup_eks_cluster.sh"
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    labels:
      lazycloud.ignore: "true"
    networks:
      - lazycloud
    profiles: [frontend]
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    env_file:
      - ./apps/web/.env
    ports:
      - 3000:3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
