# create a network for the services to communicate
networks:
  lazycloud:
    external: true

# create volumes for the databases
volumes:
  pg-data: # postgres data
  redis-data: # redis data

services:
  api:
    image: lazycloud-api:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    volumes:
      # this allows for hot reloading
      - ./src/lazycloud_api:/src/lazycloud_api
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://lazycloud-dev:password@postgres:5432/lazycloud
      - REDIS_URL=redis://redis:6379
    networks:
      - lazycloud
    command: ["uv", "run", "python", "main.py", "--debug", "--workers", "1"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://api:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - 8000:8000

  celery-beat:
    image: lazycloud-api:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: celery-beat
    volumes:
      # this allows for hot reloading
      - ./src/lazycloud_api:/src/lazycloud_api
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://lazycloud-dev:password@postgres:5432/lazycloud
      - REDIS_URL=redis://redis:6379
    networks:
      - lazycloud
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      replicas: 1  # Ensure only one beat instance runs

  celery-worker:
    image: lazycloud-api:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: celery-worker
    volumes:
      # this allows for hot reloading
      - ./src/lazycloud_api:/src/lazycloud_api
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://lazycloud-dev:password@postgres:5432/lazycloud
      - REDIS_URL=redis://redis:6379
    networks:
      - lazycloud
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      celery-beat:
        condition: service_started

  postgres:
    image: timescale/timescaledb-ha:pg17
    networks:
      - lazycloud
    environment:
      POSTGRES_USER: lazycloud-dev
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lazycloud
      POSTGRES_KEEPALIVES: 1
      POSTGRES_KEEPALIVES_IDLE: 60
      POSTGRES_KEEPALIVES_INTERVAL: 10
      POSTGRES_KEEPALIVES_COUNT: 3
    # add persistent storage
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lazycloud-dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    networks:
      - lazycloud
    volumes:
      - redis-data:/data
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
