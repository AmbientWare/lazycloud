# create a network for the services to communicate
networks:
  machines:
    external: true

# create volumes for the databases
volumes:
  pg-data: # postgres data

services:
  api:
    image: machines-api:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    volumes:
      # this allows for hot reloading
      - ./poetry.lock:/machines/poetry.lock
      - ./pyproject.toml:/machines/pyproject.toml
      - ./machines:/machines
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://machines-dev:password@postgres:5432/machines
    networks:
      - machines
    command: ["python", "main.py", "--debug", "--workers", "1"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://api:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 8000:8000

  postgres:
    image: timescale/timescaledb-ha:pg17
    networks:
      - machines
    environment:
      POSTGRES_USER: machines-dev
      POSTGRES_PASSWORD: password
      POSTGRES_DB: machines
      POSTGRES_KEEPALIVES: 1
      POSTGRES_KEEPALIVES_IDLE: 60
      POSTGRES_KEEPALIVES_INTERVAL: 10
      POSTGRES_KEEPALIVES_COUNT: 3
    # add persistent storage
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U machines-dev"]
      interval: 10s
      timeout: 5s
      retries: 5
