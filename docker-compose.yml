networks:
  lazycloud:
    external: true

volumes:
  pg-data:
  redis-data:
  localstack-data:

x-backend-volumes: &backend-volumes
  - ./apps/backend:/workspace/apps/backend
  - ./packages:/workspace/packages
  - ./pyproject.toml:/workspace/pyproject.toml
  - ./uv.lock:/workspace/uv.lock
  - "${HOME}/.kube/config-docker:/root/.kube/config:ro"
  - "${HOME}/.minikube:/root/.minikube:ro"

services:
  api:
    networks:
      - lazycloud
    image: lazycloud-api:latest
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
      target: api
    links:
      - "localstack:localhost.localstack.cloud"
    volumes: *backend-volumes
    env_file:
      - path: ./apps/backend/.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://lc_dev:lc_dev@pgbouncer:6432/lazycloud}
    working_dir: /workspace/apps/backend
    command: ["uv", "run", "--no-sync", "uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--no-access-log"]
    ports:
      - 8000:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      db-migration:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_started

  crons:
    networks:
      - lazycloud
    image: lazycloud-worker:latest
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
      target: crons
    volumes: *backend-volumes
    env_file:
      - path: ./apps/backend/.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://lc_dev:lc_dev@pgbouncer:6432/lazycloud}
    working_dir: /workspace/apps/backend
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy
      db-migration:
        condition: service_completed_successfully
      redis:
        condition: service_started

  background-workers:
    networks:
      - lazycloud
    image: lazycloud-background-worker:latest
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
      target: background-workers
    volumes: *backend-volumes
    env_file:
      - path: ./apps/backend/.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://lc_dev:lc_dev@pgbouncer:6432/lazycloud}
    working_dir: /workspace/apps/backend
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy
      db-migration:
        condition: service_completed_successfully
      redis:
        condition: service_started
      localstack:
        condition: service_healthy

  db-migration:
    networks:
      - lazycloud
    image: lazycloud-api:latest
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
      target: api
    volumes: *backend-volumes
    env_file:
      - path: ./apps/backend/.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://lc_dev:lc_dev@postgres:5432/lazycloud}
    working_dir: /workspace/apps/backend
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    networks:
      - lazycloud
    env_file:
      - path: ./apps/backend/.env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lc_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lc_dev}
      POSTGRES_DB: ${POSTGRES_DB:-lazycloud}
      POSTGRES_KEEPALIVES: 1
      POSTGRES_KEEPALIVES_IDLE: 60
      POSTGRES_KEEPALIVES_INTERVAL: 10
      POSTGRES_KEEPALIVES_COUNT: 3
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lc_dev -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - 5432:5432

  pgbouncer:
    image: edoburu/pgbouncer:latest
    networks:
      - lazycloud
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lc_dev}:${POSTGRES_PASSWORD:-lc_dev}@postgres:5432/${POSTGRES_DB:-lazycloud}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      LISTEN_PORT: 6432
      AUTH_TYPE: scram-sha-256
    ports:
      - 6432:6432
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432", "-U", "lc_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    networks:
      - lazycloud
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    labels:
      lazycloud.ignore: "true"
    image: localstack/localstack-pro:latest
    container_name: lazycloud-localstack
    networks:
      lazycloud:
        aliases:
          - 000000000000.dkr.ecr.us-east-1.localhost
    ports:
      - "127.0.0.1:4566:4566"
      - "127.0.0.1:4510-4559:4510-4559"
    env_file:
      - path: ./apps/backend/.env
        required: false
    environment:
      DEBUG: 0
      DOCKER_HOST: unix:///var/run/docker.sock
      EKS_LOADBALANCER_PORT: 8081
      EKS_K8S_PROVIDER: local
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./scripts/setup_localstack_iam.sh:/etc/localstack/init/ready.d/setup_iam.sh"
      - "./scripts/setup_eks_cluster.sh:/etc/localstack/init/ready.d/setup_eks_cluster.sh"
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    labels:
      lazycloud.ignore: "true"
    networks:
      - lazycloud
    profiles: [frontend]
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    env_file:
      - path: ./apps/web/.env
        required: false
    ports:
      - 3000:3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  ngrok:
    image: ngrok/ngrok:latest
    networks:
      - lazycloud
    profiles: [frontend]
    command: ["http", "http://web:3000", "--domain=lazycloud.ambientware.co"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      web:
        condition: service_healthy
