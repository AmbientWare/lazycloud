networks:
  lazycloud:
    external: true

volumes:
  pg-data:
  redis-data:
  prefect-data:
  prefect-task-storage:
  localstack-data:
  
x-database-environment: &lazycloud-databases
  DATABASE_URL: postgresql+asyncpg://lc_dev:password@postgres:5432/postgres
  REDIS_URL: redis://redis:6379

x-shared-environment: &lazycloud-shared-environment
  <<: *lazycloud-databases
  KUBECONFIG: /root/.kube/config
  PREFECT_API_URL: http://prefect-server:4200/api
  PREFECT_LOGGING_LOG_PRINTS: "true"
  PREFECT_LOCAL_STORAGE_PATH: /task-storage
  PREFECT_RESULTS_PERSIST_BY_DEFAULT: "true"
  # AWS Configuration (defaults to LocalStack for dev)
  AWS_ACCOUNT_ID: "000000000000"
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_REGION: us-east-1
  AWS_ECR_BASE_ROLE_ARN: arn:aws:iam::000000000000:role/LazyCloudECRBaseRole
  # Monitoring Configuration
  PROMETHEUS_URL: http://minikube:30090

x-shared-volumes: &lazycloud-shared-volumes
  - ./src/lazycloud_api:/src/lazycloud_api
  - "${HOME}/.kube/config-docker:/root/.kube/config:ro"
  - "${HOME}/.minikube:/root/.minikube:ro"
  - ./src/shared:/src/shared
  - prefect-task-storage:/task-storage

services:
  api:
    networks:
      lazycloud:
        ipv4_address: 172.20.0.10
    image: lazycloud-api:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    links:
      - "localstack:localhost.localstack.cloud"
    volumes: *lazycloud-shared-volumes
    env_file:
      - .env
    environment:
      <<: *lazycloud-shared-environment
    command: [ "uv", "run", "python", "main.py", "--debug", "--workers", "1" ]
    ports:
      - 8000:8000
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      localstack:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      prefect-server:
        condition: service_started

  prefect-worker:
    networks:
      lazycloud:
        ipv4_address: 172.20.0.11
    image: lazycloud-worker:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: prefect-worker
    volumes: *lazycloud-shared-volumes
    env_file:
      - .env
    environment:
      <<: *lazycloud-shared-environment
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      prefect-server:
        condition: service_started

  prefect-server:
    image: prefecthq/prefect:3-latest
    networks:
      lazycloud:
        ipv4_address: 172.20.0.12
    command: ["prefect", "server", "start"]
    volumes:
      - prefect-data:/root/.prefect
    environment:
      # Allow connections from other containers
      PREFECT_SERVER_API_HOST: 0.0.0.0
    ports:
      - 4200:4200

  postgres:
    image: postgres:17
    networks:
      lazycloud:
        ipv4_address: 172.20.0.13
    environment:
      POSTGRES_USER: lc_dev
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
      POSTGRES_KEEPALIVES: 1
      POSTGRES_KEEPALIVES_IDLE: 60
      POSTGRES_KEEPALIVES_INTERVAL: 10
      POSTGRES_KEEPALIVES_COUNT: 3
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lc_dev -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - 5432:5432

  redis:
    image: redis:latest
    networks:
      lazycloud:
        ipv4_address: 172.20.0.14
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack-pro:latest
    container_name: lazycloud-localstack
    networks:
      lazycloud:
        ipv4_address: 172.20.0.15
        aliases:
          # NOTE: this is the registry url for the localstack registry
          - 000000000000.dkr.ecr.us-east-1.localhost
    ports:
      - "127.0.0.1:4566:4566"
      - "127.0.0.1:4510-4559:4510-4559"
    env_file:
      - .env
    environment:
      - DEBUG=0
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://localstack:4566
      # EKS configuration
      - EKS_LOADBALANCER_PORT=8081
      # NOTE: minikube is used becuase it has built in gvisor runtimeclass
      - EKS_K8S_PROVIDER=local
      - LOCALSTACK_HOST=localhost
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./scripts/setup_localstack_iam.sh:/etc/localstack/init/ready.d/setup_iam.sh"
      - "./scripts/setup_eks_cluster.sh:/etc/localstack/init/ready.d/setup_eks_cluster.sh"
      - localstack-data:/var/lib/localstack
      - "${HOME}/.kube/config-docker:/root/.kube/config:ro"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
