<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Document OCR</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">LazyCloud example</p>
      <h1>Extract text from a document</h1>
      <p class="lede">Upload a PDF, PNG, or JPEG up to 10 MiB. Processing continues as a durable Task.</p>
      <form id="upload-form">
        <label for="document">Document</label>
        <input id="document" type="file" accept="application/pdf,image/png,image/jpeg" required />
        <button type="submit">Extract text</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <pre id="result" hidden></pre>
      <button id="delete" type="button" hidden>Delete result</button>
    </main>
    <script src="/static/app.js" defer></script>
  </body>
</html>
