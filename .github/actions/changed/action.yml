name: Changed
description: >-
  Whether the pull request changes any of the given git pathspecs, where *
  also matches /. Outside a pull request everything counts as changed.
inputs:
  paths:
    description: Pathspecs, one per line.
    required: true
outputs:
  changed:
    description: '"true" or "false".'
    value: ${{ steps.diff.outputs.changed }}
runs:
  using: composite
  steps:
    - id: diff
      shell: bash
      env:
        BASE: ${{ github.event.pull_request.base.sha }}
        PATHS: ${{ inputs.paths }}
      run: |
        set -euo pipefail
        if [ -z "$BASE" ]; then
          echo "changed=true" >>"$GITHUB_OUTPUT"
          exit 0
        fi
        git fetch --no-tags --depth=1 origin "$BASE"
        mapfile -t paths < <(printf '%s\n' "$PATHS" | sed '/^[[:space:]]*$/d')
        if git diff --quiet "$BASE" HEAD -- "${paths[@]}"; then
          echo "changed=false" >>"$GITHUB_OUTPUT"
        else
          echo "changed=true" >>"$GITHUB_OUTPUT"
        fi
