name: Docker Images

# A build check for every image family, run by hand. It publishes nothing:
# production images reach ECR through `deploy.yml`, and the release tag is
# pushed by `ship.yml` with the workflow token, which starts no other workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-plane:
    name: Build control-plane image family
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build control-plane images
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker/bake.hcl
          targets: control-plane
          set: |
            *.cache-from=type=gha,scope=docker-images-control-plane
            *.cache-to=type=gha,mode=max,scope=docker-images-control-plane
            api.tags=ghcr.io/${{ github.repository }}-api:${{ github.sha }}
            scheduler.tags=ghcr.io/${{ github.repository }}-scheduler:${{ github.sha }}
            tunnel-gateway.tags=ghcr.io/${{ github.repository }}-tunnel-gateway:${{ github.sha }}
            cache-server.tags=ghcr.io/${{ github.repository }}-cache-server:${{ github.sha }}
            worker-bootstrap.tags=ghcr.io/${{ github.repository }}-worker-bootstrap:${{ github.sha }}
            cli.tags=ghcr.io/${{ github.repository }}-cli:${{ github.sha }}
            database-bootstrap.tags=ghcr.io/${{ github.repository }}-database-bootstrap:${{ github.sha }}

  agent:
    name: Build agent image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build agent image
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker/bake.hcl
          targets: agent
          set: |
            agent.cache-from=type=gha,scope=docker-images-agent
            agent.cache-to=type=gha,mode=max,scope=docker-images-agent
            agent.tags=ghcr.io/${{ github.repository }}-agent:${{ github.sha }}

  worker:
    name: Build container-worker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container-worker image
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker/bake.hcl
          targets: container-worker
          set: |
            container-worker.cache-from=type=gha,scope=docker-images-worker
            container-worker.cache-to=type=gha,mode=max,scope=docker-images-worker
            container-worker.tags=ghcr.io/${{ github.repository }}-container-worker:${{ github.sha }}
