name: Helm chart

on:
  pull_request:
    paths:
      - ".github/workflows/helm.yml"
      - "deploy/charts/lazycloud/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/helm.yml"
      - "deploy/charts/lazycloud/**"

permissions:
  contents: read

jobs:
  validate:
    name: Render Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Validate current chart
        run: |
          helm lint deploy/charts/lazycloud --values deploy/charts/lazycloud/values.local.yaml
          helm template lazycloud deploy/charts/lazycloud \
            --namespace lazycloud-system \
            --values deploy/charts/lazycloud/values.local.yaml >/dev/null
