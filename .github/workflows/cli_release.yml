name: Update Releases Repo

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.0). Leave empty to only sync examples/README.'
        required: false
        type: string

jobs:
  build:
    if: ${{ inputs.version != '' }}
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Linux AMD64
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            python-arch: x64

          # macOS Intel
          - os: darwin
            arch: amd64
            runner: macos-15-intel
            python-arch: x64

          # macOS Apple Silicon
          - os: darwin
            arch: arm64
            runner: macos-latest
            python-arch: arm64

          # Windows
          - os: windows
            arch: amd64
            runner: windows-latest
            python-arch: x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python-arch }}

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Install dependencies
        run: |
          cd apps/cli
          uv sync
          uv pip install pyinstaller

      - name: Build binary with PyInstaller
        run: |
          cd apps/cli
          uv run pyinstaller release/build.spec --clean

      - name: Create tarball (Linux)
        if: matrix.os == 'linux'
        run: |
          cd apps/cli/dist
          tar -czf lazycloud-${{ matrix.os }}-${{ matrix.arch }}.tar.gz lazycloud
          sha256sum lazycloud-${{ matrix.os }}-${{ matrix.arch }}.tar.gz > lazycloud-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256

      - name: Create tarball (macOS)
        if: matrix.os == 'darwin'
        run: |
          cd apps/cli/dist
          tar -czf lazycloud-${{ matrix.os }}-${{ matrix.arch }}.tar.gz lazycloud
          shasum -a 256 lazycloud-${{ matrix.os }}-${{ matrix.arch }}.tar.gz | awk '{print $1}' > lazycloud-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256

      - name: Create zip (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          cd apps/cli/dist
          Compress-Archive -Path lazycloud.exe -DestinationPath lazycloud-${{ matrix.os }}-${{ matrix.arch }}.zip
          (Get-FileHash lazycloud-${{ matrix.os }}-${{ matrix.arch }}.zip -Algorithm SHA256).Hash.ToLower() | Out-File -NoNewline -FilePath lazycloud-${{ matrix.os }}-${{ matrix.arch }}.zip.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lazycloud-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            apps/cli/dist/lazycloud-*

  sync:
    name: Sync Examples and README
    if: ${{ always() && (inputs.version == '' || needs.build.result == 'success') }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Checkout releases repo
        uses: actions/checkout@v4
        with:
          repository: AmbientWare/lazycloud-releases
          token: ${{ secrets.ADMIN_TOKEN }}
          path: releases-repo

      - name: Configure git
        working-directory: releases-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync README and examples
        working-directory: releases-repo
        run: |
          cp ../apps/cli/release/release_readme.md README.md
          rm -rf examples
          cp -r ../examples .
          git add README.md examples
          git diff --staged --quiet || git commit -m "Sync examples and README"
          git push

  release:
    name: Create GitHub Release
    if: ${{ inputs.version != '' }}
    needs: [build, sync]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Create GitHub Release in releases repo
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          mkdir -p release-assets
          find artifacts -type f -name "lazycloud-*" -exec cp {} release-assets/ \;

          # Delete existing release and tag if they exist
          gh release delete "v${{ inputs.version }}" --repo AmbientWare/lazycloud-releases --yes --cleanup-tag || true

          gh release create "v${{ inputs.version }}" \
            --repo AmbientWare/lazycloud-releases \
            --title "Release v${{ inputs.version }}" \
            --notes-file apps/cli/release/release_readme.md \
            release-assets/*
