name: Build and Release CLI Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.0)'
        required: true
        type: string

jobs:
  version-bump:
    name: Bump Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ADMIN_TOKEN }}

      - name: Update version in pyproject.toml
        run: |
          sed -i 's/^version = ".*"/version = "${{ inputs.version }}"/' apps/cli/pyproject.toml
          echo "Updated version to ${{ inputs.version }}"
          grep '^version = ' apps/cli/pyproject.toml

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/cli/pyproject.toml
          git commit -m "CLI: bump version to ${{ inputs.version }}"
          git push

  build:
    needs: version-bump
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Linux AMD64
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            python-arch: x64

          # macOS Intel
          - os: darwin
            arch: amd64
            runner: macos-15-intel
            python-arch: x64

          # macOS Apple Silicon
          - os: darwin
            arch: arm64
            runner: macos-latest
            python-arch: arm64

          # Windows
          - os: windows
            arch: amd64
            runner: windows-latest
            python-arch: x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main  # Get the latest code after version bump

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python-arch }}

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Install dependencies
        run: |
          cd apps/cli
          uv sync
          uv pip install pyinstaller

      - name: Build binary with PyInstaller
        run: |
          cd apps/cli
          uv run pyinstaller release/build.spec --clean

      - name: Create tarball (Linux)
        if: matrix.os == 'linux'
        run: |
          cd apps/cli/dist
          tar -czf lazycloud-${{ matrix.os }}-${{ matrix.arch }}.tar.gz lazycloud
          sha256sum lazycloud-${{ matrix.os }}-${{ matrix.arch }}.tar.gz > lazycloud-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256

      - name: Create tarball (macOS)
        if: matrix.os == 'darwin'
        run: |
          cd apps/cli/dist
          tar -czf lazycloud-${{ matrix.os }}-${{ matrix.arch }}.tar.gz lazycloud
          shasum -a 256 lazycloud-${{ matrix.os }}-${{ matrix.arch }}.tar.gz | awk '{print $1}' > lazycloud-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256

      - name: Create zip (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          cd apps/cli/dist
          Compress-Archive -Path lazycloud.exe -DestinationPath lazycloud-${{ matrix.os }}-${{ matrix.arch }}.zip
          (Get-FileHash lazycloud-${{ matrix.os }}-${{ matrix.arch }}.zip -Algorithm SHA256).Hash.ToLower() | Out-File -NoNewline -FilePath lazycloud-${{ matrix.os }}-${{ matrix.arch }}.zip.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lazycloud-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            apps/cli/dist/lazycloud-*

  release:
    name: Publish to Releases Repo
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          ref: main  # Get the latest code after version bump

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep '^version = ' apps/cli/pyproject.toml | sed 's/version = "\(.*\)"/v\1/')
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Checkout releases repo
        uses: actions/checkout@v4
        with:
          repository: AmbientWare/lazycloud-releases
          token: ${{ secrets.ADMIN_TOKEN }}
          path: releases-repo

      - name: Configure git
        working-directory: releases-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update README if changed
        working-directory: releases-repo
        run: |
          cp ../apps/cli/release/release_readme.md README.md
          git add README.md
          git diff --staged --quiet || git commit -m "Update README for ${{ steps.version.outputs.tag }}"
          git push

      - name: Create GitHub Release in releases repo
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          # Flatten artifacts into a single directory
          mkdir -p release-assets
          find artifacts -type f -name "lazycloud-*" -exec cp {} release-assets/ \;

          gh release create ${{ steps.version.outputs.tag }} \
            --repo AmbientWare/lazycloud-releases \
            --title "Release ${{ steps.version.outputs.tag }}" \
            --notes-file apps/cli/release/release_readme.md \
            release-assets/*
