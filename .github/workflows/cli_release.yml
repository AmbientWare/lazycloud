name: Build and Release CLI Binaries

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Linux AMD64
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            python-arch: x64

          # macOS Intel
          - os: darwin
            arch: amd64
            runner: macos-15-intel
            python-arch: x64

          # macOS Apple Silicon
          - os: darwin
            arch: arm64
            runner: macos-latest
            python-arch: arm64

          # Windows
          - os: windows
            arch: amd64
            runner: windows-latest
            python-arch: x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python-arch }}

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Install dependencies
        run: |
          cd apps/cli
          uv sync
          uv pip install pyinstaller

      - name: Build binary with PyInstaller
        run: |
          cd apps/cli
          uv run pyinstaller release/build.spec --clean

      - name: Create tarball (Linux)
        if: matrix.os == 'linux'
        run: |
          cd apps/cli/dist
          tar -czf lazycloud-${{ matrix.os }}-${{ matrix.arch }}.tar.gz lazycloud
          sha256sum lazycloud-${{ matrix.os }}-${{ matrix.arch }}.tar.gz > lazycloud-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256

      - name: Create tarball (macOS)
        if: matrix.os == 'darwin'
        run: |
          cd apps/cli/dist
          tar -czf lazycloud-${{ matrix.os }}-${{ matrix.arch }}.tar.gz lazycloud
          shasum -a 256 lazycloud-${{ matrix.os }}-${{ matrix.arch }}.tar.gz | awk '{print $1}' > lazycloud-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256

      - name: Create zip (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          cd apps/cli/dist
          Compress-Archive -Path lazycloud.exe -DestinationPath lazycloud-${{ matrix.os }}-${{ matrix.arch }}.zip
          (Get-FileHash lazycloud-${{ matrix.os }}-${{ matrix.arch }}.zip -Algorithm SHA256).Hash.ToLower() | Out-File -NoNewline -FilePath lazycloud-${{ matrix.os }}-${{ matrix.arch }}.zip.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lazycloud-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            apps/cli/dist/lazycloud-*

  release:
    name: Publish to Releases Repo
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep '^version = ' apps/cli/pyproject.toml | sed 's/version = "\(.*\)"/v\1/')
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Checkout releases repo
        uses: actions/checkout@v4
        with:
          repository: AmbientWare/lazycloud-releases
          token: ${{ secrets.ADMIN_TOKEN }}
          path: releases-repo

      - name: Configure git
        working-directory: releases-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Copy README and artifacts
        run: |
          # Copy release README as main README
          cp apps/cli/release/release_readme.md releases-repo/README.md

          # Create release directory if it doesn't exist
          mkdir -p releases-repo/${{ steps.version.outputs.tag }}

          # Copy all binaries to release directory
          find artifacts -type f -name "lazycloud-*" -exec cp {} releases-repo/${{ steps.version.outputs.tag }}/ \;

      - name: Commit and push to releases repo
        working-directory: releases-repo
        run: |
          git add .
          git commit -m "Release ${{ steps.version.outputs.tag }}" || echo "No changes to commit"
          git push

      - name: Create GitHub Release in releases repo
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          cd releases-repo
          gh release create ${{ steps.version.outputs.tag }} \
            --repo AmbientWare/lazycloud-releases \
            --title "Release ${{ steps.version.outputs.tag }}" \
            --notes-file ../apps/cli/release/release_readme.md \
            ${{ steps.version.outputs.tag }}/*
