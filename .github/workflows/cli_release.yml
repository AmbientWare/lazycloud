name: Update Releases Repo

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - sync-only
        default: patch

jobs:
  calculate-version:
    name: Calculate Version
    if: ${{ inputs.bump_type != 'sync-only' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Calculate new version
        id: bump
        run: |
          # Read current version from pyproject.toml
          CURRENT=$(grep -oP '^version = "\K[^"]+' apps/cli/pyproject.toml)
          echo "Current version: $CURRENT"

          # Parse version components
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          # Increment based on bump type
          case "${{ inputs.bump_type }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update pyproject.toml
        run: |
          sed -i 's/^version = ".*"/version = "${{ steps.bump.outputs.version }}"/' apps/cli/pyproject.toml

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/cli/pyproject.toml
          git commit -m "Bump CLI version to ${{ steps.bump.outputs.version }}"
          git push

  build:
    needs: calculate-version
    if: ${{ inputs.bump_type != 'sync-only' }}
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: depot-ubuntu-24.04
            python-arch: x64
          - os: linux
            arch: arm64
            runner: depot-ubuntu-24.04-arm
            python-arch: arm64
          - os: darwin
            arch: amd64
            runner: macos-15-intel
            python-arch: x64
          - os: darwin
            arch: arm64
            runner: macos-latest
            python-arch: arm64
          - os: windows
            arch: amd64
            runner: windows-latest
            python-arch: x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main  # Get the latest commit with version bump

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python-arch }}

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Install dependencies
        working-directory: apps/cli
        run: |
          uv sync
          uv pip install pyinstaller

      - name: Build binary with PyInstaller
        working-directory: apps/cli
        run: uv run pyinstaller release/build.spec --clean

      - name: Create tarball (Linux)
        if: matrix.os == 'linux'
        working-directory: apps/cli/dist
        run: |
          tar -czf lazycloud-${{ matrix.os }}-${{ matrix.arch }}.tar.gz lazycloud
          sha256sum lazycloud-${{ matrix.os }}-${{ matrix.arch }}.tar.gz > lazycloud-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256

      - name: Create tarball (macOS)
        if: matrix.os == 'darwin'
        working-directory: apps/cli/dist
        run: |
          tar -czf lazycloud-${{ matrix.os }}-${{ matrix.arch }}.tar.gz lazycloud
          shasum -a 256 lazycloud-${{ matrix.os }}-${{ matrix.arch }}.tar.gz | awk '{print $1}' > lazycloud-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256

      - name: Create zip (Windows)
        if: matrix.os == 'windows'
        working-directory: apps/cli/dist
        shell: pwsh
        run: |
          Compress-Archive -Path lazycloud.exe -DestinationPath lazycloud-${{ matrix.os }}-${{ matrix.arch }}.zip
          (Get-FileHash lazycloud-${{ matrix.os }}-${{ matrix.arch }}.zip -Algorithm SHA256).Hash.ToLower() | Out-File -NoNewline -FilePath lazycloud-${{ matrix.os }}-${{ matrix.arch }}.zip.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lazycloud-${{ matrix.os }}-${{ matrix.arch }}
          path: apps/cli/dist/lazycloud-*

  sync:
    name: Sync Examples and README
    if: ${{ always() && (inputs.bump_type == 'sync-only' || needs.build.result == 'success') }}
    needs: [calculate-version, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Checkout releases repo
        uses: actions/checkout@v4
        with:
          repository: AmbientWare/lazycloud-releases
          token: ${{ secrets.ADMIN_TOKEN }}
          path: releases-repo

      - name: Sync README and examples
        working-directory: releases-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp ../apps/cli/release/release_readme.md README.md
          rm -rf examples
          cp -r ../examples .
          git add README.md examples
          git diff --staged --quiet || git commit -m "Sync examples and README"
          git push

  release:
    name: Create GitHub Release
    if: ${{ inputs.bump_type != 'sync-only' }}
    needs: [calculate-version, build, sync]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          VERSION: ${{ needs.calculate-version.outputs.version }}
        run: |
          mkdir -p release-assets
          find artifacts -type f -name "lazycloud-*" -exec cp {} release-assets/ \;

          # Delete existing release if retrying (only works for unpublished/draft releases)
          gh release delete "v${VERSION}" --repo AmbientWare/lazycloud-releases --yes --cleanup-tag 2>/dev/null || true

          gh release create "v${VERSION}" \
            --repo AmbientWare/lazycloud-releases \
            --title "Release v${VERSION}" \
            --notes-file apps/cli/release/release_readme.md \
            release-assets/*
