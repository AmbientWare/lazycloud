name: Publish platform images

on:
  workflow_call:
    inputs:
      commit:
        type: string
        required: true
    outputs:
      images:
        value: ${{ jobs.publish.outputs.images }}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      images: ${{ steps.publish.outputs.images }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}
      - uses: astral-sh/setup-uv@v5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v4
      - name: Expose the build cache environment
        uses: actions/github-script@v8
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              const value = process.env[name];
              if (!value) throw new Error(`${name} is unavailable`);
              core.setSecret(value);
              core.exportVariable(name, value);
            }
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'true');
      - name: Publish and verify every platform image
        id: publish
        env:
          INFRASTRUCTURE_CONFIG_URI: ${{ vars.INFRASTRUCTURE_CONFIG_URI }}
          LAZYCLOUD_OBJECT_STORE_ENDPOINT_URL: ${{ vars.LAZYCLOUD_OBJECT_STORE_ENDPOINT_URL }}
          LAZYCLOUD_OBJECT_STORE_REGION_NAME: ${{ vars.LAZYCLOUD_OBJECT_STORE_REGION_NAME }}
          LAZYCLOUD_OBJECT_STORE_FORCE_PATH_STYLE: ${{ vars.LAZYCLOUD_OBJECT_STORE_FORCE_PATH_STYLE }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          uv run --frozen --group workspace python -m deploy.object_storage download \
            --uri "$INFRASTRUCTURE_CONFIG_URI" --file "$RUNNER_TEMP/infrastructure.json"
          uv run --frozen --group workspace python -m deploy.platform_images \
            --infrastructure "$RUNNER_TEMP/infrastructure.json" --commit "$RELEASE_COMMIT" \
            --output "$RUNNER_TEMP/platform-images.json"
          echo "images=$(cat "$RUNNER_TEMP/platform-images.json")" >> "$GITHUB_OUTPUT"
