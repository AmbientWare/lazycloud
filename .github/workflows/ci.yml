name: Python changed scope

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "apps/**/*.py"
      - "packages/**/*.py"
      - "tests/**"
      - "conftest.py"
      - "compose.test.yaml"
      - ".python-version"
      - "benchmarks/**/*.py"
      - "deploy/**/*.py"
      - "examples/**/*.py"
      - ".github/scripts/**/*.py"
      - "pyproject.toml"
      - "**/pyproject.toml"
      - "uv.lock"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - "apps/**/*.py"
      - "packages/**/*.py"
      - "tests/**"
      - "conftest.py"
      - "compose.test.yaml"
      - ".python-version"
      - "benchmarks/**/*.py"
      - "deploy/**/*.py"
      - "examples/**/*.py"
      - ".github/scripts/**/*.py"
      - "pyproject.toml"
      - "**/pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

concurrency:
  group: python-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Repository lint and format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          version: "0.11.21"

      - name: Install lint tools
        run: uv sync --locked --only-group lint

      - name: Ruff lint
        run: uv run --only-group lint ruff check .

      - name: Ruff format
        run: uv run --only-group lint ruff format --check .

      # The worker image refuses a lock whose metadata digest disagrees with the
      # managed packages, and it does so twenty minutes into a release. A rename
      # in a pyproject is caught here instead.
      - name: Managed runtime locks are current
        run: uv run --no-project python deploy/managed-runtime/locks.py check

      - name: Validate test service definition
        run: docker compose -f compose.test.yaml config --quiet

      - name: Validate blind exception handlers
        run: uv run --no-project python .github/scripts/validate_blind_handlers.py

  types:
    name: Changed Python types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          version: "0.11.21"
      - run: uv sync --locked --group dev
      - name: Check changed Python types
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run --group dev python .github/scripts/validate_changed_scope.py --base "${BASE_SHA}" --check types
      - name: Connection role policy is current
        run: uv run --group dev python deploy/render_connection_policy.py --check

  # The customer package claims Python 3.10 through 3.14, and the two wheels
  # it ships are all a customer gets. Installing them into an empty environment
  # on every version is what catches an import that only one interpreter
  # lacks, and it catches it here rather than on a customer's machine.
  client-wheels:
    name: Client wheels install on every supported Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          version: "0.11.21"

      - name: Build the wheels
        run: |
          set -euo pipefail
          uv build --package lazycloud-shared -o dist/pypi
          uv build --package lazycloud-client -o dist/pypi

      - name: Install them on every supported Python
        shell: bash
        run: |
          set -euo pipefail
          for python in 3.10 3.11 3.12 3.13 3.14; do
            uv run --isolated --no-project --python "${python}" \
              --with dist/pypi/lazycloud_shared-*.whl \
              --with dist/pypi/lazycloud_client-*.whl \
              -- python - <<'PY'
          import importlib, pkgutil, sys
          import lazycloud, shared
          failed = []
          for package in (lazycloud, shared):
              for module in pkgutil.walk_packages(package.__path__, package.__name__ + "."):
                  try:
                      importlib.import_module(module.name)
                  except Exception as exc:
                      failed.append(f"{module.name}: {exc}")
          if failed:
              sys.exit("\n".join(failed))
          print(f"every module imports on {sys.version.split()[0]}")
          PY
            uv run --isolated --no-project --python "${python}" \
              --with dist/pypi/lazycloud_shared-*.whl \
              --with dist/pypi/lazycloud_client-*.whl \
              -- lazycloud --help >/dev/null
          done

  validate:
    name: Changed Python owners
    runs-on: ubuntu-latest
    # Real Redis and real PostgreSQL, because the properties that most need
    # proving cannot be proven without them: single-winner races, expired-lease
    # recovery, exactly-once delivery, prefix sweeps matched against the real key
    # layout, and on the database side `FOR UPDATE SKIP LOCKED`, unique
    # constraints and advisory locks that SQLite has no equivalent for. A fake
    # passes all of them while production loses the race.
    #
    # The PostgreSQL fixtures create a throwaway database per test off this URL
    # and drop it after, so `postgres` here is only ever connected to in order to
    # issue `CREATE DATABASE`.
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lazycloud
          POSTGRES_PASSWORD: lazycloud
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lazycloud"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      LAZYCLOUD_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      LAZYCLOUD_TEST_POSTGRES_URL: postgresql+psycopg://lazycloud:lazycloud@127.0.0.1:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          version: "0.11.21"

      - name: Sync workspace
        run: uv sync --locked --group dev

      - name: Test changed scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          uv run --group dev python .github/scripts/validate_changed_scope.py
          --base "${BASE_SHA}" --check tests --workers 2
          --junitxml test-results/python.xml

      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results
          path: test-results/python.xml
          retention-days: 14
