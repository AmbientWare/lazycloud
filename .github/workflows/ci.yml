name: Python changed scope

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "apps/**/*.py"
      - "packages/**/*.py"
      - "tests/**/*.py"
      - "benchmarks/**/*.py"
      - "deploy/**/*.py"
      - "examples/**/*.py"
      - ".github/scripts/**/*.py"
      - "pyproject.toml"
      - "**/pyproject.toml"
      - "uv.lock"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - "apps/**/*.py"
      - "packages/**/*.py"
      - "tests/**/*.py"
      - "benchmarks/**/*.py"
      - "deploy/**/*.py"
      - "examples/**/*.py"
      - ".github/scripts/**/*.py"
      - "pyproject.toml"
      - "**/pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  lint:
    name: Repository lint and format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          version: "0.11.21"

      - name: Sync workspace
        run: uv sync --locked --group dev

      - name: Ruff lint
        run: uv run --group dev ruff check .

      - name: Ruff format
        run: uv run --group dev ruff format --check .

      # The committed policy and the generator that owns it drift silently, and
      # they drift into a role missing an action the control plane started
      # calling. That surfaces as a launch denial naming an API call.
      - name: Connection role policy is current
        run: uv run --group workspace python deploy/render_connection_policy.py --check

      # The worker image refuses a lock whose metadata digest disagrees with the
      # managed packages, and it does so twenty minutes into a release. A rename
      # in a pyproject is caught here instead.
      - name: Managed runtime locks are current
        run: uv run --no-project python deploy/managed-runtime/locks.py check

  validate:
    name: Changed Python owners
    runs-on: ubuntu-latest
    # Real Redis and real PostgreSQL, because the properties that most need
    # proving cannot be proven without them: single-winner races, expired-lease
    # recovery, exactly-once delivery, prefix sweeps matched against the real key
    # layout, and on the database side `FOR UPDATE SKIP LOCKED`, unique
    # constraints and advisory locks that SQLite has no equivalent for. A fake
    # passes all of them while production loses the race.
    #
    # The PostgreSQL fixtures create a throwaway database per test off this URL
    # and drop it after, so `postgres` here is only ever connected to in order to
    # issue `CREATE DATABASE`.
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lazycloud
          POSTGRES_PASSWORD: lazycloud
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lazycloud"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      LAZYCLOUD_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      LAZYCLOUD_TEST_POSTGRES_URL: postgresql+psycopg://lazycloud:lazycloud@127.0.0.1:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          version: "0.11.21"

      - name: Sync workspace
        run: uv sync --locked --group dev

      - name: Validate changed scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run --group dev python .github/scripts/validate_changed_scope.py --base "${BASE_SHA}"

      - name: Validate blind exception handlers
        run: uv run --group dev python .github/scripts/validate_blind_handlers.py
