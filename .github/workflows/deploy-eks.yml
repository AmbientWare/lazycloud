name: Deploy EKS

# Builds the control-plane images and records them on the deployment branch.
#
# Nothing here installs anything. Argo CD watches that branch and reconciles the
# cluster to it, so a deploy is a commit rather than a command, and what the
# cluster runs is a fact recorded in git rather than the outcome of whichever
# workflow ran last.
#
# One bake, pushing every control-plane image to ECR in a single invocation. A
# subset rebuild produces a package-digest mismatch the managed runtime rejects
# at container start, naming a digest rather than the stale artifact behind it,
# which is why `deploy/release.py` refuses one and why this does not build images
# job by job.
#
# Nothing here holds a long-lived AWS key. The job assumes a role through OIDC,
# and reaches GitHub as the organisation App rather than as a user.

on:
  workflow_dispatch:
    inputs:
      deployment:
        description: Deployment prefix the ECR repositories and secrets carry
        type: string
        default: lazycloud-prod
  workflow_call:
    inputs:
      deployment:
        description: Deployment prefix the ECR repositories and secrets carry
        type: string
        default: lazycloud-prod
      release_manifest_url:
        description: |
          Release this deployment should run. Empty keeps whichever release it
          already runs, so a code-only deploy does not silently take the fleet's
          managed capacity away.
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  # A second deploy overtaking the first would leave the cluster on whichever
  # release landed last rather than on whichever is newer.
  group: deploy-eks-${{ inputs.deployment || 'lazycloud-prod' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build images and record them
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOYMENT: ${{ inputs.deployment || 'lazycloud-prod' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      RELEASE_MANIFEST_URL: ${{ inputs.release_manifest_url }}
      DEPLOYMENT_BRANCH: ${{ vars.DEPLOYMENT_BRANCH || 'prod' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push every control-plane image
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker/bake.hcl
          targets: control-plane
          push: true
          set: |
            *.cache-from=type=gha,scope=deploy-control-plane
            *.cache-to=type=gha,mode=max,scope=deploy-control-plane
            api.tags=${{ steps.ecr.outputs.registry }}/${{ env.DEPLOYMENT }}/api:${{ github.sha }}
            scheduler.tags=${{ steps.ecr.outputs.registry }}/${{ env.DEPLOYMENT }}/scheduler:${{ github.sha }}
            cache-server.tags=${{ steps.ecr.outputs.registry }}/${{ env.DEPLOYMENT }}/cache-server:${{ github.sha }}
            worker-bootstrap.tags=${{ steps.ecr.outputs.registry }}/${{ env.DEPLOYMENT }}/worker-bootstrap:${{ github.sha }}
            cli.tags=${{ steps.ecr.outputs.registry }}/${{ env.DEPLOYMENT }}/cli:${{ github.sha }}
            database-bootstrap.tags=${{ steps.ecr.outputs.registry }}/${{ env.DEPLOYMENT }}/database-bootstrap:${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Not present on the runner image, and the failure is `command not found`
      # rather than anything that names Terraform.
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Render the values the branch will carry
        run: |
          set -euo pipefail
          terraform -chdir=deploy/platform-eks init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=platform-eks/$DEPLOYMENT.tfstate" \
            -backend-config="region=$AWS_REGION"
          terraform -chdir=deploy/platform-eks output -json runtime_configuration >runtime.json
          terraform -chdir=deploy/platform-eks output -json secret_environment >secret-map.json

          # Which release this deployment runs is a fact about the deployment,
          # not about its infrastructure, so it is not a Terraform output. It
          # lives beside the bundle, in the bucket Terraform does own, and is
          # therefore destroyed with the stack rather than outliving it.
          bucket="$(terraform -chdir=deploy/platform-eks output -raw deploy_bucket)"
          pointer="s3://${bucket}/current/release-manifest-url"
          if [ -z "${RELEASE_MANIFEST_URL}" ]; then
            RELEASE_MANIFEST_URL="$(aws s3 cp "${pointer}" - 2>/dev/null || true)"
          else
            printf '%s' "${RELEASE_MANIFEST_URL}" | aws s3 cp - "${pointer}"
          fi
          if [ -z "${RELEASE_MANIFEST_URL}" ]; then
            echo "::warning::No release named; this control plane will run without managed capacity."
          fi

          uv run --group workspace python deploy/chart_values.py \
            --registry "${{ steps.ecr.outputs.registry }}" \
            --deployment "$DEPLOYMENT" \
            --tag "$GITHUB_SHA" \
            --runtime runtime.json \
            --secret-map secret-map.json \
            --release-manifest-url "${RELEASE_MANIFEST_URL}" \
            --output values-prod.yaml

      - name: Record it on the deployment branch
        run: |
          set -euo pipefail
          # The App rather than the workflow's own token: the same credential
          # Argo reads with, installed on the organisation, so a second
          # repository needs no second secret.
          token="$(uv run --group workspace python deploy/github_app_token.py \
            --app-id "${{ vars.GITHUB_APP_ID }}" \
            --installation-id "${{ vars.GITHUB_APP_INSTALLATION_ID }}" \
            --private-key-secret "$DEPLOYMENT/github-app-private-key")"

          git config user.name "lazycloud-deploy"
          git config user.email "deploy@lazycloud.dev"
          git remote set-url origin \
            "https://x-access-token:${token}@github.com/${GITHUB_REPOSITORY}.git"

          # Branched from this commit rather than merged into: the deployment
          # branch is the source that produced the images plus the file naming
          # them, so it can never describe a tree the tag was not built from.
          git fetch origin "${DEPLOYMENT_BRANCH}" || true
          git checkout -B "${DEPLOYMENT_BRANCH}" "$GITHUB_SHA"
          mv values-prod.yaml deploy/chart/values-prod.yaml
          git add deploy/chart/values-prod.yaml
          git commit -m "Run ${GITHUB_SHA}"
          git push --force-with-lease origin "${DEPLOYMENT_BRANCH}"
