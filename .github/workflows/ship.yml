name: Ship

# One entry point for a full deploy: publish a release, then put the control
# plane on it.
#
# The two halves stay separate workflows because they answer to different
# audiences. A release is immutable and public — a customer's own AWS account
# resolves the agent binary, the worker image and the node AMI out of its
# manifest — so rebuilding it on every code deploy would churn artifacts other
# people's infrastructure depends on. A deploy is ours alone and runs many times
# against one release.
#
# Sequencing them here is what a tag used to get wrong. Both workflows once
# triggered on `v*` independently, so the deploy raced the release it was meant
# to run and published a bundle naming whichever release came before it.

on:
  workflow_dispatch:
    inputs:
      deployment:
        description: Deployment prefix the ECR repositories and secrets carry
        type: string
        default: lazycloud-prod
  push:
    tags:
      - "v*"

# What the called workflows need, because a caller cannot grant less than they
# ask for: the deploy records its build as a commit on the deployment branch,
# and a caller offering only `contents: read` fails the whole run before any job
# starts, with no logs to read.
permissions:
  contents: write
  # A caller cannot grant a called workflow less than it asks for, and the
  # deploy writes the whole tree to the deployment branch.
  workflows: write
  id-token: write

concurrency:
  group: ship-${{ inputs.deployment || 'lazycloud-prod' }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish the release
    uses: ./.github/workflows/release.yml
    secrets: inherit

  deploy:
    name: Deploy onto it
    needs: release
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      deployment: ${{ inputs.deployment || 'lazycloud-prod' }}
      release_manifest_url: ${{ needs.release.outputs.manifest_url }}
