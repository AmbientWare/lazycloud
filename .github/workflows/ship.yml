name: Ship

# The tag defines the release version. Publishing must finish before Deploy
# records the complete manifest for Argo; the workflow token starts no tag workflow.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Source commit already merged into main. Empty uses this workflow's commit.
        type: string
        default: ""
      bump:
        description: Which part of the version this release changes
        type: choice
        required: true
        options:
          - patch
          - minor
          - major

# Reusable workflows cannot request permissions their caller lacks.
permissions:
  contents: write
  id-token: write

concurrency:
  group: ship
  cancel-in-progress: false

jobs:
  version:
    name: Cut the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      # Only main. A release tags the commit it runs from, and a tag on a branch
      # commit is a version customers can install that main never contained.
      - name: Refuse anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Ship runs from main; this run is on ${GITHUB_REF}."
          exit 1

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve the merged source commit
        id: source
        env:
          REQUESTED_COMMIT: ${{ inputs.commit || github.sha }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse --verify "${REQUESTED_COMMIT}^{commit}")"
          git merge-base --is-ancestor "$commit" origin/main || {
            echo "::error::Release source must already be merged into main."
            exit 1
          }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Compute the next version
        id: next
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git tag -l 'v*' | sort -V | tail -1)"
          current="${latest#v}"
          current="${current:-0.0.0}"
          IFS=. read -r major minor patch <<<"${current}"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="${major}.${minor}.${patch}"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "::error::v${version} already exists."
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "${latest:-no tag} -> v${version} (${{ inputs.bump }})"

      - name: Push the tag
        run: |
          set -euo pipefail
          git config user.name "lazycloud-deploy"
          git config user.email "deploy@lazycloud.dev"
          git tag -a "v${{ steps.next.outputs.version }}" -m "Release ${{ steps.next.outputs.version }}" "${{ steps.source.outputs.commit }}"
          git push origin "v${{ steps.next.outputs.version }}"

  # Stamp the SDK and its exact shared-package dependency with the same version.
  # Wheel installation runs outside the workspace before publication.
  python-package:
    name: Publish the Python package
    needs: version
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.commit }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          version: "0.11.21"

      - name: Stamp the release version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          uv version --frozen --package lazycloud-shared "${version}"
          uv version --frozen --package lazycloud-client "${version}"
          python3 - "${version}" <<'EOF'
          import re, sys
          from pathlib import Path
          version = sys.argv[1]
          path = Path("packages/lazycloud/pyproject.toml")
          text, count = re.subn(r'"lazycloud-shared==[^"]+"', f'"lazycloud-shared=={version}"', path.read_text())
          if count != 1:
              sys.exit(f"expected one lazycloud-shared pin in {path}, found {count}")
          path.write_text(text)
          EOF
          git --no-pager diff --stat

      - name: Build wheels and sdists
        run: |
          set -euo pipefail
          uv build --package lazycloud-shared -o dist/pypi
          uv build --package lazycloud-client -o dist/pypi
          ls -1 dist/pypi

      - name: Install the wheels into an empty environment
        shell: bash
        run: |
          set -euo pipefail
          for python in 3.10 3.11 3.12 3.13 3.14; do
            uv run --isolated --no-project --python "${python}" \
              --with dist/pypi/lazycloud_shared-*.whl \
              --with dist/pypi/lazycloud_client-*.whl \
              -- lazycloud --help >/dev/null
            uv run --isolated --no-project --python "${python}" \
              --with dist/pypi/lazycloud_shared-*.whl \
              --with dist/pypi/lazycloud_client-*.whl \
              -- python -c "import lazycloud, shared; print(lazycloud.__name__)"
          done

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: lazycloud-python-package
          path: dist/pypi/*
          if-no-files-found: error

      # Trusted publishing: PyPI accepts this workflow's OIDC token for both
      # projects, configured on each as owner `AmbientWare`, repository
      # `lazycloud`, workflow `ship.yml`, environment `release`. No token is
      # stored anywhere. The step lives here and not in release.yml because
      # PyPI does not accept a reusable workflow as a publisher.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pypi
          # A re-run of the same ship rebuilds identical wheels. PyPI refuses
          # a second upload of a version, and that refusal must not fail the
          # deploy that follows.
          skip-existing: true

  platform:
    needs: version
    uses: ./.github/workflows/build-platform.yml
    secrets: inherit
    with:
      commit: ${{ needs.version.outputs.commit }}

  release:
    name: Publish the release
    # Host images are published separately. This job only builds release assets.
    needs: [version, python-package, platform]
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      commit: ${{ needs.version.outputs.commit }}
      platform_images: ${{ needs.platform.outputs.images }}

  # Straight to prod, until staging runs. Then a release lands on staging here
  # and `promote.yml` carries it to prod once it has been looked at.
  deploy:
    name: Deploy onto it
    needs: [version, python-package, release]
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      deployment: prod
      release_manifest_url: ${{ needs.release.outputs.manifest_url }}
