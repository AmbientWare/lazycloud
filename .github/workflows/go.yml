name: Go backend and host runtime

on:
  # Ship runs it before publishing images.
  workflow_call:
  pull_request:
    paths:
      - ".github/workflows/go.yml"
      - "go.mod"
      - "go.sum"
      - "**/*.go"
      - "contracts/**"
      - "migrations/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - ".golangci.yml"
      - "**/sqlc.yaml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lazycloud
          POSTGRES_PASSWORD: lazycloud
          POSTGRES_DB: postgres
        ports:
          - 15442:5432
        options: >-
          --health-cmd "pg_isready -U lazycloud -d postgres"
          --health-interval 1s
          --health-retries 30
      # Billing's Stripe tests fail without it rather than skip.
      stripe-mock:
        image: stripe/stripe-mock:v0.205.0@sha256:ff32647993847be491e68533e2881c90434fa8d5df40246ee5f7d41253422081
        ports:
          - 12111:12111
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Object store for storage tests
        run: |
          docker compose up -d --wait object-store
          docker compose run --rm object-store-bootstrap
      - name: GeeseFS for volume mount tests
        run: deploy/local/fetch-geesefs.sh
      - name: Generated code is current
        run: |
          go generate ./...
          git diff --exit-code
      - run: go mod tidy -diff
      - run: go tool buf format -d --exit-code
      - run: go tool buf lint
      - run: go vet ./...
      - run: go tool golangci-lint run ./...
      # The host runtime tests run in the host-runtime job, on a runner set
      # up as a host.
      - run: go list ./... | grep -v -e /internal/agent$ -e /internal/imagefs/snapshotter$ | xargs go test -race

  # The agent pulls workload images lazily through lazycloud-snapshotter,
  # which needs root and Docker reconfigured, so this job sets the runner up
  # as a host before anything else runs in Docker.
  host-runtime:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install the snapshotter as hosts do
        run: |
          go build -o "$RUNNER_TEMP/host/lazycloud-agent" ./cmd/agent
          go build -o "$RUNNER_TEMP/host/lazycloud-snapshotter" ./cmd/snapshotter
          sudo "$RUNNER_TEMP/host/lazycloud-agent" install-snapshotter
          # Hosts run the agent as root; the tests run as the runner user,
          # who is in the docker group.
          sudo chmod 0755 /run/lazycloud-snapshotter
          sudo chgrp docker /run/lazycloud-snapshotter/snapshotter.sock /run/containerd/containerd.sock
          sudo chmod g+rw /run/lazycloud-snapshotter/snapshotter.sock /run/containerd/containerd.sock
          docker info --format 'storage driver {{.Driver}}'
      - name: Object store for layers and volumes
        run: |
          docker compose up -d --wait object-store
          docker compose run --rm object-store-bootstrap
      - name: GeeseFS for volume mount tests
        run: deploy/local/fetch-geesefs.sh
      - run: go test -race ./internal/agent/... ./internal/imagefs/...
