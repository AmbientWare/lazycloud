name: Go backend and host runtime

on:
  # Ship runs it before publishing images.
  workflow_call:
  pull_request:
    paths:
      - ".github/workflows/go.yml"
      - "go.mod"
      - "go.sum"
      - "**/*.go"
      - "contracts/**"
      - "migrations/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - ".golangci.yml"
      - "**/sqlc.yaml"
      # The test services.
      - "compose.test.yaml"
      - "deploy/local/garage.toml"
      - "deploy/local/garage-bootstrap.sh"
      - "deploy/local/install-snapshotter.sh"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: PostgreSQL, stripe-mock and the object store
        run: docker compose -f compose.test.yaml up -d --wait
      - name: GeeseFS for volume mount tests
        run: deploy/local/fetch-geesefs.sh
      - name: Generated code is current
        run: |
          go generate ./...
          git diff --exit-code
      - run: go mod tidy -diff
      - run: go tool buf format -d --exit-code
      - run: go tool buf lint
      - run: go vet ./...
      - run: go tool golangci-lint run ./...
      # The host runtime and acceptance tests run in their own jobs, on
      # runners set up as hosts.
      - run: go list ./... | grep -v -e /internal/agent$ -e /internal/imagefs -e /acceptance$ | xargs go test -race

  # The agent pulls workload images lazily through lazycloud-snapshotter,
  # which needs root and Docker reconfigured, so this job sets the runner up
  # as a host before anything else runs in Docker.
  host-runtime:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install the snapshotter as hosts do
        run: deploy/local/install-snapshotter.sh
      - name: Object store for layers and volumes
        run: docker compose -f compose.test.yaml up -d --wait object-store-bootstrap
      - name: GeeseFS for volume mount tests
        run: deploy/local/fetch-geesefs.sh
      - run: go test -race ./internal/agent/... ./internal/imagefs ./internal/imagefs/layersource
      # The snapshotter mounts FUSE and overlay filesystems as root, as on
      # hosts, and a join installs as root.
      - run: sudo --preserve-env=PATH,HOME,GOPATH,GOCACHE,GOMODCACHE "$(command -v go)" test -race ./internal/imagefs/snapshotter
      - run: sudo --preserve-env=PATH,HOME,GOPATH,GOCACHE,GOMODCACHE "$(command -v go)" test -race -run TestInstallScriptInstallsAReleaseAndRunsTheAgent -v ./cmd/agent

  # Cross-owner workflows against an agent on a runner set up as a host:
  # the platform images and the managed image convert for real and
  # workloads start through the snapshotter. A skipped test fails the job.
  acceptance:
    runs-on: ubuntu-26.04
    # The tests and the snapshotter trace into Jaeger; the job keeps the
    # trace of the slowest container start.
    env:
      LAZYCLOUD_OTLP_ENDPOINT: 127.0.0.1:24317
      LAZYCLOUD_OTLP_INSECURE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.29"
          python-version: "3.12"
      - name: Install the snapshotter as hosts do
        run: deploy/local/install-snapshotter.sh
      # Started after the snapshotter install, which restarts Docker.
      - name: PostgreSQL, the object store and Jaeger
        run: |
          docker compose -f compose.test.yaml up -d --wait postgres object-store-bootstrap
          docker compose up -d --wait jaeger
      - name: GeeseFS and the managed runtime
        run: |
          deploy/local/fetch-geesefs.sh
          deploy/local/build-runtime.sh .lazycloud/runtime 3.12
      - name: Acceptance
        run: |
          set -o pipefail
          go test -race -timeout 60m -v ./acceptance 2>&1 | tee "$RUNNER_TEMP/acceptance.log"
          if grep -- '--- SKIP' "$RUNNER_TEMP/acceptance.log"; then
            echo "acceptance tests skipped" >&2
            exit 1
          fi
      - name: Export the slowest container start's trace
        if: always()
        run: |
          # Spans leave the exporters' batches within seconds.
          sleep 10
          deploy/local/export-trace.sh http://127.0.0.1:16686 lazycloud-acceptance "$RUNNER_TEMP/cold-start-trace.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cold-start-trace
          path: ${{ runner.temp }}/cold-start-trace.json
          if-no-files-found: ignore
