name: Python clients and runner

on:
  pull_request:
    paths:
      - ".github/workflows/python.yml"
      - "python/**"
      - "contracts/**"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [main, go-rewrite]
    paths:
      - ".github/workflows/python.yml"
      - "python/**"
      - "contracts/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.29"
          python-version: "3.12"
      - run: uv sync --frozen --group dev
      - run: uv run --frozen --group dev ruff check python
      - run: uv run --frozen --group dev ruff format --check python
      - run: uv run --frozen --group dev pytest -x
