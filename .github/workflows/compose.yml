name: Compose definition

on:
  pull_request:
    paths:
      - ".github/workflows/compose.yml"
      - ".dockerignore"
      - "docker/**"
      - "compose.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/compose.yml"
      - ".dockerignore"
      - "docker/**"
      - "compose.yaml"

permissions:
  contents: read

jobs:
  validate:
    name: Render Compose
    runs-on: ubuntu-latest
    env:
      LAZYCLOUD_OBJECT_STORE_ENDPOINT_URL: https://storage.example.invalid
      LAZYCLOUD_OBJECT_STORE_REGION_NAME: us-east-1
      LAZYCLOUD_OBJECT_STORE_ACCESS_KEY_ID: render-only
      LAZYCLOUD_OBJECT_STORE_SECRET_ACCESS_KEY: render-only
      LAZYCLOUD_OBJECT_STORE_BUCKET: lazycloud-render
      LAZYCLOUD_OBJECT_STORE_WORKSPACE_BUCKET_PREFIX: lazycloud-render-workspace
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate current definition
        run: docker compose config --quiet

      - name: Validate canonical image build owners
        run: >-
          docker compose build --check
          database-bootstrap
          control-plane
          tunnel-gateway
          scheduler
          container-worker
          cache-server

      - name: Validate canonical Bake graph
        run: docker buildx bake -f docker/bake.hcl --check
