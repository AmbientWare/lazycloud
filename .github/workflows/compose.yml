name: Compose definition

on:
  pull_request:
    paths:
      - ".github/workflows/compose.yml"
      - ".dockerignore"
      - ".env.example"
      - ".githooks/post-checkout"
      - "deploy/garage/**"
      - "deploy/local_credentials.py"
      - "deploy/setup-local-env.sh"
      - "docker/**"
      - "compose.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/compose.yml"
      - ".dockerignore"
      - ".env.example"
      - ".githooks/post-checkout"
      - "deploy/garage/**"
      - "deploy/local_credentials.py"
      - "deploy/setup-local-env.sh"
      - "docker/**"
      - "compose.yaml"

permissions:
  contents: read

jobs:
  validate:
    name: Render Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize local environment
        run: bash deploy/setup-local-env.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate current definition
        run: docker compose config --quiet

      - name: Validate canonical image build owners
        run: >-
          docker compose build --check
          database-bootstrap
          control-plane
          tunnel-gateway
          scheduler
          container-worker
          cache-server

      - name: Validate canonical Bake graph
        run: docker buildx bake -f docker/bake.hcl --check
