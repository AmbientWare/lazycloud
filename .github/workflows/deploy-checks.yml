name: Deployment automation

# Renders and validates the chart and Terraform, and builds every image
# without pushing. It reaches no cloud account or cluster.
on:
  workflow_call:
  pull_request:
    paths:
      - ".github/workflows/deploy.yml"
      - "deploy/**"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - "pyproject.toml"
      - "uv.lock"
      - "python/**"
  push:
    branches: [main, go-rewrite]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Chart, manifests and Terraform
        run: deploy/check.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build images
        run: docker buildx bake -f deploy/images/docker-bake.hcl
