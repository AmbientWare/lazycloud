name: Deployment definition

# What the cluster is told to be, checked before it is told.
#
# The infrastructure module and the chart decide what production runs, and until
# now nothing looked at either until a deploy did. A chart that does not render
# or a module that does not validate then merged cleanly and failed against real
# AWS, several minutes and one apply later, with the error naming a Kubernetes
# kind rather than the commit that broke it.

on:
  pull_request:
    paths:
      - "deploy/platform-eks/**"
      - "deploy/chart/**"
      - "deploy/argocd/**"
      - ".github/workflows/deployment-definition.yml"
  push:
    branches: [main]
    paths:
      - "deploy/platform-eks/**"
      - "deploy/chart/**"
      - "deploy/argocd/**"

permissions:
  contents: read

jobs:
  definition:
    name: Terraform and chart render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      # No backend: this proves the configuration is coherent, not that it
      # matches a deployment. Reaching the real state would need credentials a
      # pull request from a fork must not have.
      - name: Terraform is formatted and valid
        run: |
          set -euo pipefail
          terraform -chdir=deploy/platform-eks fmt -check -recursive
          terraform -chdir=deploy/platform-eks init -backend=false -input=false
          terraform -chdir=deploy/platform-eks validate

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      # Rendered, not just linted. `helm lint` accepts a chart whose templates
      # produce nothing valid; rendering is what catches a missing value, a
      # helper that fails, or an object with no image.
      - name: Chart renders
        run: |
          set -euo pipefail
          helm template lazycloud deploy/chart \
            --set image.registry=registry.invalid \
            --set image.repositoryPrefix=lazycloud-prod \
            --set image.tag=0000000000000000000000000000000000000000 \
            --set runtime.LAZYCLOUD_OBJECT_STORE_REGION_NAME=us-east-1 \
            --set cloudflared.tunnelId=00000000-0000-0000-0000-000000000000 \
            --set cloudflared.apex=example.invalid \
            --set secrets.map.LAZYCLOUD_DATABASE_URL=deployment/database-url \
            --set secrets.map.LAZYCLOUD_TOKEN=deployment/administrator-token \
            --set secrets.files.LAZYCLOUD_CLOUDFLARE_TUNNEL_CREDENTIALS=deployment/tunnel \
            --set fleet.account_id=000000000000 \
            --set fleet.role_arn=arn:aws:iam::000000000000:role/connection \
            --set fleet.vpc_id=vpc-0 \
            --set "fleet.subnet_ids={subnet-a,subnet-b}" \
            --set fleet.security_group_id=sg-0 \
            >rendered.yaml
          test -s rendered.yaml

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Every object carries an image, every environment variable has a source,
      # and every source resolves. All three have shipped absent. An empty image
      # renders a Deployment that fails at the pod with InvalidImageName. An
      # environment entry with neither value nor valueFrom is accepted by
      # Kubernetes and read by the process as unset. And a key the Secret does
      # not hold has a source, passes both earlier checks, and stops the pod:
      # at CreateContainerConfigError when an env var names it, and at
      # ContainerCreating with `references non-existent secret key` when a
      # volume does. Volumes are checked because only env was, and the tunnel
      # credential went missing through the half that was not looked at.
      #
      # The map above is why this renders with one at all: an empty
      # `secrets.map` produces an ExternalSecret with no entries and containers
      # with almost no environment, so the gate would pass without looking at
      # the wiring it exists to check. What is in the map does not matter. That
      # both sides derive from the same one does.
      - name: Nothing rendered is empty
        run: |
          python - <<'PY'
          import sys, yaml

          problems = []
          documents = [d for d in yaml.safe_load_all(open("rendered.yaml")) if d]
          provided = {
              entry["secretKey"]
              for document in documents
              if document["kind"] == "ExternalSecret"
              for entry in document["spec"]["data"]
          }
          if not provided:
              raise SystemExit("the render provided no secret keys, so nothing checked the wiring")
          for document in documents:
              name = f"{document['kind']}/{document['metadata']['name']}"
              pod = (document.get("spec", {}).get("template", {}) or {}).get("spec", {})
              for container in pod.get("containers", []):
                  image = container.get("image", "")
                  if not image or image.endswith(":"):
                      problems.append(f"{name}/{container['name']}: image {image!r}")
                  for entry in container.get("env", []):
                      if "value" not in entry and "valueFrom" not in entry:
                          problems.append(f"{name}: env {entry.get('name')} has no source")
                      reference = (entry.get("valueFrom") or {}).get("secretKeyRef")
                      if reference and reference["key"] not in provided:
                          problems.append(
                              f"{name}: env {entry['name']} reads secret key "
                              f"{reference['key']}, which no ExternalSecret provides"
                          )
              for volume in pod.get("volumes", []):
                  for item in (volume.get("secret") or {}).get("items", []):
                      if item["key"] not in provided:
                          problems.append(
                              f"{name}: volume {volume['name']} mounts secret key "
                              f"{item['key']}, which no ExternalSecret provides"
                          )
          if problems:
              print("\n".join(problems), file=sys.stderr)
              raise SystemExit(1)
          print(f"{len(documents)} objects, all complete")
          PY

      # Two orderings the cluster cannot recover from on its own.
      #
      # Argo holds a sync wave until it is healthy, so anything the workloads
      # depend on has to be in an earlier one. A Job behind them waits on a
      # control plane that is itself waiting on the schema that Job creates, and
      # the only way out of that is a person terminating the sync. A Job that
      # depends on the control plane instead belongs after it, and says so with
      # `lazycloud.dev/needs-control-plane`, because the two are the same shape
      # and only the direction of the dependency separates them.
      #
      # And a container that reads agent binaries out of a directory nothing
      # mounted finds an empty one: the release resolves, the install route
      # serves 404, and nothing says the volume was the missing piece.
      - name: The order and the mounts hold
        run: |
          python - <<'PY'
          import sys, yaml

          documents = [d for d in yaml.safe_load_all(open("rendered.yaml")) if d]

          def wave(document):
              annotations = document["metadata"].get("annotations") or {}
              return int(annotations.get("argocd.argoproj.io/sync-wave", "0"))

          def needs_control_plane(document):
              annotations = document["metadata"].get("annotations") or {}
              return annotations.get("lazycloud.dev/needs-control-plane") == "true"

          problems = []
          workloads = [d for d in documents if d["kind"] == "Deployment"]
          candidates = [d for d in documents if d["kind"] in ("Job", "ExternalSecret", "StorageClass")]
          earlier = [d for d in candidates if not needs_control_plane(d)]
          later = [d for d in candidates if needs_control_plane(d)]
          for workload in workloads:
              for prerequisite in earlier:
                  if wave(prerequisite) >= wave(workload):
                      problems.append(
                          f"{prerequisite['kind']}/{prerequisite['metadata']['name']} is in wave "
                          f"{wave(prerequisite)} and Deployment/{workload['metadata']['name']} is in "
                          f"wave {wave(workload)}; the workload must come after what it depends on"
                      )
              for dependent in later:
                  if wave(dependent) <= wave(workload):
                      problems.append(
                          f"{dependent['kind']}/{dependent['metadata']['name']} reaches the control "
                          f"plane, so it belongs after Deployment/{workload['metadata']['name']} "
                          f"rather than in wave {wave(dependent)}"
                      )

          for document in documents:
              # A Job's pod template is immutable, so a second sync patches it
              # and fails. The image tag moves with the commit, which makes that
              # every deploy after the first.
              if document["kind"] == "Job":
                  options = (document["metadata"].get("annotations") or {}).get(
                      "argocd.argoproj.io/sync-options", ""
                  )
                  if "Replace=true" not in options:
                      problems.append(
                          f"Job/{document['metadata']['name']} is patched rather than replaced; "
                          "its pod template is immutable and the next deploy will fail to apply it"
                      )

          for document in documents:
              pod = (document.get("spec", {}).get("template", {}) or {}).get("spec", {})
              mounted = {v["name"] for v in pod.get("volumes", [])}
              for container in pod.get("containers", []) + pod.get("initContainers", []):
                  directories = [
                      entry["value"]
                      for entry in container.get("env", [])
                      if entry.get("name") == "LAZYCLOUD_AGENT_BINARY_DIR" and "value" in entry
                  ]
                  if not directories:
                      continue
                  paths = {m["mountPath"] for m in container.get("volumeMounts", []) if m["name"] in mounted}
                  for directory in directories:
                      if directory not in paths:
                          problems.append(
                              f"{document['kind']}/{document['metadata']['name']}/{container['name']} "
                              f"serves agent binaries from {directory}, which no volume mounts"
                          )

          if problems:
              print("\n".join(problems), file=sys.stderr)
              raise SystemExit(1)
          print(
              f"{len(workloads)} workloads after {len(earlier)} prerequisites "
              f"and before {len(later)} that reach the control plane"
          )
          PY

      - name: Argo applications parse
        run: |
          python - <<'PY'
          import pathlib, yaml

          for path in sorted(pathlib.Path("deploy/argocd/apps").glob("*.yaml")):
              document = yaml.safe_load(path.read_text())
              assert document["kind"] == "Application", path
              # An Application with no wave syncs whenever the controller reaches
              # it, which is the ordering bug this repository already paid for.
              wave = document["metadata"]["annotations"]["argocd.argoproj.io/sync-wave"]
              print(f"{path.name}: wave {wave}")
          PY
