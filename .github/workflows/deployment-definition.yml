name: Deployment definition

# What the cluster is told to be, checked before it is told.
#
# The infrastructure module and the chart decide what production runs, and until
# now nothing looked at either until a deploy did. A chart that does not render
# or a module that does not validate then merged cleanly and failed against real
# AWS, several minutes and one apply later, with the error naming a Kubernetes
# kind rather than the commit that broke it.

on:
  pull_request:
    paths:
      - "deploy/platform-core/**"
      - "deploy/platform-deployment/**"
      - "deploy/cloudflare/**"
      - "deploy/chart/**"
      - "deploy/chart_values.py"
      - "deploy/infrastructure.example.json"
      - "deploy/release.example.json"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/promote.yml"
      - "deploy/argocd/**"
      - ".github/workflows/deployment-definition.yml"
  push:
    branches: [main]
    paths:
      - "deploy/platform-core/**"
      - "deploy/platform-deployment/**"
      - "deploy/cloudflare/**"
      - "deploy/chart/**"
      - "deploy/chart_values.py"
      - "deploy/infrastructure.example.json"
      - "deploy/release.example.json"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/promote.yml"
      - "deploy/argocd/**"

permissions:
  contents: read

jobs:
  definition:
    name: Terraform and chart render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      # No backend: this proves the configuration is coherent, not that it
      # matches a deployment. Reaching the real state would need credentials a
      # pull request from a fork must not have.
      - name: Terraform is formatted and valid
        run: |
          set -euo pipefail
          for module in deploy/platform-core deploy/platform-deployment deploy/cloudflare; do
            terraform -chdir="$module" fmt -check -recursive
            terraform -chdir="$module" init -backend=false -input=false
            terraform -chdir="$module" validate
          done

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Render the deployment through the production configuration boundary
        run: |
          set -euo pipefail
          uv run --frozen --python 3.12 --group workspace python deploy/chart_values.py \
            --infrastructure deploy/infrastructure.example.json \
            --environment deploy/chart/environments/prod.yaml \
            --deployment lazycloud-prod \
            --manifest deploy/release.example.json \
            --output "$RUNNER_TEMP/values-deployment.yaml"
          helm lint deploy/chart --strict -f "$RUNNER_TEMP/values-deployment.yaml"
          helm template lazycloud deploy/chart --namespace lazycloud-prod \
            -f "$RUNNER_TEMP/values-deployment.yaml" >"$RUNNER_TEMP/rendered.yaml"
