name: Deploy

# Records a published version for prod: the prod branch becomes the
# version's tagged tree plus values-deployment.yaml, which merges
# platform-deployment's values.json with the version. Argo CD syncs the
# branch. Ship calls it; run it by hand to roll back to an earlier version.
# Only the prod environment's deploy key may push prod (the github root's
# ruleset), so no workflow token can, and the environment admits main only.

on:
  workflow_dispatch:
    inputs:
      version:
        description: A version Ship published, such as 1.4.2; an earlier one rolls back.
        type: string
        required: true
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  record:
    name: Record the version
    runs-on: ubuntu-26.04
    # The deploy role trusts only this workflow on main in this environment.
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOYMENT: lazycloud-prod
      BRANCH: prod
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate the version
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version $VERSION is not major.minor.patch"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
          ssh-key: ${{ secrets.PROD_DEPLOY_KEY }}
      # A v* tag anyone created on a branch commit is not a release.
      - name: Check the version is on main
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "v$VERSION^{commit}" FETCH_HEAD; then
            echo "::error::v$VERSION is not a commit of main."
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Read the deployment's values
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          aws s3 cp "s3://$DEPLOYMENT-deploy-$account/values.json" "$RUNNER_TEMP/infrastructure.json"
          jq --arg version "$VERSION" '. * {release: {version: $version}}' "$RUNNER_TEMP/infrastructure.json" \
            >"$RUNNER_TEMP/values-deployment.yaml"
      # Argo would otherwise sync a version whose pods cannot pull.
      - name: Check every image of the version exists
        run: |
          set -euo pipefail
          registry="$(jq -r .image.registry "$RUNNER_TEMP/values-deployment.yaml")"
          prefix="${registry#*/}"
          for image in server scheduler web; do
            aws ecr describe-images --repository-name "$prefix/$image" --image-ids "imageTag=$VERSION" \
              --query 'imageDetails[0].imageDigest' --output text
          done
      - name: Render the chart
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/values-deployment.yaml" deploy/helm/lazycloud/values-deployment.yaml
          helm="docker.io/alpine/helm:4.3.0@sha256:a6cf54599ccb99d90cf0712b30f03fdb3cab062e6b94e0418cc4db7e8a1464b2"
          run_helm() {
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD/deploy/helm/lazycloud:/chart:ro" "$helm" "$@" \
              --kube-version 1.36.0 -f "/chart/environments/$BRANCH.yaml" -f /chart/values-deployment.yaml
          }
          run_helm lint --strict /chart
          run_helm template lazycloud /chart --namespace "$DEPLOYMENT" >/dev/null
      - name: Record the version for Argo CD
        run: |
          set -euo pipefail
          previous="$(git ls-remote --heads origin "refs/heads/$BRANCH" | cut -f1)"
          git config user.name "lazycloud-deploy"
          git config user.email "deploy@lazycloud.dev"
          git checkout -B "$BRANCH" "v$VERSION"
          # The branch needs no workflow files.
          git rm -r --quiet --cached .github
          git add deploy/helm/lazycloud/values-deployment.yaml
          git commit -m "Select release $VERSION"
          git push --force-with-lease="refs/heads/$BRANCH:$previous" origin "HEAD:refs/heads/$BRANCH"
          echo "$DEPLOYMENT selected $VERSION (previous branch head ${previous:-none}). Argo CD owns the rollout." >>"$GITHUB_STEP_SUMMARY"
