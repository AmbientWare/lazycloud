name: Deploy

# Publishes the deployment bundle and converges the control plane host onto it.
#
# One bake, pushing every control-plane image to ECR in a single invocation. A
# subset rebuild produces a package-digest mismatch the managed runtime rejects
# at container start, naming a digest rather than the stale artifact behind it,
# which is why `deploy/release.py` refuses one and why this does not build images
# job by job.
#
# Nothing here holds a long-lived AWS key or an SSH key. The job assumes a role
# through OIDC, and the host is reached with SSM Run Command.

on:
  workflow_dispatch:
    inputs:
      deployment:
        description: Deployment prefix the ECR repositories and secrets carry
        type: string
        default: lazycloud-prod
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  # A second deploy overtaking the first would leave the host on whichever bundle
  # landed last rather than whichever release is newer.
  group: deploy-${{ inputs.deployment || 'lazycloud-prod' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish bundle and converge the host
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOYMENT: ${{ inputs.deployment || 'lazycloud-prod' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push every control-plane image
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker/bake.hcl
          targets: control-plane
          push: true
          set: |
            *.cache-from=type=gha,scope=deploy-control-plane
            *.cache-to=type=gha,mode=max,scope=deploy-control-plane
            *.platform=linux/arm64
            api.tags=${{ steps.ecr.outputs.registry }}/${{ env.DEPLOYMENT }}/api:${{ github.sha }}
            scheduler.tags=${{ steps.ecr.outputs.registry }}/${{ env.DEPLOYMENT }}/scheduler:${{ github.sha }}
            cache-server.tags=${{ steps.ecr.outputs.registry }}/${{ env.DEPLOYMENT }}/cache-server:${{ github.sha }}
            worker-bootstrap.tags=${{ steps.ecr.outputs.registry }}/${{ env.DEPLOYMENT }}/worker-bootstrap:${{ github.sha }}
            cli.tags=${{ steps.ecr.outputs.registry }}/${{ env.DEPLOYMENT }}/cli:${{ github.sha }}
            database-bootstrap.tags=${{ steps.ecr.outputs.registry }}/${{ env.DEPLOYMENT }}/database-bootstrap:${{ github.sha }}

      - name: Resolve pushed digests
        id: digests
        run: |
          set -euo pipefail
          # Read back what the registry holds rather than trusting the build's
          # own report: the bundle pins what a host will actually pull.
          printf '{' >digests.json
          separator=""
          for image in api scheduler cache-server worker-bootstrap database-bootstrap; do
            digest="$(aws ecr describe-images \
              --repository-name "$DEPLOYMENT/$image" \
              --image-ids imageTag="$GITHUB_SHA" \
              --query 'imageDetails[0].imageDigest' --output text)"
            printf '%s"%s":"%s"' "$separator" "$image" "$digest" >>digests.json
            separator=","
          done
          printf '}' >>digests.json
          cat digests.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Publish the bundle
        run: |
          set -euo pipefail
          terraform -chdir=deploy/platform-aws init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=platform-aws/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"
          terraform -chdir=deploy/platform-aws output -json runtime_configuration >runtime.json
          uv run --group workspace python deploy/bundle.py \
            --bucket "$(terraform -chdir=deploy/platform-aws output -raw deploy_bucket)" \
            --registry "${{ steps.ecr.outputs.registry }}" \
            --deployment "$DEPLOYMENT" \
            --digests digests.json \
            --runtime runtime.json \
            --stage-dir bundle

      - name: Converge the control plane host
        run: |
          set -euo pipefail
          instance="$(terraform -chdir=deploy/platform-aws output -raw control_plane_instance_id)"
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$instance" \
            --parameters 'commands=["/usr/local/bin/lazycloud-deploy"]' \
            --query 'Command.CommandId' --output text)"
          # Poll and print, rather than waiting on a terminal status: a command
          # that never starts produces no status to wait for, and the timeout
          # would report nothing about why.
          for _ in $(seq 1 60); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$instance" \
              --query 'Status' --output text 2>/dev/null || echo Pending)"
            echo "ssm status: $status"
            case "$status" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$command_id" \
                  --instance-id "$instance" --query 'StandardErrorContent' --output text
                exit 1 ;;
            esac
            sleep 10
          done
          echo "deploy command did not finish within ten minutes" >&2
          exit 1
