name: Deploy EKS

# Builds the control-plane images and records them on the deployment branch.
#
# Nothing here installs anything. Argo CD watches that branch and reconciles the
# cluster to it, so a deploy is a commit rather than a command, and what the
# cluster runs is a fact recorded in git rather than the outcome of whichever
# workflow ran last.
#
# One bake, pushing every control-plane image to ECR in a single invocation. A
# subset rebuild produces a package-digest mismatch the managed runtime rejects
# at container start, naming a digest rather than the stale artifact behind it,
# which is why `deploy/release.py` refuses one and why this does not build images
# job by job.
#
# Nothing here holds a long-lived AWS key or a GitHub one. The job assumes a role
# through OIDC and pushes with the token GitHub gives it for this repository.

on:
  workflow_dispatch:
    inputs:
      deployment:
        description: Deployment prefix the ECR repositories and secrets carry
        type: string
        default: lazycloud-prod
      release_manifest_url:
        description: |
          Release this deployment should run. Empty keeps whichever release it
          already runs. Naming one by hand is how a deployment reaches a release
          that published successfully and then lost its workflow, which the
          anonymous registry read at the end of a release does often enough to
          matter.
        type: string
        default: ""
  workflow_call:
    inputs:
      deployment:
        description: Deployment prefix the ECR repositories and secrets carry
        type: string
        default: lazycloud-prod
      release_manifest_url:
        description: |
          Release this deployment should run. Empty keeps whichever release it
          already runs, so a code-only deploy does not silently take the fleet's
          managed capacity away.
        type: string
        default: ""

permissions:
  # Write, because recording a build is a commit on the deployment branch. The
  # branch is in this repository, so the workflow's own token reaches it and no
  # other credential is involved -- Argo's App credential exists to read the
  # repository from inside the cluster, which is a different direction.
  contents: write
  id-token: write

concurrency:
  # A second deploy overtaking the first would leave the cluster on whichever
  # release landed last rather than on whichever is newer.
  group: deploy-eks-${{ inputs.deployment || 'lazycloud-prod' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build images and record them
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOYMENT: ${{ inputs.deployment || 'lazycloud-prod' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      RELEASE_MANIFEST_URL: ${{ inputs.release_manifest_url }}
      DEPLOYMENT_BRANCH: ${{ vars.DEPLOYMENT_BRANCH || 'prod' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # An ECR tag is immutable, so a deploy re-run for a commit whose images
      # are already published cannot push them again. Recording the values is
      # still the point of the run: a deployment moves onto a new release
      # without its code changing, and that deploy has nothing to build.
      #
      # All or nothing. A tag present in some repositories and absent in others
      # is a half-published build, and completing it would put images from two
      # trees behind one tag -- the package-digest mismatch the managed runtime
      # rejects at container start, which names a digest rather than the deploy
      # that produced it.
      - name: Check whether this commit is already published
        id: published
        run: |
          set -euo pipefail
          present=0
          missing=0
          for repository in api scheduler cache-server worker-bootstrap cli database-bootstrap; do
            if aws ecr describe-images \
              --repository-name "$DEPLOYMENT/$repository" \
              --image-ids "imageTag=$GITHUB_SHA" >/dev/null 2>&1; then
              present=$((present + 1))
            else
              missing=$((missing + 1))
              echo "not published: $DEPLOYMENT/$repository:$GITHUB_SHA"
            fi
          done
          if [ "$present" -gt 0 ] && [ "$missing" -gt 0 ]; then
            echo "::error::$present image(s) already published at $GITHUB_SHA and $missing missing; an immutable tag cannot be completed. Deploy a new commit."
            exit 1
          fi
          if [ "$missing" -gt 0 ]; then
            echo "build=true" >>"$GITHUB_OUTPUT"
          else
            echo "build=false" >>"$GITHUB_OUTPUT"
            echo "every image is already published at $GITHUB_SHA; recording values only"
          fi

      - name: Set up Docker Buildx
        if: steps.published.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push every control-plane image
        if: steps.published.outputs.build == 'true'
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker/bake.hcl
          targets: control-plane
          push: true
          set: |
            *.cache-from=type=gha,scope=deploy-control-plane
            *.cache-to=type=gha,mode=max,scope=deploy-control-plane
            api.tags=${{ steps.ecr.outputs.registry }}/${{ env.DEPLOYMENT }}/api:${{ github.sha }}
            scheduler.tags=${{ steps.ecr.outputs.registry }}/${{ env.DEPLOYMENT }}/scheduler:${{ github.sha }}
            cache-server.tags=${{ steps.ecr.outputs.registry }}/${{ env.DEPLOYMENT }}/cache-server:${{ github.sha }}
            worker-bootstrap.tags=${{ steps.ecr.outputs.registry }}/${{ env.DEPLOYMENT }}/worker-bootstrap:${{ github.sha }}
            cli.tags=${{ steps.ecr.outputs.registry }}/${{ env.DEPLOYMENT }}/cli:${{ github.sha }}
            database-bootstrap.tags=${{ steps.ecr.outputs.registry }}/${{ env.DEPLOYMENT }}/database-bootstrap:${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Not present on the runner image, and the failure is `command not found`
      # rather than anything that names Terraform.
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Render the values the branch will carry
        run: |
          set -euo pipefail
          terraform -chdir=deploy/platform-eks init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=platform-eks/$DEPLOYMENT.tfstate" \
            -backend-config="region=$AWS_REGION"
          terraform -chdir=deploy/platform-eks output -json runtime_configuration >runtime.json
          terraform -chdir=deploy/platform-eks output -json secret_files >secret-files.json
          terraform -chdir=deploy/platform-eks output -json fleet_connection >fleet.json
          terraform -chdir=deploy/platform-eks output -json secret_environment >secret-map.json
          tunnel_id="$(terraform -chdir=deploy/platform-eks output -raw cloudflare_tunnel_id)"

          # Which release this deployment runs is a fact about the deployment,
          # not about its infrastructure, so it is not a Terraform output. It
          # lives beside the bundle, in the bucket Terraform does own, and is
          # therefore destroyed with the stack rather than outliving it.
          bucket="$(terraform -chdir=deploy/platform-eks output -raw deploy_bucket)"
          pointer="s3://${bucket}/current/release-manifest-url"
          if [ -z "${RELEASE_MANIFEST_URL}" ]; then
            RELEASE_MANIFEST_URL="$(aws s3 cp "${pointer}" - 2>/dev/null || true)"
          else
            printf '%s' "${RELEASE_MANIFEST_URL}" | aws s3 cp - "${pointer}"
          fi
          if [ -z "${RELEASE_MANIFEST_URL}" ]; then
            echo "::warning::No release named; this control plane will run without managed capacity."
          fi

          uv run --group workspace python deploy/chart_values.py \
            --registry "${{ steps.ecr.outputs.registry }}" \
            --deployment "$DEPLOYMENT" \
            --tag "$GITHUB_SHA" \
            --tunnel-id "${tunnel_id}" \
            --runtime runtime.json \
            --secret-map secret-map.json \
            --secret-files secret-files.json \
            --fleet fleet.json \
            --release-manifest-url "${RELEASE_MANIFEST_URL}" \
            --output values-prod.yaml

      - name: Record it on the deployment branch
        run: |
          set -euo pipefail
          git config user.name "lazycloud-deploy"
          git config user.email "deploy@lazycloud.dev"
          git remote set-url origin \
            "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"

          # Branched from this commit rather than merged into: the deployment
          # branch is the source that produced the images plus the file naming
          # them, so it can never describe a tree the tag was not built from.
          git fetch origin "${DEPLOYMENT_BRANCH}" || true
          git checkout -B "${DEPLOYMENT_BRANCH}" "$GITHUB_SHA"
          # Argo reads `deploy/chart` from this branch and nothing else, so the
          # workflows are carried here for no reader. They are not free to
          # carry: a deploy of any commit that touched one makes this push a
          # workflow rewrite, which the workflow token is refused — at the push,
          # after every image is built, and with no way to grant it, because
          # `workflows` is not a permission a job can ask for.
          git rm -r --quiet --cached .github
          mv values-prod.yaml deploy/chart/values-prod.yaml
          git add deploy/chart/values-prod.yaml
          git commit -m "Run ${GITHUB_SHA}"
          git push --force-with-lease origin "${DEPLOYMENT_BRANCH}"
