name: Deploy Services

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: write
  id-token: write

jobs:
  # Determine which services to build
  prepare:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    outputs:
      build_web: ${{ steps.check.outputs.build_web }}
      build_backend: ${{ steps.check.outputs.build_backend }}
      is_staging: ${{ inputs.environment == 'staging' }}
    steps:
      - name: Determine services to build
        id: check
        run: |
          echo "build_web=true" >> $GITHUB_OUTPUT
          echo "build_backend=true" >> $GITHUB_OUTPUT

  # Build jobs (only for staging - production promotes from staging)
  build-web:
    name: Build Web
    needs: [prepare]
    if: needs.prepare.outputs.build_web == 'true' && inputs.environment == 'staging'
    uses: ./.github/workflows/_build_push.yml
    with:
      app_name: web
      dockerfile_path: ./apps/web/Dockerfile
      build_context: .
      image_name: web
    secrets: inherit

  build-api:
    name: Build API
    needs: [prepare]
    if: needs.prepare.outputs.build_backend == 'true' && inputs.environment == 'staging'
    uses: ./.github/workflows/_build_push.yml
    with:
      app_name: backend-api
      dockerfile_path: ./apps/backend/Dockerfile
      build_context: .
      image_name: backend-api
      docker_target: api
    secrets: inherit

  build-background-worker:
    name: Build Background Worker
    needs: [prepare]
    if: needs.prepare.outputs.build_backend == 'true' && inputs.environment == 'staging'
    uses: ./.github/workflows/_build_push.yml
    with:
      app_name: backend-background-worker
      dockerfile_path: ./apps/backend/Dockerfile
      build_context: .
      image_name: backend-background-workers
      docker_target: background-workers
    secrets: inherit

  build-cron-worker:
    name: Build Cron Worker
    needs: [prepare]
    if: needs.prepare.outputs.build_backend == 'true' && inputs.environment == 'staging'
    uses: ./.github/workflows/_build_push.yml
    with:
      app_name: backend-cron-worker
      dockerfile_path: ./apps/backend/Dockerfile
      build_context: .
      image_name: backend-crons
      docker_target: crons
    secrets: inherit

  # Deploy to staging - update values and push to staging branch
  deploy-staging:
    name: Deploy to Staging
    needs: [prepare, build-web, build-api, build-background-worker, build-cron-worker]
    if: |
      always() &&
      inputs.environment == 'staging' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      web_sha: ${{ steps.update.outputs.web_sha }}
      api_sha: ${{ steps.update.outputs.api_sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update values files
        id: update
        run: |
          # Get image SHAs from build outputs
          WEB_SHA="${{ needs.build-web.outputs.image_sha }}"
          API_SHA="${{ needs.build-api.outputs.image_sha }}"

          echo "web_sha=$WEB_SHA" >> $GITHUB_OUTPUT
          echo "api_sha=$API_SHA" >> $GITHUB_OUTPUT

          # Update web if built
          if [ -n "$WEB_SHA" ]; then
            echo "Updating web to $WEB_SHA"
            sed -i "s/tag: \".*\"/tag: \"${WEB_SHA}\"/" deploy/services/web/values-staging.yaml
          fi

          # Update backend if built
          if [ -n "$API_SHA" ]; then
            echo "Updating backend to $API_SHA"
            sed -i "s/tag: \".*\"/tag: \"${API_SHA}\"/" deploy/services/api-platform/values-staging.yaml
          fi

      - name: Commit and push to staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create/update staging branch from current state
          git checkout -B staging

          git add deploy/services/*/values-staging.yaml

          # Build commit message
          MSG="Deploy to staging:"
          [ -n "${{ needs.build-web.outputs.image_sha }}" ] && MSG="$MSG web=${{ needs.build-web.outputs.image_sha }}"
          [ -n "${{ needs.build-api.outputs.image_sha }}" ] && MSG="$MSG api=${{ needs.build-api.outputs.image_sha }}"

          git commit -m "$MSG" || echo "No changes to commit"
          git push -f origin staging

  # Deploy to production - promote from staging
  deploy-production:
    name: Deploy to Production
    needs: [prepare]
    if: inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      web_sha: ${{ steps.promote.outputs.web_sha }}
      api_sha: ${{ steps.promote.outputs.api_sha }}
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current staging versions
        id: promote
        run: |
          # Extract current staging image tags
          WEB_SHA=$(grep -oP 'tag: "\K[^"]+' deploy/services/web/values-staging.yaml || echo "")
          API_SHA=$(grep -oP 'tag: "\K[^"]+' deploy/services/api-platform/values-staging.yaml || echo "")

          echo "Promoting from staging:"
          echo "  web: $WEB_SHA"
          echo "  api: $API_SHA"

          echo "web_sha=$WEB_SHA" >> $GITHUB_OUTPUT
          echo "api_sha=$API_SHA" >> $GITHUB_OUTPUT

          # Update prod values with staging versions
          sed -i "s/tag: \".*\"/tag: \"${WEB_SHA}\"/" deploy/services/web/values-prod.yaml
          sed -i "s/tag: \".*\"/tag: \"${API_SHA}\"/" deploy/services/api-platform/values-prod.yaml

      - name: Commit and push to production branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create/update production branch
          git checkout -B production

          git add deploy/services/*/values-prod.yaml

          # Build commit message
          MSG="Deploy to production: web=${{ steps.promote.outputs.web_sha }} api=${{ steps.promote.outputs.api_sha }}"

          git commit -m "$MSG" || echo "No changes to commit"
          git push -f origin production

  # Summary
  summary:
    name: Deployment Summary
    needs: [prepare, build-web, build-api, deploy-staging, deploy-production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ inputs.environment }}" = "staging" ]; then
            echo "### Deployed Versions" >> $GITHUB_STEP_SUMMARY
            echo "- Web: \`${{ needs.deploy-staging.outputs.web_sha }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- API: \`${{ needs.deploy-staging.outputs.api_sha }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**URLs:**" >> $GITHUB_STEP_SUMMARY
            echo "- https://staging.lazycloud.dev" >> $GITHUB_STEP_SUMMARY
            echo "- https://api-staging.lazycloud.dev" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Promoted Versions (from staging)" >> $GITHUB_STEP_SUMMARY
            echo "- Web: \`${{ needs.deploy-production.outputs.web_sha }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- API: \`${{ needs.deploy-production.outputs.api_sha }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**URLs:**" >> $GITHUB_STEP_SUMMARY
            echo "- https://lazycloud.dev" >> $GITHUB_STEP_SUMMARY
            echo "- https://api.lazycloud.dev" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ArgoCD will automatically sync from the \`${{ inputs.environment }}\` branch." >> $GITHUB_STEP_SUMMARY
