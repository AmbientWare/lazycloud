name: Deploy

on:
  workflow_dispatch:
    inputs:
      deployment:
        type: choice
        default: prod
        options: [prod, staging]
        required: true
      release_manifest_url:
        description: Complete published release to select, including for rollback.
        type: string
        required: true
  workflow_call:
    inputs:
      deployment:
        type: string
        required: true
      release_manifest_url:
        type: string
        required: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: deploy-${{ inputs.deployment }}
  cancel-in-progress: false

jobs:
  select:
    name: Record the selected release
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment }}
    env:
      DEPLOYMENT: lazycloud-${{ inputs.deployment }}
      BRANCH: ${{ inputs.deployment }}
      RELEASE_MANIFEST_URL: ${{ inputs.release_manifest_url }}
    steps:
      - name: Validate deployment
        run: |
          case "$BRANCH" in prod|staging) ;; *) exit 1 ;; esac
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Resolve the published source
        run: |
          set -euo pipefail
          uv run --frozen --group workspace python - <<'PY'
          import os
          from pathlib import Path
          from provider_clients.release import fetch_release_manifest
          manifest = fetch_release_manifest(os.environ["RELEASE_MANIFEST_URL"])
          Path(os.environ["RUNNER_TEMP"], "release-manifest.json").write_text(manifest.model_dump_json())
          with open(os.environ["GITHUB_ENV"], "a") as out:
              out.write(f"COMMIT={manifest.source_revision}\n")
          PY
      - name: Render the deployment from the published source
        env:
          INFRASTRUCTURE_CONFIG_URI: ${{ vars.INFRASTRUCTURE_CONFIG_URI }}
          LAZYCLOUD_OBJECT_STORE_ENDPOINT_URL: ${{ vars.LAZYCLOUD_OBJECT_STORE_ENDPOINT_URL }}
          LAZYCLOUD_OBJECT_STORE_REGION_NAME: ${{ vars.LAZYCLOUD_OBJECT_STORE_REGION_NAME }}
          LAZYCLOUD_OBJECT_STORE_FORCE_PATH_STYLE: ${{ vars.LAZYCLOUD_OBJECT_STORE_FORCE_PATH_STYLE }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$COMMIT"
          git checkout --detach "$COMMIT"
          uv run --frozen --group workspace python -m deploy.object_storage download \
            --uri "$INFRASTRUCTURE_CONFIG_URI" --file "$RUNNER_TEMP/infrastructure.json"
          git ls-remote --heads origin "refs/heads/$BRANCH" > "$RUNNER_TEMP/deployment-ref"
          previous="$(cut -f1 "$RUNNER_TEMP/deployment-ref")"
          echo "PREVIOUS_DEPLOYMENT=$previous" >> "$GITHUB_ENV"
          previous_args=()
          if [ -n "$previous" ]; then
            git fetch --depth=1 origin "$previous"
            git show "$previous:deploy/chart/values-deployment.yaml" > "$RUNNER_TEMP/previous-values.yaml"
            git show "$previous:deploy/chart/values.yaml" > "$RUNNER_TEMP/previous-chart-values.yaml"
            previous_args=(--previous-values "$RUNNER_TEMP/previous-values.yaml" --previous-chart-values "$RUNNER_TEMP/previous-chart-values.yaml")
          fi
          uv run --frozen --group workspace python -m deploy.chart_values \
            --infrastructure "$RUNNER_TEMP/infrastructure.json" \
            --environment "deploy/chart/environments/$BRANCH.yaml" \
            --deployment "$DEPLOYMENT" --manifest "$RUNNER_TEMP/release-manifest.json" \
            "${previous_args[@]}" --output "$RUNNER_TEMP/values-deployment.yaml"
          helm lint deploy/chart --strict -f "$RUNNER_TEMP/values-deployment.yaml"
          helm template "$DEPLOYMENT" deploy/chart --namespace "$DEPLOYMENT" \
            -f "$RUNNER_TEMP/values-deployment.yaml" > "$RUNNER_TEMP/rendered.yaml"
      - name: Record the release for Argo CD
        run: |
          set -euo pipefail
          git config user.name "lazycloud-deploy"
          git config user.email "deploy@lazycloud.dev"
          git checkout -B "$BRANCH" "$COMMIT"
          git rm -r --quiet --cached .github
          cp "$RUNNER_TEMP/values-deployment.yaml" deploy/chart/values-deployment.yaml
          git add deploy/chart/values-deployment.yaml
          git commit -m "Select release from $COMMIT"
          git push --force-with-lease="refs/heads/$BRANCH:$PREVIOUS_DEPLOYMENT" origin "HEAD:refs/heads/$BRANCH"
          echo "$DEPLOYMENT selected $RELEASE_MANIFEST_URL. Argo CD owns rollout; release status reports runtime completion." >> "$GITHUB_STEP_SUMMARY"
