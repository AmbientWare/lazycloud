name: Release Artifacts

# A release is the unit a deployment points at, and the unit a customer's own AWS
# account pulls from. It is published on its own rather than as a deploy step so
# that shipping code to our control plane does not rebuild artifacts other
# people's infrastructure already resolves.
#
# `ship.yml` cuts the version, runs this, and then the deploy.

# Called by `ship.yml`, never dispatched on its own. Publishing a release
# finishes nothing by itself: the artifacts are immutable and public, and
# nothing runs them until a deploy records the manifest URL against a
# deployment. Running this alone is how a control plane ends up refusing to
# start against a release that exists and that it was never told about.
on:
  workflow_call:
    inputs:
      version:
        description: The version this release is published under, as cut by ship.yml.
        type: string
        required: true
    outputs:
      manifest_url:
        description: Public URL of the published manifest, for a deployment to name.
        value: ${{ jobs.connected-aws-assets.outputs.manifest_url }}

permissions:
  contents: read
  id-token: write

jobs:
  connected-aws-assets:
    name: Publish connected AWS assets
    runs-on: ubuntu-latest
    environment: release
    outputs:
      manifest_url: ${{ steps.published.outputs.manifest_url }}
    env:
      AWS_RELEASE_REGION: ${{ vars.AWS_RELEASE_REGION || 'us-east-1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure release AWS identity
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_RELEASE_REGION }}

      - name: Resolve the current node image catalog
        id: images
        shell: bash
        run: |
          set -euo pipefail
          url="https://s3.${AWS_RELEASE_REGION}.amazonaws.com/${{ vars.AWS_RELEASE_ASSET_BUCKET }}/connected-aws/node-images/current.json"
          if ! curl -fsS -o node-images.json "${url}"; then
            echo "::error::No current node image catalog. Run the Node Images workflow on main before Ship."
            exit 1
          fi
          uv run --group workspace python -m deploy.ami.catalog resolve \
            --catalog node-images.json \
            --github-output "${GITHUB_OUTPUT}"
          echo "node image catalog: ${url}"

      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Resolve public container worker repository
        id: repository
        shell: bash
        run: |
          repository="$(aws ecr-public describe-repositories \
            --repository-names '${{ vars.AWS_RELEASE_CONTAINER_WORKER_REPOSITORY_NAME }}' \
            --region us-east-1 \
            --query 'repositories[0].repositoryUri' \
            --output text)"
          test -n "${repository}"
          test "${repository}" != "None"
          echo "uri=${repository}" >> "${GITHUB_OUTPUT}"

      # The previous release is the baseline every reuse decision is made
      # against. Its manifest names each artifact by digest, which is how the
      # control plane and the managed runtime check them, so a manifest for this
      # version may point at an artifact an earlier one built. Tags newer than
      # this one are skipped, and a tag with no manifest behind it (a cancelled
      # ship) is skipped too, back to the newest release that published.
      - name: Resolve the previous release
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          base=""
          for tag in $(git tag -l 'v*' --sort=-v:refname | grep -vx "v${{ inputs.version }}" | head -5); do
            url="https://s3.${AWS_RELEASE_REGION}.amazonaws.com/${{ vars.AWS_RELEASE_ASSET_BUCKET }}/connected-aws/releases/${tag#v}/manifest.json"
            if curl -fsS -o previous-manifest.json "${url}"; then
              base="${tag}"
              echo "baseline ${tag}: ${url}"
              break
            fi
            echo "${tag} published no manifest; looking further back"
          done
          if [ -z "${base}" ]; then
            echo "::warning::no previous release with a manifest; every artifact is built"
            rm -f previous-manifest.json
          fi
          echo "base=${base}" >> "${GITHUB_OUTPUT}"

      - name: Plan what this release rebuilds
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          manifest_arg=()
          if [ -f previous-manifest.json ]; then
            manifest_arg=(--previous-manifest previous-manifest.json)
          fi
          uv run --group workspace python deploy/aws-release-assets/plan.py \
            "${manifest_arg[@]}" \
            --base "${{ steps.previous.outputs.base }}" \
            --head "${GITHUB_SHA}" \
            --output plan.json \
            --summary "${GITHUB_STEP_SUMMARY}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Build and stage Linux agent executables
        if: steps.plan.outputs.rebuild_agent == 'true'
        run: >-
          uv run --no-project python deploy/agent-binary/build.py build
          --version "${{ inputs.version }}"
          --output dist/agent-binarys
          --arch amd64

      # The same bytes the previous release published, staged under this
      # version. The stage tool verifies the hash and the ELF header the way it
      # does for a fresh build, and the object is republished under this
      # version's key so the manifest's object list is complete on its own.
      - name: Reuse the previous release's agent executable
        if: steps.plan.outputs.rebuild_agent != 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          directory="dist/agent-binarys/${version}"
          mkdir -p "${directory}"
          curl -fsSL -o "${directory}/lazycloud-agent-linux-amd64" \
            "${{ steps.plan.outputs.previous_agent_url }}"
          echo "${{ steps.plan.outputs.previous_agent_sha256 }}  ${directory}/lazycloud-agent-linux-amd64" | sha256sum -c -
          chmod 0755 "${directory}/lazycloud-agent-linux-amd64"
          python3 - "${version}" "${directory}" <<'PY'
          import json, os, sys
          version, directory = sys.argv[1], sys.argv[2]
          path = os.path.join(directory, "lazycloud-agent-linux-amd64")
          manifest = {
              "schema_version": 1,
              "version": version,
              "artifacts": [{
                  "os": "linux",
                  "arch": "amd64",
                  "filename": "lazycloud-agent-linux-amd64",
                  "sha256": "${{ steps.plan.outputs.previous_agent_sha256 }}",
                  "size_bytes": os.path.getsize(path),
              }],
          }
          with open(os.path.join(directory, "manifest.json"), "w") as handle:
              handle.write(json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n")
          PY

      - name: Build and publish container worker
        if: steps.plan.outputs.rebuild_worker == 'true'
        id: container-worker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.worker
          target: container-worker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.repository.outputs.uri }}:${{ inputs.version }}
          cache-from: type=gha,scope=connected-aws-container-worker
          cache-to: type=gha,mode=max,scope=connected-aws-container-worker

      - name: Resolve the worker image this release names
        id: worker
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.plan.outputs.rebuild_worker }}" = "true" ]; then
            image="${{ steps.repository.outputs.uri }}@${{ steps.container-worker.outputs.digest }}"
          else
            image="${{ steps.plan.outputs.previous_worker_image }}"
          fi
          test -n "${image}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "worker image: ${image}"

      - name: Stage immutable connected AWS release bundle
        run: >-
          uv run --group workspace python deploy/aws-release-assets/release.py stage
          --version "${{ inputs.version }}"
          --agent-version-dir
          "dist/agent-binarys/${{ inputs.version }}"
          --worker-image "${{ steps.worker.outputs.image }}"
          --bucket "${{ vars.AWS_RELEASE_ASSET_BUCKET }}"
          --region "${AWS_RELEASE_REGION}"
          --cpu-ami-ids '${{ steps.images.outputs.cpu_ami_ids }}'
          --gpu-ami-ids '${{ steps.images.outputs.gpu_ami_ids }}'
          --source-revision "${GITHUB_SHA}"
          --reused-from '${{ steps.plan.outputs.reused_from }}'
          --output dist/connected-aws

      - name: Publish and anonymously verify connected AWS release bundle
        run: >-
          uv run --group workspace python deploy/aws-release-assets/release.py publish
          --manifest
          "dist/connected-aws/${{ inputs.version }}/manifest.json"

      - name: Name the published release
        id: published
        shell: bash
        run: |
          set -euo pipefail
          manifest="dist/connected-aws/${{ inputs.version }}/manifest.json"
          url="$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["manifest_public_url"])' "${manifest}")"
          test -n "${url}"
          echo "manifest_url=${url}" >> "${GITHUB_OUTPUT}"
          echo "Published ${{ inputs.version }} at ${url}"

      - name: Verify published assets without AWS or registry credentials
        run: >-
          uv run --group workspace python deploy/aws-release-assets/release.py verify
          --manifest
          "dist/connected-aws/${{ inputs.version }}/manifest.json"

      - name: Upload connected AWS release evidence
        uses: actions/upload-artifact@v7
        with:
          name: lazycloud-connected-aws-${{ inputs.version }}
          path: dist/connected-aws/${{ inputs.version }}/
          if-no-files-found: error
