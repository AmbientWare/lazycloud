name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v0.1.0, v1.2.3
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Linux AMD64
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            python-arch: x64

          # macOS Intel
          - os: darwin
            arch: amd64
            runner: macos-13
            python-arch: x64

          # macOS Apple Silicon
          - os: darwin
            arch: arm64
            runner: macos-14
            python-arch: arm64

          # Windows
          - os: windows
            arch: amd64
            runner: windows-latest
            python-arch: x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python-arch }}

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Install dependencies
        run: |
          cd apps/cli
          uv sync
          uv pip install pyinstaller

      - name: Build binary with PyInstaller
        run: |
          cd apps/cli
          uv run pyinstaller release/build.spec --clean

      - name: Create tarball (Unix)
        if: matrix.os != 'windows'
        run: |
          cd apps/cli/dist
          tar -czf lazycloud-${{ matrix.os }}-${{ matrix.arch }}.tar.gz lazycloud
          sha256sum lazycloud-${{ matrix.os }}-${{ matrix.arch }}.tar.gz > lazycloud-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256

      - name: Create zip (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          cd apps/cli/dist
          Compress-Archive -Path lazycloud.exe -DestinationPath lazycloud-${{ matrix.os }}-${{ matrix.arch }}.zip
          (Get-FileHash lazycloud-${{ matrix.os }}-${{ matrix.arch }}.zip -Algorithm SHA256).Hash | Out-File -FilePath lazycloud-${{ matrix.os }}-${{ matrix.arch }}.zip.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lazycloud-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            apps/cli/dist/lazycloud-*

  release:
    name: Publish to Releases Repo
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Checkout releases repo
        uses: actions/checkout@v4
        with:
          repository: AmbientWare/lazycloud-releases
          token: ${{ secrets.RELEASES_REPO_DEPLOY_KEY }}
          path: releases-repo

      - name: Copy README and artifacts
        run: |
          # Copy release README as main README
          cp apps/cli/release/release_readme.md releases-repo/README.md

          # Create release directory if it doesn't exist
          mkdir -p releases-repo/${{ github.ref_name }}

          # Copy all binaries to release directory
          find artifacts -type f -name "lazycloud-*" -exec cp {} releases-repo/${{ github.ref_name }}/ \;

      - name: Commit and push to releases repo
        working-directory: releases-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Release ${{ github.ref_name }}" || echo "No changes to commit"
          git push

      - name: Create GitHub Release in releases repo
        uses: softprops/action-gh-release@v1
        with:
          repository: AmbientWare/lazycloud-releases
          files: releases-repo/${{ github.ref_name }}/*
          draft: false
          prerelease: false
          body_path: apps/cli/release/release_readme.md
          token: ${{ secrets.RELEASES_REPO_DEPLOY_KEY }}
