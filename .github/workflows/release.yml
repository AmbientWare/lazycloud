name: Release images

# A v* tag publishes the server, scheduler and agent images to ECR once every
# Go, Python, web and deployment check passes on the tagged commit.
#
# It deploys nothing. There is no Ship equivalent for these services yet: no
# workflow changes a cluster, and production keeps running the reference
# platform until a cutover is authorized. The checks are owner tests; they do
# not stand for platform acceptance against real providers.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  go:
    uses: ./.github/workflows/go.yml
  python:
    uses: ./.github/workflows/python.yml
  web:
    uses: ./.github/workflows/web.yml
  deploy:
    uses: ./.github/workflows/deploy.yml

  publish:
    needs: [go, python, web, deploy]
    runs-on: ubuntu-26.04
    # The image release role trusts only jobs in this environment; its
    # deployment rule admits v* tags alone.
    environment: images
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Release settings
        env:
          ROLE: ${{ vars.AWS_IMAGE_RELEASE_ROLE_ARN }}
          REGISTRY: ${{ vars.IMAGE_REGISTRY }}
        run: |
          if [ -z "$ROLE" ] || [ -z "$REGISTRY" ]; then
            echo "::error::Set AWS_IMAGE_RELEASE_ROLE_ARN and IMAGE_REGISTRY on the images environment (deploy/terraform/images outputs)."
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_IMAGE_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push
        env:
          REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          VERSION: ${{ github.ref_name }}
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          docker buildx bake -f deploy/images/docker-bake.hcl --push \
            --metadata-file "$RUNNER_TEMP/images.json"
      - name: Record digests
        run: |
          {
            echo "## Images"
            echo
            echo "Published only; nothing was deployed."
            echo
            jq -r 'to_entries[] | "- \(.key): `\(.value["image.name"])@\(.value["containerimage.digest"])`"' \
              "$RUNNER_TEMP/images.json"
          } >>"$GITHUB_STEP_SUMMARY"
