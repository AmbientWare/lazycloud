name: Tests

on:
  workflow_dispatch:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lc_dev
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://lc_dev:password@localhost:5432/postgres
      PREFECT_API_URL: http://localhost:4200/api
      PREFECT_LOCAL_STORAGE_PATH: /tmp/prefect-task-storage
      # these are not used in the tests, but are required by the app
      ADMIN_API_KEY: test-admin-key
      REDIS_URL: redis://localhost:6379
      AWS_ACCOUNT_ID: "000000000000"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      AWS_ECR_BASE_ROLE_ARN: arn:aws:iam::000000000000:role/LazyCloudECRBaseRole
      AWS_ROUTE53_ZONES: "{}"
      DB_SECRET_KEY: zkylH2X8q71YyllmlO4kL_8wmQc7JRooJgGppjWV5Hc=
      RESEND_API_KEY: test-resend-key
      PROMETHEUS_URL: http://localhost:9090
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run database migrations
        working-directory: src/lazycloud_api
        run: uv run alembic upgrade head

      - name: Start Prefect server
        run: |
          docker run -d \
            --name prefect-server \
            -p 4200:4200 \
            -e PREFECT_SERVER_API_HOST=0.0.0.0 \
            prefecthq/prefect:3-latest \
            prefect server start --host 0.0.0.0
          echo "Prefect server container started"

      - name: Wait for Prefect server
        run: |
          timeout=60
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            if curl -f http://localhost:4200/api/health > /dev/null 2>&1; then
              echo "Prefect server is ready"
              exit 0
            fi
            echo "Waiting for Prefect server... ($elapsed/$timeout seconds)"
            sleep 2
            elapsed=$((elapsed + 2))
          done
          echo "Prefect server failed to start"
          docker logs prefect-server || true
          exit 1

      - name: Run tests
        run: uv run tests

