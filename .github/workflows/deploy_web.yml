name: Deploy Web

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  # Only build image for staging - production promotes staging image
  build-web:
    name: Build Web Image
    if: inputs.environment == 'staging'
    uses: ./.github/workflows/_build_push.yml
    with:
      app_name: web
      dockerfile_path: ./apps/web/Dockerfile
      build_context: .
      ecr_repository: web
    secrets: inherit

  deploy-staging:
    name: Deploy to Staging
    if: inputs.environment == 'staging'
    needs: [build-web]
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      image_sha: ${{ needs.build-web.outputs.image_sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Update staging values
        run: |
          IMAGE_SHA="${{ needs.build-web.outputs.image_sha }}"
          echo "Updating values-staging.yaml with image SHA: $IMAGE_SHA"
          sed -i "s/tag: \".*\"/tag: \"${IMAGE_SHA}\"/" deploy/services/web/values-staging.yaml

      - name: Commit and tag as staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          IMAGE_SHA="${{ needs.build-web.outputs.image_sha }}"

          git add deploy/services/web/values-staging.yaml
          git commit -m "🚀 Deploy web to staging: $IMAGE_SHA"

          # Tag and force push
          git tag -f staging
          git push -f origin staging

  deploy-production:
    name: Deploy to Production
    if: inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image_sha: ${{ steps.get-sha.outputs.image_sha }}
    steps:
      - name: Checkout staging tag
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: staging
          fetch-depth: 0

      - name: Get image SHA from staging
        id: get-sha
        run: |
          IMAGE_SHA=$(grep -oP 'tag: "\K[^"]+' deploy/services/web/values-staging.yaml)
          echo "Promoting staging image: $IMAGE_SHA"
          echo "image_sha=$IMAGE_SHA" >> $GITHUB_OUTPUT

      - name: Update production values
        run: |
          IMAGE_SHA="${{ steps.get-sha.outputs.image_sha }}"
          echo "Updating values-prod.yaml with image SHA: $IMAGE_SHA"
          sed -i "s/tag: \".*\"/tag: \"${IMAGE_SHA}\"/" deploy/services/web/values-prod.yaml

      - name: Commit and tag as production
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          IMAGE_SHA="${{ steps.get-sha.outputs.image_sha }}"

          git add deploy/services/web/values-prod.yaml
          git commit -m "🚀 Deploy web to production: $IMAGE_SHA"

          # Tag and force push
          git tag -f production
          git push -f origin production

  summary:
    name: Deployment Summary
    needs: [build-web, deploy-staging, deploy-production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate summary
        run: |
          echo "## 🚀 Web Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ inputs.environment }}\`" >> $GITHUB_STEP_SUMMARY

          if [ "${{ inputs.environment }}" = "staging" ]; then
            echo "**Image SHA:** \`${{ needs.deploy-staging.outputs.image_sha }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Build Status" >> $GITHUB_STEP_SUMMARY
            echo "- Build: ${{ needs.build-web.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- Deploy: ${{ needs.deploy-staging.result }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🌐 **URL:** https://staging.lazycloud.dev" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Image SHA:** \`${{ needs.deploy-production.outputs.image_sha }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Promotion" >> $GITHUB_STEP_SUMMARY
            echo "Promoted staging image to production (no rebuild)" >> $GITHUB_STEP_SUMMARY
            echo "- Deploy: ${{ needs.deploy-production.result }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🌐 **URL:** https://lazycloud.dev" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Argo CD will automatically sync this deployment." >> $GITHUB_STEP_SUMMARY
