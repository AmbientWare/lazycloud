name: Web owner

on:
  pull_request:
    paths:
      - ".github/workflows/web.yml"
      - "apps/web/**"
      - "tests/contracts/http_contract_cases.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/web.yml"
      - "apps/web/**"
      - "tests/contracts/http_contract_cases.json"

permissions:
  contents: read

concurrency:
  group: web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Web checkpoint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Validate web owner
        working-directory: apps/web
        run: |
          bun run format:check
          bun run lint
          bun run typecheck
          bun run test --reporter=default --reporter=junit --outputFile=test-results/vitest.xml
          bun run build

      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results
          path: apps/web/test-results/vitest.xml
          retention-days: 14
