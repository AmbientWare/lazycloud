name: Web owner

on:
  pull_request:
    paths:
      - ".github/workflows/web.yml"
      - "apps/web/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/web.yml"
      - "apps/web/**"

permissions:
  contents: read

jobs:
  validate:
    name: Web checkpoint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Validate web owner
        working-directory: apps/web
        run: |
          bun run format:check
          bun run lint
          bun run typecheck
          bun run test
          bun run build
          bun run quality:bundle
