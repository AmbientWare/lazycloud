name: Web owner

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: web-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # A pull request runs the jobs below only when it changes what they
  # check; "Web passed" always reports, so it can be required.
  changes:
    runs-on: ubuntu-26.04
    outputs:
      run: ${{ steps.changed.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: changed
        uses: ./.github/actions/changed
        with:
          paths: |
            .github/workflows/web.yml
            .github/actions/changed
            web
            contracts

  validate:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Web checkpoint
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Vitest runs under Node. A pinned Node keeps the jsdom Web Storage
      # behaviour the tests rely on from changing with the runner image.
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Validate web owner
        working-directory: web
        run: |
          bun run apigen
          git diff --exit-code -- src/lib/api/generated
          bun run format:check
          bun run lint
          bun run typecheck
          bun run test --reporter=default --reporter=junit --outputFile=test-results/vitest.xml
          bun run build

      # The specs mock the API, except stack.spec.ts, which skips without a
      # running platform.
      - name: Install Chromium
        working-directory: web
        run: bunx playwright install --with-deps chromium

      - name: Browser specs
        working-directory: web
        env:
          WEB_E2E_PRODUCTION: "1"
        run: bun run test:e2e

      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-test-results
          path: web/test-results/vitest.xml
          retention-days: 14

  passed:
    name: Web passed
    needs: [changes, validate]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::a required job ended $result"; exit 1 ;;
            esac
          done
