name: Benchmark

# Compares two commits with the A/B harness (acceptance/bench): each gets a
# fresh local stack on this runner, one after the other, so both see the same
# machine. The summary holds the comparison table; the raw results are an
# artifact. Run it from the ref whose harness should measure both.
on:
  workflow_dispatch:
    inputs:
      base:
        description: Branch, tag or commit to compare against
        type: string
        default: main
      head:
        description: Branch, tag or commit to measure
        type: string
        required: true
      phases:
        description: Space-separated phases (acceptance/bench/README.md); empty runs the default set
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  compare:
    name: Compare ${{ inputs.base }} with ${{ inputs.head }}
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    steps:
      - name: Refuse anyone but a repository admin
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)"
          if [ "$permission" != admin ]; then
            echo "::error::$ACTOR has $permission access; only a repository admin runs this."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.29"
          python-version: "3.12"
      - name: Resolve the commits
        id: commits
        env:
          BASE: ${{ inputs.base }}
          HEAD_REF: ${{ inputs.head }}
        run: |
          set -euo pipefail
          resolve() { git rev-parse --verify --quiet "origin/$1^{commit}" || git rev-parse --verify "$1^{commit}"; }
          echo "base=$(resolve "$BASE")" >>"$GITHUB_OUTPUT"
          echo "head=$(resolve "$HEAD_REF")" >>"$GITHUB_OUTPUT"
      - name: Run both commits
        env:
          LCBENCH_ROOT: ${{ runner.temp }}/lcbench
          BASE_SHA: ${{ steps.commits.outputs.base }}
          HEAD_SHA: ${{ steps.commits.outputs.head }}
          PHASES: ${{ inputs.phases }}
          BASE: ${{ inputs.base }}
          HEAD_REF: ${{ inputs.head }}
        run: |
          set -eu
          # shellcheck disable=SC2086 # one phase per word
          acceptance/bench/ab.sh "$BASE_SHA" "$HEAD_SHA" $PHASES | tee "$LCBENCH_ROOT.table.md"
          {
            echo "## $BASE (${BASE_SHA:0:9}) → $HEAD_REF (${HEAD_SHA:0:9})"
            echo
            cat "$LCBENCH_ROOT.table.md"
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results
          path: |
            ${{ runner.temp }}/lcbench/*.jsonl
            ${{ runner.temp }}/lcbench/*.log
            ${{ runner.temp }}/lcbench.table.md
          if-no-files-found: warn
