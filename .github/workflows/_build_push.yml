# Reusable workflow for building and pushing Docker images to ECR
name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      app_name:
        description: 'Application name for logging'
        required: true
        type: string
      dockerfile_path:
        description: 'Path to Dockerfile'
        required: true
        type: string
      build_context:
        description: 'Docker build context path'
        required: true
        type: string
      ecr_repository:
        description: 'ECR repository name (e.g., lazycloud-web)'
        required: true
        type: string
      docker_target:
        description: 'Docker build target (for multi-stage builds)'
        required: false
        type: string
        default: ''
      build_args:
        description: 'Docker build arguments as multiline string'
        required: false
        type: string
        default: ''
      tag_prefix:
        description: 'Optional prefix for the image tag (e.g., staging-, prod-)'
        required: false
        type: string
        default: ''
    outputs:
      image_tag:
        description: 'Full ECR image tag with SHA'
        value: ${{ jobs.build-push.outputs.image_tag }}
      image_sha:
        description: 'Short git SHA used in tag'
        value: ${{ jobs.build-push.outputs.image_sha }}

jobs:
  build-push:
    runs-on: depot-ubuntu-24.04
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_sha: ${{ steps.meta.outputs.image_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata and generate tags
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY=${{ inputs.ecr_repository }}
          TAG_PREFIX="${{ inputs.tag_prefix }}"
          IMAGE_TAG="${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG_PREFIX}${SHORT_SHA}"

          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "image_sha=${TAG_PREFIX}${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Generated image tag: ${IMAGE_TAG}"

      - name: Parse build args
        id: build-args
        run: |
          BUILD_ARGS="${{ inputs.build_args }}"
          if [ -n "$BUILD_ARGS" ]; then
            echo "build_args<<EOF" >> $GITHUB_OUTPUT
            echo "$BUILD_ARGS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          target: ${{ inputs.docker_target }}
          push: true
          tags: ${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: ${{ steps.build-args.outputs.build_args }}
          platforms: linux/amd64

      - name: Output image information
        run: |
          echo "✅ Built and pushed ${{ inputs.app_name }}"
          echo "📦 Image: ${{ steps.meta.outputs.image_tag }}"
          echo "🔖 SHA: ${{ steps.meta.outputs.image_sha }}"
