# Reusable workflow for building and pushing Docker images to Depot registry
name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      app_name:
        description: 'Application name for logging'
        required: true
        type: string
      dockerfile_path:
        description: 'Path to Dockerfile'
        required: true
        type: string
      build_context:
        description: 'Docker build context path'
        required: true
        type: string
      image_name:
        description: 'Image name used as tag identifier (e.g., web, backend-api)'
        required: true
        type: string
      docker_target:
        description: 'Docker build target (for multi-stage builds)'
        required: false
        type: string
        default: ''
      build_args:
        description: 'Docker build arguments as multiline string'
        required: false
        type: string
        default: ''
      tag_prefix:
        description: 'Optional prefix for the image tag (e.g., staging-, prod-)'
        required: false
        type: string
        default: ''
    outputs:
      image_tag:
        description: 'Full image tag with SHA'
        value: ${{ jobs.build-push.outputs.image_tag }}
      image_sha:
        description: 'Short git SHA used in tag'
        value: ${{ jobs.build-push.outputs.image_sha }}

jobs:
  build-push:
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_sha: ${{ steps.meta.outputs.image_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Depot CLI
        uses: depot/setup-action@v1

      - name: Extract metadata and generate tags
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          TAG_PREFIX="${{ inputs.tag_prefix }}"
          IMAGE_NAME="${{ inputs.image_name }}"
          # Save tag is just: <image-name>-<sha> (Depot adds registry.depot.dev/<project-id>: automatically)
          SAVE_TAG="${IMAGE_NAME}-${TAG_PREFIX}${SHORT_SHA}"
          # Full image tag for reference
          IMAGE_TAG="registry.depot.dev/${DEPOT_PROJECT_ID}:${SAVE_TAG}"

          echo "save_tag=${SAVE_TAG}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "image_sha=${TAG_PREFIX}${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Generated save tag: ${SAVE_TAG}"
          echo "Full image tag: ${IMAGE_TAG}"
        env:
          DEPOT_PROJECT_ID: ${{ secrets.DEPOT_PROJECT_ID }}

      - name: Parse build args
        id: build-args
        run: |
          BUILD_ARGS="${{ inputs.build_args }}"
          if [ -n "$BUILD_ARGS" ]; then
            echo "build_args<<EOF" >> $GITHUB_OUTPUT
            echo "$BUILD_ARGS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Build and save Docker image to Depot Registry
        uses: depot/build-push-action@v1
        with:
          project: ${{ secrets.DEPOT_PROJECT_ID }}
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          target: ${{ inputs.docker_target }}
          save: true
          save-tags: ${{ steps.meta.outputs.save_tag }}
          build-args: ${{ steps.build-args.outputs.build_args }}
          platforms: linux/amd64

      - name: Output image information
        run: |
          echo "✅ Built and pushed ${{ inputs.app_name }}"
          echo "📦 Image: ${{ steps.meta.outputs.image_tag }}"
          echo "🔖 SHA: ${{ steps.meta.outputs.image_sha }}"
