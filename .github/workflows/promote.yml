name: Promote

# Puts prod on what staging runs. No build: the images were built once when
# staging recorded the commit, so this reads the commit and the release off the
# `staging` branch and records the same pair for prod. Deploy finds every image
# already published and writes the values file.
#
# What promotes is the image tag and the release manifest URL and nothing
# else. Prod's values are rendered from prod's own infrastructure descriptor -- its
# tunnel, its secrets, its database -- so a staging credential never crosses.
#
# Required reviewers on the `prod` environment, if configured, pause exactly at
# the deploy job. That is the approval gate.

on:
  workflow_dispatch:

# What the called workflow needs; a caller cannot grant less than the callee
# asks for.
permissions:
  contents: write
  id-token: write

jobs:
  staging:
    name: Read what staging runs
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.read.outputs.commit }}
      release_manifest_url: ${{ steps.read.outputs.release_manifest_url }}
    steps:
      - name: Checkout the staging branch
        uses: actions/checkout@v6
        with:
          ref: staging
          fetch-depth: 2

      - name: Install the values reader
        run: pip install pyyaml

      # The branch is the built commit plus one commit carrying the values, so
      # the recorded tag and the branch's parent name the same commit. A
      # mismatch means the branch was written by something other than Deploy,
      # and promoting it would put a tree on prod that nothing built.
      - name: Read the recorded commit and release
        id: read
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess, yaml

          values = yaml.safe_load(open("deploy/chart/values-deployment.yaml"))
          commit = values["image"]["tag"]
          manifest = values.get("runtime", {}).get("LAZYCLOUD_RELEASE_MANIFEST_URL", "")
          parent = subprocess.check_output(["git", "rev-parse", "HEAD^"], text=True).strip()
          if parent != commit:
              raise SystemExit(f"staging records {commit} but its branch was built from {parent}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"commit={commit}\n")
              out.write(f"release_manifest_url={manifest}\n")
          summary = f"Promoting {commit}"
          summary += f" on release {manifest}" if manifest else " with prod's recorded release unchanged"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(summary + "\n")
          print(summary)
          PY

  prod:
    name: Record it for prod
    needs: staging
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      deployment: prod
      release_manifest_url: ${{ needs.staging.outputs.release_manifest_url }}
