name: Promote

# Puts prod on the version staging runs. Nothing is built: the version's
# images and package were published once by Ship. Prod's values come from
# prod's own Terraform values, so no staging identity crosses. Reviewers on
# the prod environment, if configured, pause the run at the Deploy job.

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  staging:
    name: Read what staging runs
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: staging
          fetch-depth: 2
      # The branch is the version's tag plus one commit carrying the values.
      # Anything else was written by something other than Deploy.
      - name: Read the recorded version
        id: read
        run: |
          set -euo pipefail
          version="$(jq -r .release.version deploy/helm/lazycloud/values-deployment.yaml)"
          git fetch --depth=1 origin "refs/tags/v$version:refs/tags/v$version"
          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse "v$version^{commit}")" ]; then
            echo "::error::staging records $version but its branch was not built from v$version"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "Promoting $version" >>"$GITHUB_STEP_SUMMARY"

  prod:
    name: Record it for prod
    needs: staging
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      deployment: prod
      version: ${{ needs.staging.outputs.version }}
