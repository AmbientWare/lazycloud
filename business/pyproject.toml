[project]
name = "business"
version = "0.1.0"
description = "LazyCloud business analytics and pricing simulations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "models",
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "plotly>=6.5.2",
    "streamlit>=1.53.1",
]

[tool.uv.sources]
models = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pricing", "marketing"]
