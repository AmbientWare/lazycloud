name: cache-default
kind: cache
runner: cache
description: Embedded cache throughput and proof benchmark profile.
defaults:
  verify_reads: true
  require_remote_read: true
  require_read_path_proof: true
  direct_cache_disk_probe: true
  cleanup_cache_before_run: true
  cleanup_cache_after_run: true
  remote_cache_proof_chunk_bytes: 4194304
  remote_cache_proof_concurrency: 2
scenarios:
  - name: volume-strict-sequential-64
    access: volume_mount
    operation: read
    pattern: sequential
    size_mib: 64
    cache_state: strict_disk
    probes:
      - sandbox_read
      - worker_direct_read
      - sandbox_direct_read
      - remote_cache_socket
      - cache_path
    thresholds:
      python_file_read_min_mbps: 100
      remote_cache_socket_read_min_mbps: 100
  - name: workspace-strict-sequential-64
    access: workspace_fuse
    operation: read
    pattern: sequential
    size_mib: 64
    cache_state: strict_disk
    probes:
      - worker_read
      - worker_direct_read
      - remote_cache_socket
      - cache_path
    thresholds:
      python_file_read_min_mbps: 100
      remote_cache_socket_read_min_mbps: 100
