openapi: 3.0.3
info:
  title: LazyCloud API
  version: "1"
servers:
  - url: /
security:
  - bearer: []
  - session: []
paths:
  # Identity: accounts, sessions, tokens, device login, workspaces, members
  # and invitations. Browser sign-in (/auth/github/start and
  # /auth/github/callback) and the Resend delivery webhook
  # (/webhooks/resend) are redirects and provider-shaped requests served
  # outside this document.

  /v1/me:
    get:
      operationId: getMe
      summary: The authenticated user and the workspaces they are a member of
      description: >-
        Workspaces being deleted are listed with state `deleting`. A token
        restricted to one workspace lists only that one.
      responses:
        "200":
          description: Caller identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Error" }

  /v1/sessions/current:
    delete:
      operationId: signOut
      summary: End the browser session that made this request, and no other
      security:
        - session: []
      responses:
        "204":
          description: Signed out; the session cookie is cleared
        default: { $ref: "#/components/responses/Error" }

  /v1/tokens:
    get:
      operationId: listTokens
      summary: The caller's unrevoked access tokens, newest first
      parameters:
        - name: include_device
          in: query
          description: Include tokens minted by `lazycloud login`.
          schema: { type: boolean, default: true }
        - $ref: "#/components/parameters/Limit"
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: One page of tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createToken
      summary: Create an access token that reaches every workspace of the account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenCreateRequest" }
      responses:
        "201":
          description: The token; its value is shown only here
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedToken" }
        default: { $ref: "#/components/responses/Error" }

  /v1/tokens/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeToken
      summary: Revoke one of the caller's tokens; a token cannot revoke itself
      responses:
        "204":
          description: Revoked
        default: { $ref: "#/components/responses/Error" }

  /v1/device-codes:
    post:
      operationId: startDeviceLogin
      summary: Start a device-code login for a CLI
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceLoginRequest" }
      responses:
        "201":
          description: The codes and where the person approves them
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceLogin" }
        default: { $ref: "#/components/responses/Error" }

  /v1/device-codes/token:
    post:
      operationId: pollDeviceLogin
      summary: Poll a device-code login until it is approved, denied or expired
      description: >-
        Polling sooner than `poll_interval_seconds` after the previous poll
        answers `slow_down` with a longer interval. The token appears once,
        on the poll that finds the login approved.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceTokenRequest" }
      responses:
        "200":
          description: Where the login stands
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceTokenResponse" }
        default: { $ref: "#/components/responses/Error" }

  /v1/device-codes/{user_code}:
    parameters:
      - $ref: "#/components/parameters/UserCodePath"
    get:
      operationId: getDeviceLogin
      summary: The device-code login a user code names
      responses:
        "200":
          description: The login
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceCode" }
        default: { $ref: "#/components/responses/Error" }

  /v1/device-codes/{user_code}/approve:
    parameters:
      - $ref: "#/components/parameters/UserCodePath"
    post:
      operationId: approveDeviceLogin
      summary: Approve a waiting CLI for the caller's account
      responses:
        "200":
          description: The approved login
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceCode" }
        default: { $ref: "#/components/responses/Error" }

  /v1/device-codes/{user_code}/deny:
    parameters:
      - $ref: "#/components/parameters/UserCodePath"
    post:
      operationId: denyDeviceLogin
      summary: Refuse a waiting CLI
      responses:
        "200":
          description: The denied login
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceCode" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces:
    get:
      operationId: listWorkspaces
      summary: The workspaces the caller may act on, by name
      description: >-
        Platform administrators see every workspace, members their
        memberships, and a restricted token only its workspace.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page.
          schema: { $ref: "#/components/schemas/Name" }
      responses:
        "200":
          description: One page of workspaces
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createWorkspace
      summary: Create a workspace owned by the caller; platform administrators only
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceRequest" }
      responses:
        "201":
          description: The workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
    get:
      operationId: getWorkspace
      summary: One workspace, in any state
      responses:
        "200":
          description: The workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: renameWorkspace
      summary: Rename a workspace; any member may
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceRequest" }
      responses:
        "200":
          description: The renamed workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteWorkspace
      summary: Delete a workspace, or resume an unfinished deletion; platform administrators only
      description: >-
        The workspace becomes `deleting` at once and refuses every other
        request. Its tasks are cancelled, its containers stopped and its
        data removed in the background, after which it disappears.
      responses:
        "202":
          description: Deletion is under way
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/members:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
    get:
      operationId: listMembers
      summary: The workspace's members, owner first
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/members/{user}:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - name: user
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: setMemberRole
      summary: Change a member's role; administrators only, never the owner's
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberRoleRequest" }
      responses:
        "200":
          description: The member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeMember
      summary: Remove a member, or leave when the user is the caller
      responses:
        "204":
          description: Removed
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/invitations:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
    get:
      operationId: listInvitations
      summary: Open invitations with their email delivery state; administrators only
      responses:
        "200":
          description: Invitations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createInvitation
      summary: Invite an email address; administrators only
      description: >-
        Returns once the invitation and its email are committed. The email is
        delivered in the background, so a provider outage delays it rather
        than refusing the invitation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationRequest" }
      responses:
        "201":
          description: The invitation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/invitations/{invitation}:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/InvitationPath"
    delete:
      operationId: revokeInvitation
      summary: Withdraw an invitation and its unsent email
      responses:
        "204":
          description: Revoked
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/invitations/{invitation}/resend:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/InvitationPath"
    post:
      operationId: resendInvitation
      summary: Send the invitation again on a new link; the previous link stops working
      responses:
        "200":
          description: The invitation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        default: { $ref: "#/components/responses/Error" }

  /v1/invitations/{token}:
    parameters:
      - $ref: "#/components/parameters/InvitationTokenPath"
    get:
      operationId: previewInvitation
      summary: What an invitation link offers, without answering it
      responses:
        "200":
          description: The offer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationPreview" }
        default: { $ref: "#/components/responses/Error" }

  /v1/invitations/{token}/accept:
    parameters:
      - $ref: "#/components/parameters/InvitationTokenPath"
    post:
      operationId: acceptInvitation
      summary: Join the workspace as the signed-in account
      responses:
        "201":
          description: The membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptedInvitation" }
        default: { $ref: "#/components/responses/Error" }

  /v1/invitations/{token}/decline:
    parameters:
      - $ref: "#/components/parameters/InvitationTokenPath"
    post:
      operationId: declineInvitation
      summary: Refuse an invitation
      responses:
        "204":
          description: Declined
        default: { $ref: "#/components/responses/Error" }

  # Administration: platform accounts, for platform administrators using an
  # account credential.

  /v1/users/{user}/role:
    parameters:
      - $ref: "#/components/parameters/UserPath"
    put:
      operationId: setUserRole
      tags: [admin]
      summary: Grant or withdraw platform administration; never your own
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserRoleRequest" }
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }

  /v1/users/{user}/status:
    parameters:
      - $ref: "#/components/parameters/UserPath"
    put:
      operationId: setUserStatus
      tags: [admin]
      summary: Enable or disable an account; never your own
      description: >-
        A disabled account cannot sign in, and its tokens, browser sessions
        and approved device logins end at once. Enabling it again restores
        none of them. Its running work is not stopped.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserStatusRequest" }
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }

  # Function execution

  /v1/workspaces/{workspace}/sources:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
    post:
      operationId: createSourceUpload
      summary: Register a source archive by digest and get an upload URL when it is missing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceUploadRequest" }
      responses:
        "200":
          description: Source state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceUpload" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/apps/{app}/deployments:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/AppPath"
    post:
      operationId: deployApp
      summary: Make the app's deployed workloads match the given definitions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeploymentRequest" }
      responses:
        "200":
          description: Resulting releases
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/apps/{app}/workloads/function/{name}/tasks:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/AppPath"
      - $ref: "#/components/parameters/WorkloadPath"
    post:
      operationId: submitTasks
      summary: Admit one task per input against the function's active release
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitTasksRequest" }
      responses:
        "201":
          description: Admitted tasks, in input order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitTasksResponse" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/tasks/{task}:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/TaskPath"
    get:
      operationId: getTask
      summary: Read a task, optionally waiting until it finishes
      parameters:
        - name: wait_seconds
          in: query
          description: Hold the request until the task finishes or this many seconds pass.
          schema: { type: integer, minimum: 0, maximum: 60, default: 0 }
      responses:
        "200":
          description: The task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/tasks/{task}/result:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/TaskPath"
    get:
      operationId: getTaskResult
      summary: The value a succeeded task returned
      responses:
        "200":
          description: The result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payload" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/tasks/{task}/logs:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/TaskPath"
    get:
      operationId: streamTaskLogs
      summary: Log lines after a cursor, one JSON LogEntry per line
      description: >-
        A followed stream writes a blank line after 15 seconds without
        entries, so clients can apply a read timeout. Clients skip blank
        lines.
      parameters:
        - $ref: "#/components/parameters/LogAfter"
        - $ref: "#/components/parameters/LogTail"
        - name: follow
          in: query
          description: Keep the stream open until the task finishes.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Newline-delimited LogEntry objects
          content:
            application/x-ndjson:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/tasks/{task}/cancel:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/TaskPath"
    post:
      operationId: cancelTask
      summary: Cancel a queued or running task
      responses:
        "200":
          description: The task after cancellation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        default: { $ref: "#/components/responses/Error" }

  # Control: apps, deployments, task listing, containers and logs.

  /v1/workspaces/{workspace}/apps:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
    get:
      operationId: listApps
      tags: [control]
      summary: Apps with at least one deployed workload, by name
      parameters:
        - name: state
          in: query
          description: Only apps in this state. Omitted lists active and paused apps.
          schema: { $ref: "#/components/schemas/LiveAppState" }
        - name: search
          in: query
          description: Part of the app name.
          schema: { type: string, minLength: 1, maxLength: 100 }
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of apps
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppPage" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/apps/{app}:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/AppRefPath"
    get:
      operationId: getApp
      tags: [control]
      responses:
        "200":
          description: The app
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteApp
      tags: [control]
      summary: Delete the app and every workload in it
      description: >-
        Admission stops at once. Queued and running tasks are cancelled and
        containers stop. Task history, volumes, secrets and stored data stay.
        The name is free for a new app.
      responses:
        "200":
          description: The deleted app
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/apps/{app}/pause:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/AppRefPath"
    post:
      operationId: pauseApp
      tags: [control]
      summary: Stop admission and drain every workload of the app
      description: Queued tasks are cancelled; running tasks finish.
      responses:
        "200":
          description: The paused app
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/apps/{app}/resume:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/AppRefPath"
    post:
      operationId: resumeApp
      tags: [control]
      responses:
        "200":
          description: The resumed app
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/apps/{app}/deployment-plan:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/AppPath"
    post:
      operationId: planDeployment
      tags: [control]
      summary: What a deploy of these workloads would do, without deploying
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeploymentPlanRequest" }
      responses:
        "200":
          description: One item per listed or deployed workload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentPlan" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/apps/{app}/releases:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/AppPath"
    post:
      operationId: prepareRelease
      tags: [control]
      summary: A release that runs this definition, for calls from a working tree
      description: >-
        Returns the workload's release with the same resolved definition when
        one exists, including the active one, or creates an unversioned
        release that is never active. Submits and instances name it by id.
        The app and workload are created when missing but are not deployed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkloadSpec" }
      responses:
        "200":
          description: The release
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Release" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/workloads:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
    get:
      operationId: listWorkloads
      tags: [control]
      summary: Deployed workloads, by app, name and kind
      parameters:
        - name: app
          in: query
          schema: { $ref: "#/components/schemas/AppName" }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/WorkloadKind" }
        - name: name
          in: query
          schema: { $ref: "#/components/schemas/WorkloadName" }
        - name: id
          in: query
          description: Only the workload with this id.
          schema: { type: string, format: uuid }
        - name: search
          in: query
          description: Part of the app or workload name.
          schema: { type: string, minLength: 1, maxLength: 100 }
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of workloads
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkloadPage" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/apps/{app}/workloads/{kind}/{name}:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/AppPath"
      - $ref: "#/components/parameters/KindPath"
      - $ref: "#/components/parameters/WorkloadPath"
    get:
      operationId: getWorkload
      tags: [control]
      summary: The workload, the definition its active version runs and where it answers
      parameters:
        - $ref: "#/components/parameters/VersionQuery"
      responses:
        "200":
          description: The workload and its release
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkloadDetail" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteWorkload
      tags: [control]
      summary: Delete the workload and every version of it
      description: >-
        Queued and running tasks are cancelled and its containers stop. The
        name is free for a later deploy, which starts again at version 1.
      responses:
        "200":
          description: The deleted workload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workload" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/apps/{app}/workloads/{kind}/{name}/stop:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/AppPath"
      - $ref: "#/components/parameters/KindPath"
      - $ref: "#/components/parameters/WorkloadPath"
    post:
      operationId: stopWorkload
      tags: [control]
      summary: Stop admission and drain the workload, keeping its definition
      description: Queued tasks are cancelled; running tasks finish.
      responses:
        "200":
          description: The stopped workload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workload" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/apps/{app}/workloads/{kind}/{name}/start:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/AppPath"
      - $ref: "#/components/parameters/KindPath"
      - $ref: "#/components/parameters/WorkloadPath"
    post:
      operationId: startWorkload
      tags: [control]
      summary: Start the workload again, optionally on an earlier version
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartWorkloadRequest" }
      responses:
        "200":
          description: The started workload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workload" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/apps/{app}/workloads/{kind}/{name}/scale:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/AppPath"
      - $ref: "#/components/parameters/KindPath"
      - $ref: "#/components/parameters/WorkloadPath"
    post:
      operationId: scaleWorkload
      tags: [workloads]
      summary: Hold a pod at a number of containers
      description: >-
        The count holds until the next scale, whatever the pod's
        connections. Only an active pod of an active app scales; a pod with a
        disk runs at most one container, and an always-on pod (keep_warm -1)
        cannot scale to zero. Functions and endpoints follow their autoscaler.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScaleRequest" }
      responses:
        "200":
          description: The workload after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workload" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/apps/{app}/workloads/{kind}/{name}/versions:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/AppPath"
      - $ref: "#/components/parameters/KindPath"
      - $ref: "#/components/parameters/WorkloadPath"
    get:
      operationId: listWorkloadVersions
      tags: [control]
      summary: Deployed versions, newest first
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of versions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionPage" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/apps/{app}/workloads/{kind}/{name}/logs:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/AppPath"
      - $ref: "#/components/parameters/KindPath"
      - $ref: "#/components/parameters/WorkloadPath"
    get:
      operationId: streamWorkloadLogs
      tags: [control]
      summary: Log lines of every task of the workload, one JSON LogEntry per line
      description: >-
        A followed stream stays open until the client closes it and writes a
        blank line after 15 seconds without entries.
      parameters:
        - $ref: "#/components/parameters/LogAfter"
        - $ref: "#/components/parameters/LogTail"
        - name: follow
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Newline-delimited LogEntry objects
          content:
            application/x-ndjson:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/apps/{app}/workloads/{kind}/{name}/containers:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/AppPath"
      - $ref: "#/components/parameters/KindPath"
      - $ref: "#/components/parameters/WorkloadPath"
    get:
      operationId: listWorkloadContainers
      tags: [control]
      summary: Containers of the workload's releases, newest first
      parameters:
        - name: live
          in: query
          description: Only containers that have not stopped.
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of containers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerPage" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/apps/{app}/workloads/{kind}/{name}/performance:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/AppPath"
      - $ref: "#/components/parameters/KindPath"
      - $ref: "#/components/parameters/WorkloadPath"
    get:
      operationId: getWorkloadPerformance
      tags: [observability]
      summary: Run time percentiles, outcomes and cold starts per time bucket
      description: >-
        Tasks fall in the bucket they were submitted in; a duration is from
        start to finish of a finished task. A cold start is a container started
        for the workload. The default range is the last 24 hours.
      parameters:
        - $ref: "#/components/parameters/WindowSeconds"
        - $ref: "#/components/parameters/RangeStart"
        - $ref: "#/components/parameters/RangeEnd"
      responses:
        "200":
          description: Buckets that saw tasks or cold starts, oldest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkloadPerformance" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/tasks:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
    get:
      operationId: listTasks
      tags: [control]
      summary: Tasks, newest first
      parameters:
        - name: app
          in: query
          schema: { $ref: "#/components/schemas/AppName" }
        - name: function
          in: query
          description: Requires `app`.
          schema: { $ref: "#/components/schemas/WorkloadName" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/TaskStatus" }
        - name: version
          in: query
          description: A deployed version of `function`; requires it.
          schema: { type: integer, minimum: 1 }
        - name: root_only
          in: query
          description: Only tasks no other task spawned.
          schema: { type: boolean, default: false }
        - name: search
          in: query
          description: A task id prefix or part of a function name.
          schema: { type: string, minLength: 1, maxLength: 100 }
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of tasks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskPage" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/tasks/stop:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
    post:
      operationId: stopTasks
      tags: [control]
      summary: Cancel each listed task that is queued or running
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StopTasksRequest" }
      responses:
        "200":
          description: Which tasks stopped and which were already finished or unknown
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StopTasksResponse" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/tasks/{task}/rerun:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/TaskPath"
    post:
      operationId: rerunTask
      tags: [control]
      summary: Submit the task's input again to the release it ran on
      responses:
        "201":
          description: The new task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/containers:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
    get:
      operationId: listContainers
      tags: [control]
      summary: Containers, newest first
      parameters:
        - name: live
          in: query
          description: Only containers that have not stopped.
          schema: { type: boolean, default: false }
        - name: app
          in: query
          description: Only the containers of this app's workloads.
          schema: { $ref: "#/components/schemas/AppName" }
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of containers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerPage" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/containers/{container}:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/ContainerPath"
    get:
      operationId: getContainer
      tags: [control]
      responses:
        "200":
          description: The container
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Container" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/containers/{container}/stop:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/ContainerPath"
    post:
      operationId: stopContainer
      tags: [control]
      summary: Stop the container now
      description: >-
        Its running attempts end as lost and retry by their policy. An active
        workload starts a replacement when it still has work.
      responses:
        "200":
          description: The container after the request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Container" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/containers/{container}/logs:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/ContainerPath"
    get:
      operationId: streamContainerLogs
      tags: [control]
      summary: Log lines of the tasks the container ran, one JSON LogEntry per line
      description: >-
        A followed stream ends once the container has stopped and its lines
        are drained, and writes a blank line after 15 seconds without entries.
      parameters:
        - $ref: "#/components/parameters/LogAfter"
        - $ref: "#/components/parameters/LogTail"
        - name: follow
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Newline-delimited LogEntry objects
          content:
            application/x-ndjson:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  # Workload runtime: secrets and schedules.

  /v1/workspaces/{workspace}/secrets:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
    get:
      operationId: listSecrets
      tags: [secrets]
      summary: Secret names and update times, without values
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of secrets in name order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretPage" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createSecret
      tags: [secrets]
      summary: Create a secret; an existing name is a conflict
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretCreate" }
      responses:
        "201":
          description: The created secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/secrets/{secret}:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/SecretPath"
    get:
      operationId: getSecret
      tags: [secrets]
      summary: A secret without its value
      responses:
        "200":
          description: The secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: setSecret
      tags: [secrets]
      summary: Create the secret or replace its value
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretValueUpdate" }
      responses:
        "200":
          description: The secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateSecret
      tags: [secrets]
      summary: Replace an existing secret's value
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretValueUpdate" }
      responses:
        "200":
          description: The secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSecret
      tags: [secrets]
      responses:
        "204":
          description: Deleted
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/secrets/{secret}/value:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/SecretPath"
    get:
      operationId: getSecretValue
      tags: [secrets]
      summary: Reveal a secret's value
      description: >-
        The only operation that returns a value. Tokens limited to reading
        cannot call it.
      responses:
        "200":
          description: The secret and its value
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretValue" }
        default: { $ref: "#/components/responses/Error" }

  # Storage: volumes, disks, artifacts, queues and maps.

  /v1/workspaces/{workspace}/volumes:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
    get:
      operationId: listVolumes
      tags: [storage]
      summary: Volumes in the workspace, by name
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of volumes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VolumePage" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createVolume
      tags: [storage]
      summary: Create a volume, or return the active one of that name
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVolumeRequest" }
      responses:
        "200":
          description: The volume
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Volume" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/volumes/{volume}:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/VolumePath"
    get:
      operationId: getVolume
      tags: [storage]
      responses:
        "200":
          description: The volume
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Volume" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteVolume
      tags: [storage]
      summary: Delete a volume and its files
      description: >-
        Refused with `conflict` while a container that mounts the volume has
        not stopped. The name is free at once; the files are removed in the
        background.
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/volumes/{volume}/files:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/VolumePath"
    get:
      operationId: listVolumeFiles
      tags: [storage]
      summary: The entries of one directory, files and directories by name
      parameters:
        - name: path
          in: query
          description: A directory relative to the volume root; empty is the root.
          schema: { $ref: "#/components/schemas/VolumeRelativePath" }
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 1000 }
      responses:
        "200":
          description: A page of entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VolumeFilePage" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeVolumeFiles
      tags: [storage]
      summary: Remove a file, or a directory and everything under it
      parameters:
        - name: path
          in: query
          required: true
          schema: { $ref: "#/components/schemas/VolumeFilePath" }
      responses:
        "200":
          description: The removed paths
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemovedVolumeFiles" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/volumes/{volume}/files/stat:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/VolumePath"
    get:
      operationId: statVolumeFile
      tags: [storage]
      parameters:
        - name: path
          in: query
          schema: { $ref: "#/components/schemas/VolumeRelativePath" }
      responses:
        "200":
          description: The file or directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VolumeFile" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/volumes/{volume}/files/move:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/VolumePath"
    post:
      operationId: moveVolumeFile
      tags: [storage]
      summary: Move or rename a file or directory within the volume
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveVolumeFileRequest" }
      responses:
        "200":
          description: The moved entry at its new path
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VolumeFile" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/volumes/{volume}/files/url:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/VolumePath"
    post:
      operationId: presignVolumeFile
      tags: [storage]
      summary: A presigned URL that reads, writes or uploads a part of one file
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PresignVolumeFileRequest" }
      responses:
        "200":
          description: The URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresignedUrl" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/volumes/{volume}/uploads:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/VolumePath"
    post:
      operationId: createVolumeUpload
      tags: [storage]
      summary: Start a multipart upload of one file and presign its parts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVolumeUploadRequest" }
      responses:
        "200":
          description: The upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MultipartUpload" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/volumes/{volume}/uploads/complete:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/VolumePath"
    post:
      operationId: completeVolumeUpload
      tags: [storage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteVolumeUploadRequest" }
      responses:
        "200":
          description: The stored file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VolumeFile" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/volumes/{volume}/uploads/abort:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/VolumePath"
    post:
      operationId: abortVolumeUpload
      tags: [storage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AbortVolumeUploadRequest" }
      responses:
        "204": { description: Aborted }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/disks:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
    get:
      operationId: listDisks
      tags: [storage]
      summary: Disks in the workspace, by name
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of disks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiskPage" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/disks/{disk}:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/DiskPath"
    get:
      operationId: getDisk
      tags: [storage]
      responses:
        "200":
          description: The disk
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Disk" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteDisk
      tags: [storage]
      summary: Delete a disk and everything written to it
      description: Refused with `conflict` while a container holds the disk.
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/artifacts:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
    get:
      operationId: listArtifacts
      tags: [storage]
      summary: Stored, unexpired artifacts, newest first
      parameters:
        - name: task_id
          in: query
          schema: { type: string, format: uuid }
        - name: app
          in: query
          schema: { $ref: "#/components/schemas/AppName" }
        - name: search
          in: query
          description: Case-insensitive substring of the filename.
          schema: { type: string, maxLength: 255 }
        - name: content_type
          in: query
          description: A content type prefix, such as `image/`.
          schema: { type: string, maxLength: 255 }
        - name: created_after
          in: query
          description: Inclusive lower bound on the save time.
          schema: { type: string, format: date-time }
        - name: created_before
          in: query
          description: Exclusive upper bound on the save time.
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of artifacts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactPage" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createArtifact
      tags: [storage]
      summary: Start saving an artifact for a task and presign its upload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateArtifactRequest" }
      responses:
        "201":
          description: The pending artifact and where to send its bytes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactUpload" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/artifacts/summary:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
    get:
      operationId: getArtifactSummary
      tags: [storage]
      summary: Stored artifact count, bytes, cost and retention
      responses:
        "200":
          description: The summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactSummary" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/artifacts/delete:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
    post:
      operationId: deleteArtifacts
      tags: [storage]
      summary: Delete up to 100 artifacts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteArtifactsRequest" }
      responses:
        "200":
          description: The ids that were deleted; unknown ids are left out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletedArtifacts" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/artifacts/{artifact}:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/ArtifactPath"
    get:
      operationId: getArtifact
      tags: [storage]
      responses:
        "200":
          description: The artifact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteArtifact
      tags: [storage]
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/artifacts/{artifact}/complete:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/ArtifactPath"
    post:
      operationId: completeArtifact
      tags: [storage]
      summary: Record an uploaded artifact and start its retention
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteArtifactRequest" }
      responses:
        "200":
          description: The stored artifact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/artifacts/{artifact}/url:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/ArtifactPath"
    post:
      operationId: presignArtifact
      tags: [storage]
      summary: A presigned GET for the artifact's bytes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PresignArtifactRequest" }
      responses:
        "200":
          description: The URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresignedUrl" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/queues:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
    get:
      operationId: listQueues
      tags: [storage]
      summary: Queues in the workspace, by name
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of queues
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueuePage" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/queues/{queue}:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/QueuePath"
    get:
      operationId: getQueue
      tags: [storage]
      summary: The queue's size; a queue never written has size 0
      responses:
        "200":
          description: The queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueInfo" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteQueue
      tags: [storage]
      summary: Delete the queue and its messages
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/queues/{queue}/messages:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/QueuePath"
    post:
      operationId: putQueueMessages
      tags: [storage]
      summary: Append messages in order, creating the queue on first use
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutQueueMessagesRequest" }
      responses:
        "204": { description: Appended }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/queues/{queue}/pop:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/QueuePath"
    post:
      operationId: popQueueMessage
      tags: [storage]
      summary: Remove and return the oldest message
      parameters:
        - name: wait_seconds
          in: query
          description: Wait this long for a message when the queue is empty.
          schema: { type: integer, minimum: 0, maximum: 60, default: 0 }
      responses:
        "200":
          description: The message; `message` is absent when the queue is empty
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueMessageResult" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/queues/{queue}/head:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/QueuePath"
    get:
      operationId: peekQueueMessage
      tags: [storage]
      summary: The oldest message without removing it
      responses:
        "200":
          description: The message; `message` is absent when the queue is empty
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueMessageResult" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/maps:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
    get:
      operationId: listMaps
      tags: [storage]
      summary: Maps with at least one live key, by name
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of maps
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapPage" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/maps/{map}:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/MapPath"
    get:
      operationId: getMap
      tags: [storage]
      summary: Live key count and expiry statistics; a map never written is empty
      responses:
        "200":
          description: The map
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapInfo" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMap
      tags: [storage]
      summary: Delete the map and its keys
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/maps/{map}/keys:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/MapPath"
    get:
      operationId: listMapKeys
      tags: [storage]
      summary: Live keys in byte order, optionally with a prefix
      parameters:
        - name: prefix
          in: query
          schema: { type: string, maxLength: 1024 }
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 1000 }
      responses:
        "200":
          description: A page of keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapKeyPage" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/maps/{map}/entries/{key}:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/MapPath"
      - $ref: "#/components/parameters/MapKeyPath"
    get:
      operationId: getMapEntry
      tags: [storage]
      responses:
        "200":
          description: The entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapEntry" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: setMapEntry
      tags: [storage]
      summary: Write a key, creating the map on first use
      description: >-
        With `if_revision` the write applies only while the key holds that
        revision; with `if_absent` only while the key is missing. A failed
        condition is a `conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetMapEntryRequest" }
      responses:
        "200":
          description: The entry after the write
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapEntryWrite" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMapEntry
      tags: [storage]
      summary: Delete a key; a missing key is `not_found`
      parameters:
        - name: if_revision
          in: query
          schema: { type: string, pattern: "^[0-9]{1,20}$" }
      responses:
        "204": { description: Deleted }
  # Images

  /v1/workspaces/{workspace}/images/resolve:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
    post:
      tags: [images]
      operationId: resolveImage
      summary: Resolve a definition to its image without starting a build
      description: >-
        Pins every base image by digest and computes the image identity. The
        workspace may deploy the image once it is ready. A build already in
        progress for the image is returned with it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageDefinition" }
      responses:
        "200":
          description: The image and any active build
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageResolution" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/images:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
    post:
      tags: [images]
      operationId: buildImage
      summary: Resolve a definition and build its image unless it is ready
      description: >-
        Equal definitions share one image across workspaces, and a request
        for an image that is already building joins that build.
      parameters:
        - name: force
          in: query
          description: Build again even when the image is ready.
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageDefinition" }
      responses:
        "200":
          description: The image and its build, when one runs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageResolution" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/images/{image}:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/ImagePath"
    get:
      tags: [images]
      operationId: getImage
      summary: An image the workspace resolved
      responses:
        "200":
          description: The image
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Image" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/image-builds/{build}:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/ImageBuildPath"
    get:
      tags: [images]
      operationId: getImageBuild
      summary: Read a build, optionally waiting until it finishes
      parameters:
        - name: wait_seconds
          in: query
          description: Hold the request until the build finishes or this many seconds pass.
          schema: { type: integer, minimum: 0, maximum: 60, default: 0 }
      responses:
        "200":
          description: The build
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageBuild" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/image-builds/{build}/logs:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/ImageBuildPath"
    get:
      tags: [images]
      operationId: streamImageBuildLogs
      summary: Build output after a cursor, one JSON ImageBuildLogEntry per line
      description: >-
        A followed stream ends when the build finishes and writes a blank line
        after 15 seconds without entries. Clients skip blank lines.
      parameters:
        - name: after
          in: query
          description: Return entries with an id greater than this.
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: follow
          in: query
          description: Keep the stream open until the build finishes.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Newline-delimited ImageBuildLogEntry objects
          content:
            application/x-ndjson:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  # Endpoints: HTTP workloads, custom domains and previews.

  /v1/workspaces/{workspace}/apps/{app}/workloads/endpoint/{name}/invoke:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/AppPath"
      - $ref: "#/components/parameters/WorkloadPath"
    post:
      operationId: requestEndpointPath
      summary: Send a request to an endpoint through the API host
      description: >-
        Any method, and any path after /invoke, which becomes the request's
        path. The request is forwarded to the workload as its own host would
        forward it, with the same admission, records and token policy, and
        streams both ways; WebSockets upgrade. The browser's session cookie
        (from the dashboard origin for anything but GET and HEAD) or a bearer
        token authenticates it, and neither reaches the workload.
      x-lazycloud-opaque: true
      responses:
        default:
          description: The workload's own response, or an Error from the platform.

  /v1/workspaces/{workspace}/apps/{app}/workloads/endpoint/{name}/versions/{version}/invoke:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/AppPath"
      - $ref: "#/components/parameters/WorkloadPath"
      - $ref: "#/components/parameters/VersionPath"
    post:
      operationId: requestEndpointPathVersion
      summary: Send a request to an endpoint version through the API host
      description: As requestEndpointPath, pinned to one deployed version.
      x-lazycloud-opaque: true
      responses:
        default:
          description: The workload's own response, or an Error from the platform.

  /v1/workspaces/{workspace}/apps/{app}/workloads/asgi/{name}/invoke:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/AppPath"
      - $ref: "#/components/parameters/WorkloadPath"
    post:
      operationId: requestAsgiPath
      summary: Send a request to an ASGI or realtime app through the API host
      description: As requestEndpointPath, for an ASGI or realtime app.
      x-lazycloud-opaque: true
      responses:
        default:
          description: The workload's own response, or an Error from the platform.

  /v1/workspaces/{workspace}/apps/{app}/workloads/asgi/{name}/versions/{version}/invoke:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/AppPath"
      - $ref: "#/components/parameters/WorkloadPath"
      - $ref: "#/components/parameters/VersionPath"
    post:
      operationId: requestAsgiPathVersion
      summary: Send a request to an ASGI or realtime app version through the API host
      description: As requestEndpointPath, for one deployed version of an ASGI or realtime app.
      x-lazycloud-opaque: true
      responses:
        default:
          description: The workload's own response, or an Error from the platform.

  /v1/workspaces/{workspace}/apps/{app}/workloads/function/{name}/invoke:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/AppPath"
      - $ref: "#/components/parameters/WorkloadPath"
    post:
      operationId: invokeFunction
      summary: Run the function's active release with JSON arguments
      description: >-
        The body's `args` and `kwargs`, or else the whole body, become the
        arguments, and query parameters are added as keyword arguments.
      parameters:
        - $ref: "#/components/parameters/InvokeWait"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvocationBody" }
      responses:
        "200":
          description: The task, with its result when it succeeded within the wait
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invocation" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/apps/{app}/workloads/function/{name}/versions/{version}/invoke:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/AppPath"
      - $ref: "#/components/parameters/WorkloadPath"
      - $ref: "#/components/parameters/VersionPath"
    post:
      operationId: invokeFunctionVersion
      summary: Run one version of the function with JSON arguments
      parameters:
        - $ref: "#/components/parameters/InvokeWait"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvocationBody" }
      responses:
        "200":
          description: The task, with its result when it succeeded within the wait
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invocation" }
        default: { $ref: "#/components/responses/Error" }

  /v1/domains:
    get:
      operationId: listDomains
      summary: Domains the caller registered, by hostname
      parameters:
        - name: after
          in: query
          description: Return domains whose hostname sorts after this.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        "200":
          description: Registered domains
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: registerDomain
      summary: Register a hostname the caller's workspaces may serve from
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DomainRequest" }
      responses:
        "201":
          description: The registration and the DNS records it waits for
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }
        default: { $ref: "#/components/responses/Error" }

  /v1/domains/{hostname}:
    parameters:
      - name: hostname
        in: path
        required: true
        schema: { type: string, maxLength: 253 }
    get:
      operationId: getDomain
      summary: One registration, re-read from the provider while it is unsettled
      responses:
        "200":
          description: The registration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeDomain
      summary: Retire a registration no deployment serves from
      responses:
        "204":
          description: Removed
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/apps/{app}/previews:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/AppPath"
    post:
      operationId: createPreview
      summary: Start a preview container for one workload definition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreviewRequest" }
      responses:
        "201":
          description: The preview; its container starts asynchronously
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preview" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/previews/{preview}:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/PreviewPath"
    get:
      operationId: getPreview
      summary: Read a preview, optionally waiting until its container is ready
      parameters:
        - name: wait_seconds
          in: query
          description: Hold the request until the container is ready or the preview stops, or this many seconds pass.
          schema: { type: integer, minimum: 0, maximum: 60, default: 0 }
      responses:
        "200":
          description: The preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preview" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: stopPreview
      summary: Stop the preview and its container
      responses:
        "200":
          description: The stopped preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preview" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/previews/{preview}/files:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/PreviewPath"
    post:
      operationId: syncPreviewFiles
      summary: Write and remove files in the preview container's workspace
      description: >-
        The body is a tar archive of the files to write, paths relative to
        the workspace, at most 64 MiB. A path to remove is a regular entry of size zero carrying
        the PAX record `LAZYCLOUD.removed=1`. The container's runners restart
        once their current work finishes.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: What was applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreviewSync" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/previews/{preview}/output:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/PreviewPath"
    get:
      operationId: streamPreviewOutput
      summary: The preview container's output after a cursor, one JSON ContainerLogEntry per line
      description: >-
        A followed stream keeps the preview alive, writes a blank line after
        15 seconds without entries and ends when the preview stops. Without a
        follower the preview stops a minute later.
      parameters:
        - name: after
          in: query
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: follow
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Newline-delimited ContainerLogEntry objects
          content:
            application/x-ndjson:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/apps/{app}/requests:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/AppPath"
    get:
      operationId: listHttpRequests
      summary: The app's endpoint and ASGI requests, newest first
      description: >-
        One record per request the edge served, written about a second after
        it ends and kept for seven days. Function invocations over HTTP are
        tasks instead.
      parameters:
        - name: name
          in: query
          description: Only the requests of this endpoint or ASGI app.
          schema: { $ref: "#/components/schemas/WorkloadName" }
        - name: before
          in: query
          description: Return requests older than this request id.
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Requests, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HttpRequestList" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/requests/{http_request}:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/RequestPath"
    get:
      operationId: getHttpRequest
      summary: One request by its X-Request-Id
      responses:
        "200":
          description: The request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HttpRequest" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/requests/{http_request}/logs:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/RequestPath"
    get:
      operationId: listHttpRequestLogs
      summary: What the workload wrote while serving the request
      parameters:
        - name: after
          in: query
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 1000 }
      responses:
        "200":
          description: Output lines in order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerLogList" }
        default: { $ref: "#/components/responses/Error" }

  # Observability: the change stream, container metrics and lifecycle, task
  # timelines and call graphs, workload performance and account metrics.

  /v1/workspaces/{workspace}/changes/stream:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
    get:
      operationId: streamChanges
      tags: [observability]
      summary: Committed changes to the workspace's resources as server-sent events
      description: >-
        Each `change` event's data is a ChangeEvent and its id is the event's
        seq. A reconnect that sends the last id in Last-Event-ID receives the
        events that followed it, or a `reset` event (data ChangeReset) when
        the server no longer holds them or the client fell behind; the client
        then reloads what it shows. A comment line arrives every 15 seconds
        without events. The server ends a stream after 10 minutes; clients
        reconnect with Last-Event-ID.
      parameters:
        - name: Last-Event-ID
          in: header
          description: The id of the last event the client received.
          schema: { type: string, pattern: "^[0-9]{1,19}$" }
      responses:
        "200":
          description: A text/event-stream of change and reset events
          content:
            text/event-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/containers/{container}/metrics:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/ContainerPath"
    get:
      operationId: getContainerMetrics
      tags: [observability]
      summary: CPU, memory, network, disk and GPU use of a container over time
      description: >-
        Hosts sample every 5 seconds. Samples are kept for an hour and as
        per-minute points for seven days, so a step under 60 seconds reads
        only the last hour. The default range is the container's last hour of
        life, and a range spans at most 7 days; at most 1,000 points are
        returned, and the step grows to fit.
      parameters:
        - $ref: "#/components/parameters/RangeStart"
        - $ref: "#/components/parameters/RangeEnd"
        - name: step_seconds
          in: query
          description: Seconds per point; defaults to the finest step the range allows.
          schema: { type: integer, minimum: 5, maximum: 86400 }
      responses:
        "200":
          description: The container's metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerMetrics" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/containers/{container}/lifecycle:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/ContainerPath"
    get:
      operationId: getContainerLifecycle
      tags: [observability]
      summary: How long the container waited for placement and each start stage, and how it stopped
      responses:
        "200":
          description: The container's lifecycle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerLifecycle" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/containers/lifecycles:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
    post:
      operationId: listContainerLifecycles
      tags: [observability]
      summary: The lifecycles of up to 200 containers, such as those of a call graph
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContainerLifecyclesRequest" }
      responses:
        "200":
          description: The lifecycles of the listed containers in the workspace; unknown ids are left out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerLifecycleList" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/tasks/{task}/call-graph:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/TaskPath"
    get:
      operationId: getTaskCallGraph
      tags: [observability]
      summary: Every task of the task's call graph, from its root
      responses:
        "200":
          description: The call graph
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskCallGraph" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/metrics/tasks:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
    get:
      operationId: getTaskMetrics
      tags: [observability]
      summary: Task outcomes, failure rate, run time and startup percentiles over a range
      description: >-
        Tasks submitted in the range count. The default range is the last 24
        hours; a range spans at most 31 days.
      parameters:
        - $ref: "#/components/parameters/RangeStart"
        - $ref: "#/components/parameters/RangeEnd"
        - name: app
          in: query
          schema: { $ref: "#/components/schemas/AppName" }
        - name: function
          in: query
          description: Requires `app`.
          schema: { $ref: "#/components/schemas/WorkloadName" }
      responses:
        "200":
          description: The metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskMetrics" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/metrics/activity:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
    get:
      operationId: getTaskActivity
      tags: [observability]
      summary: Tasks submitted per time bucket and status, one series per app or, with `app`, per function
      description: >-
        Buckets are dense and aligned to multiples of window_seconds since the
        epoch. The default range is the last 24 buckets.
      parameters:
        - $ref: "#/components/parameters/WindowSeconds"
        - $ref: "#/components/parameters/RangeStart"
        - $ref: "#/components/parameters/RangeEnd"
        - name: app
          in: query
          schema: { $ref: "#/components/schemas/AppName" }
      responses:
        "200":
          description: The activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskActivity" }
        default: { $ref: "#/components/responses/Error" }

  /v1/me/metrics:
    get:
      operationId: getAccountMetrics
      tags: [observability]
      summary: Live containers across the caller's workspaces and concurrency against plan limits
      responses:
        "200":
          description: The account's metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountMetrics" }
        default: { $ref: "#/components/responses/Error" }

  /v1/me/activity:
    get:
      operationId: getAccountActivity
      tags: [observability]
      summary: Container or task starts, or allocated CPU, memory or GPUs, per app over time across the caller's workspaces
      description: >-
        Starts count containers or tasks created per bucket. Allocations are
        the average cores, GiB or GPUs reserved by live containers over each
        bucket, and over the range for each series' total. Series are sorted
        by total; past `limit` they fold into one `other` series. The default
        range is the last 24 buckets.
      parameters:
        - name: measure
          in: query
          schema: { $ref: "#/components/schemas/ActivityMeasure" }
        - $ref: "#/components/parameters/WindowSeconds"
        - $ref: "#/components/parameters/RangeStart"
        - $ref: "#/components/parameters/RangeEnd"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
      responses:
        "200":
          description: The activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountActivity" }

  # Billing: plans, prices, credit, spending controls and usage cost. The
  # account is the caller's: a workspace bills its owner. Every operation
  # except the catalog needs an account credential, not a token restricted
  # to one workspace. The Stripe webhook (/webhooks/stripe) is served outside
  # this document.

  /v1/pricing:
    get:
      tags: [billing]
      operationId: getPricing
      summary: Published plans, limits and metered rates
      security: []
      parameters:
        - name: at
          in: query
          description: Answer with the rates in force at this instant.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: The pricing catalog
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingCatalog" }
        default: { $ref: "#/components/responses/Error" }

  /v1/billing:
    get:
      tags: [billing]
      operationId: getBilling
      summary: The caller's plan, payment standing, credit and limits
      responses:
        "200":
          description: The billing account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingAccount" }
        default: { $ref: "#/components/responses/Error" }

  /v1/billing/preferences:
    put:
      tags: [billing]
      operationId: setBillingPreferences
      summary: Set the monthly usage limit and automatic reload
      description: >-
        Turning automatic reload on needs a saved payment method. A limit of
        0 blocks new work.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingPreferences" }
      responses:
        "200":
          description: The billing account with the new preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingAccount" }
        default: { $ref: "#/components/responses/Error" }

  /v1/billing/automatic-reload/resume:
    post:
      tags: [billing]
      operationId: resumeAutomaticReload
      summary: Resume automatic reload after a declined or unauthenticated payment
      responses:
        "200":
          description: The billing account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingAccount" }
        default: { $ref: "#/components/responses/Error" }

  /v1/billing/plan:
    put:
      tags: [billing]
      operationId: changePlan
      summary: Move the account onto published plan terms
      description: >-
        A dearer plan applies at once and charges the prorated difference; a
        cheaper one, Free included, applies at renewal. Choosing the current
        terms cancels a scheduled change. Responds 409 while another change
        is being settled and 402 when the payment method is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanChangeRequest" }
      responses:
        "200":
          description: >-
            The billing account. plan_change_pending is true when the
            provider's answer is not known yet; the change is retried.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingAccount" }
        default: { $ref: "#/components/responses/Error" }

  /v1/billing/payment-method-sessions:
    post:
      tags: [billing]
      operationId: startPaymentMethodSetup
      summary: Open Stripe's page for saving a card
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostedSessionRequest" }
      responses:
        "201":
          description: Where to send the person
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostedSession" }
        default: { $ref: "#/components/responses/Error" }

  /v1/billing/portal-sessions:
    post:
      tags: [billing]
      operationId: startBillingPortal
      summary: Open Stripe's page for invoices and the saved card
      description: Responds 404 for an account with no Stripe customer yet.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostedSessionRequest" }
      responses:
        "201":
          description: Where to send the person
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostedSession" }
        default: { $ref: "#/components/responses/Error" }

  /v1/billing/credit-purchases:
    post:
      tags: [billing]
      operationId: createCreditPurchase
      summary: Buy prepaid credit through Stripe Checkout
      description: >-
        Needs a saved payment method. Repeating a request_key returns the
        same purchase.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreditPurchaseRequest" }
      responses:
        "201":
          description: The purchase and its checkout page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditPurchase" }
        default: { $ref: "#/components/responses/Error" }

  /v1/billing/credit-purchases/{purchase}:
    parameters:
      - name: purchase
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [billing]
      operationId: getCreditPurchase
      summary: One credit purchase
      responses:
        "200":
          description: The purchase
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditPurchase" }
        default: { $ref: "#/components/responses/Error" }

  /v1/billing/costs:
    get:
      tags: [billing]
      operationId: listCosts
      summary: What the account's usage cost, grouped by app, workload or task
      description: >-
        Covers every workspace the account pays for. Rows are ordered by cost,
        most first; cost_nanos totals the whole window.
      parameters:
        - $ref: "#/components/parameters/CostStart"
        - $ref: "#/components/parameters/CostEnd"
        - name: group_by
          in: query
          schema: { $ref: "#/components/schemas/UsageCostGroup" }
        - name: workspace_id
          in: query
          schema: { type: string, format: uuid }
        - name: app_id
          in: query
          description: Only this app's usage.
          schema: { type: string, format: uuid }
        - name: workload_id
          in: query
          description: Only this workload's usage, such as its runs by task.
          schema: { type: string, format: uuid }
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/UsageCostCategory" }
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: One page of cost rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageCostPage" }
        default: { $ref: "#/components/responses/Error" }

  /v1/billing/cost-series:
    get:
      tags: [billing]
      operationId: getCostSeries
      summary: The account's spend over a window, interval by interval
      description: >-
        Intervals are whole buckets from start; every interval is present,
        including empty ones, and the last ends at end.
      parameters:
        - $ref: "#/components/parameters/CostStart"
        - $ref: "#/components/parameters/CostEnd"
        - name: bucket
          in: query
          schema: { $ref: "#/components/schemas/UsageCostBucket" }
      responses:
        "200":
          description: The series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageCostSeries" }
        default: { $ref: "#/components/responses/Error" }

  /v1/billing/accounts:
    get:
      tags: [billing]
      operationId: listBillingAccounts
      summary: Every user with their billing standing and recent spend
      description: >-
        Platform administrators only. Users that billing has no account for
        yet are listed too. search matches the email, display name or GitHub
        login.
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 200 }
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/PlatformRole" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/UserStatus" }
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: One page of accounts ordered by user id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingAccountAdminPage" }
        default: { $ref: "#/components/responses/Error" }

  /v1/billing/accounts/{user}/complimentary:
    parameters:
      - name: user
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [billing]
      operationId: setComplimentary
      summary: Waive a user's usage charges, or stop waiving them
      description: >-
        Platform administrators only. Usage keeps its price; while waived it
        costs nothing and the account has Business limits.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComplimentaryRequest" }
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingAccountAdmin" }
        default: { $ref: "#/components/responses/Error" }

  # Compute: workspace capacity, the account's AWS connection and joined
  # machines. Agent installs (/install/agent, /install/agent/{os}/{arch} and
  # /install/agent/{version}/{os}/{arch}) are unauthenticated downloads
  # served outside this document.

  /v1/workspaces/{workspace}/compute:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
    get:
      operationId: getComputeSummary
      tags: [compute]
      summary: Where the workspace runs and how much capacity serves it
      responses:
        "200":
          description: The workspace's compute
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComputeSummary" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/compute/workloads:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
    get:
      operationId: listComputeWorkloads
      tags: [compute]
      summary: Deployed workloads with their sizes and machine pins
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of workloads ordered by app and name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComputeWorkloadPage" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/machines:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
    get:
      operationId: listWorkspaceMachines
      tags: [compute]
      summary: Joined machines that serve the workspace
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of machines ordered by name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MachinePage" }
        default: { $ref: "#/components/responses/Error" }

  /v1/compute/instances:
    get:
      operationId: listComputeInstances
      tags: [compute]
      summary: Instances running in the account's connected AWS account
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of instances, newest first; empty without a connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComputeInstancePage" }
        default: { $ref: "#/components/responses/Error" }

  /v1/aws-connection:
    get:
      operationId: getAwsConnection
      tags: [compute]
      summary: The account's AWS connection
      responses:
        "200":
          description: The connection, or null without one
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AwsConnectionEnvelope" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: connectAws
      tags: [compute]
      summary: Connect an AWS account to back the workspaces the account owns
      description: >-
        Without a role the response carries the CloudFormation stack the
        customer submits with `lazycloud cloud authorize`. With an existing
        role it carries the external ID the role must require. Repeating an
        unfinished setup for the same account returns it again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AwsConnectionRequest" }
      responses:
        "201":
          description: The connection and the authorization to complete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AwsConnectionAuthorization" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: disconnectAws
      tags: [compute]
      summary: Disconnect the AWS account
      description: >-
        Refused while a workspace lives in the account. An unfinished setup is
        removed at once; a connected account drains its instances, then the
        platform deletes the stack and verifies the role is gone.
      responses:
        "202":
          description: The connection while removal runs, or null once removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AwsConnectionEnvelope" }
        default: { $ref: "#/components/responses/Error" }

  /v1/aws-connection/validate:
    post:
      operationId: validateAwsConnection
      tags: [compute]
      summary: Check the pending or active authorization now
      description: >-
        A failed check is not an error: the authorization carries its
        error_code and error_message.
      responses:
        "200":
          description: The connection after the check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AwsConnection" }
        default: { $ref: "#/components/responses/Error" }

  /v1/aws-connection/reconnect:
    post:
      operationId: reconnectAws
      tags: [compute]
      summary: Start a replacement authorization while the current one keeps serving
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AwsReconnectRequest" }
      responses:
        "200":
          description: The connection and the replacement to complete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AwsConnectionAuthorization" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: cancelAwsReconnect
      tags: [compute]
      summary: Cancel a pending replacement authorization
      responses:
        "200":
          description: The connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AwsConnection" }
        default: { $ref: "#/components/responses/Error" }

  /v1/aws-connection/retry:
    post:
      operationId: retryAwsConnection
      tags: [compute]
      summary: Retry the step the connection is waiting on
      responses:
        "200":
          description: The connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AwsConnection" }
        default: { $ref: "#/components/responses/Error" }

  /v1/fleet:
    get:
      operationId: getFleet
      tags: [compute]
      summary: The platform fleet's capacity by market and the agent release rollout
      description: Platform administrators only.
      responses:
        "200":
          description: The fleet summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FleetSummary" }
        default: { $ref: "#/components/responses/Error" }

  /v1/fleet/nodes:
    get:
      operationId: listFleetNodes
      tags: [compute]
      summary: The platform's hosts with their state, capacity and load
      description: Platform administrators only.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of hosts ordered by id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FleetNodePage" }
        default: { $ref: "#/components/responses/Error" }

  /v1/machines:
    get:
      operationId: listMachines
      tags: [compute]
      summary: Machines the account joined
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        "200":
          description: One page of machines ordered by name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MachinePage" }
        default: { $ref: "#/components/responses/Error" }

  /v1/machines/join-command:
    post:
      operationId: createMachineJoinCommand
      tags: [compute]
      summary: The command that joins a host to the account as a named machine
      description: >-
        Creates the machine, or reuses one that never joined, and mints a
        single-use join token that expires after ttl_seconds. Every workspace
        must be owned by the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MachineJoinRequest" }
      responses:
        "201":
          description: The command to run on the host
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MachineJoinCommand" }
        default: { $ref: "#/components/responses/Error" }

  /v1/machines/{machine}:
    parameters:
      - name: machine
        in: path
        required: true
        description: The machine's name or id.
        schema: { type: string, minLength: 1, maxLength: 64 }
    patch:
      operationId: updateMachine
      tags: [compute]
      summary: Change the workspaces a machine serves
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MachineUpdate" }
      responses:
        "200":
          description: The machine
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Machine" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeMachine
      tags: [compute]
      summary: Remove a machine and revoke its host credential
      description: >-
        Its containers stop and their running tasks retry elsewhere; an agent
        still running on the host stops. Removing a removed machine succeeds.
      responses:
        "204": { description: Removed }
        default: { $ref: "#/components/responses/Error" }

  # Workloads: pods, devboxes, sandboxes, shells and SSH.

  /v1/workspaces/{workspace}/apps/{app}/workloads/pod/{name}/devbox:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/AppPath"
      - $ref: "#/components/parameters/WorkloadPath"
    get:
      operationId: getDevbox
      tags: [workloads]
      summary: How to reach a devbox and what it is doing
      responses:
        "200":
          description: The devbox
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Devbox" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/apps/{app}/workloads/pod/{name}/devbox/start:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/AppPath"
      - $ref: "#/components/parameters/WorkloadPath"
    post:
      operationId: startDevbox
      tags: [workloads]
      summary: Start the devbox now, activating its workload if it is stopped
      responses:
        "200":
          description: The devbox after the request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Devbox" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/apps/{app}/workloads/pod/{name}/devbox/stop:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/AppPath"
      - $ref: "#/components/parameters/WorkloadPath"
    post:
      operationId: stopDevbox
      tags: [workloads]
      summary: Stop the devbox's container until the next connection or start
      description: The workload stays active; the root disk is saved as the container stops.
      responses:
        "200":
          description: The devbox after the request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Devbox" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/instances:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
    post:
      operationId: createInstance
      tags: [workloads]
      summary: Start a container of a release outside its deployment's count
      description: >-
        An instance of a pod or sandbox release, a shell container of any
        release, or a sandbox restored from a memory snapshot. It is placed
        like any container and stops once its lifetime passes with no open
        connection, or when it is stopped.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInstanceRequest" }
      responses:
        "201":
          description: The pending container
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instance" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/containers/{container}/connect:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/ContainerPath"
    post:
      operationId: connectContainer
      tags: [workloads]
      summary: Wait until the container is ready
      description: >-
        Answers with the container once it is ready, with `unavailable` while
        it is still starting after wait_seconds, and with `conflict` once it
        has stopped.
      parameters:
        - name: wait_seconds
          in: query
          schema: { type: integer, minimum: 0, maximum: 60, default: 0 }
      responses:
        "200":
          description: The ready container
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instance" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/containers/{container}/output:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/ContainerPath"
    get:
      operationId: streamContainerOutput
      tags: [workloads]
      summary: What the container wrote outside task attempts, one JSON ContainerLogEntry per line
      description: >-
        A followed stream ends once the container has stopped and its output
        is drained, and writes a blank line after 15 seconds without output.
      parameters:
        - $ref: "#/components/parameters/LogAfter"
        - name: follow
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Newline-delimited ContainerLogEntry objects
          content:
            application/x-ndjson:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/containers/{container}/processes:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/ContainerPath"
    get:
      operationId: listProcesses
      tags: [workloads]
      summary: Processes started through the API, with those that exited in the last five minutes
      responses:
        "200":
          description: The processes by pid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: startProcess
      tags: [workloads]
      summary: Start a process in the container
      description: >-
        args run directly, without a shell, in their own process group, with
        the container's environment plus env.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProcessRequest" }
      responses:
        "201":
          description: The started process
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Process" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/containers/{container}/processes/{process}:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/ContainerPath"
      - $ref: "#/components/parameters/ProcessPath"
    get:
      operationId: getProcess
      tags: [workloads]
      summary: A process's state and the first 256 KiB of each output stream
      description: A result stays readable for five minutes after the process exits.
      parameters:
        - name: wait_seconds
          in: query
          description: Hold the request until the process exits or this many seconds pass.
          schema: { type: number, minimum: 0, maximum: 5, default: 0 }
      responses:
        "200":
          description: The process
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Process" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/containers/{container}/processes/{process}/kill:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/ContainerPath"
      - $ref: "#/components/parameters/ProcessPath"
    post:
      operationId: killProcess
      tags: [workloads]
      summary: Signal the process's group; a process that already exited is not an error
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KillRequest" }
      responses:
        "204": { description: Signalled }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/containers/{container}/files:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/ContainerPath"
      - $ref: "#/components/parameters/ContainerFilePath"
    get:
      operationId: listContainerFiles
      tags: [workloads]
      summary: A directory's entries by name, or the one entry of a file
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 10000 }
      responses:
        "200":
          description: The entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerFileList" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteContainerFile
      tags: [workloads]
      summary: Delete a file; a missing one is not an error and a directory is refused
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/containers/{container}/files/stat:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/ContainerPath"
      - $ref: "#/components/parameters/ContainerFilePath"
    get:
      operationId: statContainerFile
      tags: [workloads]
      responses:
        "200":
          description: The file, following symbolic links
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerFile" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/containers/{container}/files/content:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/ContainerPath"
      - $ref: "#/components/parameters/ContainerFilePath"
    get:
      operationId: downloadContainerFile
      tags: [workloads]
      summary: A file's bytes
      description: >-
        A file larger than max_bytes is refused unless truncate asks for its
        first max_bytes; the response then carries `Lazycloud-Truncated:
        true`.
      parameters:
        # Defaults to 64 MiB. No schema default: the request validator would
        # write it back into the query as a float.
        - name: max_bytes
          in: query
          schema: { type: integer, format: int64, minimum: 1, maximum: 67108864 }
        - name: truncate
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: The file's bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: uploadContainerFile
      tags: [workloads]
      summary: Write a file and its parent directories; the replace is atomic
      parameters:
        - name: mode
          in: query
          description: Permission bits, such as 420 for 0644.
          schema: { type: integer, minimum: 0, maximum: 4095, default: 420 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Written }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/containers/{container}/files/find:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/ContainerPath"
    post:
      operationId: findInContainerFiles
      tags: [workloads]
      summary: Every occurrence of a literal string in the UTF-8 files under a path
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FindInFilesRequest" }
      responses:
        "200":
          description: The matches
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileMatches" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/containers/{container}/files/replace:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/ContainerPath"
    post:
      operationId: replaceInContainerFiles
      tags: [workloads]
      summary: Replace every occurrence of a literal string in the UTF-8 files under a path
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceInFilesRequest" }
      responses:
        "200":
          description: What changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplacedFiles" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/containers/{container}/directories:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/ContainerPath"
      - $ref: "#/components/parameters/ContainerFilePath"
    post:
      operationId: createContainerDirectory
      tags: [workloads]
      summary: Create a directory and its parents
      parameters:
        - name: mode
          in: query
          schema: { type: integer, minimum: 0, maximum: 4095, default: 493 }
      responses:
        "204": { description: Created }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteContainerDirectory
      tags: [workloads]
      summary: Delete a directory and everything in it; a missing one is not an error
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/containers/{container}/ports:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/ContainerPath"
    get:
      operationId: listContainerPorts
      tags: [workloads]
      summary: The container's exposed ports and their URLs
      responses:
        "200":
          description: The ports
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerPortList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: exposeContainerPort
      tags: [workloads]
      summary: Answer HTTP on a port the container listens on, for as long as it runs
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExposePortRequest" }
      responses:
        "200":
          description: The port's URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerPort" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/containers/{container}/network:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/ContainerPath"
    get:
      operationId: getContainerNetwork
      tags: [workloads]
      responses:
        "200":
          description: The container's outbound network policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkPolicy" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: setContainerNetwork
      tags: [workloads]
      summary: Block outbound traffic, limit it to CIDR ranges, or open it
      description: An allow list wins over block_network.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NetworkPolicy" }
      responses:
        "200":
          description: The policy in force
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkPolicy" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/containers/{container}/ttl:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/ContainerPath"
    put:
      operationId: setContainerTtl
      tags: [workloads]
      summary: Keep an instance up for ttl more idle seconds, or without a limit for 0 or -1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TtlRequest" }
      responses:
        "200":
          description: The instance's lifetime
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ttl" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/containers/{container}/snapshots:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/ContainerPath"
    post:
      operationId: snapshotContainer
      tags: [workloads]
      summary: Checkpoint the container's memory and filesystem; it keeps running
      description: >-
        Answers once the snapshot is stored, or with its failure. A host that
        cannot checkpoint fails it with `unsupported`.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SnapshotRequest" }
      responses:
        "201":
          description: The stored snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemorySnapshot" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/containers/{container}/filesystem-images:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/ContainerPath"
    post:
      operationId: createFilesystemImage
      tags: [workloads]
      summary: Publish the container's filesystem, without its mounts, as an image
      description: Answers once the image is published; `Image.from_id` reuses it.
      responses:
        "201":
          description: The image
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FilesystemImage" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/containers/{container}/shell:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/ContainerPath"
    get:
      operationId: openContainerShell
      tags: [workloads]
      summary: An interactive login shell in the container, over a WebSocket
      description: >-
        Binary messages carry terminal bytes both ways. Text messages are
        JSON: the client sends `{"type": "resize", "cols": N, "rows": N}`;
        the server sends `{"type": "exit", "code": N}` when the shell ends and
        `{"type": "error", "message": "..."}` when it cannot start. A browser
        session must send the dashboard's Origin.
      parameters:
        - name: cols
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 80 }
        - name: rows
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 24 }
        - name: term
          in: query
          schema: { type: string, pattern: "^[A-Za-z0-9._+-]{1,64}$", default: xterm-256color }
      responses:
        "101": { description: Switching to the WebSocket protocol }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/sandboxes:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
    get:
      operationId: listSandboxes
      tags: [workloads]
      summary: Sandbox containers, newest first
      parameters:
        - name: app
          in: query
          schema: { $ref: "#/components/schemas/AppName" }
        - name: search
          in: query
          description: Part of the sandbox's name, its app's name or its container id.
          schema: { type: string, minLength: 1, maxLength: 100 }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of sandboxes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SandboxPage" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/sandboxes/stats:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
    get:
      operationId: getSandboxStats
      tags: [workloads]
      parameters:
        - name: app
          in: query
          schema: { $ref: "#/components/schemas/AppName" }
      responses:
        "200":
          description: Counts of the workspace's sandboxes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SandboxStats" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/ssh/certificates:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
    post:
      operationId: createSshCertificate
      tags: [workloads]
      summary: Sign a public key for 12 hours of SSH as root to the workspace's pods
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SshCertificateRequest" }
      responses:
        "201":
          description: The certificate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SshCertificate" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/ssh/hosts:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
    get:
      operationId: listSshHosts
      tags: [workloads]
      summary: Active pods and devboxes that serve SSH, by app and name
      parameters:
        - name: app
          in: query
          schema: { $ref: "#/components/schemas/AppName" }
        - name: pod
          in: query
          schema: { $ref: "#/components/schemas/WorkloadName" }
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/PodRole" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of hosts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SshHostPage" }
        default: { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace}/apps/{app}/workloads/pod/{name}/ssh:
    parameters:
      - $ref: "#/components/parameters/WorkspacePath"
      - $ref: "#/components/parameters/AppPath"
      - $ref: "#/components/parameters/WorkloadPath"
    get:
      operationId: openSshTunnel
      tags: [workloads]
      summary: A WebSocket carrying an SSH connection to the pod, starting it when it is stopped
      description: >-
        The socket opens at once and carries the connection's bytes as
        binary messages once a container is ready, up to 175 seconds later.
        It closes with 1008 when the pod does not exist, is stopped or serves
        no SSH, and with 1013 when no container became ready.
      responses:
        "101": { description: Switching to the WebSocket protocol }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    session:
      description: >-
        The dashboard's browser session, set by GitHub sign-in. Requests
        that change state with it must send an Origin header naming the
        dashboard.
      type: apiKey
      in: cookie
      name: __Host-lazycloud_session

  parameters:
    WorkspacePath:
      name: workspace
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Name" }
    AppPath:
      name: app
      in: path
      required: true
      schema: { $ref: "#/components/schemas/AppName" }
    RequestPath:
      name: http_request
      in: path
      required: true
      schema: { type: string, format: uuid }
    KindPath:
      name: kind
      in: path
      required: true
      schema: { $ref: "#/components/schemas/WorkloadKind" }
    WorkloadPath:
      name: name
      in: path
      required: true
      schema: { $ref: "#/components/schemas/WorkloadName" }
    VersionPath:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    TaskPath:
      name: task
      in: path
      required: true
      schema: { type: string, format: uuid }
    SecretPath:
      name: secret
      in: path
      required: true
      schema: { $ref: "#/components/schemas/SecretName" }
    Cursor:
      name: cursor
      in: query
      description: The next_cursor of the previous page.
      schema: { type: string, maxLength: 2048 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    UserCodePath:
      name: user_code
      in: path
      required: true
      description: The code the CLI shows, such as BCDF-GHJK, in any case.
      schema: { type: string, pattern: "^[A-Za-z]{4}-?[A-Za-z]{4}$" }
    UserPath:
      name: user
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationPath:
      name: invitation
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationTokenPath:
      name: token
      in: path
      required: true
      description: The secret from the invitation link.
      schema: { type: string, minLength: 1, maxLength: 200 }
    ImagePath:
      name: image
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ImageId" }
    ImageBuildPath:
      name: build
      in: path
      required: true
      schema: { type: string, format: uuid }
    # Control parameters.
    AppRefPath:
      name: app
      in: path
      required: true
      description: The app's name or id.
      schema: { $ref: "#/components/schemas/AppRef" }
    ContainerPath:
      name: container
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    LogAfter:
      name: after
      in: query
      description: Return entries with an id greater than this.
      schema: { type: integer, format: int64, minimum: 0, default: 0 }
    LogTail:
      name: tail
      in: query
      description: Start with only the last this many stored entries.
      schema: { type: integer, minimum: 1, maximum: 1000 }
    PreviewPath:
      name: preview
      in: path
      required: true
      schema: { type: string, format: uuid }
    VersionQuery:
      name: version
      in: query
      description: Describe this version instead of the active one.
      schema: { type: integer, minimum: 1 }
    InvokeWait:
      name: wait_seconds
      in: query
      description: Hold the request until the task finishes or this many seconds pass.
      schema: { type: integer, minimum: 0, maximum: 60, default: 60 }

    # Observability parameters.
    RangeStart:
      name: start
      in: query
      description: The start of the range, inclusive.
      schema: { type: string, format: date-time }
    RangeEnd:
      name: end
      in: query
      description: The end of the range, exclusive; defaults to now.
      schema: { type: string, format: date-time }
    WindowSeconds:
      name: window_seconds
      in: query
      description: Seconds per bucket. A range holds at most 500 buckets and 31 days.
      schema: { type: integer, minimum: 60, maximum: 604800, default: 3600 }
    VolumePath:
      name: volume
      in: path
      required: true
      schema: { $ref: "#/components/schemas/VolumeName" }
    DiskPath:
      name: disk
      in: path
      required: true
      schema: { $ref: "#/components/schemas/DiskName" }
    ArtifactPath:
      name: artifact
      in: path
      required: true
      schema: { type: string, format: uuid }
    QueuePath:
      name: queue
      in: path
      required: true
      schema: { $ref: "#/components/schemas/CollectionName" }
    MapPath:
      name: map
      in: path
      required: true
      schema: { $ref: "#/components/schemas/CollectionName" }
    MapKeyPath:
      name: key
      in: path
      required: true
      schema: { $ref: "#/components/schemas/MapKey" }
    ProcessPath:
      name: process
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" }
    ContainerFilePath:
      name: path
      in: query
      required: true
      description: A path in the container; a relative one is under /workspace.
      schema: { type: string, minLength: 1, maxLength: 4096 }
    CostStart:
      name: start
      in: query
      required: true
      schema: { type: string, format: date-time }
    CostEnd:
      name: end
      in: query
      required: true
      description: After start, and at most 400 days later.
      schema: { type: string, format: date-time }

  responses:
    Error:
      description: A typed error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string }

    ErrorCode:
      type: string
      enum:
        - invalid_request
        - unauthenticated
        - forbidden
        - not_found
        - conflict
        - payload_too_large
        - unsupported
        - too_many_pending_tasks
        - task_not_finished
        - unavailable
        - internal
        # Billing: the account must pay or add credit (HTTP 402), or it
        # already holds what its plan allows (HTTP 409).
        - payment_required
        - limit_reached

    Name:
      type: string
      pattern: "^[a-z][a-z0-9-]{0,62}$"

    AppName:
      type: string
      pattern: "^[a-z][a-z0-9_]{0,62}$"

    WorkloadName:
      type: string
      pattern: "^[A-Za-z_][A-Za-z0-9_-]{0,62}$"

    Sha256:
      description: Lowercase hex SHA-256 digest
      type: string
      pattern: "^[0-9a-f]{64}$"

    Me:
      type: object
      required: [user, workspaces]
      properties:
        user: { $ref: "#/components/schemas/User" }
        workspaces:
          type: array
          items: { $ref: "#/components/schemas/Workspace" }

    User:
      type: object
      required: [id, email, display_name, avatar_url, github_login, is_admin, status, created_at]
      properties:
        id: { type: string, format: uuid }
        email:
          description: Empty when GitHub reported no verified primary address.
          type: string
        display_name: { type: string }
        avatar_url: { type: string }
        github_login:
          description: Empty for accounts that have not signed in with GitHub.
          type: string
        is_admin:
          description: Platform administrators reach every workspace.
          type: boolean
        status: { $ref: "#/components/schemas/UserStatus" }
        created_at: { type: string, format: date-time }

    UserStatus:
      description: A disabled account cannot sign in or authenticate.
      type: string
      enum: [active, disabled]

    PlatformRole:
      description: An account's standing on the platform; administrators reach every workspace.
      type: string
      enum: [administrator, member]

    UserRoleRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/PlatformRole" }

    UserStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/UserStatus" }

    Workspace:
      type: object
      required: [id, name, state, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { $ref: "#/components/schemas/Name" }
        state: { $ref: "#/components/schemas/WorkspaceState" }
        role:
          description: The caller's role; absent for an administrator who is not a member.
          allOf: [{ $ref: "#/components/schemas/WorkspaceRole" }]
        created_at: { type: string, format: date-time }

    WorkspaceState:
      type: string
      enum: [active, deleting]

    WorkspaceRole:
      type: string
      enum: [owner, administrator, member]

    WorkspaceList:
      type: object
      required: [workspaces]
      properties:
        workspaces:
          type: array
          items: { $ref: "#/components/schemas/Workspace" }
        next_cursor:
          description: Pass as `cursor` for the next page; absent after the last.
          allOf: [{ $ref: "#/components/schemas/Name" }]

    WorkspaceRequest:
      type: object
      required: [name]
      properties:
        name: { $ref: "#/components/schemas/Name" }
        cloud:
          description: aws places the workspace in the caller's ready AWS connection, for good.
          type: string
          enum: [aws]

    TokenStatus:
      type: string
      enum: [active, expired]

    Token:
      type: object
      required: [id, name, prefix, device, status, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix:
          description: The token's first characters; empty for older tokens.
          type: string
        device:
          description: Minted by `lazycloud login`.
          type: boolean
        workspace_id:
          description: Set when the token reaches only this workspace.
          type: string
          format: uuid
        status: { $ref: "#/components/schemas/TokenStatus" }
        created_at: { type: string, format: date-time }
        expires_at:
          description: Absent when the token never expires.
          type: string
          format: date-time
        last_used_at:
          description: Recorded within 30 seconds of use; absent if never used.
          type: string
          format: date-time

    TokenList:
      type: object
      required: [tokens]
      properties:
        tokens:
          type: array
          items: { $ref: "#/components/schemas/Token" }
        next_cursor:
          description: Pass as `cursor` for the next page; absent after the last.
          type: string
          format: uuid

    TokenCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        expires_in_seconds:
          description: One to 90 days; omit for a token that never expires.
          type: integer
          minimum: 86400
          maximum: 7776000

    CreatedToken:
      type: object
      required: [token, record]
      properties:
        token:
          description: The secret; it is not shown again.
          type: string
        record: { $ref: "#/components/schemas/Token" }

    DeviceLoginRequest:
      type: object
      properties:
        client_name:
          description: Names the device token, such as cli@laptop.
          type: string
          maxLength: 200
          default: cli

    DeviceLogin:
      type: object
      required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in_seconds, poll_interval_seconds]
      properties:
        device_code:
          description: The CLI's secret for polling.
          type: string
        user_code:
          description: What the person confirms at the verification page.
          type: string
        verification_uri: { type: string }
        verification_uri_complete:
          description: The verification page with the code filled in.
          type: string
        expires_in_seconds: { type: integer }
        poll_interval_seconds: { type: integer }

    DeviceTokenRequest:
      type: object
      required: [device_code]
      properties:
        device_code: { type: string, minLength: 1, maxLength: 200 }

    DeviceTokenStatus:
      type: string
      enum: [pending, slow_down, approved, denied, expired]

    DeviceTokenResponse:
      type: object
      required: [status, poll_interval_seconds]
      properties:
        status: { $ref: "#/components/schemas/DeviceTokenStatus" }
        token:
          description: The device token, on the poll that finds the login approved.
          type: string
        poll_interval_seconds:
          description: Wait at least this long before the next poll.
          type: integer

    DeviceCodeStatus:
      type: string
      enum: [pending, approved, denied, expired]

    DeviceCode:
      type: object
      required: [user_code, client_name, status, created_at, expires_at]
      properties:
        user_code: { type: string }
        client_name: { type: string }
        status: { $ref: "#/components/schemas/DeviceCodeStatus" }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    Member:
      type: object
      required: [user_id, display_name, email, role, created_at]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/WorkspaceRole" }
        created_at:
          description: When the user joined.
          type: string
          format: date-time

    MemberList:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items: { $ref: "#/components/schemas/Member" }

    MemberRoleRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/InvitationRole" }

    InvitationRole:
      description: The roles an invitation or role change grants; ownership is never offered.
      type: string
      enum: [administrator, member]

    DeliveryState:
      description: >-
        What became of an email: `queued` until the provider accepts it,
        then `sent`, and `delivered`, `bounced` or `complained` as the
        provider reports; `failed` when delivery gave up; `discarded` when
        it was withdrawn before sending.
      type: string
      enum: [queued, sent, delivered, bounced, complained, failed, discarded]

    InvitationRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, minLength: 3, maxLength: 320 }
        role:
          allOf: [{ $ref: "#/components/schemas/InvitationRole" }]
          default: member

    Invitation:
      type: object
      required: [id, workspace_id, email, role, invited_by_name, expired, delivery, expires_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/InvitationRole" }
        invited_by_user_id: { type: string, format: uuid }
        invited_by_name: { type: string }
        expired:
          description: Decided by the server's clock.
          type: boolean
        delivery: { $ref: "#/components/schemas/DeliveryState" }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    InvitationList:
      type: object
      required: [invitations]
      properties:
        invitations:
          type: array
          items: { $ref: "#/components/schemas/Invitation" }

    InvitationPreview:
      type: object
      required: [workspace_id, workspace_name, email, role, invited_by_name, expired, expires_at]
      properties:
        workspace_id: { type: string, format: uuid }
        workspace_name: { $ref: "#/components/schemas/Name" }
        email: { type: string }
        role: { $ref: "#/components/schemas/InvitationRole" }
        invited_by_name: { type: string }
        expired: { type: boolean }
        expires_at: { type: string, format: date-time }

    AcceptedInvitation:
      type: object
      required: [workspace, member]
      properties:
        workspace: { $ref: "#/components/schemas/Workspace" }
        member: { $ref: "#/components/schemas/Member" }

    SourceUploadRequest:
      type: object
      required: [sha256, size_bytes]
      properties:
        sha256: { $ref: "#/components/schemas/Sha256" }
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 536870912

    SourceUpload:
      type: object
      required: [sha256, present]
      properties:
        sha256: { $ref: "#/components/schemas/Sha256" }
        present:
          description: The archive is stored and can be deployed.
          type: boolean
        upload:
          $ref: "#/components/schemas/UploadTarget"

    UploadTarget:
      description: Send the archive bytes with this request, then register the digest again.
      type: object
      required: [url, method, headers, expires_at]
      properties:
        url:
          description: Absolute URL; the request carries no bearer token.
          type: string
        method:
          type: string
          enum: [PUT]
        headers:
          type: object
          additionalProperties: { type: string }
        expires_at: { type: string, format: date-time }

    DeploymentRequest:
      type: object
      required: [workloads]
      properties:
        workloads:
          description: At least one, unless prune deletes every deployed workload.
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/WorkloadSpec" }
        prune:
          description: Delete every workload of the app that is not listed.
          type: boolean
          default: false

    Deployment:
      type: object
      required: [app, releases, pruned, removed_versions]
      properties:
        app: { $ref: "#/components/schemas/App" }
        releases:
          type: array
          items: { $ref: "#/components/schemas/Release" }
        pruned:
          description: Workloads the prune deleted.
          type: array
          items: { $ref: "#/components/schemas/WorkloadName" }
        removed_versions:
          description: Versions of the pruned workloads.
          type: integer

    App:
      type: object
      required: [id, name, state, workloads, running_containers, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { $ref: "#/components/schemas/AppName" }
        state: { $ref: "#/components/schemas/AppState" }
        workloads:
          description: Deployed workloads that are not deleted.
          type: integer
        running_containers:
          description: Containers of the app that are ready or draining.
          type: integer
          minimum: 0
        created_at: { type: string, format: date-time }

    WorkloadSpec:
      description: >-
        One workload's definition. `kind` names what it deploys as and which
        section it carries: `http` for an endpoint or ASGI app, `pod` for a
        pod or sandbox, neither for a function.
      type: object
      required: [kind, name, source, image, resources]
      properties:
        kind: { $ref: "#/components/schemas/WorkloadKind" }
        name: { $ref: "#/components/schemas/WorkloadName" }
        handler:
          description: "module:qualname within the source archive; pods have none"
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_.]*:[A-Za-z_][A-Za-z0-9_.]*$"
        source:
          $ref: "#/components/schemas/SourceRef"
        image:
          $ref: "#/components/schemas/ImageSpec"
        resources:
          $ref: "#/components/schemas/Resources"
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          default: 3600
        retry_policy:
          $ref: "#/components/schemas/RetryPolicy"
        concurrency:
          description: Tasks one container runs at once, one process per slot.
          type: integer
          minimum: 1
          maximum: 256
          default: 1
        # Defaults: 10, 0 for a scheduled function, and -1 whenever
        # autoscaler.min_containers is above zero. -1 leaves idle containers
        # above the minimum to the planner, which stops them at once.
        keep_warm_seconds:
          description: Idle seconds before a container above the minimum stops.
          type: integer
          minimum: -1
          maximum: 86400
        autoscaler:
          $ref: "#/components/schemas/Autoscaler"
        max_pending_tasks:
          type: integer
          minimum: 1
          maximum: 1000000
          default: 100
        environment:
          type: object
          additionalProperties: { type: string }
        metadata:
          description: Custom metadata stored with the workload's release.
          type: object
          maxProperties: 64
          additionalProperties: true
        # Five cron fields, an alias such as @hourly, or `every N` minutes
        # (m, at most 59), hours (h, at most 23) or days (d, at most 31).
        # Deploy stores the normalized expression.
        cron:
          description: Run the function on this UTC schedule.
          type: string
          minLength: 1
          maxLength: 160
        secrets:
          description: Secrets the container receives as environment variables of the same name.
          type: array
          maxItems: 100
          uniqueItems: true
          items: { $ref: "#/components/schemas/SecretName" }
        # http or https, with a host and without credentials or a fragment.
        callback_url:
          description: Receives a signed POST when a task is retried or finishes.
          type: string
          maxLength: 2048
        in_process:
          description: Run the concurrency slots as threads of one runner process.
          type: boolean
          default: false
        lifecycle_hooks:
          $ref: "#/components/schemas/LifecycleHooks"
        placement:
          $ref: "#/components/schemas/Placement"
        volumes:
          type: array
          maxItems: 32
          items: { $ref: "#/components/schemas/VolumeMountSpec" }
        client_contract:
          description: The signature `lazycloud app export` types clients from.
          type: object
          additionalProperties: true
          x-go-type: json.RawMessage
        http:
          $ref: "#/components/schemas/HttpSpec"
        authorized:
          description: Whether requests to the workload's URLs need a token.
          type: boolean
        pod:
          $ref: "#/components/schemas/PodSpec"
        disks:
          description: Durable disks; a workload with one runs at most one container.
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/DiskMountSpec" }
        docker_enabled:
          description: Run a Docker daemon in each container; the image must include Docker.
          type: boolean
          default: false
        checkpoint:
          $ref: "#/components/schemas/CheckpointSpec"

    SourceRef:
      type: object
      required: [sha256]
      properties:
        sha256: { $ref: "#/components/schemas/Sha256" }

    ImageSpec:
      type: object
      required: [python_version]
      properties:
        python_version:
          description: The Python minor version the runtime is mounted for.
          type: string
          enum: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # A ready image the workspace resolved, built for python_version.
        # Without one the function runs the platform's image for it.
        image_id: { $ref: "#/components/schemas/ImageId" }
        reference:
          description: The image by digest the release runs, set by the server.
          type: string
          readOnly: true

    Resources:
      description: >-
        Reservations the container always keeps. CPU above the reservation is
        shared up to `cpu_limit_millis`, by default the reservation plus 16
        cores. Memory above the reservation is allowed up to
        `memory_limit_mib`, by default four times the reservation, at least
        1 GiB and at most 8 GiB above it; the container is killed beyond it.
      type: object
      required: [cpu_millis, memory_mib]
      properties:
        cpu_millis:
          type: integer
          minimum: 125
          maximum: 192000
        cpu_limit_millis:
          type: integer
          minimum: 125
          maximum: 192000
        memory_mib:
          type: integer
          minimum: 128
          maximum: 1572864
        memory_limit_mib:
          type: integer
          minimum: 128
          maximum: 1572864
        disk_mib:
          description: >-
            Writable layer limit; enforced where Docker has project quotas.
          type: integer
          minimum: 1024
          maximum: 16777216
        gpu:
          description: GPU models by preference; any, last, takes whatever has capacity.
          type: array
          maxItems: 9
          uniqueItems: true
          items: { $ref: "#/components/schemas/GpuType" }
        gpu_count:
          description: GPUs per container; a gpu list without it reserves one.
          type: integer
          minimum: 0
          maximum: 8

    RetryPolicy:
      type: object
      required: [max_attempts]
      properties:
        max_attempts:
          description: Attempts including the first.
          type: integer
          minimum: 1
          maximum: 100
        delay_seconds:
          type: number
          minimum: 0
          maximum: 3600
          default: 0
        backoff:
          type: string
          enum: [fixed, exponential]
          default: fixed
        max_delay_seconds:
          type: number
          minimum: 0
          maximum: 86400
        retry_on:
          description: The failures another attempt follows; absent means all three.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [user_error, timeout, lost]

    Autoscaler:
      type: object
      properties:
        min_containers:
          type: integer
          minimum: 0
          maximum: 1000
          default: 0
        max_containers:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1
        tasks_per_container:
          type: integer
          minimum: 1
          maximum: 10000
          default: 1

    Release:
      type: object
      required: [id, name, created_at, spec]
      properties:
        id: { type: string, format: uuid }
        name: { $ref: "#/components/schemas/WorkloadName" }
        version:
          description: The deployed version; absent for a release only working-tree calls use.
          type: integer
        created_at: { type: string, format: date-time }
        spec: { $ref: "#/components/schemas/WorkloadSpec" }
        url:
          description: Where the workload answers, following the active release.
          type: string
        invoke_path:
          description: The workload on the API host, following the active release.
          type: string

    Payload:
      description: >-
        A task argument or return value. `json` carries `value`; `cloudpickle`
        carries base64 `data`. Arguments encode `{"args": [...], "kwargs": {...}}`.
      type: object
      required: [encoding]
      properties:
        encoding:
          type: string
          enum: [json, cloudpickle]
        value:
          # Kept as raw JSON so values pass through unchanged, including
          # integers beyond float64 precision.
          x-go-type: json.RawMessage
        data:
          type: string
          format: byte
        display: { $ref: "#/components/schemas/ResultDisplay" }

    ResultDisplay:
      description: >-
        How a cloudpickle result shows without loading it, as the runner
        rendered the value where it ran: its text and, when the value
        defines `_repr_png_` or `_repr_html_`, that rendering. Absent for
        JSON results and arguments.
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 65536 }
        rich: { $ref: "#/components/schemas/RichDisplay" }

    RichDisplay:
      description: >-
        `image` carries a PNG of at most 1 MiB as `value_base64`; `html` an
        HTML fragment of at most 262144 characters, which the dashboard
        shows in a sandboxed frame without scripts or network access.
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [image, html] }
        media_type: { type: string, enum: [image/png] }
        value_base64: { type: string, maxLength: 1398104 }
        html: { type: string, maxLength: 262144 }

    SubmitTasksRequest:
      type: object
      required: [inputs]
      properties:
        inputs:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/TaskInput" }
        release_id:
          description: Run on this release, such as a prepared one, instead of the active one.
          type: string
          format: uuid
        parent_task_id:
          description: The task that submits these, which becomes their parent.
          type: string
          format: uuid

    TaskInput:
      description: >-
        A task's arguments. A cloudpickle input refers to each pending
        FunctionCall it contains by the persistent id `("function_call",
        task_id)` and lists those ids in `depends_on`; the task waits until
        they succeed and the runner resolves each id to that task's result.
      allOf:
        - $ref: "#/components/schemas/Payload"
        - type: object
          properties:
            depends_on:
              type: array
              maxItems: 100
              uniqueItems: true
              items: { type: string, format: uuid }

    SubmitTasksResponse:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items: { $ref: "#/components/schemas/Task" }

    TaskStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]

    Task:
      type: object
      required: [id, app, function, release_id, status, attempts, max_attempts, created_at, root_task_id]
      properties:
        id: { type: string, format: uuid }
        app: { $ref: "#/components/schemas/AppName" }
        function: { $ref: "#/components/schemas/WorkloadName" }
        release_id: { type: string, format: uuid }
        version:
          description: The deployed version of the release; absent for a working-tree release.
          type: integer
        status: { $ref: "#/components/schemas/TaskStatus" }
        attempts:
          description: Attempts started so far.
          type: integer
        max_attempts: { type: integer }
        parent_task_id:
          description: The running task that spawned this one.
          type: string
          format: uuid
        root_task_id:
          description: The root of the call graph; the task itself when nothing spawned it.
          type: string
          format: uuid
        scheduled_for:
          description: The cron occurrence that admitted the task.
          type: string
          format: date-time
        container_id:
          description: The container of the latest attempt.
          type: string
          format: uuid
        next_attempt_at:
          description: When a queued task that already ran becomes due again.
          type: string
          format: date-time
        pending: { $ref: "#/components/schemas/TaskPendingProgress" }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        failure: { $ref: "#/components/schemas/TaskFailure" }

    TaskPendingProgress:
      description: Why a queued task has not started, derived from current state on every read.
      type: object
      required: [reason, message, since, pending_since, observed_at]
      properties:
        reason: { $ref: "#/components/schemas/TaskPendingReason" }
        message: { type: string }
        since:
          description: When the current reason began.
          type: string
          format: date-time
        pending_since:
          description: When the task last became due or was submitted.
          type: string
          format: date-time
        observed_at: { type: string, format: date-time }

    TaskPendingReason:
      type: string
      enum:
        - queued
        - dependencies
        - retry
        - capacity_busy
        - capacity_unavailable
        - capacity_limit
        - provisioning_compute
        - starting_container
      x-enum-varnames:
        - Queued
        - Dependencies
        - Retry
        - CapacityBusy
        - CapacityUnavailable
        - CapacityLimit
        - ProvisioningCompute
        - StartingContainer

    FailureKind:
      type: string
      enum: [user_error, load_error, timeout, lost, start_failed, system, dependency_failed]

    TaskFailure:
      type: object
      required: [kind, message]
      properties:
        kind: { $ref: "#/components/schemas/FailureKind" }
        type:
          description: The exception type the handler raised.
          type: string
        message: { type: string }
        traceback: { type: string }
        exception:
          description: The cloudpickled exception, when the runner could serialize it.
          type: string
          format: byte

    LogEntry:
      type: object
      required: [id, task_id, attempt, stream, data, time]
      properties:
        id: { type: integer, format: int64 }
        task_id: { type: string, format: uuid }
        attempt: { type: integer }
        stream:
          type: string
          enum: [stdout, stderr, system]
        data:
          description: One line of output without its trailing newline.
          type: string
        time: { type: string, format: date-time }

    # Workload runtime

    LifecycleHooks:
      description: >-
        Callables the runner invokes with a context object, each a
        `module:qualname` reference into the source. on_start runs once per
        runner process after the handler loads, and its failure is a load
        error. The others run in the container around each attempt, in
        order; their failures are logged and do not change the outcome.
      type: object
      properties:
        on_start: { $ref: "#/components/schemas/HookReferences" }
        on_running: { $ref: "#/components/schemas/HookReferences" }
        on_success: { $ref: "#/components/schemas/HookReferences" }
        on_error: { $ref: "#/components/schemas/HookReferences" }
        on_retry: { $ref: "#/components/schemas/HookReferences" }
        on_failure: { $ref: "#/components/schemas/HookReferences" }
        on_finish: { $ref: "#/components/schemas/HookReferences" }

    HookReferences:
      type: array
      maxItems: 16
      items:
        type: string
        pattern: "^[A-Za-z_][A-Za-z0-9_.]*:[A-Za-z_][A-Za-z0-9_.]*$"

    SecretName:
      description: An environment variable name; the LAZYCLOUD_ prefix is reserved.
      type: string
      pattern: "^[A-Za-z_][A-Za-z0-9_]{0,239}$"

    SecretText:
      type: string
      maxLength: 65536

    SecretCreate:
      type: object
      required: [name, value]
      properties:
        name: { $ref: "#/components/schemas/SecretName" }
        value: { $ref: "#/components/schemas/SecretText" }

    SecretValueUpdate:
      type: object
      required: [value]
      properties:
        value: { $ref: "#/components/schemas/SecretText" }

    Secret:
      type: object
      required: [name, created_at, updated_at, used_by]
      properties:
        name: { $ref: "#/components/schemas/SecretName" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        used_by:
          description: Workloads whose active release receives the secret.
          type: array
          items: { $ref: "#/components/schemas/WorkloadRef" }

    SecretValue:
      type: object
      required: [name, value, created_at, updated_at]
      properties:
        name: { $ref: "#/components/schemas/SecretName" }
        value: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SecretPage:
      type: object
      required: [secrets]
      properties:
        secrets:
          type: array
          items: { $ref: "#/components/schemas/Secret" }
        next_cursor:
          description: Present when more secrets follow.
          type: string

    Schedule:
      type: object
      required: [cron, timezone, next_run_at]
      properties:
        cron:
          description: The normalized expression.
          type: string
        timezone:
          type: string
          enum: [UTC]
        next_run_at: { type: string, format: date-time }
        last_run_at:
          description: When the last handled occurrence was due.
          type: string
          format: date-time
        last_task_id:
          description: The task the last occurrence admitted.
          type: string
          format: uuid
        last_error:
          description: Why the last occurrence admitted no task.
          type: string

    # Storage

    VolumeName:
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$"

    DiskName:
      type: string
      pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"

    CollectionName:
      description: A queue or map name; any characters except control characters.
      type: string
      pattern: "^[^\\x00-\\x1f\\x7f]{1,255}$"

    MapKey:
      type: string
      minLength: 1
      maxLength: 1024
      pattern: "^[^\\x00-\\x1f\\x7f]+$"

    VolumeRelativePath:
      description: >-
        A path below the volume root; `.` or empty is the root, `..` is refused.
      type: string
      maxLength: 1024

    VolumeFilePath:
      description: A file or directory below the volume root.
      type: string
      minLength: 1
      maxLength: 1024

    WorkloadRef:
      type: object
      required: [app, kind, name]
      properties:
        app: { $ref: "#/components/schemas/AppName" }
        kind: { $ref: "#/components/schemas/WorkloadKind" }
        name: { $ref: "#/components/schemas/WorkloadName" }

    VolumeMountSpec:
      description: >-
        A volume, or with `cloud_bucket` an S3 bucket, mounted into every
        container of the workload. A platform volume is created on first use.
      type: object
      required: [name]
      properties:
        name: { $ref: "#/components/schemas/VolumeName" }
        mount_path:
          description: >-
            Absolute, or relative to /volumes; the default is /volumes/<name>.
          type: string
          maxLength: 1024
        read_only:
          type: boolean
          default: false
        cloud_bucket: { $ref: "#/components/schemas/CloudBucketSpec" }

    CloudBucketSpec:
      type: object
      required: [bucket]
      properties:
        bucket:
          type: string
          minLength: 3
          maxLength: 63
        prefix:
          description: A key prefix ending in `/`, or empty for the whole bucket.
          type: string
          maxLength: 1024
          default: ""
        region: { type: string, maxLength: 64 }
        endpoint:
          description: An S3-compatible endpoint URL; AWS S3 when absent.
          type: string
          maxLength: 1024
        force_path_style:
          type: boolean
          default: false
        access_key_secret:
          description: The workspace secret holding the access key id.
          allOf: [{ $ref: "#/components/schemas/SecretName" }]
        secret_key_secret:
          description: The workspace secret holding the secret access key.
          allOf: [{ $ref: "#/components/schemas/SecretName" }]

    Volume:
      type: object
      required: [id, name, size_bytes, created_at, used_by]
      properties:
        id: { type: string, format: uuid }
        name: { $ref: "#/components/schemas/VolumeName" }
        size_bytes:
          description: Bytes stored at the last measurement.
          type: integer
          format: int64
        size_measured_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        used_by:
          description: Workloads whose active release mounts the volume.
          type: array
          items: { $ref: "#/components/schemas/WorkloadRef" }

    VolumePage:
      type: object
      required: [volumes]
      properties:
        volumes:
          type: array
          items: { $ref: "#/components/schemas/Volume" }
        next_cursor: { type: string }

    CreateVolumeRequest:
      type: object
      required: [name]
      properties:
        name: { $ref: "#/components/schemas/VolumeName" }

    VolumeFile:
      type: object
      required: [path, is_dir, size_bytes]
      properties:
        path:
          description: The path relative to the volume root.
          type: string
        is_dir: { type: boolean }
        size_bytes:
          type: integer
          format: int64
        modified_at:
          description: Absent for directories.
          type: string
          format: date-time

    VolumeFilePage:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items: { $ref: "#/components/schemas/VolumeFile" }
        next_cursor: { type: string }

    RemovedVolumeFiles:
      type: object
      required: [removed]
      properties:
        removed:
          description: Removed file paths relative to the volume root.
          type: array
          items: { type: string }

    MoveVolumeFileRequest:
      type: object
      required: [from, to]
      properties:
        from: { $ref: "#/components/schemas/VolumeFilePath" }
        to: { $ref: "#/components/schemas/VolumeFilePath" }

    PresignVolumeFileRequest:
      type: object
      required: [path, method]
      properties:
        path: { $ref: "#/components/schemas/VolumeFilePath" }
        method:
          type: string
          enum: [get, head, put, upload_part]
        expires_seconds:
          type: integer
          minimum: 1
          maximum: 604800
          default: 3600
        upload_id:
          description: Required for `upload_part`.
          type: string
          maxLength: 1024
        part_number:
          description: Required for `upload_part`.
          type: integer
          minimum: 1
          maximum: 10000
        download:
          description: For `get`, have a browser save the file instead of showing it.
          type: boolean
          default: false

    PresignedUrl:
      type: object
      required: [url, expires_at]
      properties:
        url:
          description: Absolute URL; the request carries no bearer token.
          type: string
        expires_at: { type: string, format: date-time }

    UploadPart:
      type: object
      required: [number, offset, size_bytes, url]
      properties:
        number: { type: integer }
        offset:
          type: integer
          format: int64
        size_bytes:
          type: integer
          format: int64
        url:
          description: A presigned PUT of these bytes; its ETag completes a multipart upload.
          type: string

    Upload:
      description: >-
        Where to send bytes. With `upload_id` it is a multipart upload whose
        part ETags complete it; without, `parts` holds one plain PUT.
      type: object
      required: [parts, expires_at]
      properties:
        upload_id: { type: string }
        part_size_bytes:
          type: integer
          format: int64
        parts:
          type: array
          items: { $ref: "#/components/schemas/UploadPart" }
        expires_at: { type: string, format: date-time }

    CompletedPart:
      type: object
      required: [number, etag]
      properties:
        number:
          type: integer
          minimum: 1
          maximum: 10000
        etag:
          type: string
          maxLength: 1024

    CreateVolumeUploadRequest:
      type: object
      required: [path, size_bytes]
      properties:
        path: { $ref: "#/components/schemas/VolumeFilePath" }
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 5497558138880
        part_size_bytes:
          type: integer
          format: int64
          minimum: 5242880
          maximum: 5368709120
          default: 5242880

    MultipartUpload:
      type: object
      required: [upload_id, path, part_size_bytes, parts, expires_at]
      properties:
        upload_id: { type: string }
        path: { type: string }
        part_size_bytes:
          type: integer
          format: int64
        parts:
          type: array
          items: { $ref: "#/components/schemas/UploadPart" }
        expires_at: { type: string, format: date-time }

    CompleteVolumeUploadRequest:
      type: object
      required: [path, upload_id, parts]
      properties:
        path: { $ref: "#/components/schemas/VolumeFilePath" }
        upload_id:
          type: string
          maxLength: 1024
        parts:
          type: array
          minItems: 1
          maxItems: 10000
          items: { $ref: "#/components/schemas/CompletedPart" }

    AbortVolumeUploadRequest:
      type: object
      required: [path, upload_id]
      properties:
        path: { $ref: "#/components/schemas/VolumeFilePath" }
        upload_id:
          type: string
          maxLength: 1024

    DiskStatus:
      type: string
      enum: [detached, attached, saving]

    Disk:
      type: object
      required: [id, name, size_bytes, stored_bytes, generation, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { $ref: "#/components/schemas/DiskName" }
        size_bytes:
          type: integer
          format: int64
        stored_bytes:
          description: Bytes the disk's published generations occupy in the object store.
          type: integer
          format: int64
        generation:
          description: The newest published generation; 0 before the first.
          type: integer
          format: int64
        status: { $ref: "#/components/schemas/DiskStatus" }
        holder_container_id:
          description: The container holding the disk while attached or saving.
          type: string
          format: uuid
        holder:
          description: The workload whose container holds the disk.
          allOf: [{ $ref: "#/components/schemas/WorkloadRef" }]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DiskPage:
      type: object
      required: [disks]
      properties:
        disks:
          type: array
          items: { $ref: "#/components/schemas/Disk" }
        next_cursor: { type: string }

    Artifact:
      type: object
      required: [id, filename, content_type, size_bytes, state, created_at]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        app: { $ref: "#/components/schemas/AppName" }
        filename: { type: string }
        content_type: { type: string }
        size_bytes:
          type: integer
          format: int64
        state:
          type: string
          enum: [uploading, stored]
        created_at: { type: string, format: date-time }
        stored_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    ArtifactPage:
      type: object
      required: [artifacts]
      properties:
        artifacts:
          type: array
          items: { $ref: "#/components/schemas/Artifact" }
        next_cursor: { type: string }

    CreateArtifactRequest:
      type: object
      required: [task_id, filename, size_bytes]
      properties:
        task_id: { type: string, format: uuid }
        filename:
          description: A base name without `/`.
          type: string
          pattern: "^[^/\\x00-\\x1f\\x7f]{1,255}$"
        content_type:
          type: string
          minLength: 1
          maxLength: 255
          default: application/octet-stream
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 5497558138880

    ArtifactUpload:
      type: object
      required: [artifact, upload]
      properties:
        artifact: { $ref: "#/components/schemas/Artifact" }
        upload: { $ref: "#/components/schemas/Upload" }

    CompleteArtifactRequest:
      type: object
      properties:
        parts:
          description: The ETag of every part of a multipart upload.
          type: array
          maxItems: 10000
          items: { $ref: "#/components/schemas/CompletedPart" }

    PresignArtifactRequest:
      type: object
      properties:
        expires_seconds:
          description: Capped at the artifact's remaining retention.
          type: integer
          minimum: 1
          maximum: 604800
          default: 3600
        download:
          description: Ask browsers to save the file rather than show it.
          type: boolean
          default: false

    ArtifactSummary:
      type: object
      required: [count, size_bytes, estimated_monthly_nanos, accrued_nanos, accrued_since, retention_seconds]
      properties:
        count:
          type: integer
          format: int64
        size_bytes:
          type: integer
          format: int64
        estimated_monthly_nanos:
          description: size_bytes for 30 days at the volume storage rate.
          type: integer
          format: int64
        accrued_nanos:
          description: Metered cost since accrued_since, by closed quarter-hour.
          type: integer
          format: int64
        accrued_since:
          description: The start of the current UTC month.
          type: string
          format: date-time
        retention_seconds:
          description: How long new artifacts are kept under the workspace's plan.
          type: integer
          format: int64

    DeleteArtifactsRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: uuid }

    DeletedArtifacts:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: array
          items: { type: string, format: uuid }

    QueueInfo:
      description: In a list, statistics count at most 100,001 messages.
      type: object
      required: [name, size]
      properties:
        name: { $ref: "#/components/schemas/CollectionName" }
        size:
          type: integer
          format: int64
        oldest_message_at: { type: string, format: date-time }

    QueuePage:
      type: object
      required: [queues]
      properties:
        queues:
          type: array
          items: { $ref: "#/components/schemas/QueueInfo" }
        next_cursor: { type: string }

    PutQueueMessagesRequest:
      type: object
      required: [messages]
      properties:
        messages:
          description: Message bodies, base64; each at most 1 MiB.
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: string, format: byte }

    QueueMessageResult:
      type: object
      properties:
        message: { type: string, format: byte }

    MapInfo:
      description: In a list, statistics count at most 100,001 live keys.
      type: object
      required: [name, count, size_bytes, expiring_count]
      properties:
        name: { $ref: "#/components/schemas/CollectionName" }
        count:
          type: integer
          format: int64
        size_bytes:
          type: integer
          format: int64
        expiring_count:
          type: integer
          format: int64
        next_expiry_at: { type: string, format: date-time }

    MapPage:
      type: object
      required: [maps]
      properties:
        maps:
          type: array
          items: { $ref: "#/components/schemas/MapInfo" }
        next_cursor: { type: string }

    MapKeyPage:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: { type: string }
        next_cursor: { type: string }

    MapEntry:
      type: object
      required: [key, value, revision, updated_at]
      properties:
        key: { type: string }
        value:
          description: >-
            Base64 bytes; SDK values are JSON, or cloudpickle (first byte 0x80).
          type: string
          format: byte
        revision:
          description: Changes on every write; pass it as `if_revision` to compare and set.
          type: string
        expires_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SetMapEntryRequest:
      type: object
      required: [value]
      properties:
        value:
          description: At most 1 MiB, base64.
          type: string
          format: byte
        ttl_seconds:
          description: >-
            Seconds to expiry, 0 for never; absent keeps an existing expiry.
          type: integer
          minimum: 0
          maximum: 604800
        if_revision:
          type: string
          pattern: "^[0-9]{1,20}$"
        if_absent:
          type: boolean
          default: false

    MapEntryWrite:
      type: object
      required: [revision]
      properties:
        revision: { type: string }
        expires_at: { type: string, format: date-time }

    # Control

    AppRef:
      description: An app name or id.
      type: string
      pattern: "^([a-z][a-z0-9_]{0,62}|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$"

    AppState:
      type: string
      enum: [active, paused, deleted]

    LiveAppState:
      type: string
      enum: [active, paused]

    WorkloadState:
      description: Desired state. A paused app stops its active workloads too.
      type: string
      enum: [active, stopped, deleted]

    DeploymentPlanAction:
      description: >-
        `add` deploys a new workload, `redeploy` deploys one that exists,
        `retain` leaves an omitted one deployed and `remove` deletes an
        omitted one with prune.
      type: string
      enum: [add, redeploy, retain, remove]

    AppPage:
      type: object
      required: [apps]
      properties:
        apps:
          type: array
          items: { $ref: "#/components/schemas/App" }
        next_cursor:
          description: Present when another page follows.
          type: string

    WorkloadKind:
      description: >-
        A function runs tasks; an endpoint or ASGI app serves HTTP, and
        realtime apps are ASGI apps. A pod runs a command, and a devbox is a
        pod; a sandbox runs instances its owner creates.
      type: string
      enum: [function, endpoint, asgi, pod, sandbox]

    DeploymentPlanRequest:
      type: object
      required: [workloads]
      properties:
        workloads:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/WorkloadIdentity" }
        prune:
          type: boolean
          default: false

    WorkloadIdentity:
      type: object
      required: [kind, name]
      properties:
        kind: { $ref: "#/components/schemas/WorkloadKind" }
        name: { $ref: "#/components/schemas/WorkloadName" }

    DeploymentPlan:
      type: object
      required: [app, prune, items]
      properties:
        app: { $ref: "#/components/schemas/AppName" }
        prune: { type: boolean }
        items:
          description: Listed workloads by kind and name, then omitted deployed ones.
          type: array
          items: { $ref: "#/components/schemas/DeploymentPlanItem" }

    DeploymentPlanItem:
      type: object
      required: [kind, name, action, versions]
      properties:
        kind: { $ref: "#/components/schemas/WorkloadKind" }
        name: { $ref: "#/components/schemas/WorkloadName" }
        action: { $ref: "#/components/schemas/DeploymentPlanAction" }
        versions:
          description: Versions the workload has now.
          type: integer

    Workload:
      description: >-
        A deployed workload, addressed as
        /apps/{app}/workloads/{kind}/{name}.
      type: object
      required: [id, app, name, kind, state, running_containers, created_at]
      properties:
        id: { type: string, format: uuid }
        app: { $ref: "#/components/schemas/AppName" }
        name: { $ref: "#/components/schemas/WorkloadName" }
        kind: { $ref: "#/components/schemas/WorkloadKind" }
        state: { $ref: "#/components/schemas/WorkloadState" }
        app_state: { $ref: "#/components/schemas/AppState" }
        running_containers:
          description: Containers of the workload's releases that are ready or draining.
          type: integer
          minimum: 0
        version:
          description: The active version.
          type: integer
        release_id:
          description: The active release.
          type: string
          format: uuid
        created_at: { type: string, format: date-time }
        deployed_at:
          description: When the active version was deployed.
          type: string
          format: date-time
        role: { $ref: "#/components/schemas/PodRole" }
        scaling: { $ref: "#/components/schemas/Scaling" }
        url:
          description: Where a pod or HTTP workload answers.
          type: string

    WorkloadDetail:
      type: object
      required: [workload, release]
      properties:
        workload: { $ref: "#/components/schemas/Workload" }
        release:
          description: The definition the active version runs, or the version the request names.
          allOf: [{ $ref: "#/components/schemas/Release" }]
        http: { $ref: "#/components/schemas/HttpUrls" }
        schedule:
          description: When a scheduled function runs.
          allOf: [{ $ref: "#/components/schemas/Schedule" }]

    WorkloadPage:
      type: object
      required: [workloads]
      properties:
        workloads:
          type: array
          items: { $ref: "#/components/schemas/Workload" }
        next_cursor: { type: string }

    StartWorkloadRequest:
      type: object
      properties:
        version:
          description: Make this deployed version active before starting.
          type: integer
          minimum: 1

    Version:
      type: object
      required: [release_id, version, active, created_at]
      properties:
        release_id: { type: string, format: uuid }
        version: { type: integer }
        active: { type: boolean }
        created_at: { type: string, format: date-time }

    VersionPage:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          items: { $ref: "#/components/schemas/Version" }
        next_cursor: { type: string }

    TaskPage:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        next_cursor: { type: string }

    StopTasksRequest:
      type: object
      required: [task_ids]
      properties:
        task_ids:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items: { type: string, format: uuid }

    StopTasksResponse:
      type: object
      required: [stopped, skipped]
      properties:
        stopped:
          description: Tasks this request cancelled.
          type: array
          items: { type: string, format: uuid }
        skipped:
          description: Tasks that were already finished or are not in the workspace.
          type: array
          items: { type: string, format: uuid }

    ContainerState:
      type: string
      enum: [pending, starting, ready, draining, stopped]

    StopReason:
      type: string
      description: exited means a pod's command ended on its own; exit_code says how.
      enum: [stopped, load_error, start_failed, crashed, out_of_memory, host_lost, exited]

    Container:
      type: object
      required: [id, app, function, release_id, state, slots, running_tasks, cpu_millis, memory_mib, created_at]
      properties:
        id: { type: string, format: uuid }
        app: { $ref: "#/components/schemas/AppName" }
        function: { $ref: "#/components/schemas/WorkloadName" }
        release_id: { type: string, format: uuid }
        version:
          description: The deployed version of the release; absent for a working-tree release.
          type: integer
        state: { $ref: "#/components/schemas/ContainerState" }
        stop_reason: { $ref: "#/components/schemas/StopReason" }
        exit_message: { type: string }
        slots: { type: integer }
        running_tasks:
          description: Attempts running now.
          type: integer
        cpu_millis: { type: integer, format: int64 }
        memory_mib: { type: integer, format: int64 }
        image:
          description: The image reference the release runs.
          type: string
        created_at: { type: string, format: date-time }
        ready_at: { type: string, format: date-time }
        stopped_at: { type: string, format: date-time }
        kind: { $ref: "#/components/schemas/WorkloadKind" }
        purpose: { $ref: "#/components/schemas/ContainerPurpose" }
        exit_code:
          description: How the container's command exited, once it has.
          type: integer
        host:
          description: The name of the host the container was placed on.
          type: string
        gpu_count: { type: integer }
        expires_at:
          description: When an instance with a timeout stops unless it is used again.
          type: string
          format: date-time

    ContainerPurpose:
      description: >-
        serve containers are the ones a deployment's count asks for; an
        instance or shell was started on request and has its own lifetime.
      type: string
      enum: [serve, instance, shell]
      x-enum-varnames: [ContainerPurposeServe, ContainerPurposeInstance, ContainerPurposeShell]

    ContainerPage:
      type: object
      required: [containers]
      properties:
        containers:
          type: array
          items: { $ref: "#/components/schemas/Container" }
        next_cursor: { type: string }

    # Images

    ImageId:
      type: string
      pattern: "^img_[0-9a-f]{24}$"

    ImageArchitecture:
      type: string
      enum: [amd64, arm64]

    ImageDefinition:
      description: >-
        What an image contains. Steps run in order after python_packages and
        before commands.
      type: object
      required: [python_version]
      properties:
        python_version:
          description: A supported minor release or an exact patch release.
          type: string
          pattern: "^3\\.(10|11|12|13|14)(\\.[0-9]{1,3})?$"
        micromamba:
          description: Micromamba provides Python and the base environment.
          type: boolean
          default: false
        # Without a base image the image starts from the platform's Python
        # image for python_version.
        base_image:
          description: A registry image to start from.
          type: string
          minLength: 1
          maxLength: 512
        # Values are used for the build and never returned. Names other than
        # the documented ones, such as GITHUB_USERNAME, are ignored.
        base_image_credentials:
          description: Registry credentials by environment variable name.
          type: object
          maxProperties: 32
          additionalProperties: { type: string, maxLength: 65536 }
        architecture:
          type: string
          enum: [amd64, arm64]
          default: amd64
        python_packages:
          type: array
          maxItems: 1000
          items: { type: string, minLength: 1, maxLength: 1024 }
        steps:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/ImageStep" }
        commands:
          type: array
          maxItems: 1000
          items: { type: string, minLength: 1, maxLength: 65536 }
        env:
          type: object
          maxProperties: 256
          additionalProperties: { type: string, maxLength: 65536 }
        dockerfile:
          description: A Dockerfile that replaces the base image and Python setup.
          type: string
          maxLength: 1048576
        # A source archive the workspace uploaded with the files the build reads.
        context: { $ref: "#/components/schemas/SourceRef" }
        secrets:
          description: Workspace secrets the build steps read as environment variables.
          type: array
          maxItems: 64
          items: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]{0,127}$" }
        gpu:
          description: The GPU model the build runs on and its steps use; one model, not any.
          type: string
          maxLength: 64

    ImageStepKind:
      type: string
      enum: [shell, pip, micromamba, uv_project, poetry_project, pyproject, micromamba_environment]

    ImageStep:
      description: >-
        shell runs command. pip and micromamba install args. Project kinds
        install the project at args[0] with extras args[1:] and groups.
        micromamba_environment creates the environment from the file at
        args[0].
      type: object
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/ImageStepKind" }
        command: { type: string, maxLength: 65536 }
        args:
          type: array
          maxItems: 1000
          items: { type: string, maxLength: 1024 }
        groups:
          type: array
          maxItems: 64
          items: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$" }

    Image:
      type: object
      required: [id, python_version, architecture, ready, created_at]
      properties:
        id: { $ref: "#/components/schemas/ImageId" }
        python_version: { type: string }
        architecture: { $ref: "#/components/schemas/ImageArchitecture" }
        ready:
          description: The image is published and can be deployed.
          type: boolean
        created_at: { type: string, format: date-time }
        ready_at: { type: string, format: date-time }

    ImageResolution:
      type: object
      required: [image]
      properties:
        image: { $ref: "#/components/schemas/Image" }
        # The build in progress, or the one this request started.
        build: { $ref: "#/components/schemas/ImageBuild" }

    ImageBuildStatus:
      type: string
      enum: [building, succeeded, failed]

    ImageBuildPhase:
      description: >-
        queued waits for a host with room, starting prepares the build
        container, building runs the build and finished means the status is
        final.
      type: string
      enum: [queued, starting, building, finished]

    ImageBuild:
      type: object
      required: [id, image_id, status, phase, attempt, created_at]
      properties:
        id: { type: string, format: uuid }
        image_id: { $ref: "#/components/schemas/ImageId" }
        status: { $ref: "#/components/schemas/ImageBuildStatus" }
        phase: { $ref: "#/components/schemas/ImageBuildPhase" }
        attempt:
          description: Build containers started so far, at most 2.
          type: integer
        failure: { type: string }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }

    ImageBuildLogEntry:
      type: object
      required: [id, attempt, data, time]
      properties:
        id: { type: integer, format: int64 }
        attempt: { type: integer }
        data:
          description: One line of build output without its trailing newline.
          type: string
        time: { type: string, format: date-time }

    # Endpoints

    HttpSpec:
      description: >-
        Makes the workload answer HTTP. Its slots are `workers` processes,
        each handling `concurrency` requests at once.
      type: object
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/HttpKind" }
        route:
          description: The path an endpoint answers on.
          type: string
          pattern: "^/[^\\s?#]*$"
          maxLength: 512
          default: /
        methods:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/HttpMethod" }
          default: [GET, POST]
        domain:
          $ref: "#/components/schemas/Hostname"
        workers:
          type: integer
          minimum: 1
          maximum: 64
          default: 1

    HttpKind:
      type: string
      enum: [endpoint, asgi, realtime]

    HttpMethod:
      type: string
      enum: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT, TRACE]

    Hostname:
      type: string
      maxLength: 253
      pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)+$"

    HttpUrls:
      description: Where an endpoint or ASGI app answers, for the release a describe names.
      type: object
      required: [url, version_url, release_url, invoke_path, version_invoke_path]
      properties:
        url:
          description: Follows the active release across deploys.
          type: string
        version_url:
          description: Pinned to the release's version.
          type: string
        release_url:
          description: Addresses the release by id.
          type: string
        invoke_path:
          description: The workload on the API host; append the request's path.
          type: string
        version_invoke_path:
          description: The API-host path pinned to the release's version.
          type: string
        domain_url:
          description: The custom hostname, once its registration is ready.
          type: string

    InvocationBody:
      type: object
      additionalProperties: true
      # Kept as raw JSON so arguments pass through unchanged, including
      # integers beyond float64 precision.
      x-go-type: json.RawMessage

    Invocation:
      type: object
      required: [task]
      properties:
        task: { $ref: "#/components/schemas/Task" }
        result:
          description: The JSON value the function returned, once it succeeded.
          x-go-type: json.RawMessage

    DomainRequest:
      type: object
      required: [hostname]
      properties:
        hostname:
          type: string
          maxLength: 253

    DomainPhase:
      type: string
      enum: [awaiting_verification, validating, ready, action_required]

    DomainErrorCode:
      type: string
      enum: [verification_timed_out, certificate_failed, hostname_rejected, upstream_unavailable]

    DnsRecord:
      type: object
      required: [type, name, value]
      properties:
        type: { type: string }
        name: { type: string }
        value: { type: string }

    Domain:
      type: object
      required: [id, hostname, phase, cname_target, required_records, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        hostname: { $ref: "#/components/schemas/Hostname" }
        phase: { $ref: "#/components/schemas/DomainPhase" }
        cname_target:
          description: The hostname the domain's CNAME points at.
          type: string
        required_records:
          description: Records the provider still waits for beyond the CNAME.
          type: array
          items: { $ref: "#/components/schemas/DnsRecord" }
        error_code: { $ref: "#/components/schemas/DomainErrorCode" }
        error_message: { type: string }
        verified_at: { type: string, format: date-time }
        last_checked_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DomainList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Domain" }
        next:
          description: Pass as `after` for the next page; absent on the last.
          type: string

    PreviewRequest:
      type: object
      required: [spec]
      properties:
        spec: { $ref: "#/components/schemas/WorkloadSpec" }
        timeout_seconds:
          description: Stop after this long; 0 runs until stopped.
          type: integer
          minimum: 0
          maximum: 86400
          default: 0

    PreviewState:
      type: string
      enum: [starting, ready, stopped]

    PreviewKind:
      type: string
      enum: [function, endpoint, asgi, realtime]

    Preview:
      type: object
      required: [id, app, name, kind, state, url, created_at]
      properties:
        id: { type: string, format: uuid }
        app: { $ref: "#/components/schemas/AppName" }
        name: { $ref: "#/components/schemas/WorkloadName" }
        kind: { $ref: "#/components/schemas/PreviewKind" }
        state: { $ref: "#/components/schemas/PreviewState" }
        container_id: { type: string, format: uuid }
        url:
          description: Where the preview answers; a function preview takes tasks through the API.
          type: string
        stop_reason:
          description: Why the preview stopped on its own, such as load_error.
          allOf: [{ $ref: "#/components/schemas/StopReason" }]
        error: { type: string }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    PreviewSync:
      type: object
      required: [written, removed]
      properties:
        written: { type: integer }
        removed: { type: integer }

    HttpRequest:
      description: >-
        One request to an endpoint or ASGI app. `status` is what the caller
        received, 101 for a WebSocket whose `duration_ms` is the session.
      type: object
      required: [id, app, name, kind, release_id, method, path, status, started_at, duration_ms, request_bytes, response_bytes]
      properties:
        id: { type: string, format: uuid }
        app: { $ref: "#/components/schemas/AppName" }
        name: { $ref: "#/components/schemas/WorkloadName" }
        kind: { $ref: "#/components/schemas/WorkloadKind" }
        release_id: { type: string, format: uuid }
        version:
          description: The deployed version; negative for a preview.
          type: integer
        container_id: { type: string, format: uuid }
        method: { type: string }
        path: { type: string }
        status: { type: integer }
        started_at: { type: string, format: date-time }
        duration_ms: { type: integer, format: int64 }
        request_bytes: { type: integer, format: int64 }
        response_bytes: { type: integer, format: int64 }

    HttpRequestList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/HttpRequest" }
        next:
          description: Pass as `before` for the next page; absent on the last.
          type: string
          format: uuid

    ContainerLogList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ContainerLogEntry" }

    ContainerLogEntry:
      type: object
      required: [id, stream, data, time]
      properties:
        id: { type: integer, format: int64 }
        stream:
          type: string
          enum: [stdout, stderr, system]
        data:
          description: One line of output without its trailing newline.
          type: string
        time: { type: string, format: date-time }

    # Observability

    ChangeTopic:
      type: string
      enum: [apps, deployments, tasks, containers, storage.secrets, storage.volumes, usage]

    ChangeKind:
      type: string
      enum: [created, updated, deleted]

    ChangeEvent:
      description: >-
        The changes one statement committed in the workspace. A statement
        that changed many resources sends them grouped, with a count and no
        resource_id.
      type: object
      required: [seq, workspace_id, occurred_at, changes]
      properties:
        seq: { type: integer, format: int64 }
        workspace_id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        changes:
          type: array
          items: { $ref: "#/components/schemas/ResourceChange" }

    ResourceChange:
      type: object
      required: [topic, change]
      properties:
        topic: { $ref: "#/components/schemas/ChangeTopic" }
        change: { $ref: "#/components/schemas/ChangeKind" }
        resource_id:
          description: The resource's id, or a secret's name.
          type: string
        app_id: { type: string, format: uuid }
        deployment_id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        root_task_id: { type: string, format: uuid }
        container_id: { type: string, format: uuid }
        status:
          description: The resource's state after the change.
          type: string
        count:
          description: How many resources a grouped change covers.
          type: integer

    ChangeResetReason:
      type: string
      enum: [behind, missed, unknown_cursor]
      description: >-
        behind: the client read too slowly and events were dropped. missed:
        the server lost its database connection and may have missed changes.
        unknown_cursor: Last-Event-ID is older than the events the server
        holds.

    ChangeReset:
      type: object
      required: [reason]
      properties:
        reason: { $ref: "#/components/schemas/ChangeResetReason" }

    ContainerMetrics:
      type: object
      required: [container_id, cpu_total_millicores, memory_total_bytes, step_seconds, points]
      properties:
        container_id: { type: string, format: uuid }
        cpu_total_millicores:
          description: The container's CPU reservation.
          type: integer
          format: int64
        memory_total_bytes:
          description: The container's memory reservation.
          type: integer
          format: int64
        step_seconds: { type: integer }
        points:
          type: array
          items: { $ref: "#/components/schemas/ContainerMetricPoint" }

    ContainerMetricPoint:
      description: >-
        Use over the step that starts at timestamp. Counters are the bytes
        moved in interval_ms, the sampled time the point covers; memory and
        GPU memory are the peak.
      type: object
      required: [timestamp, interval_ms, cpu_millicores, memory_rss_bytes, memory_swap_bytes,
        network_recv_bytes, network_sent_bytes, disk_read_bytes, disk_write_bytes]
      properties:
        timestamp: { type: string, format: date-time }
        interval_ms: { type: integer, format: int64 }
        cpu_millicores:
          description: Average CPU use over the interval.
          type: number
          format: double
        memory_rss_bytes: { type: integer, format: int64 }
        memory_swap_bytes: { type: integer, format: int64 }
        network_recv_bytes: { type: integer, format: int64 }
        network_sent_bytes: { type: integer, format: int64 }
        disk_read_bytes: { type: integer, format: int64 }
        disk_write_bytes: { type: integer, format: int64 }
        gpu_utilization_pct:
          description: Average over the container's GPUs; absent without one.
          type: number
          format: double
        gpu_memory_used_bytes: { type: integer, format: int64 }
        gpu_memory_total_bytes: { type: integer, format: int64 }
        gpu_type: { type: string }

    LifecycleStageKind:
      type: string
      enum: [placement, image, source, create, runtime, draining]
      description: >-
        placement: waiting for a host. image: pulling the image, or finding
        it on the host. source: fetching the source. create: starting the
        container process. runtime: loading the handler. draining: from the
        stop request until the container stopped.

    LifecycleStage:
      type: object
      required: [stage, started_at]
      properties:
        stage: { $ref: "#/components/schemas/LifecycleStageKind" }
        started_at: { type: string, format: date-time }
        finished_at:
          description: Absent while the stage runs.
          type: string
          format: date-time
        duration_ms:
          description: Until finished_at, or until now while the stage runs.
          type: integer
          format: int64
        cached:
          description: For image, the image was already on the host.
          type: boolean

    ContainerLifecycle:
      type: object
      required: [container_id, state, created_at, stages]
      properties:
        container_id: { type: string, format: uuid }
        app: { $ref: "#/components/schemas/AppName" }
        function: { $ref: "#/components/schemas/WorkloadName" }
        state: { $ref: "#/components/schemas/ContainerState" }
        stop_reason: { $ref: "#/components/schemas/StopReason" }
        exit_message: { type: string }
        host:
          description: The name of the host the container was placed on.
          type: string
        created_at: { type: string, format: date-time }
        assigned_at: { type: string, format: date-time }
        ready_at: { type: string, format: date-time }
        stopped_at: { type: string, format: date-time }
        stages:
          description: In the order they began.
          type: array
          items: { $ref: "#/components/schemas/LifecycleStage" }

    ContainerLifecyclesRequest:
      type: object
      required: [container_ids]
      properties:
        container_ids:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string, format: uuid }

    ContainerLifecycleList:
      type: object
      required: [lifecycles]
      properties:
        lifecycles:
          type: array
          items: { $ref: "#/components/schemas/ContainerLifecycle" }

    CallGraphNode:
      type: object
      required: [task_id, app, function, status, created_at, depends_on]
      properties:
        task_id: { type: string, format: uuid }
        parent_task_id: { type: string, format: uuid }
        app: { $ref: "#/components/schemas/AppName" }
        function: { $ref: "#/components/schemas/WorkloadName" }
        status: { $ref: "#/components/schemas/TaskStatus" }
        container_id:
          description: The container of the latest attempt.
          type: string
          format: uuid
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        depends_on:
          description: Upstream tasks whose results this task's input uses.
          type: array
          items: { type: string, format: uuid }

    TaskCallGraph:
      type: object
      required: [root_task_id, nodes, truncated]
      properties:
        root_task_id: { type: string, format: uuid }
        nodes:
          description: Every task of the graph, oldest first; parents precede their children.
          type: array
          items: { $ref: "#/components/schemas/CallGraphNode" }
        truncated:
          description: The graph holds more than the 2,000 tasks returned.
          type: boolean

    TaskStatusCounts:
      type: object
      required: [queued, running, succeeded, failed, cancelled]
      properties:
        queued: { type: integer }
        running: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        cancelled: { type: integer }

    PerformanceBucket:
      type: object
      required: [timestamp, count, cold_starts, status_counts]
      properties:
        timestamp: { type: string, format: date-time }
        count:
          description: Finished tasks with a run time.
          type: integer
        p50_ms: { type: number, format: double }
        p95_ms: { type: number, format: double }
        cold_starts: { type: integer }
        status_counts: { $ref: "#/components/schemas/TaskStatusCounts" }

    WorkloadPerformance:
      type: object
      required: [workload_id, window_seconds, start, end, buckets]
      properties:
        workload_id: { type: string, format: uuid }
        window_seconds: { type: integer }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        buckets:
          type: array
          items: { $ref: "#/components/schemas/PerformanceBucket" }

    TaskMetrics:
      type: object
      required: [start, end, total, status_counts, failure_rate]
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        total: { type: integer }
        status_counts: { $ref: "#/components/schemas/TaskStatusCounts" }
        failure_rate:
          description: Failed tasks over all tasks; 0 without tasks.
          type: number
          format: double
        average_runtime_ms: { type: number, format: double }
        runtime_ms_p50: { type: number, format: double }
        runtime_ms_p95: { type: number, format: double }
        runtime_ms_p99: { type: number, format: double }
        startup_ms_p50:
          description: From submission to the start of the first attempt.
          type: number
          format: double
        startup_ms_p95: { type: number, format: double }

    ActivityBucket:
      type: object
      required: [timestamp, status_counts]
      properties:
        timestamp: { type: string, format: date-time }
        status_counts: { $ref: "#/components/schemas/TaskStatusCounts" }

    ActivitySeries:
      type: object
      required: [app, total, buckets]
      properties:
        app: { $ref: "#/components/schemas/AppName" }
        app_id: { type: string, format: uuid }
        function:
          description: Set when the activity was asked for one app.
          allOf: [{ $ref: "#/components/schemas/WorkloadName" }]
        total: { type: integer }
        buckets:
          type: array
          items: { $ref: "#/components/schemas/ActivityBucket" }

    TaskActivity:
      type: object
      required: [window_seconds, start, end, series]
      properties:
        window_seconds: { type: integer }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        series:
          description: Series with tasks in the range, most tasks first.
          type: array
          items: { $ref: "#/components/schemas/ActivitySeries" }

    ContainerCounts:
      type: object
      required: [pending, running]
      properties:
        pending:
          description: Waiting for a host or starting.
          type: integer
        running:
          description: Ready or draining.
          type: integer

    ConcurrencyLimits:
      type: object
      required: [max_cpu_containers, max_gpus]
      properties:
        max_cpu_containers: { type: integer }
        max_gpus: { type: integer }

    Concurrency:
      description: Live containers in the workspaces the caller owns, which plan limits apply to.
      type: object
      required: [cpu_containers, gpus]
      properties:
        cpu_containers: { type: integer }
        gpus: { type: integer }
        limits:
          description: Absent while the account's plan limits are unknown.
          allOf: [{ $ref: "#/components/schemas/ConcurrencyLimits" }]

    AccountMetrics:
      type: object
      required: [containers, concurrency]
      properties:
        containers:
          description: Live containers in every workspace the caller is a member of.
          allOf: [{ $ref: "#/components/schemas/ContainerCounts" }]
        concurrency: { $ref: "#/components/schemas/Concurrency" }

    ActivityMeasure:
      type: string
      enum: [containers, tasks, cpu, memory, gpu]
      default: containers

    ActivityUnit:
      type: string
      enum: [starts, cores, gibibytes, gpus]

    ActivitySeriesKind:
      description: other folds the series past the limit; unassigned holds containers of no app, such as image builds.
      type: string
      enum: [app, unassigned, other]

    ActivityPoint:
      type: object
      required: [timestamp, value]
      properties:
        timestamp: { type: string, format: date-time }
        value: { type: number, format: double }

    AccountActivitySeries:
      type: object
      required: [kind, total, buckets]
      properties:
        kind: { $ref: "#/components/schemas/ActivitySeriesKind" }
        workspace: { $ref: "#/components/schemas/Name" }
        app: { $ref: "#/components/schemas/AppName" }
        app_id: { type: string, format: uuid }
        total:
          description: Starts in the range, or the average allocation over it.
          type: number
          format: double
        buckets:
          type: array
          items: { $ref: "#/components/schemas/ActivityPoint" }

    AccountActivity:
      type: object
      required: [measure, unit, window_seconds, start, end, total, series]
      properties:
        measure: { $ref: "#/components/schemas/ActivityMeasure" }
        unit: { $ref: "#/components/schemas/ActivityUnit" }
        window_seconds: { type: integer }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        total: { type: number, format: double }
        series:
          type: array
          items: { $ref: "#/components/schemas/AccountActivitySeries" }

    # Compute

    GpuType:
      description: >-
        A GPU model, or any for whatever model has capacity. A100 is not a
        model: name A100-40 or A100-80.
      type: string
      enum: [T4, A10G, L4, L40S, A100-40, A100-80, H100, H200, any]

    Region:
      description: >-
        A product region. Only us-east (us-east-2, then us-east-1) and
        us-west (us-west-1, then us-west-2) have capacity; the others are
        accepted and wait for capacity that never comes.
      type: string
      enum: [us-east, us-west, eu-central, eu-north, ap-southeast]

    Placement:
      description: Where a workload's containers may run.
      type: object
      properties:
        machine:
          description: A joined machine of the workspace the workload must run on.
          type: string
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
        region: { $ref: "#/components/schemas/Region" }
        availability_zone:
          description: An AWS zone id such as use2-az1, or a name such as us-east-2a.
          type: string
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
        preemptible:
          description: Allow capacity the provider can reclaim.
          type: boolean
          default: true

    MachineLifecycle:
      type: string
      enum: [requested, provisioning, booting, joining, ready, draining, stopping, stopped, resuming, terminating, deleted, failed]

    MachineFailure:
      type: string
      enum:
        - agent_download_failed
        - runtime_install_failed
        - network_join_failed
        - provider_identity_failed
        - agent_enrollment_failed
        - worker_image_pull_failed
        - worker_start_failed
        - worker_readiness_failed
        - bootstrap_timed_out
        - host_preflight_failed
        - service_lost
        - machine_record_deleted
        - provider_stopped
        - provider_terminated
        - unknown

    CapacityState:
      type: string
      enum: [available, draining, preempting, cordoned]

    PreflightCheck:
      type: object
      required: [name, ok, message, severity, remediation]
      properties:
        name: { type: string }
        ok: { type: boolean }
        message: { type: string }
        severity: { type: string, enum: [info, warning, error] }
        remediation: { type: string }

    Machine:
      type: object
      required: [id, name, workspaces, placement, provider, lifecycle, lifecycle_message, lifecycle_at,
                 cpu, memory, gpu, gpu_count, connected, schedulable, capacity_state, capacity_reason,
                 preflight_checks, remediation, agent_version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        workspaces:
          description: Names of the workspaces the machine serves.
          type: array
          items: { type: string }
        placement:
          description: machine:<id>
          type: string
        provider:
          type: string
          enum: [agent]
          x-enum-varnames: [MachineAgent]
        lifecycle: { $ref: "#/components/schemas/MachineLifecycle" }
        lifecycle_message: { type: string }
        lifecycle_failure: { $ref: "#/components/schemas/MachineFailure" }
        lifecycle_at: { type: string, format: date-time }
        cpu:
          description: Offered CPU in millicores.
          type: integer
          format: int64
        memory:
          description: Offered memory in MiB.
          type: integer
          format: int64
        gpu: { type: string }
        gpu_count: { type: integer }
        connected:
          description: The agent's session is open and reported within the liveness timeout.
          type: boolean
        schedulable: { type: boolean }
        capacity_state: { $ref: "#/components/schemas/CapacityState" }
        capacity_reason: { type: string }
        preflight_checks:
          type: array
          items: { $ref: "#/components/schemas/PreflightCheck" }
        remediation:
          type: array
          items: { type: string }
        last_seen_at: { type: string, format: date-time }
        agent_version: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MachinePage:
      type: object
      required: [machines]
      properties:
        machines:
          type: array
          items: { $ref: "#/components/schemas/Machine" }
        next_cursor:
          description: Present when more machines follow.
          type: string

    MachineJoinRequest:
      type: object
      required: [name, workspaces]
      properties:
        name:
          description: The name workloads pin to with machine=; unique in the account.
          type: string
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
        workspaces:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/Name" }
        gpu:
          description: GPU models the machine contributes; the agent reports what it finds.
          type: array
          maxItems: 8
          items: { type: string, maxLength: 32 }
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 1800

    MachineJoinCommand:
      type: object
      required: [command, expires_at, machine]
      properties:
        command:
          description: A shell command that installs the agent and joins the host.
          type: string
        expires_at: { type: string, format: date-time }
        machine: { $ref: "#/components/schemas/Machine" }

    MachineUpdate:
      type: object
      required: [workspaces]
      properties:
        workspaces:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/Name" }

    ComputeInstance:
      type: object
      required: [id, placement, provider, region, availability_zone, instance_id, instance_type, lifecycle,
                 lifecycle_message, lifecycle_at, connected, capacity_state, capacity_reason, gpu_count,
                 cpu_millicores, memory_mb, launch_attempt, booted_template_version, created_at]
      properties:
        id: { type: string, format: uuid }
        placement:
          description: connection:<id>
          type: string
        provider:
          type: string
          enum: [aws]
          x-enum-varnames: [InstanceAws]
        region: { type: string }
        availability_zone: { type: string }
        instance_id: { type: string }
        instance_type: { type: string }
        market: { type: string, enum: [spot, on_demand] }
        lifecycle: { $ref: "#/components/schemas/MachineLifecycle" }
        lifecycle_message: { type: string }
        lifecycle_failure: { $ref: "#/components/schemas/MachineFailure" }
        lifecycle_at: { type: string, format: date-time }
        connected: { type: boolean }
        capacity_state: { $ref: "#/components/schemas/CapacityState" }
        capacity_reason: { type: string }
        gpu: { type: string }
        gpu_count: { type: integer }
        cpu_millicores: { type: integer, format: int64 }
        memory_mb: { type: integer, format: int64 }
        launch_attempt: { type: integer }
        booted_template_version:
          description: The agent release the instance runs.
          type: string
        launched_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    ComputeInstancePage:
      type: object
      required: [instances]
      properties:
        instances:
          type: array
          items: { $ref: "#/components/schemas/ComputeInstance" }
        next_cursor:
          type: string

    ComputeSummary:
      type: object
      required: [instances, cost, workload_count]
      properties:
        connection:
          description: The connected account the workspace lives in; absent on platform compute.
          type: object
          required: [account_id, phase]
          properties:
            account_id: { type: string }
            phase: { $ref: "#/components/schemas/AwsConnectionPhase" }
        instances:
          type: object
          required: [total, ready, pending, degraded]
          properties:
            total: { type: integer }
            ready: { type: integer }
            pending: { type: integer }
            degraded: { type: integer }
        cost:
          type: object
          required: [currency, estimated]
          properties:
            hourly_micros: { type: integer, format: int64 }
            daily_micros: { type: integer, format: int64 }
            currency: { type: string, enum: [USD] }
            estimated: { type: boolean }
        workload_count: { type: integer }

    ComputeWorkload:
      type: object
      required: [deployment_id, app, name, kind, machine, cpu_millicores, memory_mb, gpu, gpu_count]
      properties:
        deployment_id:
          description: The workload id.
          type: string
          format: uuid
        app: { type: string }
        name: { type: string }
        kind: { $ref: "#/components/schemas/WorkloadKind" }
        machine:
          description: The machine the workload is pinned to; empty when unpinned.
          type: string
        cpu_millicores: { type: integer, format: int64 }
        memory_mb: { type: integer, format: int64 }
        gpu:
          type: array
          items: { $ref: "#/components/schemas/GpuType" }
        gpu_count: { type: integer }

    ComputeWorkloadPage:
      type: object
      required: [workloads]
      properties:
        workloads:
          type: array
          items: { $ref: "#/components/schemas/ComputeWorkload" }
        next_cursor:
          type: string

    AwsConnectionPhase:
      type: string
      enum: [awaiting_authorization, validating, ready, degraded, reconnect_pending, retiring_authorization,
             disconnect_draining, revoking, verifying_revocation, action_required]

    AwsConnectionAction:
      type: string
      enum: [authorize, validate, reconnect, cancel_reconnect, remove, retry]
      x-enum-varnames: [AwsAuthorize, AwsValidate, AwsReconnect, AwsCancelReconnect, AwsRemove, AwsRetry]

    AwsAuthorizationPhase:
      type: string
      enum: [awaiting_authorization, validating, ready, degraded, retiring, retired]

    AwsAuthorizationError:
      type: string
      enum: [assume_role_denied, external_id_not_enforced, account_mismatch, permission_drift, stack_drift,
             upstream_unavailable]

    AwsAuthorizationGeneration:
      type: object
      required: [generation, authorization_mode, phase, created_at, updated_at]
      properties:
        generation: { type: integer }
        authorization_mode: { type: string, enum: [managed_stack, existing_role] }
        managed_authorization:
          type: object
          required: [stack_name, region, generation, template_version, template_sha256]
          properties:
            stack_name: { type: string }
            region: { type: string }
            generation: { type: integer }
            stack_id: { type: string }
            template_version: { type: string }
            template_sha256: { type: string }
        phase: { $ref: "#/components/schemas/AwsAuthorizationPhase" }
        last_validation_started_at: { type: string, format: date-time }
        last_validated_at: { type: string, format: date-time }
        error_code: { $ref: "#/components/schemas/AwsAuthorizationError" }
        error_message: { type: string, maxLength: 512 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AwsStackParameter:
      type: object
      required: [ParameterKey, ParameterValue]
      properties:
        ParameterKey: { type: string }
        ParameterValue: { type: string }

    AwsStackAction:
      description: A CloudFormation CreateStack request the customer submits with their own credentials.
      type: object
      required: [account_id, region, template_sha256, request]
      properties:
        account_id: { type: string }
        region: { type: string }
        template_sha256: { type: string }
        request:
          type: object
          required: [StackName, TemplateBody, Parameters, Capabilities, OnFailure]
          properties:
            StackName: { type: string }
            TemplateBody: { type: string, maxLength: 51200 }
            Parameters:
              type: array
              items: { $ref: "#/components/schemas/AwsStackParameter" }
            Capabilities:
              type: array
              items: { type: string, enum: [CAPABILITY_NAMED_IAM] }
            OnFailure: { type: string, enum: [DELETE] }

    AwsCustomerAction:
      type: object
      required: [label]
      properties:
        url: { type: string }
        stack: { $ref: "#/components/schemas/AwsStackAction" }
        label: { type: string }

    AwsConnection:
      type: object
      required: [id, account_id, phase, revision, hosts_workloads, can_manage_existing_capacity,
                 available_actions, detail, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        account_id:
          description: The 12-digit AWS account id.
          type: string
        phase: { $ref: "#/components/schemas/AwsConnectionPhase" }
        revision: { type: integer }
        hosts_workloads:
          description: New workloads can be placed in the account.
          type: boolean
        can_manage_existing_capacity: { type: boolean }
        available_actions:
          type: array
          items: { $ref: "#/components/schemas/AwsConnectionAction" }
        detail: { type: string }
        customer_action: { $ref: "#/components/schemas/AwsCustomerAction" }
        next_retry_at: { type: string, format: date-time }
        active_authorization: { $ref: "#/components/schemas/AwsAuthorizationGeneration" }
        pending_authorization: { $ref: "#/components/schemas/AwsAuthorizationGeneration" }
        retiring_authorization: { $ref: "#/components/schemas/AwsAuthorizationGeneration" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AwsConnectionEnvelope:
      type: object
      properties:
        connection: { $ref: "#/components/schemas/AwsConnection" }

    AwsNetwork:
      type: object
      required: [vpc_id, subnet_ids, security_group_id]
      additionalProperties: false
      properties:
        vpc_id: { type: string, minLength: 1, maxLength: 128 }
        subnet_ids:
          type: array
          minItems: 2
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 128 }
        security_group_id: { type: string, minLength: 1, maxLength: 128 }

    AwsConnectionRequest:
      type: object
      required: [account_id]
      additionalProperties: false
      properties:
        account_id:
          type: string
          pattern: "^[0-9]{12}$"
        role_arn:
          description: An existing role to assume; it must require the external ID.
          type: string
          pattern: "^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]{1,512}$"
        networks:
          description: Per-region VPC, subnets and security group for an existing role.
          type: object
          additionalProperties: { $ref: "#/components/schemas/AwsNetwork" }
        external_id:
          description: The external ID an existing role already requires.
          type: string
          minLength: 16
          maxLength: 1224

    AwsReconnectRequest:
      type: object
      additionalProperties: false
      properties:
        role_arn:
          type: string
          pattern: "^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]{1,512}$"

    AwsConnectionAuthorization:
      type: object
      required: [connection, authorization]
      properties:
        connection: { $ref: "#/components/schemas/AwsConnection" }
        authorization:
          type: object
          properties:
            stack: { $ref: "#/components/schemas/AwsStackAction" }
            external_id: { type: string }

    FleetCapacity:
      type: object
      required: [cpu_millicores, memory_mib, gpu_count]
      properties:
        cpu_millicores: { type: integer, format: int64 }
        memory_mib: { type: integer, format: int64 }
        gpu_count: { type: integer }

    FleetState:
      description: >-
        A host's place in the fleet. preparing is a host becoming a stopped
        reserve, bought for one or refreshing; stopping is on its way there.
        stopped, hibernate_unverified and image_saved are stopped reserves:
        a plain stop, a hibernation whose saved memory is not yet proven,
        and one proven saved. starting covers a launch and a resume to serve.
      type: string
      enum: [serving, starting, draining, preparing, stopping, unavailable, failed, terminating, stopped,
             hibernate_unverified, image_saved]
      x-enum-varnames: [FleetServing, FleetStarting, FleetDraining, FleetPreparing, FleetStopping, FleetUnavailable,
                        FleetFailed, FleetTerminating, FleetStopped, FleetHibernateUnverified, FleetImageSaved]

    FleetStateCapacity:
      type: object
      required: [state, machines, capacity, allocated]
      properties:
        state: { $ref: "#/components/schemas/FleetState" }
        machines: { type: integer }
        capacity: { $ref: "#/components/schemas/FleetCapacity" }
        allocated: { $ref: "#/components/schemas/FleetCapacity" }

    FleetMarket:
      type: object
      required: [preemptible, gpu_type, warm_free, warm_target, reserve_ready, reserve_target, allocated, states, reason]
      properties:
        preemptible: { type: boolean }
        gpu_type:
          description: Empty for CPU hosts.
          type: string
        warm_free:
          description: Unreserved capacity on serving hosts.
          allOf: [{ $ref: "#/components/schemas/FleetCapacity" }]
        warm_target:
          description: The idle capacity the headroom floor keeps.
          allOf: [{ $ref: "#/components/schemas/FleetCapacity" }]
        reserve_ready:
          description: Stopped reserves prepared for the agent release they should run.
          allOf: [{ $ref: "#/components/schemas/FleetCapacity" }]
        reserve_target:
          description: The stopped reserve capacity the plan keeps.
          allOf: [{ $ref: "#/components/schemas/FleetCapacity" }]
        allocated:
          description: Reservations of live containers on the market's hosts.
          allOf: [{ $ref: "#/components/schemas/FleetCapacity" }]
        states:
          type: array
          items: { $ref: "#/components/schemas/FleetStateCapacity" }
        reason:
          description: Why the market cannot grow, when it cannot.
          type: string

    FleetSummary:
      type: object
      required: [observed_at]
      properties:
        observed_at: { type: string, format: date-time }
        plan:
          type: object
          required: [generated_at, expires_at, markets]
          properties:
            generated_at: { type: string, format: date-time }
            expires_at: { type: string, format: date-time }
            markets:
              type: array
              items: { $ref: "#/components/schemas/FleetMarket" }
        release:
          description: The agent release platform hosts move to.
          type: object
          required: [version, generation, complete, phases, pending_capacity_owners]
          properties:
            version: { type: string }
            generation: { type: integer }
            complete:
              description: Every connected platform host runs the release.
              type: boolean
            phases:
              type: object
              additionalProperties: { type: integer }
            pending_capacity_owners: { type: integer }

    FleetNode:
      type: object
      required: [id, provider, region, instance_type, preemptible, gpu_type, state, capacity, allocated,
                 containers, ready]
      properties:
        id: { type: string, format: uuid }
        machine_id:
          description: Set once the host enrolled.
          type: string
        instance_id: { type: string }
        provider:
          type: string
          enum: [agent, aws]
          x-enum-varnames: [FleetNodeAgent, FleetNodeAws]
        region: { type: string }
        instance_type: { type: string }
        preemptible: { type: boolean }
        gpu_type: { type: string }
        state: { $ref: "#/components/schemas/FleetState" }
        capacity: { $ref: "#/components/schemas/FleetCapacity" }
        allocated: { $ref: "#/components/schemas/FleetCapacity" }
        containers: { type: integer }
        ready:
          description: Serving and on the target agent release.
          type: boolean

    FleetNodePage:
      type: object
      required: [nodes, observed_at]
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/FleetNode" }
        next_cursor: { type: string }
        observed_at: { type: string, format: date-time }

    # Billing

    PlanId:
      type: string
      enum: [free, team, business]

    TermsVersion:
      description: The published terms of a plan; a change names the exact terms chosen.
      type: string
      enum: [free-v2, team-v3, business-v2]

    BillingOwner:
      description: >-
        Who pays for the machine a container ran on: the platform's fleet
        bills catalog rates, a connected cloud account a management fee, and
        self-hosted machines nothing.
      type: string
      enum: [platform_fleet, connected_cloud, self_hosted]

    RateClass:
      type: string
      enum: [auto, pinned, non_preemptible, pinned_non_preemptible]

    PlanEntitlements:
      type: object
      required:
        - max_concurrent_cpu_containers
        - max_concurrent_gpus
        - gpu_types
        - connected_cloud
        - custom_domains
        - self_hosted
        - retention_days
        - region_selection
        - max_workspace_disk_gib
      properties:
        max_concurrent_cpu_containers: { type: integer }
        max_concurrent_gpus: { type: integer }
        gpu_types:
          description: The GPU models the account may ask for.
          type: array
          items: { type: string }
        max_workspaces:
          description: Absent when unlimited.
          type: integer
        max_members:
          description: People in the account's workspaces, owner included; absent if unlimited.
          type: integer
        connected_cloud: { type: boolean }
        custom_domains: { type: boolean }
        self_hosted: { type: boolean }
        retention_days:
          description: Log and artifact retention.
          type: integer
        region_selection: { type: boolean }
        max_workspace_disk_gib:
          description: Declared disk size one workspace may hold; 0 is no disks.
          type: integer

    PublishedPlan:
      type: object
      required: [id, terms_version, name, summary, monthly_nanos, included_nanos, entitlements, terms]
      properties:
        id: { $ref: "#/components/schemas/PlanId" }
        terms_version: { $ref: "#/components/schemas/TermsVersion" }
        name: { type: string }
        summary: { type: string }
        monthly_nanos: { type: integer, format: int64 }
        included_nanos:
          description: Usage credit each month.
          type: integer
          format: int64
        entitlements: { $ref: "#/components/schemas/PlanEntitlements" }
        terms:
          type: array
          items: { type: string }

    ShapeRate:
      type: object
      required: [billing_owner, nanos_per_container_hour, nanos_per_cpu_core_hour, nanos_per_memory_gib_hour]
      properties:
        billing_owner: { $ref: "#/components/schemas/BillingOwner" }
        nanos_per_container_hour: { type: integer, format: int64 }
        nanos_per_cpu_core_hour: { type: integer, format: int64 }
        nanos_per_memory_gib_hour: { type: integer, format: int64 }

    GpuRate:
      type: object
      required: [gpu_type, nanos_per_card_hour]
      properties:
        gpu_type: { type: string }
        nanos_per_card_hour: { $ref: "#/components/schemas/CardRates" }

    CardRates:
      description: What one card costs an hour on each kind of capacity.
      type: object
      required: [platform_fleet, connected_cloud, self_hosted]
      properties:
        platform_fleet: { type: integer, format: int64 }
        connected_cloud: { type: integer, format: int64 }
        self_hosted: { type: integer, format: int64 }

    ComputeRate:
      type: object
      required:
        - billing_owner
        - nanos_per_container_hour
        - nanos_per_cpu_core_hour
        - nanos_per_memory_gib_hour
        - nanos_per_gpu_card_hour
      properties:
        billing_owner: { $ref: "#/components/schemas/BillingOwner" }
        gpu_type:
          description: Absent for containers without a GPU.
          type: string
        nanos_per_container_hour: { type: integer, format: int64 }
        nanos_per_cpu_core_hour: { type: integer, format: int64 }
        nanos_per_memory_gib_hour: { type: integer, format: int64 }
        nanos_per_gpu_card_hour: { type: integer, format: int64 }

    PlacementRate:
      type: object
      required:
        - rate_class
        - effective_at
        - pinned
        - preemptible
        - name
        - cpu_memory_multiplier
        - gpu_multiplier
        - compute_rates
      properties:
        rate_class: { $ref: "#/components/schemas/RateClass" }
        effective_at: { type: string, format: date-time }
        pinned: { type: boolean }
        preemptible: { type: boolean }
        name: { type: string }
        cpu_memory_multiplier: { type: number }
        gpu_multiplier: { type: number }
        compute_rates:
          type: array
          items: { $ref: "#/components/schemas/ComputeRate" }

    TrialTerms:
      type: object
      required: [amount_nanos, duration_days, one_time]
      properties:
        amount_nanos: { type: integer, format: int64 }
        duration_days: { type: integer }
        one_time: { type: boolean }

    NoPaymentMethodTerms:
      description: The limits of an account without a saved card.
      type: object
      required: [max_concurrent_cpu_containers, max_concurrent_gpus, gpu_types]
      properties:
        max_concurrent_cpu_containers: { type: integer }
        max_concurrent_gpus: { type: integer }
        gpu_types:
          type: array
          items: { type: string }

    PlatformRate:
      type: object
      required: [nanos_per_egress_gib, nanos_per_volume_gib_month, storage_month_seconds]
      properties:
        nanos_per_egress_gib: { type: integer, format: int64 }
        nanos_per_volume_gib_month: { type: integer, format: int64 }
        storage_month_seconds: { type: integer }

    DiskRate:
      type: object
      required: [nanos_per_stored_gib_month, nanos_per_attached_gib_month]
      properties:
        nanos_per_stored_gib_month: { type: integer, format: int64 }
        nanos_per_attached_gib_month: { type: integer, format: int64 }

    CreditPurchaseTerms:
      type: object
      required: [minimum_cents, maximum_cents]
      properties:
        minimum_cents: { type: integer }
        maximum_cents: { type: integer }

    PricingCatalog:
      type: object
      required:
        - trial
        - pricing_version
        - metered_rates_effective_at
        - currency
        - connected_cloud_management_fee_percent
        - no_payment_method
        - plans
        - shape_rates
        - gpu_rates
        - platform_rate
        - placement_rates
        - credit_purchase
      properties:
        trial: { $ref: "#/components/schemas/TrialTerms" }
        pricing_version: { type: string }
        metered_rates_effective_at: { type: string, format: date-time }
        currency: { type: string }
        connected_cloud_management_fee_percent: { type: integer }
        no_payment_method: { $ref: "#/components/schemas/NoPaymentMethodTerms" }
        plans:
          type: array
          items: { $ref: "#/components/schemas/PublishedPlan" }
        shape_rates:
          description: Automatic placement rates for containers without a GPU.
          type: array
          items: { $ref: "#/components/schemas/ShapeRate" }
        gpu_rates:
          type: array
          items: { $ref: "#/components/schemas/GpuRate" }
        platform_rate: { $ref: "#/components/schemas/PlatformRate" }
        # Absent at an instant before disks were first priced.
        disk_rate: { $ref: "#/components/schemas/DiskRate" }
        placement_rates:
          type: array
          items: { $ref: "#/components/schemas/PlacementRate" }
        credit_purchase: { $ref: "#/components/schemas/CreditPurchaseTerms" }

    BillingStatus:
      description: past_due refuses new work until the card on file is updated.
      type: string
      enum: [active, past_due]

    BillingPlan:
      type: object
      required: [id, name, terms_version, monthly_nanos, included_nanos]
      properties:
        id: { $ref: "#/components/schemas/PlanId" }
        name: { type: string }
        terms_version: { $ref: "#/components/schemas/TermsVersion" }
        monthly_nanos: { type: integer, format: int64 }
        included_nanos: { type: integer, format: int64 }
        scheduled_terms_version: { $ref: "#/components/schemas/TermsVersion" }
        scheduled_change_at: { type: string, format: date-time }
        period_started_at:
          description: The subscription's billing period; absent on Free.
          type: string
          format: date-time
        period_ended_at: { type: string, format: date-time }

    EntitlementUsage:
      type: object
      required: [concurrent_cpu_containers, concurrent_gpus, workspaces, members, connected_clouds, custom_domains]
      properties:
        concurrent_cpu_containers: { type: integer }
        concurrent_gpus: { type: integer }
        workspaces: { type: integer }
        members: { type: integer }
        connected_clouds: { type: integer }
        custom_domains: { type: integer }

    UsageBudget:
      type: object
      required: [month_started_at, month_ended_at, spent_nanos]
      properties:
        month_started_at: { type: string, format: date-time }
        month_ended_at: { type: string, format: date-time }
        limit_nanos:
          description: Absent without a monthly usage limit.
          type: integer
          format: int64
        spent_nanos: { type: integer, format: int64 }
        available_nanos: { type: integer, format: int64 }

    BillingPreferences:
      type: object
      required: [reload_enabled, reload_threshold_cents, reload_amount_cents]
      properties:
        monthly_usage_limit_nanos:
          description: Stops new work once reached; resets monthly, UTC. Absent for none.
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        reload_enabled: { type: boolean }
        reload_threshold_cents: { type: integer, minimum: 0, maximum: 100000 }
        reload_amount_cents: { type: integer, minimum: 500, maximum: 100000 }

    ReloadPauseReason:
      type: string
      enum: [declined, action_required]

    AutomaticReload:
      type: object
      required: [month_started_at, month_ended_at, monthly_payment_committed_cents]
      properties:
        paused_purchase_id: { type: string, format: uuid }
        pause_reason: { $ref: "#/components/schemas/ReloadPauseReason" }
        pending_purchase_id: { type: string, format: uuid }
        month_started_at: { type: string, format: date-time }
        month_ended_at: { type: string, format: date-time }
        monthly_payment_committed_cents: { type: integer, format: int64 }

    BillingAccount:
      type: object
      required:
        - status
        - currency
        - plan
        - portal_available
        - payment_method_on_file
        - entitlements
        - usage
        - balance_nanos
        - usage_budget
        - preferences
        - automatic_reload
        - plan_change_pending
      properties:
        status: { $ref: "#/components/schemas/BillingStatus" }
        currency: { type: string }
        plan: { $ref: "#/components/schemas/BillingPlan" }
        portal_available:
          description: Stripe holds a customer for the account, so invoices can be shown.
          type: boolean
        payment_method_on_file: { type: boolean }
        complimentary_since:
          description: When an administrator waived the account's usage charges.
          type: string
          format: date-time
        # The limits the account is held to now: its plan's, reduced without
        # a saved card, or Business while complimentary.
        entitlements: { $ref: "#/components/schemas/PlanEntitlements" }
        usage: { $ref: "#/components/schemas/EntitlementUsage" }
        balance_nanos:
          description: Prepaid credit left; negative is usage the next credit covers first.
          type: integer
          format: int64
        usage_budget: { $ref: "#/components/schemas/UsageBudget" }
        preferences: { $ref: "#/components/schemas/BillingPreferences" }
        automatic_reload: { $ref: "#/components/schemas/AutomaticReload" }
        plan_change_pending:
          description: A plan change is waiting on Stripe's answer.
          type: boolean

    PlanChangeRequest:
      type: object
      required: [plan, terms_version]
      properties:
        plan: { $ref: "#/components/schemas/PlanId" }
        terms_version: { $ref: "#/components/schemas/TermsVersion" }

    HostedSessionRequest:
      type: object
      required: [return_url]
      properties:
        return_url:
          description: A dashboard page; other origins are refused.
          type: string
          minLength: 1
          maxLength: 2048
        cancel_url:
          description: Where to return on abandoning the page; defaults to return_url.
          type: string
          maxLength: 2048

    HostedSession:
      type: object
      required: [url]
      properties:
        url: { type: string }

    CreditPurchaseRequest:
      type: object
      required: [request_key, amount_cents, return_url]
      properties:
        request_key: { type: string, format: uuid }
        amount_cents: { type: integer, minimum: 500, maximum: 100000 }
        return_url: { type: string, minLength: 1, maxLength: 2048 }
        cancel_url: { type: string, maxLength: 2048 }

    CreditPaymentStatus:
      type: string
      enum: [pending, action_required, succeeded, declined, cancelled]

    CreditPurchase:
      type: object
      required: [id, kind, amount_nanos, status, reversed_nanos, created_at]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [manual, automatic]
        amount_nanos: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/CreditPaymentStatus" }
        checkout_url:
          description: Stripe Checkout, while the purchase is pending.
          type: string
        funded_at: { type: string, format: date-time }
        reversed_nanos:
          description: Refunded or disputed credit taken back.
          type: integer
          format: int64
        created_at: { type: string, format: date-time }

    ComplimentaryRequest:
      type: object
      required: [complimentary]
      properties:
        complimentary: { type: boolean }

    BillingAccountAdmin:
      description: >-
        One user as an administrator sees them. plan and status are absent
        for a user billing has no account for yet.
      type: object
      required: [user, payment_method_on_file, recent_cost_nanos, recent_cost_since]
      properties:
        user: { $ref: "#/components/schemas/User" }
        plan: { $ref: "#/components/schemas/PlanId" }
        status: { $ref: "#/components/schemas/BillingStatus" }
        payment_method_on_file: { type: boolean }
        complimentary_since: { type: string, format: date-time }
        recent_cost_nanos:
          description: Usage cost since recent_cost_since, waived or not.
          type: integer
          format: int64
        recent_cost_since: { type: string, format: date-time }

    BillingAccountAdminPage:
      type: object
      required: [accounts]
      properties:
        accounts:
          type: array
          items: { $ref: "#/components/schemas/BillingAccountAdmin" }
        next_cursor:
          description: Present when more accounts follow.
          type: string

    UsageCostGroup:
      type: string
      enum: [app, workload, task]
      default: app

    UsageCostCategory:
      description: >-
        Usage no app explains: image builds, and usage of resources outside
        any app.
      type: string
      enum: [image-build, disk, unattributed]

    UsageCostBucket:
      type: string
      enum: [hour, day]
      default: day

    BilledDimension:
      description: The invoice line a component rolls up into.
      type: string
      enum: [compute_runtime, network_egress, volume_storage, disk]

    UsageCostComponentKind:
      description: >-
        What a quantity counts: container_time in seconds, cpu in
        core-seconds, memory, volume_storage and disk in GiB-seconds, gpu in
        card-seconds, egress in GiB. A disk's cost includes its declared size
        while held.
      type: string
      enum: [container_time, cpu, memory, gpu, volume_storage, disk, egress]

    UsageCostComponent:
      type: object
      required: [dimension, component, quantity, cost_nanos]
      properties:
        dimension: { $ref: "#/components/schemas/BilledDimension" }
        component: { $ref: "#/components/schemas/UsageCostComponentKind" }
        quantity: { type: number }
        cost_nanos: { type: integer, format: int64 }

    UsageCostRow:
      description: >-
        One app, workload or task over the window. Every level carries the
        ids above it. A name is absent when its app or workload was deleted.
      type: object
      required: [workspace_id, cost_nanos, components]
      properties:
        workspace_id: { type: string, format: uuid }
        workspace_name: { type: string }
        app_id: { type: string, format: uuid }
        app_name: { type: string }
        workload_id: { type: string, format: uuid }
        workload_name: { type: string }
        workload_kind: { type: string }
        task_id: { type: string, format: uuid }
        disk_id: { type: string, format: uuid }
        disk_name:
          description: Absent when the disk was deleted.
          type: string
        category: { $ref: "#/components/schemas/UsageCostCategory" }
        cost_nanos: { type: integer, format: int64 }
        components:
          type: array
          items: { $ref: "#/components/schemas/UsageCostComponent" }

    UsageCostPage:
      type: object
      required: [start, end, currency, group_by, cost_nanos, rows]
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        currency: { type: string }
        group_by: { $ref: "#/components/schemas/UsageCostGroup" }
        cost_nanos:
          description: The whole window's cost, not the page's.
          type: integer
          format: int64
        rows:
          type: array
          items: { $ref: "#/components/schemas/UsageCostRow" }
        next_cursor:
          description: Present when more rows follow.
          type: string

    UsageCostInterval:
      type: object
      required: [started_at, ended_at, cost_nanos, dimensions]
      properties:
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        cost_nanos: { type: integer, format: int64 }
        dimensions:
          description: Only the invoice lines metered in the interval.
          type: array
          items: { $ref: "#/components/schemas/UsageCostDimension" }

    UsageCostDimension:
      type: object
      required: [dimension, cost_nanos]
      properties:
        dimension: { $ref: "#/components/schemas/BilledDimension" }
        cost_nanos: { type: integer, format: int64 }

    UsageCostSeries:
      type: object
      required: [start, end, currency, bucket, cost_nanos, subscription_credit_nanos, intervals]
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        currency: { type: string }
        bucket: { $ref: "#/components/schemas/UsageCostBucket" }
        cost_nanos: { type: integer, format: int64 }
        subscription_credit_nanos:
          description: Usage in the window that subscription credit covered.
          type: integer
          format: int64
        intervals:
          type: array
          items: { $ref: "#/components/schemas/UsageCostInterval" }

    # Workloads: pods, devboxes, sandboxes, shells and SSH.

    PodKind:
      description: A devbox is a pod reached over SSH whose root filesystem is a disk.
      type: string
      enum: [pod, devbox, sandbox]

    PodRole:
      type: string
      enum: [pod, devbox]

    PodSpec:
      description: >-
        Makes the workload run a command instead of a handler: a pod, a
        devbox or a sandbox. keep_warm_seconds is the idle time before a
        container stops; deploy fills 600 for pods and sandboxes and 1800 for
        devboxes.
      type: object
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/PodKind" }
        # Empty runs the image's own entrypoint and command; a devbox keeps
        # running without one.
        command:
          description: What the container runs.
          type: array
          maxItems: 1024
          items: { type: string, maxLength: 65536 }
        ports:
          description: Ports the command listens on, by name. A sandbox exposes them at start.
          type: object
          maxProperties: 32
          additionalProperties: { type: integer, minimum: 1, maximum: 65535 }
        tcp:
          description: Serve the first port as raw TCP behind TLS with SNI.
          type: boolean
          default: false
        # No schema default: a devbox's unset ssh resolves to true.
        ssh:
          description: Serve SSH through `lazycloud ssh`; always on for a devbox.
          type: boolean
        health_check:
          $ref: "#/components/schemas/HealthCheck"
        block_network:
          type: boolean
          default: false
        allow_list:
          description: The only outbound destinations, as CIDR ranges; wins over block_network.
          type: array
          maxItems: 10
          items: { type: string, maxLength: 64 }

    HealthCheck:
      description: An HTTP GET that must answer 2xx or 3xx before the container takes traffic.
      type: object
      required: [path]
      properties:
        path:
          type: string
          pattern: "^/[^\\s]*$"
          maxLength: 2048
        port:
          description: Defaults to the first port.
          type: integer
          minimum: 1
          maximum: 65535

    CheckpointSpec:
      description: >-
        Snapshot the first ready container's memory and start later ones
        from it. A pod is snapshotted once readiness_path on readiness_port
        answers.
      type: object
      properties:
        readiness_path:
          type: string
          pattern: "^/[^\\s]*$"
          maxLength: 2048
        readiness_port:
          type: integer
          minimum: 1
          maximum: 65535
        readiness_timeout_seconds:
          type: integer
          minimum: 1
          maximum: 3600
          default: 600
        readiness_interval_seconds:
          type: number
          minimum: 0.1
          maximum: 60
          default: 1

    DiskMountSpec:
      type: object
      required: [name, size_bytes, mount_path]
      properties:
        name: { $ref: "#/components/schemas/DiskName" }
        size_bytes:
          description: Whole 4096-byte blocks from 1 GiB to 1 TiB.
          type: integer
          format: int64
          minimum: 1073741824
          maximum: 1099511627776
        mount_path:
          description: An absolute path; a devbox's root disk mounts at /.
          type: string
          pattern: "^/"
          maxLength: 1024

    Scaling:
      description: The containers a pod keeps, from min to max; a scale sets both.
      type: object
      required: [min_containers, max_containers]
      properties:
        min_containers: { type: integer }
        max_containers: { type: integer }

    ScaleRequest:
      type: object
      required: [containers]
      properties:
        containers:
          type: integer
          minimum: 0
          maximum: 1000

    DevboxState:
      type: string
      enum: [running, starting, stopped]

    DevboxPhase:
      type: string
      enum: [stopped, queued, pulling_image, restoring_disk, starting, running, stopping, failed]

    Devbox:
      type: object
      required: [deployment_id, name, app, ssh_command, ssh_host, state, phase, open_connections]
      properties:
        deployment_id: { type: string, format: uuid }
        name: { $ref: "#/components/schemas/WorkloadName" }
        app: { $ref: "#/components/schemas/AppName" }
        ssh_command:
          description: The CLI command that connects, with --app when the name is shared.
          type: string
        ssh_host:
          description: The host `lazycloud ssh-config` writes for it.
          type: string
        state: { $ref: "#/components/schemas/DevboxState" }
        phase: { $ref: "#/components/schemas/DevboxPhase" }
        phase_reason:
          description: Why the last start failed.
          type: string
        container_id: { type: string, format: uuid }
        failed_container_id:
          description: The container whose start failed; its logs say why.
          type: string
          format: uuid
        open_connections: { type: integer }
        idle_deadline:
          description: When it stops if nothing connects; absent while connected or always on.
          type: string
          format: date-time
        disk: { $ref: "#/components/schemas/DevboxDisk" }
        resources: { $ref: "#/components/schemas/Resources" }

    DevboxDisk:
      type: object
      required: [name, size_bytes, stored_bytes, generation, status]
      properties:
        name: { $ref: "#/components/schemas/DiskName" }
        size_bytes: { type: integer, format: int64 }
        stored_bytes: { type: integer, format: int64 }
        generation: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/DiskStatus" }

    CreateInstanceRequest:
      description: Names a release, or a memory snapshot whose release the instance runs.
      type: object
      properties:
        release_id: { type: string, format: uuid }
        snapshot_id: { type: string, format: uuid }
        command:
          description: Run this instead of the pod's command.
          type: array
          maxItems: 1024
          items: { type: string, maxLength: 65536 }
        # Defaults to the release's keep_warm_seconds; -1 keeps the instance
        # up until it is stopped.
        timeout_seconds:
          description: Seconds the instance stays up without connections or calls.
          type: integer
          minimum: -1
          maximum: 604800
        # The container stops 30 seconds after the last shell closes.
        shell:
          description: Start an idle container of the release for shells.
          type: boolean
          default: false

    Instance:
      type: object
      required: [id, release_id, app, name, kind, state, created_at]
      properties:
        id: { type: string, format: uuid }
        release_id: { type: string, format: uuid }
        app: { $ref: "#/components/schemas/AppName" }
        name: { $ref: "#/components/schemas/WorkloadName" }
        kind: { $ref: "#/components/schemas/WorkloadKind" }
        state: { $ref: "#/components/schemas/ContainerState" }
        url:
          description: The first port's URL, when the instance has ports.
          type: string
        timeout_seconds:
          description: The idle lifetime; -1 is none.
          type: integer
        expires_at:
          description: When the instance stops unless something keeps it up.
          type: string
          format: date-time
        stop_reason: { $ref: "#/components/schemas/StopReason" }
        exit_message: { type: string }
        exit_code: { type: integer }
        created_at: { type: string, format: date-time }
        ready_at: { type: string, format: date-time }

    ProcessRequest:
      type: object
      required: [args]
      properties:
        args:
          type: array
          minItems: 1
          maxItems: 4096
          items: { type: string, maxLength: 131072 }
        cwd:
          type: string
          maxLength: 4096
          default: /workspace
        env:
          type: object
          maxProperties: 1024
          additionalProperties: { type: string, maxLength: 131072 }

    Process:
      description: >-
        exit_code is 128+N for a process signal N ended. Each stream keeps
        its first 256 KiB; truncated also marks output lost to the
        container's 64 MiB output budget or still being written one second
        after the exit.
      type: object
      required: [process_id, pid, command, running, stdout, stderr, stdout_truncated, stderr_truncated]
      properties:
        process_id: { type: string }
        pid: { type: integer }
        command: { type: string }
        cwd: { type: string }
        running: { type: boolean }
        exit_code: { type: integer }
        stdout: { type: string }
        stderr: { type: string }
        stdout_truncated: { type: boolean }
        stderr_truncated: { type: boolean }
        expires_at:
          description: When an exited process's result is forgotten.
          type: string
          format: date-time

    ProcessSummary:
      type: object
      required: [process_id, pid, command, running]
      properties:
        process_id: { type: string }
        pid: { type: integer }
        command: { type: string }
        cwd: { type: string }
        running: { type: boolean }
        exit_code: { type: integer }

    ProcessList:
      type: object
      required: [processes]
      properties:
        processes:
          type: array
          items: { $ref: "#/components/schemas/ProcessSummary" }

    KillRequest:
      type: object
      properties:
        signal:
          type: string
          enum: [TERM, KILL, INT, HUP, QUIT, USR1, USR2]
          x-enum-varnames: [SignalTERM, SignalKILL, SignalINT, SignalHUP, SignalQUIT, SignalUSR1, SignalUSR2]
          default: TERM

    ContainerFile:
      type: object
      required: [name, mode, size, owner, group, is_dir, permissions]
      properties:
        name: { type: string }
        mode:
          description: The raw st_mode, file type bits included.
          type: integer
          format: int64
        size: { type: integer, format: int64 }
        mod_time: { type: string, format: date-time }
        owner:
          description: The owner's uid.
          type: string
        group:
          description: The group's gid.
          type: string
        is_dir: { type: boolean }
        permissions:
          description: The permission bits, mode & 0777.
          type: integer

    ContainerFileList:
      type: object
      required: [files, truncated]
      properties:
        files:
          type: array
          items: { $ref: "#/components/schemas/ContainerFile" }
        truncated:
          description: Only the first limit entries by name are listed.
          type: boolean

    FindInFilesRequest:
      type: object
      required: [path, pattern]
      properties:
        path: { type: string, minLength: 1, maxLength: 4096 }
        pattern: { type: string, minLength: 1, maxLength: 65536 }

    FileMatch:
      type: object
      required: [path, line, column, text]
      properties:
        path: { type: string }
        line:
          description: 1-based.
          type: integer
        column:
          description: 1-based, in characters.
          type: integer
        text: { type: string }

    FileMatches:
      type: object
      required: [matches, truncated]
      properties:
        matches:
          type: array
          items: { $ref: "#/components/schemas/FileMatch" }
        truncated:
          description: The search stopped at 10,000 matches.
          type: boolean

    ReplaceInFilesRequest:
      type: object
      required: [path, pattern, replacement]
      properties:
        path: { type: string, minLength: 1, maxLength: 4096 }
        pattern: { type: string, minLength: 1, maxLength: 65536 }
        replacement: { type: string, maxLength: 65536 }

    ReplacedFiles:
      type: object
      required: [files, replacements]
      properties:
        files:
          description: Files that changed.
          type: integer
        replacements: { type: integer }

    ExposePortRequest:
      type: object
      required: [port]
      properties:
        port: { type: integer, minimum: 1, maximum: 65535 }

    ContainerPort:
      type: object
      required: [port, url]
      properties:
        port: { type: integer }
        url: { type: string }

    ContainerPortList:
      type: object
      required: [ports]
      properties:
        ports:
          type: array
          items: { $ref: "#/components/schemas/ContainerPort" }

    NetworkPolicy:
      type: object
      required: [block_network, allow_list]
      properties:
        block_network: { type: boolean }
        allow_list:
          description: IPv4 or IPv6 CIDR ranges.
          type: array
          maxItems: 10
          items: { type: string, maxLength: 64 }

    TtlRequest:
      type: object
      required: [ttl]
      properties:
        ttl:
          type: integer
          minimum: -1
          maximum: 604800

    Ttl:
      type: object
      required: [ttl]
      properties:
        ttl: { type: integer }
        expires_at: { type: string, format: date-time }

    SnapshotRequest:
      type: object
      properties:
        snapshot_id:
          description: The id the snapshot takes; a new one by default.
          type: string
          format: uuid

    MemorySnapshotState:
      type: string
      enum: [pending, available, failed]

    MemorySnapshot:
      type: object
      required: [id, container_id, release_id, state, created_at]
      properties:
        id: { type: string, format: uuid }
        container_id: { type: string, format: uuid }
        release_id: { type: string, format: uuid }
        state: { $ref: "#/components/schemas/MemorySnapshotState" }
        failure: { type: string }
        size_bytes: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }

    FilesystemImage:
      type: object
      required: [image_id]
      properties:
        image_id: { $ref: "#/components/schemas/ImageId" }

    SandboxStatus:
      type: string
      enum: [pending, running, stopping, stopped, failed]

    Sandbox:
      type: object
      required: [id, release_id, app, name, status, created_at, gpu]
      properties:
        id:
          description: The sandbox's container id, which `Sandbox.connect` takes.
          type: string
          format: uuid
        release_id: { type: string, format: uuid }
        app: { $ref: "#/components/schemas/AppName" }
        name: { $ref: "#/components/schemas/WorkloadName" }
        status: { $ref: "#/components/schemas/SandboxStatus" }
        gpu:
          type: array
          items: { $ref: "#/components/schemas/GpuType" }
        created_at: { type: string, format: date-time }
        ready_at: { type: string, format: date-time }
        stopped_at: { type: string, format: date-time }
        time_to_started_ms: { type: integer, format: int64 }
        lifetime_ms: { type: integer, format: int64 }

    SandboxPage:
      type: object
      required: [sandboxes]
      properties:
        sandboxes:
          type: array
          items: { $ref: "#/components/schemas/Sandbox" }
        next_cursor: { type: string }

    SandboxStats:
      type: object
      required: [concurrent, total_created, rate_per_second, status_counts, created_buckets]
      properties:
        concurrent:
          description: Sandboxes pending, running or stopping.
          type: integer
        total_created: { type: integer }
        rate_per_second:
          description: Sandboxes created in the last 24 hours, per second.
          type: number
        status_counts:
          type: object
          additionalProperties: { type: integer }
        created_buckets:
          description: Sandboxes created per UTC day, for the last 30 days.
          type: array
          items: { $ref: "#/components/schemas/SandboxCreatedBucket" }

    SandboxCreatedBucket:
      type: object
      required: [timestamp, count]
      properties:
        timestamp: { type: string, format: date-time }
        count: { type: integer }

    SshCertificateRequest:
      type: object
      required: [public_key]
      properties:
        public_key:
          description: An ssh-ed25519 public key line.
          type: string
          pattern: "^ssh-ed25519 "
          maxLength: 4096

    SshCertificate:
      type: object
      required: [certificate, principal, expires_at]
      properties:
        certificate:
          description: The OpenSSH certificate line.
          type: string
        principal: { type: string }
        expires_at: { type: string, format: date-time }

    SshHost:
      type: object
      required: [app, pod, role, deployment_id, alias, host_public_key]
      properties:
        app: { $ref: "#/components/schemas/AppName" }
        pod: { $ref: "#/components/schemas/WorkloadName" }
        role: { $ref: "#/components/schemas/PodRole" }
        deployment_id: { type: string, format: uuid }
        alias:
          description: lazycloud-<workspace>-<app>-<pod>, lowercased with other characters as -.
          type: string
        host_public_key:
          description: The pod's ssh-ed25519 host key, for known_hosts.
          type: string

    SshHostPage:
      type: object
      required: [hosts]
      properties:
        hosts:
          type: array
          items: { $ref: "#/components/schemas/SshHost" }
        next_cursor: { type: string }
