syntax = "proto3";

package lazycloud.imagefs.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/AmbientWare/lazycloud/internal/imagefs/imagefsproto";

// LayerSources tells a host's snapshotter where to read the layers it may
// mount. It is served on the snapshotter's local socket. The agent grants
// every layer of an image before it pulls the image, and again before the
// URLs expire for as long as a container on the host uses the layer.
service LayerSources {
  // Grant records the read URLs of layers. A FUSE read cannot be told apart
  // by container, so a Grant, Prefetch or StartTrace that names a layer of a
  // running trace under another name marks that trace incomplete. A Grant
  // with no name refreshes URLs and leaves traces as they are.
  rpc Grant(GrantRequest) returns (GrantResponse);
  // Prefetch fetches the frames an image's earlier containers read at
  // startup into the host's frame cache, in the order they were read, as
  // each layer mounts. It returns at once; the fetches run in the background
  // with bounded concurrency, behind the containers' own reads, until done,
  // StopPrefetch, or a layer not mounted soon after. A prefetch with the
  // name of a running one replaces it.
  rpc Prefetch(PrefetchRequest) returns (PrefetchResponse);
  // StopPrefetch ends the named prefetch, if it runs.
  rpc StopPrefetch(StopPrefetchRequest) returns (StopPrefetchResponse);
  // StartTrace records which frames of the named layers are read through
  // their mounts until EndTrace, or until it expires. A trace with the name
  // of a running one replaces it.
  rpc StartTrace(StartTraceRequest) returns (StartTraceResponse);
  // EndTrace stops a trace and returns the frames it recorded. An unknown or
  // expired name is NOT_FOUND.
  rpc EndTrace(EndTraceRequest) returns (EndTraceResponse);
}

// LayerGrant is the presigned read URLs of one converted layer.
message LayerGrant {
  // The layer's uncompressed digest, "sha256:<hex>".
  string diff_id = 1;
  // GET URLs of the layer's stored index and data objects. Data reads send
  // Range headers.
  string index_url = 2;
  string data_url = 3;
  // When the URLs stop working. A grant replaces the diff_id's current one
  // unless that expires later, and reads use the current one from their next
  // request on. Mounting a layer without an unexpired grant fails.
  google.protobuf.Timestamp expires_at = 4;
}

message GrantRequest {
  repeated LayerGrant layers = 1;
  // The container whose start the grants are for; empty for refreshes.
  string name = 2;
}

message GrantResponse {}

// FrameRead is one frame of a layer, in order of first read. layer indexes
// the layers of the request or response that carries it.
message FrameRead {
  uint32 layer = 1;
  uint32 frame = 2;
}

message PrefetchRequest {
  // The image's layers, base first, as diff_ids. Each needs a live grant
  // when its frames are fetched.
  repeated string layers = 1;
  repeated FrameRead reads = 2;
  // Names the prefetch, such as the container it starts.
  string name = 3;
}

message PrefetchResponse {}

message StopPrefetchRequest {
  string name = 1;
}

message StopPrefetchResponse {}

message StartTraceRequest {
  // Names the trace, such as the container it covers.
  string name = 1;
  // The image's layers, base first, as diff_ids.
  repeated string layers = 2;
}

message StartTraceResponse {}

message EndTraceRequest {
  string name = 1;
}

message EndTraceResponse {
  // The frames read, each the first time, in order; layer indexes the
  // StartTraceRequest's layers.
  repeated FrameRead reads = 1;
  // No layer was mounted when the trace started, so the page cache held
  // none of its bytes and every read reached the trace.
  bool complete = 2;
}

// DiskSources serves the published generations of a host's durable disks as
// read-only files. Each frame is read from the disk's store on first use,
// checked against its digest and kept in the frame cache image layers use.
// The disk engine stacks the disk's local writes on such a file.
service DiskSources {
  // GrantDisk records the credential the disk's frames are read with,
  // replacing the disk's current one unless that expires later.
  rpc GrantDisk(GrantDiskRequest) returns (GrantDiskResponse);
  // ServeDisk serves a generation and returns its file. Serving a served
  // generation again returns the same file.
  rpc ServeDisk(ServeDiskRequest) returns (ServeDiskResponse);
  // ReleaseDisk stops serving every generation of the disk but keep, 0 for
  // none. A file still open keeps reading.
  rpc ReleaseDisk(ReleaseDiskRequest) returns (ReleaseDiskResponse);
  // DiskReads returns the frames the disk read: its start trace and those
  // the cache holds now.
  rpc DiskReads(DiskReadsRequest) returns (DiskReadsResponse);
}

// DiskGrant reads the objects under disks/<disk id>/ of one bucket.
message DiskGrant {
  string endpoint = 1;
  string region = 2;
  string bucket = 3;
  bool force_path_style = 4;
  string access_key_id = 5;
  string secret_access_key = 6;
  string session_token = 7;
  google.protobuf.Timestamp expires_at = 8;
}

message GrantDiskRequest {
  string disk_id = 1;
  DiskGrant grant = 2;
}

message GrantDiskResponse {}

message ServeDiskRequest {
  string disk_id = 1;
  int64 generation = 2;
  // The sha256 of the generation's stored DiskIndex.
  string index_sha256 = 3;
  // The disk engine's copy of the index. A generation not yet served reads
  // it there, or when it is missing reads the stored index through the
  // disk's grant and writes it there.
  string index_path = 4;
  // Starts the disk's start trace and fetches the index's start_frames,
  // then its recent_frames, in the background, bounded by the cache's size
  // and a time limit. An attach sets it.
  bool prefetch = 5;
  // A directory of frames, each named by the hex sha256 of its bytes, on
  // the cache's volume, which the snapshotter moves into its cache before
  // the call returns, as a publish leaves the frames it stored.
  string frames_dir = 6;
}

message ServeDiskResponse {
  // The read-only file holding the generation's bytes.
  string path = 1;
}

message ReleaseDiskRequest {
  string disk_id = 1;
  int64 keep = 2;
}

message ReleaseDiskResponse {}

message DiskReadsRequest {
  string disk_id = 1;
}

message DiskReadsResponse {
  // The frames read in the first minute after the latest serve that
  // prefetched, in order of first read; empty until that minute has passed.
  repeated uint32 start_frames = 1;
  // The newest served generation's frames the cache holds, most recently
  // used first, at most as many as a prefetch fetches.
  repeated uint32 recent_frames = 2;
}
