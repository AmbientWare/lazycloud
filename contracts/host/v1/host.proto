syntax = "proto3";

package lazycloud.host.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/AmbientWare/lazycloud/internal/hostproto";

// HostService is the connection a host agent opens to the control plane. The
// agent dials out; every call except Enroll carries `authorization: Bearer
// <host token>` metadata. Session carries control messages only. Task inputs,
// results and logs travel on their own calls so large payloads never delay
// commands or presence.
service HostService {
  // Enroll exchanges a single-use join token, or a cloud instance's identity
  // proof, for a host identity.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  // Session is the host's control stream. The first HostMessage is Hello.
  // Commands are derived from durable state and resent after reconnect, so
  // hosts treat them as idempotent by container id.
  rpc Session(stream HostMessage) returns (stream ServerMessage);
  // ClaimTasks waits up to wait_seconds for queued tasks of a ready container.
  rpc ClaimTasks(ClaimTasksRequest) returns (ClaimTasksResponse);
  // CompleteTask records an attempt's outcome. A stale attempt returns
  // FAILED_PRECONDITION and the host discards the outcome.
  rpc CompleteTask(CompleteTaskRequest) returns (CompleteTaskResponse);
  // AppendLogs stores output lines in order per attempt.
  rpc AppendLogs(AppendLogsRequest) returns (AppendLogsResponse);

  // AcquireDisk takes the lease on a disk the container's release declares.
  // ABORTED means another container still holds it; the host retries.
  rpc AcquireDisk(AcquireDiskRequest) returns (AcquireDiskResponse);
  // RecordDiskGeneration records an uploaded generation under the lease. A
  // stale lease returns FAILED_PRECONDITION.
  rpc RecordDiskGeneration(RecordDiskGenerationRequest) returns (RecordDiskGenerationResponse);
  // RecordDiskCollection records the bytes a collection removed.
  rpc RecordDiskCollection(RecordDiskCollectionRequest) returns (RecordDiskCollectionResponse);
  // ReleaseDisk ends the lease after the final publish.
  rpc ReleaseDisk(ReleaseDiskRequest) returns (ReleaseDiskResponse);
  // ContainerAPI carries one public API request a container made through its
  // supervisor. The first APIRequest holds the head, later ones the body;
  // the host half-closes after the body. The server answers with the head,
  // then body chunks, and ends the stream after the last one.
  rpc ContainerAPI(stream APIRequest) returns (stream APIResponse);
  // CompleteImageBuild records the outcome of a build container's attempt.
  // A container that no longer runs the build returns FAILED_PRECONDITION.
  rpc CompleteImageBuild(CompleteImageBuildRequest) returns (CompleteImageBuildResponse);
  // AppendImageBuildLogs stores a build container's output in order.
  rpc AppendImageBuildLogs(AppendImageBuildLogsRequest) returns (AppendImageBuildLogsResponse);
  // CompleteSnapshot reports how a SnapshotContainer ended.
  rpc CompleteSnapshot(CompleteSnapshotRequest) returns (CompleteSnapshotResponse);
  // CompleteFilesystemImage reports how a PublishFilesystem ended.
  rpc CompleteFilesystemImage(CompleteFilesystemImageRequest) returns (CompleteFilesystemImageResponse);
}

message EnrollRequest {
  // A single-use join token. Cloud hosts send cloud_identity instead.
  string join_token = 1;
  string hostname = 2;
  Capacity capacity = 3;
  // What the host checked before joining. A failed error-severity check
  // fails a joined machine with host_preflight_failed.
  repeated PreflightCheck preflight = 70;
  // amd64 or arm64.
  string architecture = 71;
  // Proves a cloud instance's identity in place of a join token.
  CloudIdentity cloud_identity = 72;
}

message PreflightCheck {
  string name = 1;
  bool ok = 2;
  string message = 3;
  // info, warning or error.
  string severity = 4;
  string remediation = 5;
}

// CloudIdentity is an STS GetCallerIdentity request the instance signed with
// its instance-profile credentials, which the server sends to STS. The
// signature covers the LazyCloud-Host-Id header, so the request names one
// host and cannot be replayed for another.
message CloudIdentity {
  string host_id = 1;
  string url = 2;
  string method = 3;
  map<string, string> headers = 4;
  bytes body = 5;
}

message EnrollResponse {
  string host_id = 1;
  string host_token = 2;
}

message Capacity {
  int64 cpu_millis = 1;
  int64 memory_bytes = 2;
  // The GPUs the host offers, all of one model.
  string gpu_type = 70;
  int32 gpu_count = 71;
}

message HostMessage {
  oneof body {
    Hello hello = 1;
    ContainerReport container = 2;
    Ack ack = 3;
    // A sample of every running container, sent every few seconds. The
    // server drops samples it cannot keep up with.
    ContainerMetrics metrics = 80;
    // The provider will reclaim the host. Sent again after reconnects while
    // the notice stands.
    Interruption interruption = 70;
  }
}

// Interruption is a provider's notice that it reclaims the instance at
// reclaim_at, such as an EC2 Spot interruption.
message Interruption {
  string reason = 1;
  google.protobuf.Timestamp reclaim_at = 2;
}

// Hello opens a session. It lists every container the host runs so the server
// can stop containers it no longer assigns and resend missing starts.
message Hello {
  string boot_id = 1;
  Capacity capacity = 2;
  repeated ContainerReport containers = 3;
  string agent_version = 4;
  // The agent runs under its service and can replace itself on UpdateAgent.
  bool updatable = 70;
  // A release the host rolled back from; the server does not offer it again.
  string rejected_version = 71;
}

enum ContainerPhase {
  CONTAINER_PHASE_UNSPECIFIED = 0;
  // Fetching the image, source and runtime.
  CONTAINER_PHASE_PREPARING = 1;
  // The container process runs; runner slots are loading.
  CONTAINER_PHASE_STARTING = 2;
  // Every slot loaded its handler; the container can claim tasks.
  CONTAINER_PHASE_READY = 3;
  // The container is gone. exit carries the reason.
  CONTAINER_PHASE_EXITED = 4;
}

enum ExitReason {
  EXIT_REASON_UNSPECIFIED = 0;
  // A StopContainer command finished.
  EXIT_REASON_STOPPED = 1;
  // The handler failed to import or initialize.
  EXIT_REASON_LOAD_ERROR = 2;
  // Image, source or runtime preparation failed.
  EXIT_REASON_START_FAILED = 3;
  // The container or supervisor died unexpectedly.
  EXIT_REASON_CRASHED = 4;
  EXIT_REASON_OUT_OF_MEMORY = 5;
  // A pod's command ended on its own; exit_code is its status.
  EXIT_REASON_EXITED = 90;
}

message ContainerReport {
  string container_id = 1;
  ContainerPhase phase = 2;
  ContainerExit exit = 3;
  google.protobuf.Timestamp observed_at = 4;
  // Attempts the container is running. The server cancels any whose durable
  // state is no longer running, which covers cancels lost in a disconnect.
  repeated string running_attempts = 5;
  // How long each finished stage of the start took, restated in every
  // report once known.
  repeated StartupStage startup = 80;
  // The snapshot the start could not restore; the container started cold.
  string restore_failed = 90;
}

enum StartupStageKind {
  STARTUP_STAGE_KIND_UNSPECIFIED = 0;
  // Pulling the image, or finding it on the host.
  STARTUP_STAGE_KIND_IMAGE = 1;
  // Fetching and extracting the source archive.
  STARTUP_STAGE_KIND_SOURCE = 2;
  // Creating and starting the container process.
  STARTUP_STAGE_KIND_CREATE = 3;
  // The supervisor loading the handler in every slot.
  STARTUP_STAGE_KIND_RUNTIME = 4;
  // Leasing and restoring the container's disks.
  STARTUP_STAGE_KIND_DISK = 90;
}

message StartupStage {
  StartupStageKind kind = 1;
  google.protobuf.Timestamp started_at = 2;
  google.protobuf.Timestamp finished_at = 3;
  // For the image stage: the image was already on the host.
  bool cached = 4;
}

message ContainerMetrics {
  repeated ContainerSample samples = 1;
}

// ContainerSample is one container's use since its previous sample. The
// first reading after a container starts or the agent restarts only primes
// the counters and is not sent.
message ContainerSample {
  string container_id = 1;
  // Time covered since the previous sample.
  uint32 interval_ms = 2;
  // CPU time used in the interval.
  uint64 cpu_usage_usec = 3;
  // Anonymous and mapped file memory, and swap, when sampled.
  uint64 memory_rss_bytes = 4;
  uint64 memory_swap_bytes = 5;
  // Bytes moved in the interval.
  uint64 network_rx_bytes = 6;
  uint64 network_tx_bytes = 7;
  uint64 disk_read_bytes = 8;
  uint64 disk_write_bytes = 9;
  // The container's GPUs, when it has any.
  repeated GPUSample gpus = 10;
}

message GPUSample {
  string uuid = 1;
  string name = 2;
  uint32 utilization_percent = 3;
  uint64 memory_used_bytes = 4;
  uint64 memory_total_bytes = 5;
}

message ContainerExit {
  ExitReason reason = 1;
  int32 exit_code = 2;
  string message = 3;
  // For EXIT_REASON_LOAD_ERROR: the exception the runner reported.
  RunnerError error = 4;
}

message RunnerError {
  string type = 1;
  string message = 2;
  string traceback = 3;
}

// Ack confirms receipt of a command. It is not completion; completion is the
// container report that follows.
message Ack {
  string command_id = 1;
}

message ServerMessage {
  string command_id = 1;
  oneof body {
    StartContainer start = 2;
    StopContainer stop = 3;
    CancelAttempt cancel = 4;
    StorageGrant storage_grant = 40;
    UpdateAgent update = 70;
    UpdateNetwork network = 90;
    SnapshotContainer snapshot = 91;
    PublishFilesystem publish_filesystem = 92;
  }
}

// UpdateNetwork replaces a running container's outbound policy.
message UpdateNetwork {
  string container_id = 1;
  NetworkPolicy policy = 2;
}

// SnapshotContainer checkpoints a running container's memory and writable
// filesystem, leaving it running, and uploads the archive to upload_url.
// The host reports the outcome with CompleteSnapshot.
message SnapshotContainer {
  string container_id = 1;
  string snapshot_id = 2;
  // A presigned PUT URL for the archive.
  string upload_url = 3;
  google.protobuf.Timestamp deadline = 4;
  // Checkpoint only once this answers, for a pod's automatic snapshot.
  ReadinessProbe ready = 5;
}

message ReadinessProbe {
  string path = 1;
  int32 port = 2;
  int32 timeout_seconds = 3;
  float interval_seconds = 4;
}

// PublishFilesystem pushes the container's filesystem, without its mounts,
// as a single-layer image to repository, and reports it with
// CompleteFilesystemImage.
message PublishFilesystem {
  string container_id = 1;
  string request_id = 2;
  string repository = 3;
  bool insecure_registry = 4;
  RegistryAuth registry_auth = 5;
  google.protobuf.Timestamp deadline = 6;
}

// StorageGrant is a short-lived credential for one workspace's bucket of
// volumes and disks. The server sends one before the first container that
// needs it and a fresh one before it expires. Hosts keep it from containers.
message StorageGrant {
  string workspace_id = 1;
  string endpoint = 2;
  string region = 3;
  string bucket = 4;
  string access_key_id = 5;
  string secret_access_key = 6;
  string session_token = 7;
  google.protobuf.Timestamp expires_at = 8;
}

// UpdateAgent asks an updatable agent to install a release and restart into
// it. The agent verifies the archive's digest, and its service rolls back to
// the previous release if the new one does not reconnect.
message UpdateAgent {
  string version = 1;
  // Where the release archive for the host's architecture downloads from.
  string url = 2;
  string sha256 = 3;
}

message StartContainer {
  string container_id = 1;
  // An OCI image reference the host can pull.
  string image = 2;
  string python_version = 3;
  Source source = 4;
  Resources resources = 5;
  FunctionWorkload function = 6;
  map<string, string> environment = 7;
  // Values of the secrets the release names, by name. The host passes them
  // as environment variables and keeps them out of task output.
  map<string, string> secrets = 10;
  // The workspace name the container's SDK calls default to.
  string workspace = 11;
  // Credentials for pulling image. They go to the pull call only and are
  // never written to disk or into the container.
  RegistryAuth image_auth = 20;
  // Set instead of function for an image build container. image is unused.
  ImageBuild build = 21;
  // The OCI platform image is pulled for, such as linux/amd64.
  string image_platform = 22;
  // Set for endpoint, ASGI and realtime workloads: the slots are workers that
  // serve HTTP instead of claiming tasks.
  HttpServing http = 30;
  repeated VolumeMount volumes = 40;
  repeated DiskAttachment disks = 41;
  // Set instead of function for pods, devboxes, sandboxes and shell
  // containers: the container runs a command, not a handler.
  PodWorkload pod = 90;
  // Run a Docker daemon in the container.
  bool docker = 91;
  // Start from this memory snapshot. A failed restore of a deployed
  // workload's automatic snapshot starts the container cold and reports
  // restore_failed; any other failed restore fails the start.
  SnapshotRestore restore = 92;
}

message PodWorkload {
  // The command; empty runs the image's own entrypoint and command.
  repeated string command = 1;
  // Run no workload process, as for a shell container.
  bool idle = 2;
  // Ports the command listens on.
  repeated int32 ports = 3;
  HealthCheck health = 4;
  SshServer ssh = 5;
  NetworkPolicy network = 6;
  // The disk mounted at / is the root filesystem; the source is not mounted
  // and the working directory is /root.
  bool devbox = 7;
}

// HealthCheck is an HTTP GET on a port that must answer 2xx or 3xx.
message HealthCheck {
  string path = 1;
  int32 port = 2;
}

// SshServer is the container's SSH identity. Clients log in as root with a
// certificate the workspace's user authority signed.
message SshServer {
  // The OpenSSH PEM ed25519 host key.
  bytes host_key = 1;
  // The user certificate authority, an authorized_keys line.
  string user_authority = 2;
}

// NetworkPolicy limits a container's outbound traffic. An allow list wins
// over block: only those CIDR ranges are reachable.
message NetworkPolicy {
  bool block = 1;
  repeated string allow = 2;
}

message SnapshotRestore {
  string snapshot_id = 1;
  // A presigned GET URL for the snapshot archive.
  string url = 2;
  string sha256 = 3;
  // An automatic snapshot of a deployed workload falls back to a cold start.
  bool automatic = 4;
}

// VolumeMount bind-mounts a volume into the container. A platform volume is
// the prefix of its workspace bucket under the latest StorageGrant; a cloud
// bucket carries its own location and keys.
message VolumeMount {
  string mount_path = 1;
  bool read_only = 2;
  oneof source {
    PlatformVolume volume = 3;
    CloudBucket cloud_bucket = 4;
  }
}

message PlatformVolume {
  string volume_id = 1;
  string workspace_id = 2;
  // The key prefix of the volume's files, ending in "/".
  string prefix = 3;
}

message CloudBucket {
  string bucket = 1;
  string prefix = 2;
  string region = 3;
  string endpoint = 4;
  bool force_path_style = 5;
  string access_key_id = 6;
  string secret_access_key = 7;
}

// DiskAttachment mounts a durable disk the agent acquires with AcquireDisk.
message DiskAttachment {
  string name = 1;
  string mount_path = 2;
}

enum HttpKind {
  HTTP_KIND_UNSPECIFIED = 0;
  // A function whose JSON body and query become its arguments.
  HTTP_KIND_ENDPOINT = 1;
  // An ASGI application.
  HTTP_KIND_ASGI = 2;
  // A WebSocket handler called once per message.
  HTTP_KIND_REALTIME = 3;
}

// HttpServing configures a container's workers to serve HTTP. Each of the
// FunctionWorkload slots is one worker process admitting up to concurrency
// requests at once.
message HttpServing {
  HttpKind kind = 1;
  int32 concurrency = 2;
}

// RegistryAuth authenticates to one registry.
message RegistryAuth {
  string username = 1;
  string password = 2;
  // An OAuth refresh token, used instead of a password.
  string identity_token = 3;
}

// ImageBuild runs one attempt of an image build. The host builds dockerfile
// with the extracted context, pushes the result by digest to
// push_repository and reports it with CompleteImageBuild.
message ImageBuild {
  string build_id = 1;
  int32 attempt = 2;
  string dockerfile = 3;
  // The build context archive; unset when the build reads no files.
  Source context = 4;
  string platform = 5;
  string push_repository = 6;
  // A registry cache reference imported before and exported after the build.
  string cache_ref = 7;
  // The push registry and cache speak plain HTTP.
  bool insecure_registry = 8;
  // Credentials by registry host for base images, the push and the cache.
  map<string, RegistryAuth> registry_auth = 9;
  google.protobuf.Timestamp deadline = 10;
}

message Source {
  string sha256 = 1;
  // A presigned GET URL for the source zip.
  string url = 2;
  google.protobuf.Timestamp url_expires_at = 3;
}

// Resources reserve cpu_millis and memory_bytes; the container may use more
// up to the limits. The host caps cpu_limit_millis at its own size.
message Resources {
  int64 cpu_millis = 1;
  int64 memory_bytes = 2;
  int64 cpu_limit_millis = 3;
  int64 memory_limit_bytes = 4;
  // The writable layer limit; zero is the host default.
  int64 disk_limit_bytes = 40;
  // GPUs the host gives the container; the host picks free devices.
  int32 gpu_count = 70;
}

message FunctionWorkload {
  string handler = 1;
  int32 slots = 2;
  // Run every slot as a thread of one runner process.
  bool in_process = 10;
  LifecycleHooks hooks = 11;
}

// LifecycleHooks are `module:qualname` references the runner calls, in
// order, around each attempt; on_start runs once per runner process.
message LifecycleHooks {
  repeated string on_start = 1;
  repeated string on_running = 2;
  repeated string on_success = 3;
  repeated string on_error = 4;
  repeated string on_retry = 5;
  repeated string on_failure = 6;
  repeated string on_finish = 7;
}

message StopContainer {
  string container_id = 1;
  int32 grace_seconds = 2;
}

enum CancelReason {
  CANCEL_REASON_UNSPECIFIED = 0;
  CANCEL_REASON_CANCELLED = 1;
  CANCEL_REASON_TIMED_OUT = 2;
}

// CancelAttempt kills the slot running the attempt. The server has already
// recorded the outcome.
message CancelAttempt {
  string container_id = 1;
  string attempt_id = 2;
  CancelReason reason = 3;
}

message ClaimTasksRequest {
  string container_id = 1;
  int32 max_tasks = 2;
  int32 wait_seconds = 3;
}

message ClaimTasksResponse {
  repeated ClaimedTask tasks = 1;
}

enum PayloadEncoding {
  PAYLOAD_ENCODING_UNSPECIFIED = 0;
  PAYLOAD_ENCODING_JSON = 1;
  PAYLOAD_ENCODING_CLOUDPICKLE = 2;
}

message ClaimedTask {
  string task_id = 1;
  string attempt_id = 2;
  int32 attempt_number = 3;
  PayloadEncoding input_encoding = 4;
  bytes input = 5;
  google.protobuf.Timestamp deadline = 6;
  // The root of the task's call graph, which is the task itself when no
  // task spawned it, and its parent when one did.
  string root_task_id = 10;
  string parent_task_id = 11;
  int32 max_attempts = 12;
  // The results of the upstream tasks the input refers to.
  repeated DependencyResult dependencies = 60;
  // The W3C traceparent of the request that submitted the task, when it
  // was traced; the host's spans for the attempt join that trace.
  string traceparent = 80;
}

// DependencyResult is an upstream task's result that a dependent's input
// refers to by task id.
message DependencyResult {
  string task_id = 1;
  PayloadEncoding encoding = 2;
  bytes data = 3;
}

message CompleteTaskRequest {
  string container_id = 1;
  string attempt_id = 2;
  oneof outcome {
    TaskSuccess success = 3;
    TaskFailure failure = 4;
  }
}

message TaskSuccess {
  PayloadEncoding encoding = 1;
  bytes result = 2;
}

enum AttemptFailureKind {
  ATTEMPT_FAILURE_KIND_UNSPECIFIED = 0;
  // The handler raised.
  ATTEMPT_FAILURE_KIND_USER_ERROR = 1;
  // The slot process died while running the attempt.
  ATTEMPT_FAILURE_KIND_CRASHED = 2;
}

message TaskFailure {
  AttemptFailureKind kind = 1;
  RunnerError error = 2;
  // The cloudpickled exception, when the runner could serialize it.
  bytes exception = 3;
}

message CompleteTaskResponse {}

enum LogStream {
  LOG_STREAM_UNSPECIFIED = 0;
  LOG_STREAM_STDOUT = 1;
  LOG_STREAM_STDERR = 2;
  LOG_STREAM_SYSTEM = 3;
}

message AppendLogsRequest {
  string container_id = 1;
  repeated LogLine lines = 2;
}

message LogLine {
  string attempt_id = 1;
  LogStream stream = 2;
  string data = 3;
  google.protobuf.Timestamp time = 4;
  // Set for output an HTTP worker wrote while serving this request.
  string request_id = 30;
}

message AppendLogsResponse {}

message AcquireDiskRequest {
  string container_id = 1;
  string name = 2;
}

message AcquireDiskResponse {
  string disk_id = 1;
  string workspace_id = 2;
  int64 size_bytes = 3;
  bytes lease_token = 4;
  repeated DiskGeneration chain = 5;
}

// DiskGeneration is one published generation; a chain lists them base
// first.
message DiskGeneration {
  int64 generation = 1;
  string manifest_key = 2;
  string manifest_sha256 = 3;
}

message RecordDiskGenerationRequest {
  string container_id = 1;
  string disk_id = 2;
  bytes lease_token = 3;
  int64 generation = 4;
  int64 parent_generation = 5;
  string manifest_key = 6;
  string manifest_sha256 = 7;
  int64 added_bytes = 8;
  bool flat = 9;
}

message RecordDiskGenerationResponse {}

message RecordDiskCollectionRequest {
  string container_id = 1;
  string disk_id = 2;
  bytes lease_token = 3;
  int64 removed_bytes = 4;
  // The base generation of the chain the collection kept.
  int64 base_generation = 5;
}

message RecordDiskCollectionResponse {}

message ReleaseDiskRequest {
  string container_id = 1;
  string disk_id = 2;
  bytes lease_token = 3;
}

message ReleaseDiskResponse {}

// APIRequest is one message of a container API call. Only the first carries
// head; body chunks follow in order.
message APIRequest {
  APIRequestHead head = 1;
  bytes body = 2;
}

message APIRequestHead {
  // Set by the agent, which knows the container from the link socket.
  string container_id = 1;
  string method = 2;
  // The request target: path and query.
  string target = 3;
  repeated APIHeader headers = 4;
}

message APIHeader {
  string name = 1;
  string value = 2;
}

// APIResponse is one message of a container API answer. Only the first
// carries head.
message APIResponse {
  APIResponseHead head = 1;
  bytes body = 2;
}

message APIResponseHead {
  int32 status = 1;
  repeated APIHeader headers = 2;
}
message CompleteImageBuildRequest {
  string container_id = 1;
  oneof outcome {
    // The pushed manifest digest, sha256:<hex>.
    string digest = 2;
    // Why the build failed, with the end of its output.
    string failure = 3;
  }
}

message CompleteImageBuildResponse {}

message AppendImageBuildLogsRequest {
  string container_id = 1;
  repeated BuildLogLine lines = 2;
}

message BuildLogLine {
  string data = 1;
  google.protobuf.Timestamp time = 2;
}

message AppendImageBuildLogsResponse {}

message CompleteSnapshotRequest {
  string container_id = 1;
  string snapshot_id = 2;
  int64 size_bytes = 3;
  string sha256 = 4;
  // Set when the snapshot failed.
  string failure = 5;
  // The host cannot checkpoint, such as a runc host without CRIU.
  bool unsupported = 6;
}

message CompleteSnapshotResponse {}

message CompleteFilesystemImageRequest {
  string container_id = 1;
  string request_id = 2;
  // The pushed image by digest.
  string reference = 3;
  string architecture = 4;
  string failure = 5;
}

message CompleteFilesystemImageResponse {}
