metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

[s3_api]
s3_region = "us-east-1"
api_bind_addr = "[::]:9000"
root_domain = ".s3.localhost"

[admin]
# Enables the authenticated admin endpoints, which are what grant a workspace's
# key on its own bucket. Without a token Garage serves none of them.
admin_token = "lazycloud-local-garage-admin"
api_bind_addr = "[::]:3903"
