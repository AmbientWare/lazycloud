{{- if .Values.storageClasses.ebsGp2.enabled }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storageClasses.ebsGp2.name }}
  {{- if .Values.storageClasses.ebsGp2.isDefault }}
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
  {{- end }}
provisioner: ebs.csi.aws.com
parameters:
  type: gp2
  fsType: ext4
reclaimPolicy: {{ .Values.storageClasses.ebsGp2.reclaimPolicy }}
volumeBindingMode: {{ .Values.storageClasses.ebsGp2.volumeBindingMode }}
allowVolumeExpansion: {{ .Values.storageClasses.ebsGp2.allowVolumeExpansion }}
{{- end }}
