{{- if .Values.storageClasses.ebsGp3.enabled }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storageClasses.ebsGp3.name }}
  {{- if .Values.storageClasses.ebsGp3.isDefault }}
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
  {{- end }}
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  fsType: ext4
reclaimPolicy: {{ .Values.storageClasses.ebsGp3.reclaimPolicy }}
volumeBindingMode: {{ .Values.storageClasses.ebsGp3.volumeBindingMode }}
allowVolumeExpansion: {{ .Values.storageClasses.ebsGp3.allowVolumeExpansion }}
{{- end }}
