# Service alias for Cloudflare Tunnel to connect to
# The actual envoy proxy service has a generated name, so we create a stable alias
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.gateway.name }}
    app.kubernetes.io/component: gateway-service
spec:
  type: ClusterIP
  selector:
    gateway.envoyproxy.io/owning-gateway-name: {{ .Values.gateway.name }}
    gateway.envoyproxy.io/owning-gateway-namespace: {{ .Release.Namespace }}
  ports:
    - name: http
      port: 80
      targetPort: 10080
      protocol: TCP
