apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Service type ClusterIP - traffic comes through Cloudflare Tunnel
    gateway.envoyproxy.io/service-type: ClusterIP
spec:
  gatewayClassName: envoy
  listeners:
    # HTTP listener for web traffic
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    {{- range .Values.gateway.tcpPorts }}
    # TCP listener on port {{ . }}
    - name: tcp-{{ . }}
      protocol: TCP
      port: {{ . }}
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: TCPRoute
    {{- end }}
    {{- range .Values.gateway.udpPorts }}
    # UDP listener on port {{ . }}
    - name: udp-{{ . }}
      protocol: UDP
      port: {{ . }}
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: UDPRoute
    {{- end }}
