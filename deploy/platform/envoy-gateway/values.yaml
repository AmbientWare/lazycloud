# Envoy Gateway values
# This handles routing for services via Cloudflare Tunnel (replacing nginx-ingress)

envoy-gateway:
  # Envoy Gateway controller configuration
  config:
    envoyGateway:
      gateway:
        controllerName: gateway.envoyproxy.io/gatewayclass-controller
      provider:
        type: Kubernetes

  # Controller deployment resources
  deployment:
    envoyGateway:
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 128Mi

# Gateway configuration
gateway:
  name: lazycloud-gateway
  namespace: envoy-gateway-system
  # TCP ports to expose (for database, Redis, etc.)
  # Add ports as needed when services require TCP routing
  tcpPorts: []
  # Example: [5432, 6379, 3306]
  # UDP ports to expose (for DNS, gaming, streaming, etc.)
  # Add ports as needed when services require UDP routing
  udpPorts: []
  # Example: [53, 5353]

# EnvoyProxy (data plane) configuration - matches nginx-ingress settings
envoyProxy:
  # Replicas managed by HPA
  minReplicas: 2
  maxReplicas: 10

  # Resources - matching nginx-ingress
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  # Topology spread for HA across zones
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway

# Client Traffic Policy - Cloudflare integration
clientTrafficPolicy:
  # Trust Cloudflare's X-Forwarded-For headers
  numTrustedHops: 1
  # Cloudflare IP ranges (same as nginx-ingress proxy-real-ip-cidr)
  trustedCIDRs:
    - "173.245.48.0/20"
    - "103.21.244.0/22"
    - "103.22.200.0/22"
    - "103.31.4.0/22"
    - "141.101.64.0/18"
    - "108.162.192.0/18"
    - "190.93.240.0/20"
    - "188.114.96.0/20"
    - "197.234.240.0/22"
    - "198.41.128.0/17"
    - "162.158.0.0/15"
    - "104.16.0.0/13"
    - "104.24.0.0/14"
    - "172.64.0.0/13"
    - "131.0.72.0/22"

# Backend Traffic Policy - body size and timeouts
backendTrafficPolicy:
  # Timeout for large uploads (equivalent to nginx proxy-body-size: 128m)
  requestTimeout: 300s

# Prometheus metrics
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring
