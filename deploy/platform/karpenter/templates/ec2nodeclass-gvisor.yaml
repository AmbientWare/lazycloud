apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gvisor
spec:
  role: {{ .Values.nodeRoleName }}
  amiFamily: AL2023
  amiSelectorTerms:
    # Pre-built AL2023 AMI with gVisor installed
    - id: {{ required "gvisorAmiId is required - build with Image Builder first" .Values.gvisorAmiId }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.karpenter.settings.clusterName }}
  securityGroupSelectorTerms:
    - id: {{ .Values.clusterSecurityGroupId }}
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 150Gi
        volumeType: gp3
        deleteOnTermination: true
