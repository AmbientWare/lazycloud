# Karpenter values
# Infrastructure values (nodeRoleName, clusterSecurityGroupId, karpenter.settings.*)
# are injected from /infrastructure-values/karpenter.yaml

# Karpenter chart values (static config only)
karpenter:
  serviceAccount:
    name: karpenter

  controller:
    resources:
      requests:
        cpu: "1"
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 1Gi
