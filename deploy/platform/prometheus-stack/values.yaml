# Prometheus Stack values
# No infrastructure values needed - static configuration only

kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      nodeSelector:
        instance-class: platform
      retention: 7d
      resources:
        limits:
          cpu: 1000m
          memory: 2Gi
        requests:
          cpu: 500m
          memory: 1Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 50Gi

  alertmanager:
    enabled: true
    alertmanagerSpec:
      nodeSelector:
        instance-class: platform
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 50m
          memory: 64Mi

  grafana:
    enabled: true
    adminPassword: "admin"  # Change in production via External Secret
    nodeSelector:
      instance-class: platform
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
    additionalDataSources:
      - name: Loki
        type: loki
        url: http://loki-stack:3100
        access: proxy
        isDefault: false

  kubeStateMetrics:
    enabled: true

  kube-state-metrics:
    nodeSelector:
      instance-class: platform
    # Expose custom LazyCloud labels for usage attribution
    metricLabelsAllowlist:
      - pods=[lazycloud.dev/service,lazycloud.dev/deployment-id,lazycloud.dev/workspace-id,app.kubernetes.io/instance]

  nodeExporter:
    enabled: true
