# NGINX Ingress Controller values
# This handles routing for customer services via Cloudflare Tunnel

ingress-nginx:
  nameOverride: nginx-ingress
  fullnameOverride: nginx-ingress

  controller:
    name: controller

    # Use ClusterIP - traffic comes through Cloudflare Tunnel, not LoadBalancer
    service:
      type: ClusterIP
      ports:
        http: 80
        https: 443

    # Ingress class configuration
    ingressClassResource:
      name: nginx
      enabled: true
      default: true
      controllerValue: "k8s.io/ingress-nginx"

    # Resource limits
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi

    # Autoscaling for production
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80

    # Pod disruption budget
    minAvailable: 1

    # Metrics for Prometheus
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        namespace: monitoring

    # Config for Cloudflare Tunnel integration
    config:
      # Trust Cloudflare's X-Forwarded-For headers
      use-forwarded-headers: "true"
      compute-full-forwarded-for: "true"
      # Cloudflare IP ranges for proxy protocol (optional)
      proxy-real-ip-cidr: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22"
      # Enable real IP from X-Forwarded-For
      forwarded-for-header: "X-Forwarded-For"

    # Topology spread for HA
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: nginx-ingress
            app.kubernetes.io/component: controller

  # Disable default backend - we handle 404s ourselves
  defaultBackend:
    enabled: false
