# Loki Stack values
# No infrastructure values needed - static configuration only

loki-stack:
  loki:
    persistence:
      enabled: false
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

  promtail:
    enabled: true
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 64Mi

  grafana:
    enabled: false  # Using kube-prometheus-stack Grafana
