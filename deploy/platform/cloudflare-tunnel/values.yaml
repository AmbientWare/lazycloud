# Cloudflare Tunnel configuration (Remote-managed)
# Tunnel config is managed in Cloudflare Zero Trust dashboard
# This chart only deploys the cloudflared connector

# Tunnel configuration
tunnel:
  name: "lazycloud-prod"

# AWS Secrets Manager configuration
secrets:
  # ClusterSecretStore name (from external-secrets chart)
  secretStoreName: lazycloud-prod-secrets
  # AWS Secrets Manager secret name (override per-cluster in values-{cluster_id}.yaml)
  # Each cluster stores secrets at: lazycloud/clusters/{cluster_id}
  awsSecretName: lazycloud/clusters/default
  # Property within the secret containing the tunnel token (same for all clusters)
  awsSecretProperty: cloudflare_tunnel_token

# Deployment configuration
replicas: 2

image:
  repository: cloudflare/cloudflared
  tag: "2024.12.0"
  pullPolicy: IfNotPresent

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Topology spread for HA
topologySpreadConstraints:
  enabled: true

# ServiceMonitor for Prometheus metrics scraping
serviceMonitor:
  enabled: true
