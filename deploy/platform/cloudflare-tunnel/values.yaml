# Cloudflare Tunnel configuration
# Routes traffic from Cloudflare edge to NGINX Ingress Controller

# Tunnel configuration
tunnel:
  # Tunnel ID (from `cloudflared tunnel create`)
  id: ""  # Set in values-{region}.yaml
  name: "lazycloud-prod"

# AWS Secrets Manager configuration
secrets:
  # ClusterSecretStore name (from external-secrets chart)
  secretStoreName: lazycloud-prod-secrets
  # AWS Secrets Manager secret name
  awsSecretName: lazycloud/shared-secrets
  # Property within the secret containing the tunnel token
  awsSecretProperty: CLOUDFLARE_TUNNEL_TOKEN

# Ingress rules for the tunnel
# Routes traffic to NGINX Ingress Controller
ingress:
  # Apex domain (wildcard doesn't cover this)
  - hostname: "lazycloud.dev"
    service: http://nginx-ingress-controller.ingress-nginx.svc.cluster.local:80
  # Wildcard for all subdomains (platform + customer services)
  - hostname: "*.lazycloud.dev"
    service: http://nginx-ingress-controller.ingress-nginx.svc.cluster.local:80
  # Catch-all returns 404
  - service: http_status:404

# Deployment configuration
replicas: 2

image:
  repository: cloudflare/cloudflared
  tag: "2024.12.0"
  pullPolicy: IfNotPresent

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Topology spread for HA
topologySpreadConstraints:
  enabled: true

# ServiceMonitor for Prometheus metrics scraping
serviceMonitor:
  enabled: true
