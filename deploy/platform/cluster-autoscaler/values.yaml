# Cluster Autoscaler for Hetzner Cloud

cluster-autoscaler:
  cloudProvider: hetzner
  image:
    # Keep autoscaler minor aligned with Kubernetes cluster minor (1.32.x).
    # This avoids provider-specific regressions seen with older versions.
    tag: v1.32.0
  autoDiscovery:
    clusterName: lazycloud-prod

  extraEnvSecrets:
    HCLOUD_TOKEN:
      name: hetzner-cloud-token
      key: token
    HCLOUD_CLUSTER_CONFIG:
      name: cluster-autoscaler-config
      key: cluster-config
    HCLOUD_NETWORK:
      name: cluster-autoscaler-config
      key: network
    HCLOUD_SSH_KEY:
      name: cluster-autoscaler-config
      key: ssh-key
    HCLOUD_FIREWALL:
      name: cluster-autoscaler-config
      key: firewall

  autoscalingGroups:
    - name: ccx33-sandbox-ash
      minSize: 1
      maxSize: 20
      instanceType: CCX33
      region: ASH

  nodeSelector:
    instance-class: platform

  extraArgs:
    scale-down-delay-after-add: "5m"
    scale-down-unneeded-time: "5m"
    scale-down-utilization-threshold: "0.5"
    skip-nodes-with-local-storage: "false"
    balance-similar-node-groups: "true"
    expander: "least-waste"
    scan-interval: "10s"
    new-pod-scale-up-delay: "0s"

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 512Mi
