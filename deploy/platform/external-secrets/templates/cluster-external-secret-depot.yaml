{{- if .Values.depotRegistry.enabled }}
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: depot-registry
spec:
  # Sync to all user deployment namespaces (lc-*)
  namespaceSelector:
    matchLabels:
      lazycloud.dev/managed: "true"

  refreshTime: 1h

  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      name: {{ .Values.orgName }}-{{ .Values.environment }}-secrets
      kind: ClusterSecretStore

    target:
      name: depot-registry
      creationPolicy: Owner
      template:
        type: kubernetes.io/dockerconfigjson
        data:
          .dockerconfigjson: |
            {
              "auths": {
                "registry.depot.dev": {
                  "username": "x-token",
                  "password": "{{ `{{ .token }}` }}",
                  "auth": "{{ `{{ printf "x-token:%s" .token | b64enc }}` }}"
                }
              }
            }

    data:
      - secretKey: token
        remoteRef:
          key: {{ .Values.depotRegistry.awsSecretName }}
          property: DEPOT_REGISTRY_TOKEN
{{- end }}
