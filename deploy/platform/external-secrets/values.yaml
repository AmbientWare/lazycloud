# External Secrets values
# Region-specific values (region) are in values-{region}.yaml

# Shared across all regions
orgName: lazycloud
environment: prod

# Cloudflare secret settings (for ExternalDNS)
cloudflare:
  enabled: true
  awsSecretName: lazycloud/shared-secrets

# App secrets settings (for lazycloud apps)
appSecrets:
  prod:
    enabled: true
    namespace: lazycloud-prod
    awsSecretName: lazycloud/prod-secrets
    targetSecretName: app-secrets
  staging:
    enabled: true
    namespace: lazycloud-staging
    awsSecretName: lazycloud/staging-secrets
    targetSecretName: app-secrets

# External Secrets chart values
external-secrets:
  nameOverride: external-secrets
  fullnameOverride: external-secrets
  installCRDs: true
  serviceAccount:
    create: true
    name: external-secrets
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
