# External Secrets with AWS Secrets Manager for Hetzner
# Uses static AWS credentials (stored as K8s secret) since IRSA is not available outside AWS.
#
# NOTE: The ESO operator and ClusterSecretStore are installed by Terraform.
# This chart only manages the ExternalSecret resources for app secrets.

# Operator is installed by Terraform - disable here to avoid conflict
operator:
  enabled: false

# ClusterSecretStore is created by Terraform - disable here
clusterSecretStore:
  enabled: false

orgName: lazycloud
environment: prod

# AWS Secrets Manager configuration
aws:
  region: us-east-1
  # Namespace where the aws-sm-credentials secret lives
  credentialsSecretNamespace: external-secrets-system

# Depot registry secret (for user deployment image pulls)
depotRegistry:
  enabled: true
  awsSecretName: lazycloud/shared-secrets

# App secrets
appSecrets:
  prod:
    enabled: true
    namespace: lazycloud-prod
    awsSecretName: lazycloud/prod-secrets
    targetSecretName: app-secrets
  staging:
    enabled: true
    namespace: lazycloud-staging
    awsSecretName: lazycloud/staging-secrets
    targetSecretName: app-secrets

# External Secrets chart values
external-secrets:
  nameOverride: external-secrets
  fullnameOverride: external-secrets
  installCRDs: true
  serviceAccount:
    create: true
    name: external-secrets
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
