apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: git@github.com:AmbientWare/lazycloud.git
    targetRevision: main
    path: deploy/platform/external-secrets
    helm:
      valueFiles:
        # Infrastructure values from CDK-created ConfigMap (mounted in repo-server)
        - /infrastructure-values/external-secrets.yaml
        # Static chart values
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
