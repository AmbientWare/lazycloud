apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-classes
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: git@github.com:AmbientWare/lazycloud.git
    targetRevision: main
    path: deploy/platform/ingress-classes
    helm:
      valueFiles:
        # Infrastructure values from CDK-created ConfigMap (mounted in repo-server)
        - /infrastructure-values/ingress-classes.yaml
        # Static chart values
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
