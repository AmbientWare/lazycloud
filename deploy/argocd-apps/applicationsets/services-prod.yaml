apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: lazycloud-services-prod
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
          - list:
              elements:
                - service: api-platform
                - service: web
  template:
    metadata:
      name: '{{ .name }}-{{ .service }}-prod'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: git@github.com:AmbientWare/lazycloud.git
        targetRevision: production
        path: 'deploy/services/{{ .service }}'
        helm:
          valueFiles:
            - values.yaml
            - 'values-{{ index .metadata.labels "region" }}.yaml'
            - values-prod.yaml
      destination:
        server: '{{ .server }}'
        namespace: lazycloud-prod
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
