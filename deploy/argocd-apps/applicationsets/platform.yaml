apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: lazycloud-platform-hetzner
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
                  provider: hetzner
          - list:
              elements:
                - app: storage-classes
                  namespace: kube-system
                  syncWave: "1"
                  createNamespace: "false"
                  serverSideApply: "true"
                - app: reloader
                  namespace: kube-system
                  syncWave: "1"
                  createNamespace: "false"
                  serverSideApply: "false"
                - app: argo-rollouts
                  namespace: argo-rollouts
                  syncWave: "1"
                  createNamespace: "true"
                  serverSideApply: "true"
                - app: gvisor
                  namespace: kube-system
                  syncWave: "1"
                  createNamespace: "false"
                  serverSideApply: "false"
                # Namespace created by Terraform (for aws-sm-credentials bootstrap secret)
                - app: external-secrets
                  namespace: external-secrets-system
                  syncWave: "2"
                  createNamespace: "false"
                  serverSideApply: "false"
                - app: nginx-ingress
                  namespace: ingress-nginx
                  syncWave: "3"
                  createNamespace: "true"
                  serverSideApply: "false"
                - app: cluster-autoscaler
                  namespace: kube-system
                  syncWave: "4"
                  createNamespace: "false"
                  serverSideApply: "false"
                - app: loki
                  namespace: monitoring
                  syncWave: "5"
                  createNamespace: "true"
                  serverSideApply: "false"
                - app: prometheus-stack
                  namespace: monitoring
                  syncWave: "6"
                  createNamespace: "true"
                  serverSideApply: "true"
                - app: cloudflare-tunnel
                  namespace: cloudflare-system
                  syncWave: "7"
                  createNamespace: "true"
                  serverSideApply: "false"
  templatePatch: |
    spec:
      syncPolicy:
        syncOptions:
          - CreateNamespace={{ .createNamespace }}
          {{- if eq .serverSideApply "true" }}
          - ServerSideApply=true
          {{- end }}
  template:
    metadata:
      name: '{{ .name }}-{{ .app }}'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .syncWave }}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: git@github.com:AmbientWare/lazycloud.git
        targetRevision: main
        path: 'deploy/platform/{{ .app }}'
        helm:
          releaseName: '{{ .app }}'
          ignoreMissingValueFiles: true
          valueFiles:
            - values.yaml
            - 'values-{{ index .metadata.labels "cluster_id" }}.yaml'
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      # Kubernetes mutates CRD status/preserveUnknownFields
      # fields, causing permanent OutOfSync. This is the documented fix (argo-helm#3301).
      ignoreDifferences:
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jsonPointers:
            - /status
            - /spec/preserveUnknownFields
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=false
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
