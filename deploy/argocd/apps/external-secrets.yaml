# Wave -2: before anything that uses its kinds.
#
# The LazyCloud chart declares a SecretStore and an ExternalSecret. Applied
# before this operator exists, they fail with "no matches for kind
# ExternalSecret", which reads as a chart mistake and is an ordering one. The
# wave is what makes the order declared rather than discovered.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.10.7
    helm:
      values: |
        installCRDs: true
        # The operator reads Secrets Manager as itself, through the IRSA role the
        # platform module creates. Its name is fixed here because that role's
        # trust policy names this exact service account: a rename on either side
        # produces a pod that authenticates as nobody.
        #
        # The ARN is written out rather than interpolated because Argo renders
        # from the repository and has no Terraform output to read. It is
        # deterministic -- account, then `<deployment>-external-secrets` -- and an
        # account id is not a secret, but it does mean this and
        # `cluster_iam.tf` are one decision written twice.
        serviceAccount:
          name: external-secrets
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::534742592531:role/lazycloud-prod-external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: lazycloud
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs are large enough that a client-side apply exceeds the
      # annotation size limit, which fails as a metadata error rather than as
      # anything about the resource.
      - ServerSideApply=true
