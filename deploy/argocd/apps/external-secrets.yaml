# Wave -2: before anything that uses its kinds.
#
# The LazyCloud chart declares a SecretStore and an ExternalSecret. Applied
# before this operator exists, they fail with "no matches for kind
# ExternalSecret", which reads as a chart mistake and is an ordering one. The
# wave is what makes the order declared rather than discovered.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.10.7
    helm:
      values: |
        installCRDs: true
        # No role annotation: a Pod Identity association beside the cluster says
        # which identity this service account holds, so nothing here has to know
        # an account number or repeat an ARN Terraform already owns. The name is
        # fixed because that association names it.
        serviceAccount:
          name: external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: lazycloud
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs are large enough that a client-side apply exceeds the
      # annotation size limit, which fails as a metadata error rather than as
      # anything about the resource.
      - ServerSideApply=true
