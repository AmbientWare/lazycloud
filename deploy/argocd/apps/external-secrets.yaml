# Wave -2: before anything that uses its kinds.
#
# The LazyCloud chart declares a SecretStore and an ExternalSecret. Applied
# before this operator exists, they fail with "no matches for kind
# ExternalSecret", which reads as a chart mistake and is an ordering one. The
# wave is what makes the order declared rather than discovered.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.10.7
    helm:
      values: |
        installCRDs: true
        # No AWS identity of its own. It serves every deployment's namespace,
        # and each SecretStore names a service account in its own namespace
        # whose token this operator exchanges for that deployment's reader role.
        # This chart declares no requests of its own, which leaves all three of
        # its pods in the class the node's arithmetic cannot see and the kubelet
        # evicts first. They are small, 1 to 3m and under 35Mi each measured,
        # but small and invisible are different things and only the second one
        # misleads the node that carries them.
        #
        # The webhook is the one with a consequence. Every ExternalSecret is
        # admitted through it, so a webhook that cannot answer is a deployment
        # whose secrets stop refreshing, reported as a timeout against the
        # resource rather than against the pod that was starved.
        resources:
          requests: { cpu: 50m, memory: 96Mi }
          limits: { memory: 192Mi }
        webhook:
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 128Mi }
        certController:
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs are large enough that a client-side apply exceeds the
      # annotation size limit, which fails as a metadata error rather than as
      # anything about the resource.
      - ServerSideApply=true
