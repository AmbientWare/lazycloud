# Wave -2: before anything that uses its kinds.
#
# The LazyCloud chart declares a SecretStore and an ExternalSecret. Applied
# before this operator exists, they fail with "no matches for kind
# ExternalSecret", which reads as a chart mistake and is an ordering one.
#
# The chart uses external-secrets.io/v1. v1beta1 stays served while main's
# deployment, whose chart uses it, can be restored; turn it off when that
# deployment is retired (tasks/deploy.md, Decommission).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.11.0
    helm:
      valuesObject:
        installCRDs: true
        crds:
          unsafeServeV1Beta1: true
        # No AWS identity of its own. It serves every deployment's namespace,
        # and each SecretStore names a service account in its own namespace
        # whose token this operator exchanges for that deployment's reader
        # role. Requests keep its pods out of the class the kubelet evicts
        # first; the webhook admits every ExternalSecret.
        resources:
          requests: { cpu: 50m, memory: 96Mi }
          limits: { memory: 192Mi }
        webhook:
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 128Mi }
        certController:
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs exceed the client-side apply annotation size limit.
      - ServerSideApply=true
