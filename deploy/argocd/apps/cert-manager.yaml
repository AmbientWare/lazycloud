apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.2
    helm:
      valuesObject:
        crds:
          enabled: true
        resources:
          requests: {cpu: 50m, memory: 96Mi}
          limits: {memory: 192Mi}
        webhook:
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 128Mi}
        cainjector:
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 128Mi}
        startupapicheck:
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 128Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
