{{- if .Values.telemetry.enabled }}
{{/*
Receives OTLP/gRPC traces from the server and scheduler and sends them to
AWS X-Ray in the deployment's region, as its service account's EKS Pod
Identity, which may only put trace segments and telemetry records.
Metrics stay on each process's /metrics for scraping.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  labels:
    {{- include "lazycloud.labels" (list . "otel-collector") | nindent 4 }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      batch: {}
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    exporters:
      awsxray:
        region: {{ required "awsRegion is required" .Values.awsRegion | quote }}
        indexed_attributes: [lazycloud.container_id, lazycloud.task_id, lazycloud.host_id]
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [awsxray]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    {{- include "lazycloud.labels" (list . "otel-collector") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        {{- include "lazycloud.labels" (list . "otel-collector") | nindent 8 }}
      annotations:
        checksum/config: {{ .Values.telemetry | toJson | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.otelCollector }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: config
          configMap:
            name: otel-collector
      containers:
        - name: otel-collector
          image: {{ .Values.telemetry.image }}
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - name: otlp
              containerPort: 4317
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet: { path: /, port: health }
          livenessProbe:
            httpGet: { path: /, port: health }
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
          resources:
            {{- toYaml .Values.telemetry.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    {{- include "lazycloud.labels" (list . "otel-collector") | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp
      port: 4317
      targetPort: otlp
{{- end }}
