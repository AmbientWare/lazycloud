{{- if .Values.telemetry.enabled }}
{{/*
Receives OTLP/gRPC traces from the server and scheduler and forwards them
to the backend with its basic-auth credential, which the processes cannot
send themselves. Metrics stay on each process's /metrics for scraping.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  labels:
    {{- include "lazycloud.labels" (list . "otel-collector") | nindent 4 }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      batch: {}
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      basicauth/backend:
        client_auth:
          username: ${env:BACKEND_USERNAME}
          password: ${env:BACKEND_PASSWORD}
    exporters:
      otlphttp:
        endpoint: {{ required "telemetry.endpoint is required" .Values.telemetry.endpoint | quote }}
        auth:
          authenticator: basicauth/backend
    service:
      extensions: [health_check, basicauth/backend]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    {{- include "lazycloud.labels" (list . "otel-collector") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        {{- include "lazycloud.labels" (list . "otel-collector") | nindent 8 }}
      annotations:
        checksum/config: {{ .Values.telemetry | toJson | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: config
          configMap:
            name: otel-collector
      containers:
        - name: otel-collector
          image: {{ .Values.telemetry.image }}
          args: ["--config=/etc/otelcol/config.yaml"]
          env:
            - name: BACKEND_USERNAME
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.name }}, key: {{ .Values.telemetry.usernameKey }} }
            - name: BACKEND_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.name }}, key: {{ .Values.telemetry.passwordKey }} }
          ports:
            - name: otlp
              containerPort: 4317
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet: { path: /, port: health }
          livenessProbe:
            httpGet: { path: /, port: health }
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
          resources:
            {{- toYaml .Values.telemetry.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    {{- include "lazycloud.labels" (list . "otel-collector") | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp
      port: 4317
      targetPort: otlp
{{- end }}
