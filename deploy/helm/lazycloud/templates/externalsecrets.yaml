{{- if .Values.externalSecrets.enabled }}
{{/*
Projects the credentials Secret from AWS Secrets Manager. Argo CD applies
these in the earliest sync waves, so the Secret exists before the migration
hook and the workloads read it. Pods read it at start, so a rotated value
reaches a process when its pods restart.

The External Secrets operator serves every namespace and holds no AWS
identity. It exchanges a token of secrets-reader for the role named here,
whose trust admits this namespace's secrets-reader alone.
*/}}
{{- $es := .Values.externalSecrets }}
{{- $data := deepCopy $es.data }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.secretsReader }}
  labels:
    {{- include "lazycloud.labels" (list . "secrets-reader") | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "externalSecrets.readerRoleArn is required" $es.readerRoleArn | quote }}
    argocd.argoproj.io/sync-wave: "-4"
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  labels:
    {{- include "lazycloud.labels" (list . "secrets-reader") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "externalSecrets.region is required" $es.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.serviceAccounts.secretsReader }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "lazycloud.labels" (list . "secrets-reader") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: {{ .Values.secrets.name }}
    creationPolicy: Owner
  data:
    {{- range $key := keys $data | sortAlpha }}
    {{- $ref := index $data $key }}
    {{- $document := index $es.documents (required (printf "externalSecrets.data.%s.document is required" $key) $ref.document) }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ required (printf "externalSecrets.documents.%s is required" $ref.document) $document }}
        property: {{ required (printf "externalSecrets.data.%s.property is required" $key) $ref.property }}
        {{- if $ref.decodingStrategy }}
        decodingStrategy: {{ $ref.decodingStrategy }}
        {{- end }}
    {{- end }}
{{- end }}
