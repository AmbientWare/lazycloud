{{- if .Values.externalSecrets.enabled }}
{{/*
Projects the credentials Secret from AWS Secrets Manager. These are hooks of
lower weight than the migrations, so the Secret exists before the migration
Job needs it, under Helm and under Argo CD alike. The Secret is orphaned
rather than owned: recreating the hooks on each release must not delete it
from under running pods. Pods read it at start, so a rotated value reaches a
process when its pods restart.

The External Secrets operator serves every namespace and holds no AWS
identity. It exchanges a token of secrets-reader for the role named here,
whose trust admits this namespace's secrets-reader alone.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-reader
  labels:
    {{- include "lazycloud.labels" (list . "secrets-reader") | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "externalSecrets.readerRoleArn is required" .Values.externalSecrets.readerRoleArn | quote }}
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  labels:
    {{- include "lazycloud.labels" (list . "secrets-reader") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-15"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "externalSecrets.region is required" .Values.externalSecrets.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: secrets-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "lazycloud.labels" (list . "secrets-reader") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: {{ .Values.secrets.name }}
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    {{- if not .Values.externalSecrets.data }}
    {{- fail "externalSecrets.data must map every secret key to a Secrets Manager document and property" }}
    {{- end }}
    {{- range $key := keys .Values.externalSecrets.data | sortAlpha }}
    {{- $ref := index $.Values.externalSecrets.data $key }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ required (printf "externalSecrets.data.%s.document is required" $key) $ref.document }}
        property: {{ required (printf "externalSecrets.data.%s.property is required" $key) $ref.property }}
        {{- if $ref.decodingStrategy }}
        decodingStrategy: {{ $ref.decodingStrategy }}
        {{- end }}
    {{- end }}
{{- end }}
