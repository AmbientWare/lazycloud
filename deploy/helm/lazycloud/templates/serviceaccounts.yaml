{{/*
AWS access comes from EKS Pod Identity associations naming these service
accounts in the release namespace; the chart grants nothing itself.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.server }}
  labels:
    {{- include "lazycloud.labels" (list . "server") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.scheduler }}
  labels:
    {{- include "lazycloud.labels" (list . "scheduler") | nindent 4 }}
automountServiceAccountToken: false
{{- if .Values.telemetry.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.otelCollector }}
  labels:
    {{- include "lazycloud.labels" (list . "otel-collector") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
