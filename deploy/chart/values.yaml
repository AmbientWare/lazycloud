# One tag, naming the commit that produced these images, and it is safe to pin by
# tag here for a reason worth stating: every repository is created
# `image_tag_mutability = "IMMUTABLE"`, so a tag cannot be repointed once pushed.
# The rule against tags is about names that can move; this one cannot.
image:
  registry: ""
  repositoryPrefix: ""
  tag: ""

# Non-secret deployment values, rendered from the deployment module's
# `runtime_configuration`. The list is not decoration: a control plane missing
# one of these starts, reports healthy, and is wrong.
runtime: {}

secrets:
  # The Secret the External Secrets Operator materialises. One Secret, keyed by
  # variable name, so a workload's env is a list of names rather than a list of
  # mappings.
  name: lazycloud-secrets
  # Which Secrets Manager entry each variable is read from, rendered from the
  # deployment module's `secret_environment`. Every workload gets all of these
  # as environment.
  map: {}
  # Entries materialised into the same Secret but mounted as files by the one
  # workload that reads them, from `secret_files`. Kept apart from `map` so a
  # credential one pod needs is not in the environment of every pod.
  files: {}
  refreshInterval: 1h
  # The role the SecretStore assumes, from the deployment module's
  # `secrets_reader_role_arn`. The one role ARN in this chart: every other
  # identity is a Pod Identity association that names the service account from
  # the cluster's side, but a SecretStore is reconciled by an operator shared
  # across namespaces, and the only identity it can present per store is a
  # service account token exchanged for this role.
  readerRoleArn: ""

# Named here and in the identity associations the deployment module declares.
# A rename needs both.
serviceAccounts:
  controlPlane: control-plane
  scheduler: scheduler
  secretsReader: secrets-reader
  wireguardBootstrap: wireguard-bootstrap

wireguard:
  replicas: 2
  platformPeers: 2
  secretName: lazycloud-wireguard
  secretId: ""
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 256Mi }

# The server's ceiling, divided below. Every process holds its own pool, so the
# sum of what they may open is the number that has to fit, and nothing reports
# the overrun except requests failing to connect once it is exceeded. Declared
# here and read by `deploy/platform-deployment/database.tf`, which sets the branch's
# `max_connections` to it. Two control-plane and two scheduler replicas need 31
# with the reserve; 40 leaves a third control-plane replica fitting without a
# database change.
database:
  maxConnections: 40
  # Kept back for an operator's psql and the database's own sessions.
  reserved: 3

# Every workload below states a CPU and a memory request, and the reason is that
# Karpenter sizes the cluster from exactly this. A pod that requests nothing is
# not a pod that uses nothing: it is a pod the node's arithmetic cannot see, so
# the node is provisioned as though it were not there and then runs it anyway.
# Requests are measured from `/api/v1/nodes/<node>/proxy/metrics/resource`
# rather than estimated, because the estimate is what produced a node whose
# requests read 75% while its CPU sat at 85%.
#
# Memory carries a limit and CPU does not. A memory limit is a ceiling on a
# process that would otherwise take the node down with it; a CPU limit is
# throttling, which turns contention into latency in exactly the processes least
# able to absorb it. The request is what apportions CPU under contention, and it
# is the lever used here.

controlPlane:
  replicas: 2
  # 126m sustained on the replica taking traffic, 143m at its peak. The request
  # is several times that because the spike this has to absorb is not a request
  # rate: it is the fleet reconnecting at once, which arrives as a step rather
  # than a ramp.
  resources:
    requests: { cpu: 400m, memory: 1Gi }
    limits: { memory: 2Gi }
  # The artifact fetch, which runs before the container above and is sized on
  # its own. A pod's request is the larger of its init containers and the sum of
  # its containers, so this adds nothing to what the node reserves; what it buys
  # is an init container that is not the first thing descheduled while it pulls
  # 48MB over the network.
  initResources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 256Mi }
  # Each replica owns one synchronous and one asynchronous engine. Both read
  # these settings, so 2 + 1 means six possible connections per replica and 12
  # across the two replicas. The recovery fence holds one asynchronous
  # connection per process; request and stream operations use that engine's
  # remaining capacity without holding a connection for an SSE lifetime.
  database:
    poolSize: 2
    maxOverflow: 1

scheduler:
  replicas: 2
  # The largest consumer in the deployment by a wide margin: 678m sustained,
  # 899m at its peak, 497Mi resident. Whatever this process does not request it
  # takes anyway, out of whatever on the node has no request of its own, so an
  # understated figure here is charged to the ingress and to Argo rather than
  # reported against the scheduler.
  #
  # This is what the process uses, not what it ought to. A tick loop that
  # serialises on Redis leases has no obvious reason to hold two thirds of a
  # core at rest, and that question belongs to `packages/scheduler`. Until it is
  # answered the number has to be the true one.
  resources:
    requests: { cpu: 750m, memory: 640Mi }
    limits: { memory: 1Gi }
  initResources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 256Mi }
  # Each loop stamps its own heartbeat and the probe reads all of them, so a
  # wedged loop is visible while the process it lives in is still up.
  loopNames: [placement, capacity, housekeeping, dispatch]
  # Comfortably above the slowest loop's cadence plus the longest external call
  # it waits on. Housekeeping is the one that sets this: it drains to Stripe and
  # meters against S3, and a threshold near its interval would restart a
  # scheduler for being slow rather than for being stuck.
  livenessMaxAgeSeconds: 300
  # The first housekeeping pass has to finish before any heartbeat exists, and
  # it is the pass that talks to every external service.
  livenessInitialDelaySeconds: 120
  database:
    # One per loop with headroom, not one per loop times what a loop might nest.
    # Sessions are opened around an operation rather than held for a pass, so
    # four loops draw four at their peak; the rest is for a pass that opens a
    # second inside the first. Bounded from above by the server's ceiling, which
    # `lazycloud.databaseBudget` enforces at render time. This and the control
    # plane's four engine pools are what that 25 is divided between.
    poolSize: 5
    maxOverflow: 2

# Single-threaded, and they run to completion before anything serves.
bootstrap:
  database:
    poolSize: 1
    maxOverflow: 1
  # Shared by every Job in the chart. They are brief, but they are not free and
  # they run while the previous release's pods are still serving, which is the
  # moment the node has least to spare.
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

# The instant the published rate card takes effect, which the bootstrap Job
# publishes it at. Authored here rather than rendered with the rest of the
# values, because a rate boundary is a figure customers are charged either side
# of. It is a decision a commit records, not one the infrastructure derives.
#
# In the past, because the first rate ever published has to reach the usage
# already metered under it. A window no rate covers is measured, refused a price
# and never charged. Changing the card's figures moves this instant in the same
# commit; publishing different figures at an instant already published for is
# refused rather than repricing what a customer was shown.
billing:
  ratesEffectiveAt: "2026-01-01T00:00:00Z"

# The class every claim in this chart names. Cluster-scoped, so it is created
# once by `deploy/platform-core` rather than by each deployment's chart.
storage:
  className: lazycloud-ebs

cacheServer:
  replicas: 1
  storage: 20Gi
  # It serves a local directory, so its cost is disk rather than either of
  # these: 28Mi resident and no measurable CPU while nothing pulls from it. The
  # CPU request covers the moment a build does. The memory limit is close enough
  # to the request to mean something, since a ceiling far above anything the
  # process can reach reserves nothing and only inflates what the node appears
  # to have promised.
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

cloudflared:
  # More than one connector, which is how a tunnel is meant to be run and what a
  # single host could not offer.
  replicas: 2
  image: cloudflare/cloudflared:2026.7.3
  tunnelId: ""
  # The zone this deployment answers for, which the ingress rules are written
  # against and the public origin is built from.
  apex: ""
  # Deliberately far above what it measures at rest, which is 7m and 26Mi.
  #
  # This process is the whole product's ingress and its failure mode is
  # scheduling latency rather than throughput. A QUIC connection is declared
  # dead when its keepalive stops arriving, so a connector that cannot run for a
  # few seconds does not serve slowly. It drops every connection it holds and
  # every stream on them, and Cloudflare answers 502 while the origin behind it
  # is idle and healthy. A request is what apportions a contended CPU, so this
  # one is sized for the contention rather than for the average.
  resources:
    requests: { cpu: 150m, memory: 96Mi }
    limits: { memory: 256Mi }

tunnel:
  # The tunnel credentials arrive in the same Secret as everything else.
  credentialsKey: LAZYCLOUD_CLOUDFLARE_TUNNEL_CREDENTIALS

# The platform's own AWS account as capacity, from the module's
# `fleet_connection` output. Registering it is one call with its network,
# authorization, and deployment-owned capacity ceilings.
fleet: {}
