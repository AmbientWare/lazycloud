# Every application image comes from the selected immutable release.
image:
  registry: ""
  repositoryPrefix: ""
  tag: ""
  artifacts: {}

release:
  generation: 0
  active: {}

# Non-secret application settings. Resource facts are added by chart_values.py.
runtime: {}

aws:
  region: ""

secrets:
  name: lazycloud-secrets
  documents: {}
  map:
    LAZYCLOUD_DATABASE_URL: platform
    LAZYCLOUD_DATABASE_DIRECT_URL: platform
    LAZYCLOUD_BACKEND_ROUTE_AUTH_KEY: platform
    LAZYCLOUD_CACHE_SERVICE_TOKEN: platform
    LAZYCLOUD_FLEET_EXTERNAL_ID: platform
    LAZYCLOUD_TOKEN: operator
    LAZYCLOUD_GITHUB_CLIENT_ID: operator
    LAZYCLOUD_GITHUB_CLIENT_SECRET: operator
    LAZYCLOUD_CLOUDFLARE_API_TOKEN: operator
    LAZYCLOUD_STRIPE_API_KEY: operator
    LAZYCLOUD_STRIPE_WEBHOOK_SECRET: operator
    LAZYCLOUD_RESEND_API_KEY: operator
    LAZYCLOUD_RESEND_WEBHOOK_SECRET: operator
    LAZYCLOUD_ADMINISTRATOR_GITHUB_USER_ID: operator
  files:
    LAZYCLOUD_CLOUDFLARE_TUNNEL_CREDENTIALS: platform
  refreshInterval: 1h
  readerRoleArn: ""

# Terraform exports names matching the Pod Identity and IRSA associations.
serviceAccounts: {}

# Each process receives only the credentials it consumes.
environment:
  controlPlane:
    secretKeys: [LAZYCLOUD_DATABASE_URL, LAZYCLOUD_DATABASE_DIRECT_URL, LAZYCLOUD_BACKEND_ROUTE_AUTH_KEY, LAZYCLOUD_CACHE_SERVICE_TOKEN, LAZYCLOUD_GITHUB_CLIENT_ID, LAZYCLOUD_GITHUB_CLIENT_SECRET, LAZYCLOUD_CLOUDFLARE_API_TOKEN, LAZYCLOUD_STRIPE_API_KEY, LAZYCLOUD_STRIPE_WEBHOOK_SECRET, LAZYCLOUD_RESEND_WEBHOOK_SECRET]
    runtimeKeys: &applicationRuntime
      - LAZYCLOUD_WORKSPACE_STORAGE_ISSUER
      - LAZYCLOUD_AWS_WORKSPACE_STORAGE_ROLE_ARN
      - LAZYCLOUD_AWS_STORAGE_ACCESS_BUCKET
      - LAZYCLOUD_AWS_STORAGE_ACCESS_QUEUE_URL
      - LAZYCLOUD_OBJECT_STORE_ENDPOINT_URL
      - LAZYCLOUD_OBJECT_STORE_REGION_NAME
      - LAZYCLOUD_OBJECT_STORE_FORCE_PATH_STYLE
      - LAZYCLOUD_OBJECT_STORE_BUCKET
      - LAZYCLOUD_OBJECT_STORE_WORKSPACE_BUCKET_PREFIX
      - LAZYCLOUD_WORKLOAD_IMAGE_REGISTRY_REPOSITORY
      - LAZYCLOUD_AWS_CONNECTION_CONTROL_PRINCIPAL_ARN
      - LAZYCLOUD_GATEWAY_PUBLIC_HTTP_URL
      - LAZYCLOUD_GITHUB_REDIRECT_URI
      - LAZYCLOUD_REDIS_URL
      - LAZYCLOUD_RELEASE_MANIFEST_URL
      - LAZYCLOUD_PLATFORM_CAPACITY_HETZNER_IMAGES
  scheduler:
    secretKeys: [LAZYCLOUD_DATABASE_URL, LAZYCLOUD_BACKEND_ROUTE_AUTH_KEY, LAZYCLOUD_CACHE_SERVICE_TOKEN, LAZYCLOUD_CLOUDFLARE_API_TOKEN, LAZYCLOUD_STRIPE_API_KEY, LAZYCLOUD_RESEND_API_KEY]
    runtimeKeys: *applicationRuntime
  agentArtifact:
    secretKeys: []
    runtimeKeys: [LAZYCLOUD_RELEASE_MANIFEST_URL]
  cacheServer:
    secretKeys: [LAZYCLOUD_CACHE_SERVICE_TOKEN]
    runtimeKeys: []
  databaseBootstrap:
    secretKeys: [LAZYCLOUD_DATABASE_URL, LAZYCLOUD_DATABASE_DIRECT_URL]
    runtimeKeys: []
  logRetention:
    secretKeys: [LAZYCLOUD_DATABASE_URL]
    runtimeKeys: []
  administratorBootstrap:
    secretKeys: [LAZYCLOUD_DATABASE_URL, LAZYCLOUD_DATABASE_DIRECT_URL, LAZYCLOUD_TOKEN, LAZYCLOUD_ADMINISTRATOR_GITHUB_USER_ID]
    runtimeKeys: [LAZYCLOUD_OBJECT_STORE_ENDPOINT_URL, LAZYCLOUD_OBJECT_STORE_REGION_NAME, LAZYCLOUD_OBJECT_STORE_FORCE_PATH_STYLE, LAZYCLOUD_OBJECT_STORE_BUCKET, LAZYCLOUD_OBJECT_STORE_WORKSPACE_BUCKET_PREFIX, LAZYCLOUD_GATEWAY_PUBLIC_HTTP_URL]
  billingCatalog:
    secretKeys: [LAZYCLOUD_STRIPE_API_KEY]
    runtimeKeys: [LAZYCLOUD_STRIPE_ACCOUNT_ID]
  billingRates:
    secretKeys: [LAZYCLOUD_DATABASE_URL, LAZYCLOUD_DATABASE_DIRECT_URL]
    runtimeKeys: []
  fleetEnsure:
    secretKeys: [LAZYCLOUD_TOKEN, LAZYCLOUD_FLEET_EXTERNAL_ID]
    runtimeKeys: []

# Bump only affected consumers after External Secrets has refreshed rotated values.
secretRevisions:
  controlPlane: "1"
  scheduler: "1"
  cacheServer: "1"
  cloudflared: "1"
  wireguard: "1"

wireguard:
  replicas: 2
  database:
    poolSize: 1
    maxOverflow: 0
  secretName: lazycloud-wireguard
  secretId: ""
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 256Mi }

# Server ceiling comes from the infrastructure descriptor.
database:
  maxConnections: 0
  poolerMaxConnections: 0
  # Kept back for an operator's psql and the database's own sessions.
  reserved: 3

# Karpenter sizes nodes from requests. Memory limits bound process growth;
# CPU stays uncapped to allow bursts during contention.

controlPlane:
  replicas: 2
  # Reserve headroom for simultaneous fleet reconnects.
  resources:
    requests: { cpu: 400m, memory: 1Gi }
    limits: { memory: 2Gi }
  initResources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 256Mi }
  # Each replica has synchronous and asynchronous pools; SSE does not hold a session.
  database:
    poolSize: 2
    maxOverflow: 1

scheduler:
  replicas: 2
  minReadySeconds: 35
  terminationGracePeriodSeconds: 30
  resources:
    requests: { cpu: 750m, memory: 640Mi }
    limits: { memory: 1Gi }
  initResources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 256Mi }
  # The health command checks every loop. Allow for housekeeping's external calls.
  livenessMaxAgeSeconds: 300
  # Every loop must finish its first pass before the process is healthy.
  livenessInitialDelaySeconds: 120
  database:
    # Client pools use PgBouncer; Terraform bounds its PostgreSQL backend pool.
    poolSize: 5
    maxOverflow: 2

# Single-threaded, and they run to completion before anything serves.
bootstrap:
  database:
    poolSize: 1
    maxOverflow: 1
  # Jobs share nodes with the previous release during rollout.
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

# Exported by platform-core through the infrastructure descriptor.
storage:
  className: ""

cacheServer:
  replicas: 1
  storage: 20Gi
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

cloudflared:
  replicas: 2
  image: cloudflare/cloudflared:2026.7.3
  tunnelId: ""
  apex: ""
  # Keepalive latency under CPU contention can drop every tunnel connection.
  resources:
    requests: { cpu: 150m, memory: 96Mi }
    limits: { memory: 256Mi }

tunnel:
  # The tunnel credentials arrive in the same Secret as everything else.
  credentialsKey: LAZYCLOUD_CLOUDFLARE_TUNNEL_CREDENTIALS

fleet: {}
