# One tag, naming the commit that produced these images, and it is safe to pin by
# tag here for a reason worth stating: every repository is created
# `image_tag_mutability = "IMMUTABLE"`, so a tag cannot be repointed once pushed.
# The rule against tags is about names that can move; this one cannot.
image:
  registry: ""
  repositoryPrefix: ""
  tag: ""

# Non-secret deployment values, rendered from the platform module's
# `runtime_configuration`. The list is not decoration: a control plane missing
# one of these starts, reports healthy, and is wrong.
runtime: {}

secrets:
  # The Secret the External Secrets Operator materialises. One Secret, keyed by
  # variable name, so a workload's env is a list of names rather than a list of
  # mappings.
  name: lazycloud-secrets
  # Which Secrets Manager entry each variable is read from, rendered from the
  # platform module's `secret_environment`.
  map: {}
  refreshInterval: 1h

# Named here and in the Pod Identity associations the platform module declares.
# A rename needs both.
serviceAccounts:
  controlPlane: control-plane
  scheduler: scheduler
  externalSecrets: external-secrets

controlPlane:
  replicas: 1
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { memory: 2Gi }

scheduler:
  replicas: 1
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }

# The class every claim in this chart names, created here because Auto Mode
# provides the driver and no class.
storage:
  className: lazycloud-ebs

cacheServer:
  replicas: 1
  storage: 20Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

cloudflared:
  # More than one connector, which is how a tunnel is meant to be run and what a
  # single host could not offer.
  replicas: 2
  image: cloudflare/cloudflared:2026.7.3
  tunnelId: ""
  # The zone this deployment answers for, which the ingress rules are written
  # against and the public origin is built from.
  apex: ""

tunnel:
  # The tunnel credentials arrive in the same Secret as everything else.
  credentialsKey: LAZYCLOUD_CLOUDFLARE_TUNNEL_CREDENTIALS
