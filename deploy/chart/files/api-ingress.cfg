global
    maxconn 4096
    nbthread 2

defaults
    mode http
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h

resolvers system
    parse-resolv-conf
    hold valid 5s

frontend api
    bind "${LAZYCLOUD_PUBLIC_INGRESS_BIND}"
    bind "${LAZYCLOUD_PRIVATE_INGRESS_BIND}"
    monitor-uri /livez
    acl private_listener dst_port 9001
    acl control_host hdr(host),field(1,:) -i "${LAZYCLOUD_INGRESS_HOST}" localhost 127.0.0.1 api-ingress control-plane
    acl control_host hdr_ip(host) -m found
    acl internal_path path_reg ^/(worker-repository|metrics)(/|$)
    acl runtime_path path_reg ^(/worker-repository(/|$)|/api/v1/functions/(claim|set-result|monitor)$|/gateway/(agents|connections/certificate|provider-nodes|tasks|functions/retire)(/|$))
    acl execution_path path_reg ^(/api/v1/(functions|endpoints|asgi|pods|shells|ssh|artifacts|maps|simplequeues|volumes|tasks)(/|$)|/gateway/containers(/|$)|/(pod|sandbox)(/|$))
    http-request deny deny_status 404 if !private_listener control_host internal_path
    use_backend execution if !private_listener !control_host
    use_backend runtime if runtime_path
    use_backend execution if execution_path
    default_backend management

backend management
    server management "${LAZYCLOUD_MANAGEMENT_API_ADDRESS}" resolvers system init-addr libc,none

backend execution
    server execution "${LAZYCLOUD_EXECUTION_API_ADDRESS}" resolvers system init-addr libc,none

backend runtime
    server runtime "${LAZYCLOUD_RUNTIME_API_ADDRESS}" resolvers system init-addr libc,none
