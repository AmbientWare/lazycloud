apiVersion: batch/v1
kind: CronJob
metadata:
  name: log-retention
spec:
  schedule: "*/15 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: log-retention
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: log-retention
              image: {{ include "lazycloud.image" (list . "cli") }}
              command: ["lazycloud-admin", "--json", "maintenance", "prune-logs"]
              env:
                {{- include "lazycloud.env" (list . "logRetention") | nindent 16 }}
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 256Mi
