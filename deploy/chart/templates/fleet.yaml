{{/*
The platform's own account, registered as capacity.

The shared fleet is a connection like a customer's, because there is one way in
the code to say "an account we may provision in" and even an internal pool is
created holding a connection id. Ours differs only in that the module builds the
network and the role rather than a stack somebody deploys into their own account.

That leaves one durable record, and this is what creates it. A deploy runs it
every time so the fleet is registered by the thing that ships the release rather
than by whoever remembers, and a fresh database after a reset comes back with its
capacity instead of an empty control plane that accepts work it can place
nowhere.

Wave 1, alone among the Jobs in running after the workloads rather than before
them. It registers through the public API rather than against the database, so
the control plane has to be serving before it can say anything. The others reach
their own stores directly and go first.

Idempotent, and deliberately not a reconciler: a connection already present is
left alone rather than replaced, because reconnecting mints a new authorization
generation and doing that on every deploy would churn the credential every pool
depends on.
*/}}
{{- if .Values.fleet }}
apiVersion: batch/v1
kind: Job
metadata:
  name: fleet-ensure
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # Says which side of the workloads this belongs on, so the ordering can be
    # checked rather than read. A Job after the Deployments looks exactly like
    # the deadlock the negative waves exist to prevent, and only the direction
    # of the dependency tells the two apart.
    lazycloud.dev/needs-control-plane: "true"
spec:
  backoffLimit: 5
  template:
    metadata:
      name: fleet-ensure
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccounts.controlPlane }}
      containers:
        - name: fleet-ensure
          image: {{ include "lazycloud.image" (list . "database-bootstrap") }}
          command:
            - lazycloud-admin
            - --json
            - fleet
            - ensure
            - --account-id
            - {{ required "fleet.account_id is required" .Values.fleet.account_id | quote }}
            - --role-arn
            - {{ required "fleet.role_arn is required" .Values.fleet.role_arn | quote }}
            - --vpc-id
            - {{ required "fleet.vpc_id is required" .Values.fleet.vpc_id | quote }}
            {{- range .Values.fleet.subnet_ids }}
            - --subnet-id
            - {{ . | quote }}
            {{- end }}
            - --security-group-id
            - {{ required "fleet.security_group_id is required" .Values.fleet.security_group_id | quote }}
          env:
            {{- include "lazycloud.env" . | nindent 12 }}
            # The cluster-local Service rather than the public origin. This call
            # never leaves the cluster, so routing it out through the tunnel and
            # back would make the fleet depend on DNS and an edge that have
            # nothing to do with it.
            - name: LAZYCLOUD_ENDPOINT
              value: http://control-plane:9000
{{- end }}
