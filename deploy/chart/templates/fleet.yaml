{{/*
The platform's own account, registered as capacity.

The shared fleet is a connection like a customer's, because there is one way in
the code to say "an account we may provision in" and even an internal pool is
created holding a connection id. Ours differs only in that the module builds the
network and the role rather than a stack somebody deploys into their own account.

That leaves one durable record, and this is what creates it. A deploy runs it
every time so the fleet is registered by the thing that ships the release rather
than by whoever remembers, and a fresh database after a reset comes back with its
capacity instead of an empty control plane that accepts work it can place
nowhere.

Wave 1, alone among the Jobs in running after the workloads rather than before
them. It registers through the public API rather than against the database, so
the control plane has to be serving before it can say anything. The others reach
their own stores directly and go first.

Idempotent. A connection already present keeps its authorization and is restated
as the fleet's, rather than replaced: reconnecting mints a new authorization
generation, and doing that on every deploy would churn the credential every pool
depends on. What the restatement corrects is which account this is and which pool
its capacity feeds, both of which the deployment knows and neither of which the
authorization has anything to do with.
*/}}
{{- if .Values.fleet }}
apiVersion: batch/v1
kind: Job
metadata:
  name: fleet-ensure
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # Deleted and recreated rather than patched or replaced in place. A Job's
    # pod template is immutable, so the image tag moving with the commit makes
    # every later sync fail to apply this one, and the wave it is in never
    # completes: the release stops at a Job that already ran and reports an
    # immutable field rather than anything about the deploy.
    #
    # `Force` is what makes it a delete, and it is not optional here. `Replace`
    # alone sends the rendered manifest as it stands, and Kubernetes generates a
    # Job's selector and its pod labels at creation, so what is sent back is
    # missing both and is refused for a selector that does not match a template
    # it also does not have.
    #
    # Re-running is safe because each of these is idempotent, and for two of
    # them running every time is the point.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
    # Says which side of the workloads this belongs on, so the ordering can be
    # checked rather than read. A Job after the Deployments looks exactly like
    # the deadlock the negative waves exist to prevent, and only the direction
    # of the dependency tells the two apart.
    lazycloud.dev/needs-control-plane: "true"
spec:
  backoffLimit: 5
  template:
    metadata:
      name: fleet-ensure
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccounts.controlPlane }}
      containers:
        - name: fleet-ensure
          image: {{ include "lazycloud.image" (list . "database-bootstrap") }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              # Registering leaves the connection awaiting authorization, and
              # the authorization is a role this deployment's own module already
              # created. So validating is the second half of the same step
              # rather than something to come back for: a connection that is
              # registered and never validated holds no capacity, which reads
              # from the outside as a fleet that exists and cannot launch.
              lazycloud-admin --json fleet ensure \
                --account-id {{ required "fleet.account_id is required" .Values.fleet.account_id | quote }} \
                --role-arn {{ required "fleet.role_arn is required" .Values.fleet.role_arn | quote }} \
                --vpc-id {{ required "fleet.vpc_id is required" .Values.fleet.vpc_id | quote }} \
                {{- range .Values.fleet.subnet_ids }}
                --subnet-id {{ . | quote }} \
                {{- end }}
                --security-group-id {{ required "fleet.security_group_id is required" .Values.fleet.security_group_id | quote }} \
                --max-cpu {{ required "fleet.max_cpu_instances is required" .Values.fleet.max_cpu_instances }} \
                --max-gpu {{ required "fleet.max_gpu_instances is required" .Values.fleet.max_gpu_instances }}
              lazycloud-admin --json cloud validate
          env:
            {{- include "lazycloud.env" . | nindent 12 }}
            # The cluster-local Service rather than the public origin. This call
            # never leaves the cluster, so routing it out through the tunnel and
            # back would make the fleet depend on DNS and an edge that have
            # nothing to do with it.
            - name: LAZYCLOUD_ENDPOINT
              value: http://control-plane:9000
          resources:
            {{- toYaml .Values.bootstrap.resources | nindent 12 }}
{{- end }}
