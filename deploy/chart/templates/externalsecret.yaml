{{/* Environment variables and subPath mounts require a controlled pod restart after rotation. */}}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "aws.region is required" .Values.aws.region }}
      # This store's own identity, not the operator's. The operator serves
      # every namespace, so whatever it held itself would be one identity for
      # all of them. It mints a token for the service account named here,
      # exchanges it for the role that account's annotation names, and the
      # role's trust admits only this namespace's subject. A store copied into
      # another namespace assumes nothing.
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.serviceAccounts.secretsReader }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: {{ .Values.secrets.name }}
    creationPolicy: Owner
  data:
  {{- $capacitySecrets := include "lazycloud.capacitySecrets" . | mustFromJson }}
  {{- range $variable, $secret := merge (deepCopy .Values.secrets.map) .Values.secrets.files $capacitySecrets }}
    - secretKey: {{ $variable }}
      remoteRef:
        key: {{ required (printf "secrets.documents.%s is required" $secret) (index $.Values.secrets.documents $secret) }}
        property: {{ $variable }}
  {{- end }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.wireguard.secretName }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: {{ .Values.wireguard.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: server-private-key
      remoteRef:
        key: {{ required "wireguard.secretId is required" .Values.wireguard.secretId }}
        property: LAZYCLOUD_WIREGUARD_SERVER_PRIVATE_KEY
    - secretKey: server-public-key
      remoteRef:
        key: {{ .Values.wireguard.secretId }}
        property: LAZYCLOUD_WIREGUARD_SERVER_PUBLIC_KEY
  {{- range $index := until (int .Values.wireguard.platformPeers) }}
    - secretKey: platform-{{ $index }}-private-key
      remoteRef:
        key: {{ $.Values.wireguard.secretId }}
        property: LAZYCLOUD_WIREGUARD_PLATFORM_{{ $index }}_PRIVATE_KEY
    - secretKey: platform-{{ $index }}-public-key
      remoteRef:
        key: {{ $.Values.wireguard.secretId }}
        property: LAZYCLOUD_WIREGUARD_PLATFORM_{{ $index }}_PUBLIC_KEY
  {{- end }}
