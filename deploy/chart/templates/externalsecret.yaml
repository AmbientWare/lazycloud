{{/*
Secrets Manager remains the authority; the cluster holds a copy with a lifetime.

`secrets.map` is the platform module's `secret_environment` output unchanged --
variable name to the entry it is read from -- so the two cannot disagree about
where a value lives. Rotating in Secrets Manager reaches the pods on the refresh
interval without a redeploy, which is the property a sealed secret in git does
not have.
*/}}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "runtime.LAZYCLOUD_OBJECT_STORE_REGION_NAME is required" .Values.runtime.LAZYCLOUD_OBJECT_STORE_REGION_NAME }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.serviceAccounts.externalSecrets }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: {{ .Values.secrets.name }}
    creationPolicy: Owner
  data:
  {{- range $variable, $secret := .Values.secrets.map }}
    - secretKey: {{ $variable }}
      remoteRef:
        key: {{ $secret }}
        # A secret with no value is normal rather than fatal: several are minted
        # by bootstrap and an unchosen telemetry backend is a deployment that
        # simply does not export. Without this the whole ExternalSecret fails and
        # every workload waits on a Secret that never appears.
        conversionStrategy: Default
        decodingStrategy: None
  {{- end }}
