{{/*
Secrets Manager remains the authority; the cluster holds a copy with a lifetime.

`secrets.map` and `secrets.files` are the platform module's `secret_environment`
and `secret_files` outputs unchanged, a variable name against the entry it is
read from, so the two cannot disagree about where a value lives. Both land in
this Secret; only `map` becomes environment.

Each entry is a JSON document holding many variables, and every variable is
named here rather than extracted wholesale. `dataFrom` would fetch the document
and copy whatever it happened to contain, which is the same thing as having no
list: a variable nobody wrote would be missing from the Secret and the first
report of it would be a pod that will not start. Naming them means the render
carries the expectation and CI can check it. Rotating in Secrets Manager reaches the pods on the
refresh interval without a redeploy, which is the property a sealed secret in
git does not have.

Every entry resolves. A container with no version is not an empty secret, it is
`ResourceNotFoundException`, and one of those fails the whole materialisation
rather than the single key: an unchosen telemetry backend would stop the control
plane from receiving its database URL. Terraform gives every container an empty
first version so that absence answers as a blank rather than as a 404.
*/}}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "runtime.LAZYCLOUD_OBJECT_STORE_REGION_NAME is required" .Values.runtime.LAZYCLOUD_OBJECT_STORE_REGION_NAME }}
      # No `auth` block. Pod Identity injects
      # `AWS_CONTAINER_CREDENTIALS_FULL_URI` into the operator's pod and the SDK
      # reads it from the ambient chain, so naming a method here selects a
      # different one: a `jwt` block asks for the service account token exchange
      # that IRSA used, finds no federation to exchange against, and reports
      # `unable to create client` rather than saying which credential it wanted.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: {{ .Values.secrets.name }}
    creationPolicy: Owner
  data:
  {{- range $variable, $secret := merge (deepCopy .Values.secrets.map) .Values.secrets.files }}
    - secretKey: {{ $variable }}
      remoteRef:
        key: {{ $secret }}
        property: {{ $variable }}
  {{- end }}
