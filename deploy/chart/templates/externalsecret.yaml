{{/*
Secrets Manager remains the authority; the cluster holds a copy with a lifetime.

The platform, operator Pangolin credential, and generated Pangolin identities
land in separate Kubernetes Secrets. That preserves their different readers and
lets Argo create the generated identity Secret only after the bootstrap Job has
written the authoritative Secrets Manager version.

Each entry is a JSON document holding many variables, and every variable is
named here rather than extracted wholesale. `dataFrom` would fetch the document
and copy whatever it happened to contain, which is the same thing as having no
list: a variable nobody wrote would be missing from the Secret and the first
report of it would be a pod that will not start. Naming them means the render
carries the expectation and CI can check it. Rotating in Secrets Manager reaches
the pods on the refresh interval without a redeploy, which is the property a
sealed secret in git does not have.

Every shared and operator entry must have a current version before its
ExternalSecret wave. The generated Pangolin document is different: its
ExternalSecrets run only after the bootstrap has written the first version, so
Terraform never owns a credential version the Job could later overwrite.
*/}}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "runtime.LAZYCLOUD_OBJECT_STORE_REGION_NAME is required" .Values.runtime.LAZYCLOUD_OBJECT_STORE_REGION_NAME }}
      # No `auth` block. Pod Identity injects
      # `AWS_CONTAINER_CREDENTIALS_FULL_URI` into the operator's pod and the SDK
      # reads it from the ambient chain, so naming a method here selects a
      # different one: a `jwt` block asks for the service account token exchange
      # that IRSA used, finds no federation to exchange against, and reports
      # `unable to create client` rather than saying which credential it wanted.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: {{ .Values.secrets.name }}
    creationPolicy: Owner
  data:
  {{- range $variable, $secret := .Values.secrets.map }}
    - secretKey: {{ $variable }}
      remoteRef:
        key: {{ $secret }}
        property: {{ $variable }}
  {{- end }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.pangolinControl.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: {{ .Values.secrets.pangolinControl.name }}
    creationPolicy: Owner
  data:
  {{- range $variable, $secret := .Values.secrets.pangolinControl.map }}
    - secretKey: {{ $variable }}
      remoteRef:
        key: {{ $secret }}
        property: {{ $variable }}
  {{- end }}
---
{{- range $scope := list "provider" "sites" "clients" }}
{{- $runtime := index $.Values.secrets.pangolinRuntime $scope }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $runtime.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: {{ $.Values.secrets.refreshInterval }}
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: {{ $runtime.name }}
    creationPolicy: Owner
  data:
  {{- range $variable, $secret := $runtime.map }}
    - secretKey: {{ $variable }}
      remoteRef:
        key: {{ $secret }}
        property: {{ $variable }}
  {{- end }}
---
{{- end }}
