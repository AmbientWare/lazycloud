{{/* Environment variables and subPath mounts require a controlled pod restart after rotation. */}}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "aws.region is required" .Values.aws.region }}
      # IAM trust scopes this service account to the deployment namespace.
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.serviceAccounts.secretsReader }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: {{ .Values.secrets.name }}
    creationPolicy: Owner
  data:
  {{- range $variable, $secret := merge (deepCopy .Values.secrets.map) .Values.secrets.files }}
    - secretKey: {{ $variable }}
      remoteRef:
        key: {{ required (printf "secrets.documents.%s is required" $secret) (index $.Values.secrets.documents $secret) }}
        property: {{ $variable }}
  {{- end }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.wireguard.secretName }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: {{ .Values.wireguard.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: server-public-key
      remoteRef:
        key: {{ required "wireguard.secretId is required" .Values.wireguard.secretId }}
        property: LAZYCLOUD_WIREGUARD_SERVER_PUBLIC_KEY
  {{- range $position, $gateway := .Values.wireguard.gateways }}
  {{- $index := int $gateway.index }}
  {{- $directory := ternary "server" (printf "gateway-%d" $index) (eq $index 0) }}
    - secretKey: {{ $directory }}-private-key
      remoteRef:
        key: {{ required "wireguard.secretId is required" $.Values.wireguard.secretId }}
        property: {{ ternary "LAZYCLOUD_WIREGUARD_SERVER_PRIVATE_KEY" (printf "LAZYCLOUD_WIREGUARD_GATEWAY_%d_PRIVATE_KEY" $index) (eq $index 0) }}
  {{- end }}
  {{- range $index := until (int .Values.controlPlane.replicas) }}
    - secretKey: platform-{{ $index }}-private-key
      remoteRef:
        key: {{ $.Values.wireguard.secretId }}
        property: LAZYCLOUD_WIREGUARD_PLATFORM_{{ $index }}_PRIVATE_KEY
    - secretKey: platform-{{ $index }}-public-key
      remoteRef:
        key: {{ $.Values.wireguard.secretId }}
        property: LAZYCLOUD_WIREGUARD_PLATFORM_{{ $index }}_PUBLIC_KEY
  {{- end }}
