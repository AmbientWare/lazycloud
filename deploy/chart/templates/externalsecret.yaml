{{/*
Secrets Manager remains the authority; the cluster holds a copy with a lifetime.

`secrets.map` and `secrets.files` are the platform module's `secret_environment`
and `secret_files` outputs unchanged, a variable name against the entry it is
read from, so the two cannot disagree about where a value lives. Both land in
this Secret; only `map` becomes environment.

Each entry is a JSON document holding many variables, and every variable is
named here rather than extracted wholesale. `dataFrom` would fetch the document
and copy whatever it happened to contain, which is the same thing as having no
list: a variable nobody wrote would be missing from the Secret and the first
report of it would be a pod that will not start. Naming them means the render
carries the expectation and CI can check it. Rotating in Secrets Manager reaches the pods on the
refresh interval without a redeploy, which is the property a sealed secret in
git does not have.

Every entry resolves. A container with no version is not an empty secret, it is
`ResourceNotFoundException`, and one of those fails the whole materialisation
rather than the single key. Terraform writes the `platform` document on every
apply; the `operator` document is written by a person before the first sync,
and the `wireguard` one by the bootstrap Job in the wave before this reads it.
*/}}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "runtime.LAZYCLOUD_OBJECT_STORE_REGION_NAME is required" .Values.runtime.LAZYCLOUD_OBJECT_STORE_REGION_NAME }}
      # This store's own identity, not the operator's. The operator serves
      # every namespace, so whatever it held itself would be one identity for
      # all of them. It mints a token for the service account named here,
      # exchanges it for the role that account's annotation names, and the
      # role's trust admits only this namespace's subject. A store copied into
      # another namespace assumes nothing.
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.serviceAccounts.secretsReader }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: {{ .Values.secrets.name }}
    creationPolicy: Owner
  data:
  {{- range $variable, $secret := merge (deepCopy .Values.secrets.map) .Values.secrets.files }}
    - secretKey: {{ $variable }}
      remoteRef:
        key: {{ $secret }}
        property: {{ $variable }}
  {{- end }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.wireguard.secretName }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: {{ .Values.wireguard.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: server-private-key
      remoteRef:
        key: {{ required "wireguard.secretId is required" .Values.wireguard.secretId }}
        property: LAZYCLOUD_WIREGUARD_SERVER_PRIVATE_KEY
    - secretKey: server-public-key
      remoteRef:
        key: {{ .Values.wireguard.secretId }}
        property: LAZYCLOUD_WIREGUARD_SERVER_PUBLIC_KEY
  {{- range $index := until (int .Values.wireguard.platformPeers) }}
    - secretKey: platform-{{ $index }}-private-key
      remoteRef:
        key: {{ $.Values.wireguard.secretId }}
        property: LAZYCLOUD_WIREGUARD_PLATFORM_{{ $index }}_PRIVATE_KEY
    - secretKey: platform-{{ $index }}-public-key
      remoteRef:
        key: {{ $.Values.wireguard.secretId }}
        property: LAZYCLOUD_WIREGUARD_PLATFORM_{{ $index }}_PUBLIC_KEY
  {{- end }}
