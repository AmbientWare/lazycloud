{{/*
Each workload's AWS identity, assumed through the cluster's OIDC provider. The
platform module's trust policy names these service accounts exactly, so a rename
here without one there produces a pod that cannot reach AWS at all.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.controlPlane }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "roles.controlPlane is required" .Values.roles.controlPlane }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.scheduler }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "roles.controlPlane is required" .Values.roles.controlPlane }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.externalSecrets }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "roles.externalSecrets is required" .Values.roles.externalSecrets }}
