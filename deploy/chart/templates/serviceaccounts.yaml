{{/*
Plain service accounts, with no role annotation.

Which AWS identity each holds is a Pod Identity association declared beside the
cluster. The names here and the names there are one decision, and the cluster
rejects an association naming a service account that does not exist rather than
leaving a pod to authenticate as nobody.

Ahead of everything, because the bootstrap Jobs run as these and a Job naming a
service account that does not exist yet is not queued, it is rejected.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.controlPlane }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.scheduler }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.wireguardBootstrap }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
