{{/*
Plain service accounts, with no role annotation, and one that carries one.

Which AWS identity each workload holds is a Pod Identity association declared
beside the cluster. The names here and the names there are one decision, and
the cluster rejects an association naming a service account that does not exist
rather than leaving a pod to authenticate as nobody.

`secrets-reader` is the exception. No pod runs as it: the External Secrets
operator, installed once for every namespace, mints a token for it and exchanges
that token for the role the annotation names. The role's trust names this
namespace and this account, so the annotation is the chart telling the operator
which role to ask for, not the thing that grants it.

Ahead of everything, because the bootstrap Jobs run as these and a Job naming a
service account that does not exist yet is not queued, it is rejected.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.controlPlane }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.scheduler }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.wireguardBootstrap }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccounts.secretsReader }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    eks.amazonaws.com/role-arn: {{ required "secrets.readerRoleArn is required; the deployment module's secrets_reader_role_arn output" .Values.secrets.readerRoleArn }}
