{{- $root := . -}}
{{- range $ordinal := until (int $root.Values.pangolin.site.replicas) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pangolin-site-{{ $ordinal }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pangolin-site
      lazycloud.dev/ordinal: {{ $ordinal | quote }}
  template:
    metadata:
      labels:
        app: pangolin-site
        lazycloud.dev/ordinal: {{ $ordinal | quote }}
    spec:
      topologySpreadConstraints:
        {{- include "lazycloud.spreadOrdinalSetAcrossNodes" "pangolin-site" | nindent 8 }}
      volumes:
        - name: pangolin-site-credentials
          secret:
            secretName: {{ $root.Values.secrets.pangolinRuntime.sites.name }}
            items:
              - key: LAZYCLOUD_PANGOLIN_PLATFORM_CONNECTOR_{{ $ordinal }}_ID
                path: id
              - key: LAZYCLOUD_PANGOLIN_PLATFORM_CONNECTOR_{{ $ordinal }}_SECRET
                path: secret
      containers:
        - name: newt
          image: {{ $root.Values.pangolin.site.image }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              test -s /run/lazycloud/pangolin-site/id
              test -s /run/lazycloud/pangolin-site/secret
              export NEWT_ID="$(cat /run/lazycloud/pangolin-site/id)"
              export NEWT_SECRET="$(cat /run/lazycloud/pangolin-site/secret)"
              exec newt
          env:
            - name: PANGOLIN_ENDPOINT
              value: {{ required "runtime.LAZYCLOUD_PANGOLIN_ENDPOINT is required" $root.Values.runtime.LAZYCLOUD_PANGOLIN_ENDPOINT | quote }}
            - name: DISABLE_CLIENTS
              value: "true"
            - name: HEALTH_FILE
              value: /tmp/healthy
          volumeMounts:
            - name: pangolin-site-credentials
              mountPath: /run/lazycloud/pangolin-site
              readOnly: true
          resources:
            {{- toYaml $root.Values.pangolin.site.resources | nindent 12 }}
          startupProbe:
            exec:
              command: ["/bin/sh", "-ec", "test -f /tmp/healthy"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "test -f /tmp/healthy"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/bin/sh", "-ec", "test -f /tmp/healthy"]
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: pangolin-site
spec:
  clusterIP: None
  selector:
    app: pangolin-site
