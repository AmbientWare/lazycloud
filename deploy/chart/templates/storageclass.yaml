{{/*
The class Auto Mode does not create for you.

Auto Mode runs the EBS CSI driver but declares no StorageClass, and the cluster's
only other one is a legacy `gp2` that is not marked default. A claim naming
neither binds to nothing and reports "no storage class is set", which stalls the
whole sync: Argo waits for the claim to become healthy and every resource behind
it waits with it.

Default, so a claim that names no class gets this rather than nothing, and in
the first wave, because a claim applied before it exists records an empty class
and that field cannot be changed afterwards.
*/}}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storage.className }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
provisioner: ebs.csi.eks.amazonaws.com
volumeBindingMode: WaitForFirstConsumer
# The cache is rebuilt on a miss, so a volume that outlived its claim would be
# paid for and never read again.
reclaimPolicy: Delete
allowVolumeExpansion: true
parameters:
  type: gp3
  encrypted: "true"
