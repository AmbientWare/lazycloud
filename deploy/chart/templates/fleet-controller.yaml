apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-controller
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  replicas: {{ .Values.fleetController.replicas }}
  minReadySeconds: {{ .Values.fleetController.minReadySeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: fleet-controller
  template:
    metadata:
      annotations:
        checksum/aws-chain: {{ include (print $.Template.BasePath "/aws-chain.yaml") . | sha256sum }}
        lazycloud.dev/secret-revision: {{ .Values.secretRevisions.fleetController | quote }}
      labels:
        app: fleet-controller
    spec:
      terminationGracePeriodSeconds: {{ .Values.fleetController.terminationGracePeriodSeconds }}
      serviceAccountName: {{ .Values.serviceAccounts.scheduler }}
      topologySpreadConstraints:
        {{- include "lazycloud.spreadAcrossNodes" "fleet-controller" | nindent 8 }}
      volumes:
        - name: active-release
          configMap:
            name: active-release
            optional: true
        - name: agent-binarys
          emptyDir: {}
        - name: aws-chain
          configMap:
            name: aws-chain
      initContainers:
        # Release validation requires the agent artifact alongside the worker image and AMIs.
        - name: agent-artifact
          image: {{ include "lazycloud.image" (list . "database-bootstrap") }}
          command:
            - lazycloud-admin
            - --json
            - release
            - fetch-agent
            - --into
            - /var/lib/lazycloud/agent-binarys
          env:
            {{- include "lazycloud.env" (list . "agentArtifact") | nindent 12 }}
          volumeMounts:
            - name: agent-binarys
              mountPath: /var/lib/lazycloud/agent-binarys
          resources:
            {{- toYaml .Values.fleetController.initResources | nindent 12 }}
      containers:
        - name: fleet-controller
          image: {{ include "lazycloud.image" (list . "scheduler") }}
          command: [lazycloud-fleet-controller, --container-limit, "100"]
          env:
            {{- include "lazycloud.env" (list . "fleetController") | nindent 12 }}
            {{- include "lazycloud.databaseEnv" .Values.fleetController.database | nindent 12 }}
            - name: LAZYCLOUD_AGENT_BINARY_DIR
              value: /var/lib/lazycloud/agent-binarys
            - name: AWS_CONFIG_FILE
              value: /run/lazycloud/aws/config
            # Not AWS_PROFILE: boto applies that to every client in the
            # process, and only calls into a connected account belong on the
            # control principal.
            - name: LAZYCLOUD_AWS_CONNECTION_PROFILE
              value: {{ include "lazycloud.awsProfile" . | quote }}
          volumeMounts:
            - name: agent-binarys
              mountPath: /var/lib/lazycloud/agent-binarys
            - name: aws-chain
              mountPath: /run/lazycloud/aws
            - name: active-release
              mountPath: /run/lazycloud/release
              readOnly: true
          readinessProbe:
            exec:
              command:
                - python
                - -m
                - scheduler_app.fleet_health
                - --max-age-seconds
                - {{ .Values.fleetController.livenessMaxAgeSeconds | quote }}
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - python
                - -m
                - scheduler_app.fleet_health
                - --max-age-seconds
                - {{ .Values.fleetController.livenessMaxAgeSeconds | quote }}
            initialDelaySeconds: {{ .Values.fleetController.livenessInitialDelaySeconds }}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.fleetController.resources | nindent 12 }}
