{{/*
Bootstrap: the catalog and the schema, then the administrator created against it.

Argo sync waves rather than `depends_on`: the schema must exist before an
administrator can be created against it. Running them together produces a
bootstrap that fails on a table it cannot see, which reads as a database problem.

All three run in negative waves, ahead of every workload. That is the order the
control plane needs, and it is also what keeps the release able to recover.
Argo holds a wave until it is healthy, so a Job behind the Deployments would
wait on a control plane that is itself waiting on the schema that Job creates.
Nothing waits on a Deployment now, and a workload that cannot start fails alone
instead of freezing the sync that would fix it.

Both name their command. The images they run default to `--help` and to
`database status`, either of which exits 0 without doing the work, so a Job that
inherited its image's default would report success and leave the deployment
empty.

Waves rather than Helm hooks, because this chart is synced rather than installed.
Argo does honour hooks, but a hook is deleted and recreated on every sync while a
waved Job is a resource the sync ordering already understands.

The administrator credential is the one with a trap in it. `auth bootstrap`
adopts a configured credential when it finds one and mints its own when it does
not, recording a different request id for each. A first run without the value in
Secrets Manager leaves the credential inside this Job's own pod, no later step
can authenticate, and supplying it afterwards is refused as an already completed
bootstrap. The way back is resetting the schema, so the value goes in before this
ever runs.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: database-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    # Deleted and recreated rather than patched or replaced in place. A Job's
    # pod template is immutable, so the image tag moving with the commit makes
    # every later sync fail to apply this one, and the wave it is in never
    # completes: the release stops at a Job that already ran and reports an
    # immutable field rather than anything about the deploy.
    #
    # `Force` is what makes it a delete, and it is not optional here. `Replace`
    # alone sends the rendered manifest as it stands, and Kubernetes generates a
    # Job's selector and its pod labels at creation, so what is sent back is
    # missing both and is refused for a selector that does not match a template
    # it also does not have.
    #
    # Re-running is safe because each of these is idempotent, and for two of
    # them running every time is the point.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 3
  template:
    metadata:
      name: database-bootstrap
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccounts.controlPlane }}
      containers:
        - name: database-bootstrap
          image: {{ include "lazycloud.image" (list . "database-bootstrap") }}
          command: ["lazycloud-admin", "database", "initialize"]
          env:
            {{- include "lazycloud.env" . | nindent 12 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: administrator-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    # Deleted and recreated rather than patched or replaced in place. A Job's
    # pod template is immutable, so the image tag moving with the commit makes
    # every later sync fail to apply this one, and the wave it is in never
    # completes: the release stops at a Job that already ran and reports an
    # immutable field rather than anything about the deploy.
    #
    # `Force` is what makes it a delete, and it is not optional here. `Replace`
    # alone sends the rendered manifest as it stands, and Kubernetes generates a
    # Job's selector and its pod labels at creation, so what is sent back is
    # missing both and is refused for a selector that does not match a template
    # it also does not have.
    #
    # Re-running is safe because each of these is idempotent, and for two of
    # them running every time is the point.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 3
  template:
    metadata:
      name: administrator-bootstrap
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccounts.controlPlane }}
      containers:
        - name: administrator-bootstrap
          image: {{ include "lazycloud.image" (list . "database-bootstrap") }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              # The credential is read from the environment rather than a file:
              # the operator wrote it to Secrets Manager and External Secrets put
              # it here, so there is no staged file to publish to and no volume
              # that has to outlive the pod.
              printf '%s' "$LAZYCLOUD_TOKEN" > /tmp/administrator-token
              chmod 600 /tmp/administrator-token
              github_id="${LAZYCLOUD_ADMINISTRATOR_GITHUB_USER_ID:-}"
              lazycloud-admin --json auth bootstrap \
                --token-file /tmp/administrator-token \
                ${github_id:+--github-user-id "$github_id"}
              rm -f /tmp/administrator-token
          env:
            {{- include "lazycloud.env" . | nindent 12 }}
---
{{/*
The catalog, every sync rather than once.

Signing in provisions a subscription on the free plan and fails closed when it
cannot, and a subscription resolves its prices by lookup key. So an account whose
catalog is unpublished refuses every sign-in it receives, and a plan shipped
without its price refuses everyone the code puts on it. Running this only at
install would leave the second case to be discovered by a person who could not
sign in.

Additive and idempotent by name: a run against a published account creates
nothing. What it will not do is edit. A price whose amount disagrees with this
repository is a conflict and fails the Job, because a published price is what
customers are already billed against and repointing one is a decision with an
invoice attached, not a step of a deploy. The deploy stops there rather than
serving a rate card the provider does not agree with.

`--confirm-account` comes from the deployment rather than from the credential.
A key does not say which account it belongs to, so one swapped for another
account's is refused here instead of quietly publishing this catalog somewhere
else.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: billing-catalog
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    # Deleted and recreated rather than patched or replaced in place. A Job's
    # pod template is immutable, so the image tag moving with the commit makes
    # every later sync fail to apply this one, and the wave it is in never
    # completes: the release stops at a Job that already ran and reports an
    # immutable field rather than anything about the deploy.
    #
    # `Force` is what makes it a delete, and it is not optional here. `Replace`
    # alone sends the rendered manifest as it stands, and Kubernetes generates a
    # Job's selector and its pod labels at creation, so what is sent back is
    # missing both and is refused for a selector that does not match a template
    # it also does not have.
    #
    # Re-running is safe because each of these is idempotent, and for two of
    # them running every time is the point.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 3
  template:
    metadata:
      name: billing-catalog
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccounts.controlPlane }}
      containers:
        - name: billing-catalog
          image: {{ include "lazycloud.image" (list . "database-bootstrap") }}
          command:
            - lazycloud-admin
            - --json
            - billing
            - publish-catalog
            - --confirm-account
            - {{ required "runtime.LAZYCLOUD_STRIPE_ACCOUNT_ID is required" .Values.runtime.LAZYCLOUD_STRIPE_ACCOUNT_ID | quote }}
            - --confirm
          env:
            {{- include "lazycloud.env" . | nindent 12 }}
