apiVersion: apps/v1
kind: Deployment
metadata:
  name: connection-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ .Values.connectionGateway.replicas }}
  minReadySeconds: 35
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: connection-gateway
  template:
    metadata:
      annotations:
        lazycloud.dev/secret-revision: {{ .Values.secretRevisions.connectionGateway | quote }}
        checksum/api-ingress: {{ .Files.Get "files/api-ingress.cfg" | sha256sum }}
      labels:
        app: connection-gateway
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      topologySpreadConstraints:
        {{- include "lazycloud.spreadAcrossNodes" "connection-gateway" | nindent 8 }}
      volumes:
        - name: identity
          emptyDir: {}
        - name: api-ingress
          configMap:
            name: gateway-api-ingress
      initContainers:
        - name: api-router
          restartPolicy: Always
          image: {{ .Values.connectionGateway.apiRouter.image | quote }}
          env:
            - name: LAZYCLOUD_INGRESS_HOST
              value: {{ .Values.cloudflared.apex | quote }}
            - name: LAZYCLOUD_PUBLIC_INGRESS_BIND
              value: "127.0.0.1:9000"
            - name: LAZYCLOUD_PRIVATE_INGRESS_BIND
              value: "127.0.0.1:9001"
            - name: LAZYCLOUD_MANAGEMENT_API_ADDRESS
              value: "control-plane.{{ .Release.Namespace }}.svc.cluster.local:9000"
            - name: LAZYCLOUD_EXECUTION_API_ADDRESS
              value: "execution-api.{{ .Release.Namespace }}.svc.cluster.local:9000"
            - name: LAZYCLOUD_RUNTIME_API_ADDRESS
              value: "runtime-api.{{ .Release.Namespace }}.svc.cluster.local:9000"
          volumeMounts:
            - name: api-ingress
              mountPath: /usr/local/etc/haproxy
              readOnly: true
          startupProbe:
            exec:
              command: ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9001/livez"]
            periodSeconds: 1
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9001/livez"]
            periodSeconds: 2
          resources:
            {{- toYaml .Values.connectionGateway.apiRouter.resources | nindent 12 }}
      containers:
        - name: connection-gateway
          image: {{ include "lazycloud.image" (list . "connection-gateway") }}
          ports:
            - name: tunnel
              containerPort: 8443
          env:
            {{- include "lazycloud.env" (list . "connectionGateway") | nindent 12 }}
            {{- include "lazycloud.databaseEnv" .Values.connectionGateway.database | nindent 12 }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: LAZYCLOUD_CONNECTION_GATEWAY_ADVERTISED_ADDRESS
              value: "$(POD_IP):8443"
            - name: LAZYCLOUD_CONNECTION_GATEWAY_LISTEN_ADDRESS
              value: "0.0.0.0:8443"
            - name: LAZYCLOUD_CONNECTION_GATEWAY_CONTROL_ADDRESS
              value: "127.0.0.1:9001"
          volumeMounts:
            - name: identity
              mountPath: /var/lib/lazycloud/connection-gateway
          readinessProbe:
            exec:
              command: ["python", "-m", "shared.process_liveness", "--max-age-seconds", "15", "/tmp/lazycloud-connection-gateway.ready"]
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 1
          resources:
            {{- toYaml .Values.connectionGateway.resources | nindent 12 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-api-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  haproxy.cfg: |
    {{- .Files.Get "files/api-ingress.cfg" | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: connection-gateway
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: TCP
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: traffic-port
    service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
    service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: deregistration_delay.timeout_seconds=75,deregistration_delay.connection_termination.enabled=false
spec:
  type: LoadBalancer
  loadBalancerClass: eks.amazonaws.com/nlb
  selector:
    app: connection-gateway
  ports:
    - name: tunnel
      port: 443
      targetPort: tunnel
      protocol: TCP
