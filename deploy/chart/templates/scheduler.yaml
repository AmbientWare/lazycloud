apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: {{ .Values.scheduler.replicas }}
  minReadySeconds: {{ .Values.scheduler.minReadySeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      annotations:
        lazycloud.dev/secret-revision: {{ .Values.secretRevisions.scheduler | quote }}
      labels:
        app: scheduler
    spec:
      terminationGracePeriodSeconds: {{ .Values.scheduler.terminationGracePeriodSeconds }}
      serviceAccountName: {{ .Values.serviceAccounts.scheduler }}
      topologySpreadConstraints:
        {{- include "lazycloud.spreadAcrossNodes" "scheduler" | nindent 8 }}
      volumes:
        - name: active-release
          configMap:
            name: active-release
            optional: true
      containers:
        - name: scheduler
          image: {{ include "lazycloud.image" (list . "scheduler") }}
          env:
            {{- include "lazycloud.env" (list . "scheduler") | nindent 12 }}
            {{- include "lazycloud.databaseEnv" .Values.scheduler.database | nindent 12 }}
          volumeMounts:
            - name: active-release
              mountPath: /run/lazycloud/release
              readOnly: true
          readinessProbe:
            exec:
              command:
                - python
                - -m
                - scheduler_app.health
                - --max-age-seconds
                - {{ .Values.scheduler.livenessMaxAgeSeconds | quote }}
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - python
                - -m
                - scheduler_app.health
                - --max-age-seconds
                - {{ .Values.scheduler.livenessMaxAgeSeconds | quote }}
            initialDelaySeconds: {{ .Values.scheduler.livenessInitialDelaySeconds }}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
