{{/*
Two replicas, and the second is for the drain rather than for capacity.

The scheduler serialises its work on Redis token locks and tolerates overlapping
ticks by design. `packages/scheduler/AGENTS.md`: "where two overlap anyway the
second finds the row already terminal and settles nothing twice". What made more
than one impossible before was a Redis per host, which is why that moved out of
the cluster.

With one replica a node replacement stops placement until the pod is rescheduled
and its first housekeeping pass, the one that talks to every external service,
has finished. Spread across nodes with a disruption budget, one replica keeps
deciding while the other moves.

It fetches the agent artifact it never serves. Resolving the release is what
gives it the worker image and the AMI catalogue, and that resolution validates
the artifact directory as one fact. A path here that named an empty directory
would satisfy the check and describe something untrue.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
spec:
  replicas: {{ .Values.scheduler.replicas }}
  minReadySeconds: {{ .Values.scheduler.minReadySeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      annotations:
        checksum/aws-chain: {{ include (print $.Template.BasePath "/aws-chain.yaml") . | sha256sum }}
        lazycloud.dev/secret-revision: {{ .Values.secretRevisions.scheduler | quote }}
      labels:
        app: scheduler
    spec:
      terminationGracePeriodSeconds: {{ .Values.scheduler.terminationGracePeriodSeconds }}
      serviceAccountName: {{ .Values.serviceAccounts.scheduler }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys: [pod-template-hash]
          labelSelector:
            matchLabels:
              app: scheduler
      volumes:
        - name: agent-binarys
          emptyDir: {}
        - name: aws-chain
          configMap:
            name: aws-chain
      initContainers:
        - name: agent-artifact
          image: {{ include "lazycloud.image" (list . "database-bootstrap") }}
          command:
            - lazycloud-admin
            - --json
            - release
            - fetch-agent
            - --into
            - /var/lib/lazycloud/agent-binarys
          env:
            {{- include "lazycloud.env" (list . "agentArtifact") | nindent 12 }}
          volumeMounts:
            - name: agent-binarys
              mountPath: /var/lib/lazycloud/agent-binarys
          resources:
            {{- toYaml .Values.scheduler.initResources | nindent 12 }}
      containers:
        - name: scheduler
          image: {{ include "lazycloud.image" (list . "scheduler") }}
          env:
            {{- include "lazycloud.env" (list . "scheduler") | nindent 12 }}
            {{- include "lazycloud.databaseEnv" .Values.scheduler.database | nindent 12 }}
            - name: LAZYCLOUD_AGENT_BINARY_DIR
              value: /var/lib/lazycloud/agent-binarys
            - name: AWS_CONFIG_FILE
              value: /run/lazycloud/aws/config
            # Not AWS_PROFILE: boto applies that to every client in the
            # process, and only calls into a connected account belong on the
            # control principal.
            - name: LAZYCLOUD_AWS_CONNECTION_PROFILE
              value: {{ include "lazycloud.awsProfile" . | quote }}
          volumeMounts:
            - name: agent-binarys
              mountPath: /var/lib/lazycloud/agent-binarys
            - name: aws-chain
              mountPath: /run/lazycloud/aws
          # Every loop's heartbeat, not the process's. The process stays up
          # while one of its loops is wedged, which is the failure this exists to
          # catch, so the oldest file decides and a missing one fails outright.
          # The threshold is sized against the slowest loop: housekeeping waits
          # on Stripe and S3, so it beats far less often than placement does.
          readinessProbe:
            exec:
              command:
                - python
                - -m
                - shared.process_liveness
                - --max-age-seconds
                - {{ .Values.scheduler.livenessMaxAgeSeconds | quote }}
                {{- range .Values.scheduler.loopNames }}
                - /tmp/lazycloud-scheduler.heartbeat.{{ . }}
                {{- end }}
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - python
                - -m
                - shared.process_liveness
                - --max-age-seconds
                - {{ .Values.scheduler.livenessMaxAgeSeconds | quote }}
                {{- range .Values.scheduler.loopNames }}
                - /tmp/lazycloud-scheduler.heartbeat.{{ . }}
                {{- end }}
            initialDelaySeconds: {{ .Values.scheduler.livenessInitialDelaySeconds }}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
