apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  replicas: {{ .Values.cloudflared.replicas }}
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/cloudflared-config.yaml") . | sha256sum }}
        lazycloud.dev/secret-revision: {{ .Values.secretRevisions.cloudflared | quote }}
      labels:
        app: cloudflared
    spec:
      topologySpreadConstraints:
        {{- include "lazycloud.spreadAcrossNodes" "cloudflared" | nindent 8 }}
      volumes:
        - name: config
          configMap:
            name: cloudflared
        - name: credentials
          secret:
            secretName: {{ .Values.secrets.name }}
            items:
              - key: {{ .Values.tunnel.credentialsKey }}
                path: credentials.json
      containers:
        - name: cloudflared
          image: {{ .Values.cloudflared.image }}
          args: ["tunnel", "--config", "/etc/cloudflared/config.yaml", "run"]
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config.yaml
              subPath: config.yaml
            - name: credentials
              mountPath: /etc/cloudflared/credentials.json
              subPath: credentials.json
          resources:
            {{- toYaml .Values.cloudflared.resources | nindent 12 }}
