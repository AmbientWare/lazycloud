{{- include "lazycloud.databaseBudget" . -}}
{{- range $api := list
    (dict "name" "control-plane" "settings" .Values.controlPlane "binding" "controlPlane" "command" "lazycloud-api" "tcp" false "agentArtifact" true "wave" 2)
    (dict "name" "execution-api" "settings" .Values.executionApi "binding" "executionApi" "command" "lazycloud-execution-api" "tcp" true "agentArtifact" false "wave" 0)
    (dict "name" "runtime-api" "settings" .Values.runtimeApi "binding" "runtimeApi" "command" "lazycloud-runtime-api" "tcp" false "agentArtifact" true "wave" 0)
}}
{{- with $ }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $api.name }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $api.wave | quote }}
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  replicas: {{ $api.settings.replicas }}
  minReadySeconds: 155
  selector:
    matchLabels:
      app: {{ $api.name }}
  template:
    metadata:
      annotations:
        checksum/aws-chain: {{ include (print $.Template.BasePath "/aws-chain.yaml") . | sha256sum }}
        lazycloud.dev/secret-revision: {{ (index .Values.secretRevisions $api.binding) | quote }}
      labels:
        app: {{ $api.name }}
    spec:
      terminationGracePeriodSeconds: 150
      serviceAccountName: {{ .Values.serviceAccounts.controlPlane }}
      topologySpreadConstraints:
        {{- include "lazycloud.spreadAcrossNodes" $api.name | nindent 8 }}
      volumes:
        {{- if $api.tcp }}
        - name: tcp-certificate
          secret:
            secretName: tcp-ingress-tls
            defaultMode: 0600
        {{- end }}
        - name: active-release
          configMap:
            name: active-release
            optional: true
        - name: tunnel-issuer
          secret:
            secretName: {{ .Values.secrets.name }}
            defaultMode: 0600
            items:
              - key: LAZYCLOUD_TUNNEL_ISSUER_CERTIFICATE_PEM
                path: certificate.pem
              - key: LAZYCLOUD_TUNNEL_ISSUER_PRIVATE_KEY_PEM
                path: private-key.pem
        {{- if $api.agentArtifact }}
        # A shared volume would tie replicas to one zone.
        - name: agent-binarys
          emptyDir: {}
        {{- end }}
        - name: aws-chain
          configMap:
            name: aws-chain
      {{- if $api.agentArtifact }}
      initContainers:
        # AgentBinarySettings requires the artifact directory at startup.
        - name: agent-artifact
          image: {{ include "lazycloud.image" (list . "database-bootstrap") }}
          command:
            - lazycloud-admin
            - --json
            - release
            - fetch-agent
            - --into
            - /var/lib/lazycloud/agent-binarys
          env:
            {{- include "lazycloud.env" (list . "agentArtifact") | nindent 12 }}
          volumeMounts:
            - name: agent-binarys
              mountPath: /var/lib/lazycloud/agent-binarys
          resources:
            {{- toYaml $api.settings.initResources | nindent 12 }}
      {{- end }}
      containers:
        - name: {{ $api.name }}
          image: {{ include "lazycloud.image" (list . "api") }}
          command: [{{ $api.command | quote }}, "--host", "0.0.0.0", "--port", "9000"]
          lifecycle:
            preStop:
              # Keep serving while terminating endpoints leave Service routing.
              sleep:
                seconds: 7
          ports:
            - name: http
              containerPort: 9000
            {{- if $api.tcp }}
            - name: tcp-ingress
              containerPort: {{ .Values.tcpIngress.port }}
            {{- end }}
          env:
            {{- include "lazycloud.env" (list . $api.binding) | nindent 12 }}
            {{- include "lazycloud.databaseEnv" $api.settings.database | nindent 12 }}
            - name: LAZYCLOUD_TCP_INGRESS_ENABLED
              value: {{ $api.tcp | quote }}
            {{- if $api.tcp }}
            - name: LAZYCLOUD_TCP_INGRESS_PORT
              value: {{ .Values.tcpIngress.port | quote }}
            - name: LAZYCLOUD_TCP_INGRESS_EXTERNAL_HOST
              value: {{ include "lazycloud.tcpHost" . | quote }}
            - name: LAZYCLOUD_TCP_INGRESS_CERTIFICATE_FILE
              value: /run/lazycloud/tcp-ingress/tls.crt
            - name: LAZYCLOUD_TCP_INGRESS_KEY_FILE
              value: /run/lazycloud/tcp-ingress/tls.key
            {{- end }}
            {{- if $api.agentArtifact }}
            - name: LAZYCLOUD_AGENT_BINARY_DIR
              value: /var/lib/lazycloud/agent-binarys
            {{- end }}
            - name: LAZYCLOUD_TUNNEL_ISSUER_CERTIFICATE_FILE
              value: /run/lazycloud/tunnel-issuer/certificate.pem
            - name: LAZYCLOUD_TUNNEL_ISSUER_PRIVATE_KEY_FILE
              value: /run/lazycloud/tunnel-issuer/private-key.pem
            - name: AWS_CONFIG_FILE
              value: /run/lazycloud/aws/config
            # Not AWS_PROFILE: boto applies that to every client in the
            # process, and only calls into a connected account belong on the
            # control principal.
            - name: LAZYCLOUD_AWS_CONNECTION_PROFILE
              value: {{ include "lazycloud.awsProfile" . | quote }}
          volumeMounts:
            - name: tunnel-issuer
              mountPath: /run/lazycloud/tunnel-issuer
              readOnly: true
            {{- if $api.tcp }}
            - name: tcp-certificate
              mountPath: /run/lazycloud/tcp-ingress
              readOnly: true
            {{- end }}
            {{- if $api.agentArtifact }}
            - name: agent-binarys
              mountPath: /var/lib/lazycloud/agent-binarys
            {{- end }}
            - name: aws-chain
              mountPath: /run/lazycloud/aws
            - name: active-release
              mountPath: /run/lazycloud/release
              readOnly: true
          resources:
            {{- toYaml $api.settings.resources | nindent 12 }}
          # Startup completes API composition before dependency probes begin.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          # Readiness owns the dependencies: a replica that cannot reach the
          # database should stop taking traffic. Five seconds because /health
          # opens a real connection, and a one-second default reports a busy
          # pool as a dead process.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Liveness owns only the process. It asks nothing of Postgres or Redis,
          # because restarting for their sake removes capacity from the thing
          # already struggling and returns a pod that must reach them again to
          # start at all.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

---
apiVersion: v1
kind: Service
metadata:
  name: {{ $api.name }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $api.wave | quote }}
spec:
  selector:
    app: {{ $api.name }}
  ports:
    - name: http
      port: 9000
      targetPort: http

{{- end }}
{{- end }}
