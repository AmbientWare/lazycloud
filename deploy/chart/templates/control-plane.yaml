{{- include "lazycloud.databaseBudget" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: control-plane
spec:
  serviceName: control-plane
  podManagementPolicy: Parallel
  replicas: {{ .Values.controlPlane.replicas }}
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      annotations:
        checksum/aws-chain: {{ include (print $.Template.BasePath "/aws-chain.yaml") . | sha256sum }}
        lazycloud.dev/secret-revision: {{ .Values.secretRevisions.controlPlane | quote }}
      labels:
        app: control-plane
    spec:
      terminationGracePeriodSeconds: 150
      serviceAccountName: {{ .Values.serviceAccounts.controlPlane }}
      topologySpreadConstraints:
        {{- include "lazycloud.spreadAcrossNodes" "control-plane" | nindent 8 }}
      volumes:
        - name: active-release
          configMap:
            name: active-release
            optional: true
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: wireguard-keys
          secret:
            secretName: {{ .Values.wireguard.secretName }}
            defaultMode: 0600
        - name: wireguard-platform-key
          emptyDir: {}
        # Per pod, because the artifact is immutable and 48MB: a shared volume
        # would tie replicas to one zone to save a fetch that costs seconds.
        - name: agent-binarys
          emptyDir: {}
        - name: aws-chain
          configMap:
            name: aws-chain
      initContainers:
        - name: wireguard-route-marks
          image: {{ include "lazycloud.image" (list . "tunnel-gateway") }}
          command: ["sysctl", "-w", "net.ipv4.conf.all.src_valid_mark=1"]
          securityContext:
            privileged: true
          resources:
            {{- toYaml .Values.controlPlane.initResources | nindent 12 }}
        # The release publishes the agent binary; the deployment says where it
        # keeps one. Neither holds the whole path, so it is assembled here, and
        # the artifact is fetched before the process that serves it starts:
        # `AgentBinarySettings` refuses to build without a directory, so a
        # download after startup would be after the refusal.
        - name: agent-artifact
          image: {{ include "lazycloud.image" (list . "database-bootstrap") }}
          command:
            - lazycloud-admin
            - --json
            - release
            - fetch-agent
            - --into
            - /var/lib/lazycloud/agent-binarys
          env:
            {{- include "lazycloud.env" (list . "agentArtifact") | nindent 12 }}
          volumeMounts:
            - name: agent-binarys
              mountPath: /var/lib/lazycloud/agent-binarys
          resources:
            {{- toYaml .Values.controlPlane.initResources | nindent 12 }}
        - name: wireguard-platform-key
          image: {{ include "lazycloud.image" (list . "tunnel-gateway") }}
          command:
            - /bin/sh
            - -ec
            - |
              index="${LAZYCLOUD_WIREGUARD_POD_NAME##*-}"
              case "$index" in
                ''|*[!0-9]*) echo "control-plane pod has no ordinal" >&2; exit 2 ;;
              esac
              umask 077
              cp "/var/run/lazycloud/wireguard/platform-${index}-private-key" /var/lib/lazycloud/wireguard/private-key
          env:
            - name: LAZYCLOUD_WIREGUARD_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: wireguard-keys
              mountPath: /var/run/lazycloud/wireguard
              readOnly: true
            - name: wireguard-platform-key
              mountPath: /var/lib/lazycloud/wireguard
          resources:
            {{- toYaml .Values.controlPlane.initResources | nindent 12 }}
        - name: wireguard-platform
          restartPolicy: Always
          image: {{ include "lazycloud.image" (list . "tunnel-gateway") }}
          # A native sidecar outlives API shutdown and preserves its draining streams.
          command: ["lazycloud-wireguard-platform"]
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          env:
            - name: LAZYCLOUD_WIREGUARD_PRIVATE_KEY_FILE
              value: /var/lib/lazycloud/wireguard/private-key
            {{- include "lazycloud.databaseEnv" .Values.wireguard.database | nindent 12 }}
            - name: LAZYCLOUD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: LAZYCLOUD_DATABASE_URL
            - name: LAZYCLOUD_REDIS_URL
              value: {{ required "runtime.LAZYCLOUD_REDIS_URL is required" .Values.runtime.LAZYCLOUD_REDIS_URL | quote }}
            - name: LAZYCLOUD_WIREGUARD_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
            - name: wireguard-platform-key
              mountPath: /var/lib/lazycloud/wireguard
          resources:
            {{- toYaml .Values.wireguard.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/lazycloud-wireguard-platform.ready"]
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 5
      containers:
        - name: control-plane
          image: {{ include "lazycloud.image" (list . "api") }}
          ports:
            - name: http
              containerPort: 9000
          env:
            {{- include "lazycloud.env" (list . "controlPlane") | nindent 12 }}
            {{- include "lazycloud.databaseEnv" .Values.controlPlane.database | nindent 12 }}
            - name: LAZYCLOUD_AGENT_BINARY_DIR
              value: /var/lib/lazycloud/agent-binarys
            - name: LAZYCLOUD_WIREGUARD_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AWS_CONFIG_FILE
              value: /run/lazycloud/aws/config
            # Not AWS_PROFILE: boto applies that to every client in the
            # process, and only calls into a connected account belong on the
            # control principal.
            - name: LAZYCLOUD_AWS_CONNECTION_PROFILE
              value: {{ include "lazycloud.awsProfile" . | quote }}
          volumeMounts:
            - name: agent-binarys
              mountPath: /var/lib/lazycloud/agent-binarys
            - name: aws-chain
              mountPath: /run/lazycloud/aws
            - name: active-release
              mountPath: /run/lazycloud/release
              readOnly: true
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          # Loopback rather than the advertised address: a replica has to prove
          # it serves before it can be one of the things that address resolves
          # to, so a check going out through WireGuard could never pass cold.
          #
          # Startup is a phase, not a delay. uvicorn binds nothing until the
          # lifespan finishes, so a passing /livez is proof composition ended,
          # and five minutes of it covers a slow release fetch and peer setup
          # without the other two probes judging a process that has not started.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          # Readiness owns the dependencies: a replica that cannot reach the
          # database should stop taking traffic. Five seconds because /health
          # opens a real connection, and a one-second default reports a busy
          # pool as a dead process.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Liveness owns only the process. It asks nothing of Postgres or Redis,
          # because restarting for their sake removes capacity from the thing
          # already struggling and returns a pod that must reach them again to
          # start at all.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
spec:
  selector:
    app: control-plane
  ports:
    - name: http
      port: 9000
      targetPort: http
