{{- include "lazycloud.databaseBudget" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  replicas: {{ .Values.controlPlane.replicas }}
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      annotations:
        checksum/aws-chain: {{ include (print $.Template.BasePath "/aws-chain.yaml") . | sha256sum }}
        lazycloud.dev/secret-revision: {{ .Values.secretRevisions.controlPlane | quote }}
      labels:
        app: control-plane
    spec:
      terminationGracePeriodSeconds: 150
      serviceAccountName: {{ .Values.serviceAccounts.controlPlane }}
      topologySpreadConstraints:
        {{- include "lazycloud.spreadAcrossNodes" "control-plane" | nindent 8 }}
      volumes:
        - name: active-release
          configMap:
            name: active-release
            optional: true
        - name: tunnel-issuer
          secret:
            secretName: {{ .Values.secrets.name }}
            defaultMode: 0600
            items:
              - key: LAZYCLOUD_TUNNEL_ISSUER_CERTIFICATE_PEM
                path: certificate.pem
              - key: LAZYCLOUD_TUNNEL_ISSUER_PRIVATE_KEY_PEM
                path: private-key.pem
        # Per pod, because the artifact is immutable and 48MB: a shared volume
        # would tie replicas to one zone to save a fetch that costs seconds.
        - name: agent-binarys
          emptyDir: {}
        - name: aws-chain
          configMap:
            name: aws-chain
      initContainers:
        # The release publishes the agent binary; the deployment says where it
        # keeps one. Neither holds the whole path, so it is assembled here, and
        # the artifact is fetched before the process that serves it starts:
        # `AgentBinarySettings` refuses to build without a directory, so a
        # download after startup would be after the refusal.
        - name: agent-artifact
          image: {{ include "lazycloud.image" (list . "database-bootstrap") }}
          command:
            - lazycloud-admin
            - --json
            - release
            - fetch-agent
            - --into
            - /var/lib/lazycloud/agent-binarys
          env:
            {{- include "lazycloud.env" (list . "agentArtifact") | nindent 12 }}
          volumeMounts:
            - name: agent-binarys
              mountPath: /var/lib/lazycloud/agent-binarys
          resources:
            {{- toYaml .Values.controlPlane.initResources | nindent 12 }}
      containers:
        - name: control-plane
          image: {{ include "lazycloud.image" (list . "api") }}
          ports:
            - name: http
              containerPort: 9000
          env:
            {{- include "lazycloud.env" (list . "controlPlane") | nindent 12 }}
            {{- include "lazycloud.databaseEnv" .Values.controlPlane.database | nindent 12 }}
            - name: LAZYCLOUD_AGENT_BINARY_DIR
              value: /var/lib/lazycloud/agent-binarys
            - name: LAZYCLOUD_TUNNEL_ISSUER_CERTIFICATE_FILE
              value: /run/lazycloud/tunnel-issuer/certificate.pem
            - name: LAZYCLOUD_TUNNEL_ISSUER_PRIVATE_KEY_FILE
              value: /run/lazycloud/tunnel-issuer/private-key.pem
            - name: AWS_CONFIG_FILE
              value: /run/lazycloud/aws/config
            # Not AWS_PROFILE: boto applies that to every client in the
            # process, and only calls into a connected account belong on the
            # control principal.
            - name: LAZYCLOUD_AWS_CONNECTION_PROFILE
              value: {{ include "lazycloud.awsProfile" . | quote }}
          volumeMounts:
            - name: tunnel-issuer
              mountPath: /run/lazycloud/tunnel-issuer
              readOnly: true
            - name: agent-binarys
              mountPath: /var/lib/lazycloud/agent-binarys
            - name: aws-chain
              mountPath: /run/lazycloud/aws
            - name: active-release
              mountPath: /run/lazycloud/release
              readOnly: true
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          # Startup completes API composition before dependency probes begin.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          # Readiness owns the dependencies: a replica that cannot reach the
          # database should stop taking traffic. Five seconds because /health
          # opens a real connection, and a one-second default reports a busy
          # pool as a dead process.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Liveness owns only the process. It asks nothing of Postgres or Redis,
          # because restarting for their sake removes capacity from the thing
          # already struggling and returns a pod that must reach them again to
          # start at all.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
spec:
  selector:
    app: control-plane
  ports:
    - name: http
      port: 9000
      targetPort: http
