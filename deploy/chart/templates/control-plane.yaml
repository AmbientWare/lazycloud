{{/*
The API, and the tailnet device it holds.

It runs its own tailscaled rather than borrowing a proxy's, and the reason is
outbound rather than inbound. Userspace networking forwards incoming connections
to localhost, so a worker reaching this process by tailnet name would be served
without a kernel device; what userspace cannot do is dial out, which needs a
SOCKS5 or HTTP proxy. This process dials every agent's route proxy by name, so it
holds a real device. An operator exposing it as a Service answers the half that
was never the problem.

That is what NET_ADMIN, NET_RAW and /dev/net/tun below are for. Where it runs is
Auto Mode's decision: the device is a property of the node image rather than of
one instance type, and pinning a pool would be choosing hardware to obtain
something every node already has.
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: control-plane
spec:
  # A set rather than a deployment, because the tailnet name is the address
  # workers dial and a name is an identity. Held in an emptyDir it was discarded
  # on every restart, the tailnet granted the next request a suffixed name, and
  # the address published to workers stopped matching anything.
  serviceName: control-plane
  replicas: {{ .Values.controlPlane.replicas }}
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.controlPlane }}
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        # Per pod, because the artifact is immutable and 48MB: a shared volume
        # would tie replicas to one zone to save a fetch that costs seconds.
        - name: agent-binarys
          emptyDir: {}
        - name: aws-chain
          configMap:
            name: aws-chain
      initContainers:
        # The release publishes the agent binary; the deployment says where it
        # keeps one. Neither holds the whole path, so it is assembled here, and
        # the artifact is fetched before the process that serves it starts:
        # `AgentBinarySettings` refuses to build without a directory, so a
        # download after startup would be after the refusal.
        - name: agent-artifact
          image: {{ include "lazycloud.image" (list . "database-bootstrap") }}
          command:
            - lazycloud-admin
            - --json
            - release
            - fetch-agent
            - --into
            - /var/lib/lazycloud/agent-binarys
          env:
            {{- include "lazycloud.env" . | nindent 12 }}
          volumeMounts:
            - name: agent-binarys
              mountPath: /var/lib/lazycloud/agent-binarys
      containers:
        - name: control-plane
          image: {{ include "lazycloud.image" (list . "api") }}
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
          ports:
            - name: http
              containerPort: 9000
          env:
            {{- include "lazycloud.env" . | nindent 12 }}
            - name: LAZYCLOUD_AGENT_BINARY_DIR
              value: /var/lib/lazycloud/agent-binarys
            - name: AWS_CONFIG_FILE
              value: /run/lazycloud/aws/config
            - name: AWS_PROFILE
              value: {{ include "lazycloud.awsProfile" . | quote }}
            - name: LAZYCLOUD_TAILNET_STATE_DIR
              value: /run/lazycloud/tailnet
          volumeMounts:
            - name: agent-binarys
              mountPath: /var/lib/lazycloud/agent-binarys
            - name: aws-chain
              mountPath: /run/lazycloud/aws
            - name: tun
              mountPath: /dev/net/tun
            - name: state
              mountPath: /run/lazycloud/tailnet
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          # Loopback rather than the advertised address: a replica has to prove
          # it serves before it can be one of the things that address resolves
          # to, so a check going out through the tailnet could never pass cold.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
  # The tailnet identity, and the only thing here worth keeping across a restart.
  # A few megabytes of node key and state: what it buys is coming back as the
  # same device rather than as the next one along.
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storage.className }}
        resources:
          requests:
            storage: {{ .Values.controlPlane.tailnetStateSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
spec:
  selector:
    app: control-plane
  ports:
    - name: http
      port: 9000
      targetPort: http
