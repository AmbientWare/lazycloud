{{/*
The API, and the tailnet device it holds.

It runs its own tailscaled rather than borrowing a proxy's, and the reason is
outbound rather than inbound. Userspace networking forwards incoming connections
to localhost, so a worker reaching this process by tailnet name would be served
without a kernel device; what userspace cannot do is dial out, which needs a
SOCKS5 or HTTP proxy. This process dials every agent's route proxy by name, so it
holds a real device. An operator exposing it as a Service answers the half that
was never the problem.

That is what NET_ADMIN, NET_RAW and /dev/net/tun below are for. Where it runs is
Auto Mode's decision: the device is a property of the node image rather than of
one instance type, and pinning a pool would be choosing hardware to obtain
something every node already has.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
spec:
  replicas: {{ .Values.controlPlane.replicas }}
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.controlPlane }}
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: state
          emptyDir: {}
      containers:
        - name: control-plane
          image: {{ include "lazycloud.image" (list . "api") }}
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
          ports:
            - name: http
              containerPort: 9000
          env:
            {{- include "lazycloud.env" . | nindent 12 }}
            # An emptyDir, because the identity here is worth less than the
            # restart it would delay: the device is ephemeral and re-registers
            # in seconds, and a PVC would tie a replica to one zone.
            - name: LAZYCLOUD_TAILNET_STATE_DIR
              value: /run/lazycloud/tailnet
            # The device goes away with the pod. Callers reach the advertised
            # service rather than this device, so no address is lost with it,
            # and a durable device would leave a dead peer behind per restart.
            - name: LAZYCLOUD_TAILNET_EPHEMERAL_DEVICE
              value: "true"
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
            - name: state
              mountPath: /run/lazycloud/tailnet
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          # Loopback rather than the advertised address: a replica has to prove
          # it serves before it can be one of the things that address resolves
          # to, so a check going out through the tailnet could never pass cold.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
spec:
  selector:
    app: control-plane
  ports:
    - name: http
      port: 9000
      targetPort: http
