{{- include "lazycloud.databaseBudget" . -}}
{{- $root := . -}}
{{- range $ordinal := until (int $root.Values.controlPlane.replicas) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane-{{ $ordinal }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-plane
      lazycloud.dev/ordinal: {{ $ordinal | quote }}
  template:
    metadata:
      labels:
        app: control-plane
        lazycloud.dev/ordinal: {{ $ordinal | quote }}
    spec:
      serviceAccountName: {{ $root.Values.serviceAccounts.controlPlane }}
      topologySpreadConstraints:
        {{- include "lazycloud.spreadOrdinalSetAcrossNodes" "control-plane" | nindent 8 }}
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        # Per pod, because the artifact is immutable and 48MB: a shared volume
        # would tie replicas to one zone to save a fetch that costs seconds.
        - name: agent-binarys
          emptyDir: {}
        - name: aws-chain
          configMap:
            name: aws-chain
        - name: pangolin-client-credentials
          secret:
            secretName: {{ $root.Values.secrets.pangolinRuntime.clients.name }}
            items:
              - key: LAZYCLOUD_PANGOLIN_PLATFORM_CLIENT_{{ $ordinal }}_ID
                path: id
              - key: LAZYCLOUD_PANGOLIN_PLATFORM_CLIENT_{{ $ordinal }}_SECRET
                path: secret
      initContainers:
        # The release publishes the agent binary; the deployment says where it
        # keeps one. Neither holds the whole path, so it is assembled here, and
        # the artifact is fetched before the process that serves it starts:
        # `AgentBinarySettings` refuses to build without a directory, so a
        # download after startup would be after the refusal.
        - name: agent-artifact
          image: {{ include "lazycloud.image" (list $root "database-bootstrap") }}
          command:
            - lazycloud-admin
            - --json
            - release
            - fetch-agent
            - --into
            - /var/lib/lazycloud/agent-binarys
          env:
            {{- include "lazycloud.env" $root | nindent 12 }}
          volumeMounts:
            - name: agent-binarys
              mountPath: /var/lib/lazycloud/agent-binarys
          resources:
            {{- toYaml $root.Values.controlPlane.initResources | nindent 12 }}
      containers:
        - name: control-plane
          image: {{ include "lazycloud.image" (list $root "api") }}
          ports:
            - name: http
              containerPort: 9000
            - name: tcp-ingress
              containerPort: 1995
          env:
            {{- include "lazycloud.env" $root | nindent 12 }}
            {{- include "lazycloud.pangolinControlEnv" $root | nindent 12 }}
            {{- include "lazycloud.pangolinRuntimeProviderEnv" $root | nindent 12 }}
            {{- include "lazycloud.databaseEnv" $root.Values.controlPlane.database | nindent 12 }}
            - name: LAZYCLOUD_AGENT_BINARY_DIR
              value: /var/lib/lazycloud/agent-binarys
            - name: AWS_CONFIG_FILE
              value: /run/lazycloud/aws/config
            # Not AWS_PROFILE: boto applies that to every client in the
            # process, and only calls into a connected account belong on the
            # control principal.
            - name: LAZYCLOUD_AWS_CONNECTION_PROFILE
              value: {{ include "lazycloud.awsProfile" . | quote }}
          volumeMounts:
            - name: agent-binarys
              mountPath: /var/lib/lazycloud/agent-binarys
            - name: aws-chain
              mountPath: /run/lazycloud/aws
          resources:
            {{- toYaml $root.Values.controlPlane.resources | nindent 12 }}
          # Startup is a phase, not a delay. uvicorn binds nothing until the
          # lifespan finishes, so a passing /livez is proof composition ended,
          # and five minutes covers a slow release fetch without the other two
          # probes judging a process that has not started.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          # Readiness owns the dependencies: a replica that cannot reach the
          # database should stop taking traffic. Five seconds because /health
          # opens a real connection, and a one-second default reports a busy
          # pool as a dead process.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Liveness owns only the process. It asks nothing of Postgres or Redis,
          # because restarting for their sake removes capacity from the thing
          # already struggling and returns a pod that must reach them again to
          # start at all.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
        - name: pangolin-client
          image: {{ $root.Values.pangolin.client.image }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              test -s /run/lazycloud/pangolin-client/id
              test -s /run/lazycloud/pangolin-client/secret
              export CLIENT_ID="$(cat /run/lazycloud/pangolin-client/id)"
              export CLIENT_SECRET="$(cat /run/lazycloud/pangolin-client/secret)"
              exec /entrypoint.sh
          env:
            - name: PANGOLIN_ENDPOINT
              value: {{ required "runtime.LAZYCLOUD_PANGOLIN_ENDPOINT is required" $root.Values.runtime.LAZYCLOUD_PANGOLIN_ENDPOINT | quote }}
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
            - name: pangolin-client-credentials
              mountPath: /run/lazycloud/pangolin-client
              readOnly: true
          resources:
            {{- toYaml $root.Values.pangolin.client.resources | nindent 12 }}
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  status="$(pangolin-cli status client --json)"
                  printf '%s\n' "$status" | grep -q '"connected": true'
                  printf '%s\n' "$status" | grep -q '"registered": true'
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  status="$(pangolin-cli status client --json)"
                  printf '%s\n' "$status" | grep -q '"connected": true'
                  printf '%s\n' "$status" | grep -q '"registered": true'
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  status="$(pangolin-cli status client --json)"
                  printf '%s\n' "$status" | grep -q '"connected": true'
                  printf '%s\n' "$status" | grep -q '"registered": true'
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: control-plane
spec:
  selector:
    app: control-plane
  ports:
    - name: http
      port: 9000
      targetPort: http
    - name: tcp-ingress
      port: 1995
      targetPort: tcp-ingress
