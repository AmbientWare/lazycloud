{{/*
The API, and the tailnet device it holds.

It runs its own tailscaled rather than borrowing a proxy's: workers reach this
process inbound by tailnet name, which userspace networking cannot bind, and the
control plane dials each agent's route proxy outbound by name too. An operator
that exposed this as a Service would answer the inbound half and leave the
outbound half needing tailscaled anyway.

That is what NET_ADMIN, NET_RAW and /dev/net/tun below are for. Where it runs is
Auto Mode's decision: the device is a property of the node image rather than of
one instance type, and pinning a pool would be choosing hardware to obtain
something every node already has.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
spec:
  replicas: {{ .Values.controlPlane.replicas }}
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.controlPlane }}
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: state
          emptyDir: {}
      containers:
        - name: control-plane
          image: {{ include "lazycloud.image" .Values.images.api }}
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
          ports:
            - name: http
              containerPort: 9000
            - name: tcp-ingress
              containerPort: 1995
          env:
            {{- include "lazycloud.env" . | nindent 12 }}
            # Carries the deployment name because a tailnet is shared across
            # accounts, and two deployments advertising one hostname collide.
            - name: LAZYCLOUD_TAILNET_STATE_DIR
              value: /run/lazycloud/tailnet
            # The device goes away with the pod. Nothing was given its address --
            # callers reach the Tailscale Service, not this device -- and a
            # durable one would leave a dead peer per restart.
            - name: LAZYCLOUD_TAILNET_EPHEMERAL_DEVICE
              value: "true"
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
            - name: state
              mountPath: /run/lazycloud/tailnet
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          # Loopback rather than the advertised address: a replica has to prove
          # it serves before it can be one of the things that address resolves
          # to, so a check going out through the tailnet could never pass cold.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
spec:
  selector:
    app: control-plane
  ports:
    - name: http
      port: 9000
      targetPort: http
    - name: tcp-ingress
      port: 1995
      targetPort: tcp-ingress
