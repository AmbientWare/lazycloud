apiVersion: batch/v1
kind: Job
metadata:
  name: pangolin-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 3
  template:
    metadata:
      name: pangolin-bootstrap
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccounts.pangolinBootstrap }}
      containers:
        - name: pangolin-bootstrap
          image: {{ include "lazycloud.image" (list . "cli") }}
          command:
            - lazycloud-admin
            - --json
            - pangolin
            - bootstrap-aws
            - --secret-id
            - {{ required "secrets.pangolinRuntime.secretId is required" .Values.secrets.pangolinRuntime.secretId | quote }}
            - --region
            - {{ required "runtime.LAZYCLOUD_OBJECT_STORE_REGION_NAME is required" .Values.runtime.LAZYCLOUD_OBJECT_STORE_REGION_NAME | quote }}
            - --public-hostname
            - {{ required "pangolin.publicHostname is required" .Values.pangolin.publicHostname | quote }}
            - --site-count
            - {{ .Values.pangolin.site.replicas | quote }}
            - --client-count
            - {{ .Values.controlPlane.replicas | quote }}
          env:
            {{- include "lazycloud.runtimeEnv" . | nindent 12 }}
            {{- include "lazycloud.pangolinControlEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.bootstrap.resources | nindent 12 }}
