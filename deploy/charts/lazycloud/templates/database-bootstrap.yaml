{{- define "lazycloud.databaseBootstrapJobSpec" -}}
backoffLimit: {{ .Values.databaseBootstrap.backoffLimit }}
{{- with .Values.databaseBootstrap.activeDeadlineSeconds }}
activeDeadlineSeconds: {{ . }}
{{- end }}
{{- if eq .Values.databaseBootstrap.ttlSecondsAfterFinished nil }}
ttlSecondsAfterFinished: 600
{{- else }}
ttlSecondsAfterFinished: {{ .Values.databaseBootstrap.ttlSecondsAfterFinished }}
{{- end }}
template:
  metadata:
    labels:
      {{- include "lazycloud.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: database-bootstrap
  spec:
    automountServiceAccountToken: false
    restartPolicy: OnFailure
    {{- with .Values.imagePullSecrets }}
    imagePullSecrets:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    containers:
      - name: database-bootstrap
        image: "{{ .Values.databaseBootstrap.image.repository }}:{{ .Values.databaseBootstrap.image.tag }}"
        imagePullPolicy: {{ .Values.databaseBootstrap.image.pullPolicy | quote }}
        env:
          {{- include "lazycloud.databaseEnv" . | nindent 10 }}
        command:
          - lazycloud-admin
          - --json
          - database
          - initialize
        resources:
          {{- toYaml .Values.databaseBootstrap.resources | nindent 10 }}
{{- end -}}
{{- if .Values.databaseBootstrap.enabled }}
{{- $jobSpec := include "lazycloud.databaseBootstrapJobSpec" . }}
{{- $jobHash := $jobSpec | sha256sum | trunc 12 }}
{{- $jobPrefix := printf "%s-database-bootstrap" (include "lazycloud.fullname" .) | trunc 50 | trimSuffix "-" }}
{{- $jobName := printf "%s-%s" $jobPrefix $jobHash }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $jobName }}
  labels:
    {{- include "lazycloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: database-bootstrap
    lazycloud.io/job-spec-hash: {{ $jobHash | quote }}
spec:
{{ $jobSpec | nindent 2 }}
{{- end }}
