{{- if .Values.cache.enabled }}
{{- if gt (float64 .Values.cache.diskEvictWatermarkPct) (float64 .Values.cache.diskMaxUsagePct) }}
{{- fail "cache disk watermarks must satisfy 0 < evict <= max <= 1" }}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "lazycloud.fullname" . }}-cache
  labels:
    {{- include "lazycloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache
spec:
  selector:
    matchLabels:
      {{- include "lazycloud.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cache
  template:
    metadata:
      labels:
        {{- include "lazycloud.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cache
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- include "lazycloud.secretRolloutAnnotations" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      {{- if .Values.cache.priorityClassName }}
      priorityClassName: {{ .Values.cache.priorityClassName | quote }}
      {{- end }}
      {{- if .Values.cache.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cache.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cache.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cache.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cache.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cache
          image: "{{ .Values.cache.image.repository }}:{{ .Values.cache.image.tag }}"
          imagePullPolicy: {{ .Values.cache.image.pullPolicy }}
          args:
            - lazycloud-cache-server
            - --host
            - "0.0.0.0"
            - --port
            - "{{ .Values.cache.port }}"
            - --root
            - "{{ .Values.cache.root }}"
          env:
            - name: LAZYCLOUD_HOME
              value: "{{ .Values.state.home }}"
            - name: LAZYCLOUD_CACHE_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "lazycloud.cacheServiceSecretName" . }}
                  key: token
                  optional: false
            - name: LAZYCLOUD_CACHE_SERVICE_PREVIOUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "lazycloud.cacheServiceSecretName" . }}
                  key: previous-token
                  optional: true
            - name: LAZYCLOUD_CACHE_MAX_CONTENT_BYTES
              value: {{ .Values.cache.maxContentBytes | quote }}
            - name: LAZYCLOUD_CACHE_MAX_OBJECT_BYTES
              value: {{ .Values.cache.maxObjectBytes | quote }}
            - name: LAZYCLOUD_CACHE_MAX_METADATA_ENTRIES
              value: {{ .Values.cache.maxMetadataEntries | quote }}
            - name: LAZYCLOUD_CACHE_MAX_PATH_BYTES
              value: {{ .Values.cache.maxPathBytes | quote }}
            - name: LAZYCLOUD_CACHE_DISK_MAX_USAGE_PCT
              value: {{ .Values.cache.diskMaxUsagePct | quote }}
            - name: LAZYCLOUD_CACHE_DISK_EVICT_WATERMARK_PCT
              value: {{ .Values.cache.diskEvictWatermarkPct | quote }}
          ports:
            - name: cache
              containerPort: {{ .Values.cache.port }}
              hostPort: {{ .Values.cache.port }}
          readinessProbe:
            {{- toYaml .Values.cache.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.cache.livenessProbe | nindent 12 }}
          {{- with .Values.cache.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.cache.resources | nindent 12 }}
          volumeMounts:
            - name: cache-root
              mountPath: {{ .Values.cache.root }}
      volumes:
        - name: cache-root
          hostPath:
            path: {{ .Values.cache.hostPath }}
            type: DirectoryOrCreate
{{- end }}
