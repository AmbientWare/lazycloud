{{- if .Values.monitoring.enabled }}
{{- $monitoringNamespace := default .Release.Namespace .Values.monitoring.namespace }}
{{- $scrapeAuth := .Values.monitoring.scrapeAuth }}
{{- if and .Values.monitoring.namespace (ne .Values.monitoring.namespace .Release.Namespace) }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $monitoringNamespace | quote }}
  labels:
    {{- include "lazycloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lazycloud.serviceAccountName" . }}
  namespace: {{ $monitoringNamespace | quote }}
  labels:
    {{- include "lazycloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "lazycloud.serviceAccountName" . }}-monitoring
  labels:
    {{- include "lazycloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
subjects:
  - kind: ServiceAccount
    name: {{ include "lazycloud.serviceAccountName" . }}
    namespace: {{ $monitoringNamespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "lazycloud.serviceAccountName" . }}
  apiGroup: rbac.authorization.k8s.io
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lazycloud.fullname" . }}-scrape-config
  namespace: {{ $monitoringNamespace | quote }}
  labels:
    {{- include "lazycloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
data:
  scrape.yaml: |
    global:
      scrape_interval: {{ .Values.monitoring.scrapeInterval }}
    scrape_configs:
      - job_name: lazycloud-services
        metrics_path: /metrics
        {{- if $scrapeAuth.bearerTokenSecretName }}
        # The /metrics endpoint uses the normal read-scope bearer-token
        # authorization path. Store that token in the referenced Kubernetes
        # Secret; this scrape config only reads it from the mounted file.
        authorization:
          type: Bearer
          credentials_file: {{ default "/etc/vmagent/secrets/lazycloud-metrics-token/token" $scrapeAuth.bearerTokenFile | quote }}
        {{- end }}
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - {{ .Release.Namespace }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_lazycloud_io_metrics]
            action: keep
            regex: enabled
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lazycloud.fullname" . }}-metrics
  namespace: {{ $monitoringNamespace | quote }}
  labels:
    {{- include "lazycloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  {{- if not .Values.monitoring.metrics.autoscaling.enabled }}
  replicas: {{ .Values.monitoring.metrics.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "lazycloud.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: metrics
  template:
    metadata:
      labels:
        {{- include "lazycloud.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: metrics
    spec:
      serviceAccountName: {{ include "lazycloud.serviceAccountName" . }}
      containers:
        - name: victoria-metrics
          image: {{ .Values.monitoring.metrics.image | quote }}
          args:
            - -retentionPeriod={{ .Values.monitoring.metrics.retentionPeriod }}
            - -httpListenAddr=:8428
          ports:
            - name: http
              containerPort: 8428
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.monitoring.metrics.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lazycloud.fullname" . }}-metrics
  namespace: {{ $monitoringNamespace | quote }}
  labels:
    {{- include "lazycloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
    lazycloud.io/metrics: enabled
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8428"
spec:
  selector:
    {{- include "lazycloud.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
  ports:
    - name: http
      port: 8428
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lazycloud.fullname" . }}-metrics-agent
  namespace: {{ $monitoringNamespace | quote }}
  labels:
    {{- include "lazycloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics-agent
spec:
  {{- if not .Values.monitoring.agent.autoscaling.enabled }}
  replicas: {{ .Values.monitoring.agent.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "lazycloud.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: metrics-agent
  template:
    metadata:
      labels:
        {{- include "lazycloud.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: metrics-agent
    spec:
      serviceAccountName: {{ include "lazycloud.serviceAccountName" . }}
      containers:
        - name: vmagent
          image: {{ .Values.monitoring.agent.image | quote }}
          args:
            - -promscrape.config=/etc/vmagent/scrape.yaml
            - -remoteWrite.url=http://{{ include "lazycloud.fullname" . }}-metrics.{{ $monitoringNamespace }}.svc:8428/api/v1/write
            - -httpListenAddr=:8429
          ports:
            - name: http
              containerPort: 8429
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.monitoring.agent.resources | nindent 12 }}
          volumeMounts:
            - name: scrape-config
              mountPath: /etc/vmagent
              readOnly: true
            {{- if $scrapeAuth.bearerTokenSecretName }}
            - name: metrics-scrape-token
              mountPath: {{ default "/etc/vmagent/secrets/lazycloud-metrics-token" $scrapeAuth.bearerTokenMountPath | quote }}
              readOnly: true
            {{- end }}
      volumes:
        - name: scrape-config
          configMap:
            name: {{ include "lazycloud.fullname" . }}-scrape-config
        {{- if $scrapeAuth.bearerTokenSecretName }}
        - name: metrics-scrape-token
          secret:
            secretName: {{ $scrapeAuth.bearerTokenSecretName | quote }}
            optional: false
        {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lazycloud.fullname" . }}-log-config
  namespace: {{ $monitoringNamespace | quote }}
  labels:
    {{- include "lazycloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: log-collector
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        1
        Log_Level    info
        HTTP_Server  On
        HTTP_Listen  0.0.0.0
        HTTP_Port    2020
    [INPUT]
        Name              tail
        Tag               lazycloud.*
        Path              /var/log/containers/*lazycloud*.log
        Parser            cri
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        Refresh_Interval  5
    [OUTPUT]
        Name   stdout
        Match  lazycloud.*
  parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "lazycloud.fullname" . }}-log-collector
  namespace: {{ $monitoringNamespace | quote }}
  labels:
    {{- include "lazycloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: log-collector
spec:
  selector:
    matchLabels:
      {{- include "lazycloud.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: log-collector
  template:
    metadata:
      labels:
        {{- include "lazycloud.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: log-collector
    spec:
      serviceAccountName: {{ include "lazycloud.serviceAccountName" . }}
      tolerations:
        - operator: Exists
      containers:
        - name: fluent-bit
          image: {{ .Values.monitoring.logs.image | quote }}
          args:
            - --config=/fluent-bit/etc/fluent-bit.conf
            - --parser=/fluent-bit/etc/parsers.conf
          ports:
            - name: http
              containerPort: 2020
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
          resources:
            {{- toYaml .Values.monitoring.logs.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "lazycloud.fullname" . }}-log-config
        - name: varlog
          hostPath:
            path: /var/log
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lazycloud.fullname" . }}-dashboards
  namespace: {{ $monitoringNamespace | quote }}
  labels:
    {{- include "lazycloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboards
    grafana_dashboard: "1"
data:
  lazycloud-overview.json: |
    {
      "title": "LazyCloud Overview",
      "schemaVersion": 39,
      "panels": [
        {"type": "timeseries", "title": "Task Lifecycle Events", "targets": [{"expr": "sum(rate(gateway_task_lifecycle_total[5m]))"}]},
        {"type": "timeseries", "title": "Endpoint Dispatches", "targets": [{"expr": "sum(rate(endpoint_dispatch_lifecycle_total[5m]))"}]},
        {"type": "timeseries", "title": "Active Endpoint Dispatches", "targets": [{"expr": "sum(endpoint_dispatch_active_requests)"}]}
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lazycloud.fullname" . }}-alert-rules
  namespace: {{ $monitoringNamespace | quote }}
  labels:
    {{- include "lazycloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: alert-rules
data:
  lazycloud-rules.yaml: |
    groups:
      - name: lazycloud-control-plane
        rules:
          - alert: LazyCloudControlPlaneDown
            expr: up{job="lazycloud-services"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: LazyCloud control-plane metrics target is down.
      - name: lazycloud-scaling
        rules:
          - alert: LazyCloudAutoscalerScaleFailures
            expr: sum(rate(autoscaler_scale_failures_total[5m])) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: App autoscaler scale-up failures are occurring.
          - alert: LazyCloudAutoscalerGuardrailThrottled
            expr: sum(rate(autoscaler_throttled_total[10m])) > 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: App autoscaler decisions are being throttled by guardrails.
          - alert: LazyCloudAutoscalerPendingContainersStuck
            expr: sum(autoscaler_pending_containers) > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: Autoscaled containers have remained pending.
          - alert: LazyCloudAutoscalerPressureSaturated
            expr: sum(autoscaler_pressure_saturated) > 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Autoscaled workload pressure is above configured capacity.
          - alert: LazyCloudAutoscalerNoWorkerCapacity
            expr: sum(rate(autoscaler_no_worker_capacity_total[5m])) > 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: Autoscaled workloads cannot find worker capacity.
          - alert: LazyCloudWorkerPoolErrors
            expr: sum(rate(worker_pool_errors_total[5m])) > 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: Worker pool scaling or drain operations are failing.
          - alert: LazyCloudExcessiveColdStarts
            expr: sum(rate(autoscaler_actions_total{action="start"}[15m])) > 5
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: Autoscaled workloads are creating excessive cold starts.
          - alert: LazyCloudAutoscalerIdleSpend
            expr: sum(autoscaler_idle_containers) > 0
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: Autoscaled workloads have idle containers above desired scale.
{{- end }}
