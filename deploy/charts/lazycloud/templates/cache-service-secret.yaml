{{- if and .Values.cache.enabled .Values.cache.createSecret }}
{{- $token := required "cache.serviceToken is required when cache.createSecret=true" .Values.cache.serviceToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lazycloud.cacheServiceSecretName" . }}
  labels:
    {{- include "lazycloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache
type: Opaque
stringData:
  token: {{ $token | quote }}
  previous-token: {{ .Values.cache.previousServiceToken | quote }}
{{- end }}
