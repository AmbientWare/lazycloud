{{- if .Values.controlPlane.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "lazycloud.fullname" . }}-control-plane
  labels:
    {{- include "lazycloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "lazycloud.fullname" . }}-control-plane
  minReplicas: {{ .Values.controlPlane.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.controlPlane.autoscaling.maxReplicas }}
  {{- include "lazycloud.hpaMetrics" .Values.controlPlane.autoscaling | nindent 2 }}
  {{- with .Values.controlPlane.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.scheduler.enabled .Values.scheduler.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "lazycloud.fullname" . }}-scheduler
  labels:
    {{- include "lazycloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "lazycloud.fullname" . }}-scheduler
  minReplicas: {{ .Values.scheduler.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.scheduler.autoscaling.maxReplicas }}
  {{- include "lazycloud.hpaMetrics" .Values.scheduler.autoscaling | nindent 2 }}
  {{- with .Values.scheduler.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.monitoring.enabled .Values.monitoring.metrics.autoscaling.enabled }}
---
{{- $monitoringMetricsNamespace := default .Release.Namespace .Values.monitoring.namespace }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "lazycloud.fullname" . }}-metrics
  namespace: {{ $monitoringMetricsNamespace | quote }}
  labels:
    {{- include "lazycloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "lazycloud.fullname" . }}-metrics
  minReplicas: {{ .Values.monitoring.metrics.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.monitoring.metrics.autoscaling.maxReplicas }}
  {{- include "lazycloud.hpaMetrics" .Values.monitoring.metrics.autoscaling | nindent 2 }}
  {{- with .Values.monitoring.metrics.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.monitoring.enabled .Values.monitoring.agent.autoscaling.enabled }}
---
{{- $monitoringAgentNamespace := default .Release.Namespace .Values.monitoring.namespace }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "lazycloud.fullname" . }}-metrics-agent
  namespace: {{ $monitoringAgentNamespace | quote }}
  labels:
    {{- include "lazycloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "lazycloud.fullname" . }}-metrics-agent
  minReplicas: {{ .Values.monitoring.agent.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.monitoring.agent.autoscaling.maxReplicas }}
  {{- include "lazycloud.hpaMetrics" .Values.monitoring.agent.autoscaling | nindent 2 }}
  {{- with .Values.monitoring.agent.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
