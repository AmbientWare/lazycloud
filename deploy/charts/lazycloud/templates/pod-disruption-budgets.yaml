{{- if .Values.controlPlane.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "lazycloud.fullname" . }}-control-plane
  labels:
    {{- include "lazycloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  {{- include "lazycloud.pdbAvailability" .Values.controlPlane.podDisruptionBudget | nindent 2 }}
  selector:
    matchLabels:
      {{- include "lazycloud.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: control-plane
{{- end }}
{{- if and .Values.scheduler.enabled .Values.scheduler.podDisruptionBudget.enabled }}
