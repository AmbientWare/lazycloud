{{- if .Values.juicefs.gateway.enabled }}
{{- $name := include "lazycloud.juicefsGatewayName" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "lazycloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: juicefs-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "lazycloud.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: juicefs-gateway
  template:
    metadata:
      labels:
        {{- include "lazycloud.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: juicefs-gateway
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: juicefs-format
          image: "{{ .Values.juicefs.gateway.image.repository }}:{{ .Values.juicefs.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.juicefs.gateway.image.pullPolicy | quote }}
          command: ["juicefs", "format"]
          args:
            - --storage
            - s3
            - --bucket
            - $(JUICEFS_DATA_BUCKET_URL)
            - --block-size
            - $(JUICEFS_BLOCK_SIZE)
            - $(JUICEFS_METADATA_URL)
            - $(JUICEFS_FILESYSTEM_NAME)
            - --no-update
          env:
            - name: JUICEFS_METADATA_URL
              {{- if .Values.juicefs.metadataUrl }}
              value: {{ .Values.juicefs.metadataUrl | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "lazycloud.juicefsMetadataSecretName" . | quote }}
                  key: {{ .Values.juicefs.metadataSecretRef.key | quote }}
                  optional: false
              {{- end }}
            - name: JUICEFS_FILESYSTEM_NAME
              value: {{ .Values.juicefs.filesystemName | quote }}
            - name: JUICEFS_DATA_BUCKET_URL
              value: {{ include "lazycloud.juicefsDataBucketUrl" . | quote }}
            - name: JUICEFS_BLOCK_SIZE
              value: {{ .Values.juicefs.gateway.blockSize | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "lazycloud.objectStoreCredentialsSecretName" . | quote }}
                  key: {{ .Values.objectStore.credentialsSecretRef.accessKeyIdKey | quote }}
                  optional: false
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lazycloud.objectStoreCredentialsSecretName" . | quote }}
                  key: {{ .Values.objectStore.credentialsSecretRef.secretAccessKeyKey | quote }}
                  optional: false
            - name: JUICEFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lazycloud.objectStoreCredentialsSecretName" . | quote }}
                  key: {{ .Values.objectStore.credentialsSecretRef.secretAccessKeyKey | quote }}
                  optional: false
          resources:
            {{- toYaml .Values.juicefs.gateway.resources | nindent 12 }}
      containers:
        - name: juicefs-gateway
          image: "{{ .Values.juicefs.gateway.image.repository }}:{{ .Values.juicefs.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.juicefs.gateway.image.pullPolicy | quote }}
          command: ["juicefs", "gateway"]
          args:
            - --cache-size
            - $(JUICEFS_CACHE_SIZE)
            - --prefetch
            - $(JUICEFS_PREFETCH)
            - --buffer-size
            - $(JUICEFS_BUFFER_SIZE)
            - --keep-etag
            - --no-usage-report
            - --no-banner
            - $(JUICEFS_METADATA_URL)
            - 0.0.0.0:$(JUICEFS_GATEWAY_PORT)
          env:
            - name: JUICEFS_METADATA_URL
              {{- if .Values.juicefs.metadataUrl }}
              value: {{ .Values.juicefs.metadataUrl | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "lazycloud.juicefsMetadataSecretName" . | quote }}
                  key: {{ .Values.juicefs.metadataSecretRef.key | quote }}
                  optional: false
              {{- end }}
            - name: JUICEFS_CACHE_SIZE
              value: {{ .Values.juicefs.gateway.cacheSize | quote }}
            - name: JUICEFS_PREFETCH
              value: {{ .Values.juicefs.gateway.prefetch | quote }}
            - name: JUICEFS_BUFFER_SIZE
              value: {{ .Values.juicefs.gateway.bufferSize | quote }}
            - name: JUICEFS_GATEWAY_PORT
              value: {{ .Values.juicefs.gateway.port | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "lazycloud.objectStoreCredentialsSecretName" . | quote }}
                  key: {{ .Values.objectStore.credentialsSecretRef.accessKeyIdKey | quote }}
                  optional: false
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lazycloud.objectStoreCredentialsSecretName" . | quote }}
                  key: {{ .Values.objectStore.credentialsSecretRef.secretAccessKeyKey | quote }}
                  optional: false
            - name: JUICEFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lazycloud.objectStoreCredentialsSecretName" . | quote }}
                  key: {{ .Values.objectStore.credentialsSecretRef.secretAccessKeyKey | quote }}
                  optional: false
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "lazycloud.juicefsGatewayCredentialsSecretName" . | quote }}
                  key: {{ .Values.juicefs.gateway.credentialsSecretRef.accessKeyIdKey | quote }}
                  optional: false
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "lazycloud.juicefsGatewayCredentialsSecretName" . | quote }}
                  key: {{ .Values.juicefs.gateway.credentialsSecretRef.secretAccessKeyKey | quote }}
                  optional: false
          ports:
            - name: s3
              containerPort: {{ .Values.juicefs.gateway.port }}
          readinessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.juicefs.gateway.resources | nindent 12 }}
        - name: juicefs-webdav
          image: "{{ .Values.juicefs.gateway.image.repository }}:{{ .Values.juicefs.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.juicefs.gateway.image.pullPolicy | quote }}
          command: ["juicefs", "webdav"]
          args:
            - --cache-size
            - {{ .Values.juicefs.gateway.cacheSize | quote }}
            - --prefetch
            - {{ .Values.juicefs.gateway.prefetch | quote }}
            - --buffer-size
            - {{ .Values.juicefs.gateway.bufferSize | quote }}
            - --no-usage-report
            - $(JUICEFS_METADATA_URL)
            - 0.0.0.0:{{ .Values.juicefs.gateway.webdavPort }}
          env:
            - name: JUICEFS_METADATA_URL
              {{- if .Values.juicefs.metadataUrl }}
              value: {{ .Values.juicefs.metadataUrl | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "lazycloud.juicefsMetadataSecretName" . | quote }}
                  key: {{ .Values.juicefs.metadataSecretRef.key | quote }}
                  optional: false
              {{- end }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "lazycloud.objectStoreCredentialsSecretName" . | quote }}
                  key: {{ .Values.objectStore.credentialsSecretRef.accessKeyIdKey | quote }}
                  optional: false
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lazycloud.objectStoreCredentialsSecretName" . | quote }}
                  key: {{ .Values.objectStore.credentialsSecretRef.secretAccessKeyKey | quote }}
                  optional: false
            - name: JUICEFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lazycloud.objectStoreCredentialsSecretName" . | quote }}
                  key: {{ .Values.objectStore.credentialsSecretRef.secretAccessKeyKey | quote }}
                  optional: false
            - name: WEBDAV_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "lazycloud.juicefsGatewayCredentialsSecretName" . | quote }}
                  key: {{ .Values.juicefs.gateway.credentialsSecretRef.accessKeyIdKey | quote }}
                  optional: false
            - name: WEBDAV_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "lazycloud.juicefsGatewayCredentialsSecretName" . | quote }}
                  key: {{ .Values.juicefs.gateway.credentialsSecretRef.secretAccessKeyKey | quote }}
                  optional: false
          ports:
            - name: webdav
              containerPort: {{ .Values.juicefs.gateway.webdavPort }}
          readinessProbe:
            tcpSocket:
              port: webdav
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: webdav
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.juicefs.gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "lazycloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: juicefs-gateway
spec:
  selector:
    {{- include "lazycloud.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: juicefs-gateway
  ports:
    - name: s3
      port: {{ .Values.juicefs.gateway.port }}
      targetPort: s3
    - name: webdav
      port: {{ .Values.juicefs.gateway.webdavPort }}
      targetPort: webdav
{{- end }}
