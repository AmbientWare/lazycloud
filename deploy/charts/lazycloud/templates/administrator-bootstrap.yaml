{{- define "lazycloud.administratorBootstrapJobSpec" -}}
{{- $root := .root -}}
{{- $credentialSecretName := .credentialSecretName -}}
{{- $credentialSecretKey := .credentialSecretKey -}}
{{- $requestId := .requestId -}}
backoffLimit: {{ $root.Values.administratorBootstrap.backoffLimit }}
{{- with $root.Values.administratorBootstrap.activeDeadlineSeconds }}
activeDeadlineSeconds: {{ . }}
{{- end }}
{{- if eq $root.Values.administratorBootstrap.ttlSecondsAfterFinished nil }}
ttlSecondsAfterFinished: 600
{{- else }}
ttlSecondsAfterFinished: {{ $root.Values.administratorBootstrap.ttlSecondsAfterFinished }}
{{- end }}
template:
  metadata:
    labels:
      {{- include "lazycloud.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: administrator-bootstrap
  spec:
    serviceAccountName: {{ include "lazycloud.administratorBootstrapServiceAccountName" $root }}
    automountServiceAccountToken: true
    restartPolicy: OnFailure
    {{- with $root.Values.imagePullSecrets }}
    imagePullSecrets:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    initContainers:
      {{- include "lazycloud.databaseWaitInitContainer" $root | nindent 6 }}
    containers:
      - name: administrator-bootstrap
        image: "{{ $root.Values.administratorBootstrap.image.repository }}:{{ $root.Values.administratorBootstrap.image.tag }}"
        imagePullPolicy: {{ $root.Values.administratorBootstrap.image.pullPolicy | quote }}
        env:
          {{- include "lazycloud.databaseEnv" $root | nindent 10 }}
          - name: LAZYCLOUD_ADMINISTRATOR_SECRET_NAMESPACE
            value: {{ $root.Release.Namespace | quote }}
          - name: LAZYCLOUD_ADMINISTRATOR_SECRET_NAME
            value: {{ $credentialSecretName | quote }}
          - name: LAZYCLOUD_ADMINISTRATOR_SECRET_KEY
            value: {{ $credentialSecretKey | quote }}
          - name: LAZYCLOUD_ADMINISTRATOR_BOOTSTRAP_REQUEST_ID
            value: {{ $requestId | quote }}
          - name: LAZYCLOUD_ADMINISTRATOR_NAME
            value: {{ $root.Values.administratorBootstrap.administratorName | quote }}
          - name: LAZYCLOUD_ADMINISTRATOR_WORKSPACE
            value: {{ $root.Values.administratorBootstrap.workspace | quote }}
        command:
          - python
          - -c
        args:
          - |
            import base64
            import os

            from database import DatabaseApplicationName, DatabaseClient, DatabaseSettings
            from identity.auth import AuthService, IdentityDatabaseContext
            from kubernetes import client, config

            namespace = os.environ["LAZYCLOUD_ADMINISTRATOR_SECRET_NAMESPACE"]
            secret_name = os.environ["LAZYCLOUD_ADMINISTRATOR_SECRET_NAME"]
            secret_key = os.environ["LAZYCLOUD_ADMINISTRATOR_SECRET_KEY"]
            request_id = os.environ["LAZYCLOUD_ADMINISTRATOR_BOOTSTRAP_REQUEST_ID"]
            config.load_incluster_config()
            secrets = client.CoreV1Api()

            credential = secrets.read_namespaced_secret(secret_name, namespace)
            encoded = (credential.data or {}).get(secret_key)
            staged_token = None
            if encoded:
                staged_token = base64.b64decode(encoded, validate=True).decode("utf-8")
                if not staged_token:
                    raise RuntimeError("administrator credential Secret is empty")

            def publish(token: str) -> None:
                if not token:
                    raise RuntimeError("administrator bootstrap produced an empty credential")
                secrets.patch_namespaced_secret(
                    secret_name,
                    namespace,
                    {"data": {secret_key: base64.b64encode(token.encode("utf-8")).decode("ascii")}},
                )

            database = DatabaseClient.from_settings(
                DatabaseSettings(application_name=DatabaseApplicationName.Admin)
            )
            try:
                service = AuthService(IdentityDatabaseContext(database))
                service.bootstrap_admin_token(
                    request_id=request_id,
                    name=os.environ["LAZYCLOUD_ADMINISTRATOR_NAME"],
                    workspace=os.environ["LAZYCLOUD_ADMINISTRATOR_WORKSPACE"],
                    staged_token=staged_token,
                    stage_token=publish,
                )
                service.mark_admin_token_published(request_id=request_id, recovery=False)
            finally:
                database.dispose()
        resources:
          {{- toYaml $root.Values.administratorBootstrap.resources | nindent 10 }}
{{- end -}}
{{- if .Values.administratorBootstrap.enabled }}
{{- $secretName := include "lazycloud.administratorCredentialSecretName" . }}
{{- $secretKey := required "administratorBootstrap.credentialSecretKey is required when administratorBootstrap.enabled=true" .Values.administratorBootstrap.credentialSecretKey }}
{{- $requestSeed := printf "%s:%s" .Release.Namespace .Release.Name }}
{{- $requestId := printf "bootstrap:kubernetes:%s" ($requestSeed | sha256sum | trunc 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "lazycloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: administrator-credential
type: Opaque
data: {}
---
{{- $jobSpec := include "lazycloud.administratorBootstrapJobSpec" (dict "root" . "credentialSecretName" $secretName "credentialSecretKey" $secretKey "requestId" $requestId) }}
{{- $jobHash := $jobSpec | sha256sum | trunc 12 }}
{{- $jobPrefix := printf "%s-administrator-bootstrap" (include "lazycloud.fullname" .) | trunc 50 | trimSuffix "-" }}
{{- $jobName := printf "%s-%s" $jobPrefix $jobHash }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $jobName }}
  labels:
    {{- include "lazycloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: administrator-bootstrap
    lazycloud.io/job-spec-hash: {{ $jobHash | quote }}
spec:
{{ $jobSpec | nindent 2 }}
{{- end }}
