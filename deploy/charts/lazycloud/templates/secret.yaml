{{- if .Values.config.create }}
{{- $objectStoreAccessKey := required "objectStore.accessKeyId is required when the chart creates the application config Secret" .Values.objectStore.accessKeyId }}
{{- $objectStoreSecretKey := required "objectStore.secretAccessKey is required when the chart creates the application config Secret" .Values.objectStore.secretAccessKey }}
{{- $juicefsGatewayAccessKey := required "juicefs.gateway.accessKeyId is required when the chart creates the application config Secret" .Values.juicefs.gateway.accessKeyId }}
{{- $juicefsGatewaySecretKey := required "juicefs.gateway.secretAccessKey is required when the chart creates the application config Secret" .Values.juicefs.gateway.secretAccessKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lazycloud.configSecretName" . }}
  labels:
    {{- include "lazycloud.labels" . | nindent 4 }}
type: Opaque
stringData:
  LAZYCLOUD_DATABASE_URL: {{ include "lazycloud.databaseUrl" . | quote }}
  LAZYCLOUD_REDIS_URL: {{ include "lazycloud.redisUrl" . | quote }}
  LAZYCLOUD_JUICEFS_METADATA_URL: {{ include "lazycloud.juicefsMetadataUrl" . | quote }}
  LAZYCLOUD_OBJECT_STORE_ACCESS_KEY_ID: {{ $objectStoreAccessKey | quote }}
  LAZYCLOUD_OBJECT_STORE_SECRET_ACCESS_KEY: {{ $objectStoreSecretKey | quote }}
  LAZYCLOUD_JUICEFS_GATEWAY_ACCESS_KEY_ID: {{ $juicefsGatewayAccessKey | quote }}
  LAZYCLOUD_JUICEFS_GATEWAY_SECRET_ACCESS_KEY: {{ $juicefsGatewaySecretKey | quote }}
{{- end }}
