{{- define "lazycloud.workerTokenBootstrapJobSpec" -}}
{{- $root := .root -}}
{{- $secretName := .secretName -}}
{{- $secretKey := .secretKey -}}
backoffLimit: {{ $root.Values.containerWorkers.workerTokenBootstrap.backoffLimit }}
{{- with $root.Values.containerWorkers.workerTokenBootstrap.activeDeadlineSeconds }}
activeDeadlineSeconds: {{ . }}
{{- end }}
{{- if eq $root.Values.containerWorkers.workerTokenBootstrap.ttlSecondsAfterFinished nil }}
ttlSecondsAfterFinished: 600
{{- else }}
ttlSecondsAfterFinished: {{ $root.Values.containerWorkers.workerTokenBootstrap.ttlSecondsAfterFinished }}
{{- end }}
template:
  metadata:
    labels:
      {{- include "lazycloud.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: worker-token-bootstrap
  spec:
    serviceAccountName: {{ include "lazycloud.workerTokenServiceAccountName" $root }}
    automountServiceAccountToken: true
    restartPolicy: OnFailure
    {{- with $root.Values.imagePullSecrets }}
    imagePullSecrets:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    initContainers:
      {{- include "lazycloud.databaseWaitInitContainer" $root | nindent 6 }}
      {{- include "lazycloud.administratorWaitInitContainer" $root | nindent 6 }}
    containers:
      - name: worker-token
        image: "{{ $root.Values.containerWorkers.workerTokenBootstrap.image.repository }}:{{ $root.Values.containerWorkers.workerTokenBootstrap.image.tag }}"
        imagePullPolicy: "{{ $root.Values.containerWorkers.workerTokenBootstrap.image.pullPolicy }}"
        env:
          - name: LAZYCLOUD_HOME
            value: /tmp/lazycloud-token-init
          - name: LAZYCLOUD_WORKER_TOKEN_SECRET_NAMESPACE
            value: {{ $root.Release.Namespace | quote }}
          - name: LAZYCLOUD_WORKER_TOKEN_SECRET_NAME
            value: {{ $secretName | quote }}
          - name: LAZYCLOUD_WORKER_TOKEN_SECRET_KEY
            value: {{ $secretKey | quote }}
          - name: LAZYCLOUD_WORKER_TOKEN_NAME_PREFIX
            value: {{ $root.Values.containerWorkers.workerTokenBootstrap.tokenNamePrefix | quote }}
          - name: LAZYCLOUD_APP_LABEL_NAME
            value: {{ include "lazycloud.name" $root | quote }}
          - name: LAZYCLOUD_APP_LABEL_INSTANCE
            value: {{ $root.Release.Name | quote }}
          - name: LAZYCLOUD_APP_LABEL_MANAGED_BY
            value: {{ $root.Release.Service | quote }}
          {{- include "lazycloud.databaseEnv" $root | nindent 10 }}
        command:
          - lazycloud-worker-bootstrap
          - kubernetes-worker-token
        resources:
          {{- toYaml $root.Values.containerWorkers.workerTokenBootstrap.resources | nindent 10 }}
{{- end -}}
{{- if and .Values.containerWorkers.enabled .Values.containerWorkers.workerTokenBootstrap.enabled }}
{{- $secretName := .Values.containerWorkers.workerTokenSecretName | default (printf "%s-worker-token" (include "lazycloud.fullname" .)) }}
{{- $secretKey := required "containerWorkers.workerTokenSecretKey is required when workerTokenBootstrap.enabled=true" .Values.containerWorkers.workerTokenSecretKey }}
{{- $jobBaseName := .Values.containerWorkers.workerTokenBootstrap.name | default (printf "%s-worker-token" (include "lazycloud.fullname" .)) | trunc 63 | trimSuffix "-" }}
{{- $jobSpec := include "lazycloud.workerTokenBootstrapJobSpec" (dict "root" . "secretName" $secretName "secretKey" $secretKey) }}
{{- $jobHash := $jobSpec | sha256sum | trunc 12 }}
{{- $jobPrefix := $jobBaseName | trunc 50 | trimSuffix "-" }}
{{- $jobName := printf "%s-%s" $jobPrefix $jobHash }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $jobName }}
  labels:
    {{- include "lazycloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-token-bootstrap
    lazycloud.io/job-spec-hash: {{ $jobHash | quote }}
spec:
{{ $jobSpec | nindent 2 }}
{{- end }}
