image:
  repository: api
  tag: local
  pullPolicy: IfNotPresent

config:
  create: true
  existingSecret: ""

service:
  type: ClusterIP
  port: 9000

controlPlane:
  # Local installs are consumed through the documented port-forward.
  publicHttpUrl: http://127.0.0.1:8000

state:
  home: /var/lib/lazycloud

database:
  secretRef:
    name: ""
    key: LAZYCLOUD_DATABASE_URL

databaseBootstrap:
  image:
    repository: database-bootstrap
    tag: local
    pullPolicy: IfNotPresent

administratorBootstrap:
  image:
    repository: worker-bootstrap
    tag: local
    pullPolicy: IfNotPresent

redis:
  secretRef:
    name: ""
    key: LAZYCLOUD_REDIS_URL
  keyPrefix: lazycloud

objectStore:
  enabled: true
  image: dxflrs/garage:v2.3.0
  bucketInitImage: amazon/aws-cli:2.28.3
  endpointUrl: ""
  bucket: lazycloud-objects
  accessKeyId: lazycloud-local
  secretAccessKey: lazycloud-local-secret
  forcePathStyle: true
  rpcSecret: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  storage: 20Gi
  adminPort: 3903

juicefs:
  gateway:
    accessKeyId: lazycloud-volume
    secretAccessKey: lazycloud-volume-secret
    image:
      repository: storage-gateway
      tag: local
      pullPolicy: IfNotPresent

postgresql:
  enabled: true
  image: postgres:18-alpine
  database: lazycloud
  username: lazycloud
  password: lazycloud-local-password
  storage: 20Gi

redisStateful:
  enabled: true
  image: redis:8-alpine
  storage: 5Gi

rbac:
  create: true

scheduler:
  image:
    repository: scheduler
    tag: local
    pullPolicy: IfNotPresent

cache:
  enabled: true
  createSecret: true
  serviceToken: local-development-cache-service-token-change-before-use
  port: 7900
  root: /var/cache/lazycloud
  hostPath: /var/lib/lazycloud/cache
  image:
    repository: cache-server
    tag: local
    pullPolicy: IfNotPresent

containerWorkers:
  enabled: true
  image:
    repository: container-worker
    tag: local
    pullPolicy: IfNotPresent
  workerTokenBootstrap:
    image:
      repository: worker-bootstrap
      tag: local
      pullPolicy: IfNotPresent
  pools:
    - name: default
      capacityOwnerId: 6fb19db5-ddd0-478d-8f4a-cdf422ad438c
      initialWorkers: 1
      minWorkers: 1
      maxWorkers: 4
      scalingEnabled: true
      defaultEligible: true
      priority: 100
      minFreeCpuMillicores: 1000
      minFreeMemoryMib: 1024
      minFreeGpuCount: 0
      idleDrainTimeoutSeconds: 300
      scaleUpCooldownSeconds: 5
      scaleDownCooldownSeconds: 60
      registrationTimeoutSeconds: 600
      runtime: runc
      runtimes:
        - runc
        - runsc
      preemptible: false
      capacity:
        cpuMillicores: 4000
        memoryMib: 8192
      gpu:
        enabled: false
        type: nvidia
        resourceName: nvidia.com/gpu
        count: 0
