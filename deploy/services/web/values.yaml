replicaCount: 1

image:
  # registry includes Depot project ID: registry.depot.dev/<project-id>
  # Image ref becomes: registry.depot.dev/<project-id>:<name>-<tag>
  registry: registry.depot.dev/DEPOT_PROJECT_ID
  name: web
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: depot-registry

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  hostname: lazycloud.dev
  healthCheckPath: /api/health
  annotations: {}

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi


# Environment variables pulled from External Secrets
secrets:
  name: "app-secrets"
  env:
    - "NODE_ENV"
    - "APP_URL"
    - "DATABASE_URL"
    - "WORKOS_API_KEY"
    - "WORKOS_CLIENT_ID"
    - "WORKOS_COOKIE_PASSWORD"
    - "WORKOS_REDIRECT_URI"
    - "POLAR_ACCESS_TOKEN"
    - "IS_POLAR_SANDBOX"
    - "API_URL"
    - "API_PREFIX"
    - "ADMIN_API_KEY"
    - "RESEND_API_KEY"
    - "SUPPORT_EMAIL"
    - "UPSTASH_REDIS_REST_URL"
    - "UPSTASH_REDIS_REST_TOKEN"
