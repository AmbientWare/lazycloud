replicaCount: 1

image:
  name: web
  pullPolicy: Always
  tag: "latest"

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  hostname: lazycloud.dev
  healthCheckPath: /api/health
  annotations: {}

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi


# Environment variables pulled from External Secrets
secrets:
  name: "app-secrets"
  env:
    - "NODE_ENV"
    - "DATABASE_URL"
    - "WORKOS_API_KEY"
    - "WORKOS_CLIENT_ID"
    - "WORKOS_COOKIE_PASSWORD"
    - "WORKOS_REDIRECT_URI"
