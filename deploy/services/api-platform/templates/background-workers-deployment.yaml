apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-background-workers
  labels:
    app: {{ .Chart.Name }}-background-workers
    component: worker
spec:
  replicas: {{ .Values.backgroundWorkers.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}-background-workers
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}-background-workers
        component: worker
    spec:
      nodeSelector:
        instance-class: platform
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: {{ .Chart.Name }}-background-workers
                topologyKey: kubernetes.io/hostname
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Chart.Name }}
      containers:
        - name: background-worker
          image: "{{ .Values.image.registry }}:{{ .Values.backgroundWorkers.image.name }}-{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uv", "run", "--no-sync", "python", "-m", "backend.background_worker"]
          env:
          {{- range .Values.secrets.env }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.name }}
                  key: {{ . }}
          {{- end }}
          volumeMounts:
            - name: shared-storage
              mountPath: /shared-storage
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -f 'backend.background_worker' || exit 1
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: {{ .Values.backgroundWorkers.resources.limits.cpu }}
              memory: {{ .Values.backgroundWorkers.resources.limits.memory }}
            requests:
              cpu: {{ .Values.backgroundWorkers.resources.requests.cpu }}
              memory: {{ .Values.backgroundWorkers.resources.requests.memory }}
      volumes:
        - name: shared-storage
          persistentVolumeClaim:
            claimName: {{ .Chart.Name }}-shared-storage
