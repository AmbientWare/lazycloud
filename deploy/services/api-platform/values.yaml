replicaCount: 1

backgroundWorkers:
  replicaCount: 1
  image:
    name: backend-background-workers
  resources:
    limits:
      cpu: 500m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 1Gi

crons:
  replicaCount: 1
  image:
    name: backend-crons
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 512Mi

image:
  name: backend-api
  pullPolicy: Always
  tag: "latest"

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  hostname: api.lazycloud.dev
  healthCheckPath: /health
  annotations: {}

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 1Gi

storage:
  storageClassName: efs-sc
  size: 10Gi

# Environment variables pulled from External Secrets
secrets:
  name: "app-secrets"
  env:
    # Required
    - "ENV"
    - "ADMIN_API_KEY"
    - "REDIS_URL"
    - "AWS_ACCOUNT_ID"
    - "AWS_ACCESS_KEY_ID"
    - "AWS_ECR_BASE_ROLE_ARN"
    - "AWS_SECRET_ACCESS_KEY"
    - "AWS_REGION"
    - "DB_SECRET_KEY"
    - "RESEND_API_KEY"
    - "PROMETHEUS_URL"
    # Database
    - "DATABASE_URL"
    # Auth
    - "WORKOS_CLIENT_ID"
    # Billing
    - "POLAR_ACCESS_TOKEN"
    - "POLAR_ORGANIZATION_ID"
    - "IS_POLAR_SANDBOX"
    # Depot (remote builds)
    - "DEPOT_API_TOKEN"
    - "DEPOT_ORG_ID"
    # Prefect (self-hosted with basic auth)
    - "PREFECT_API_URL"
    - "PREFECT_API_AUTH_STRING"
    # Cloudflare
    - "CLOUDFLARE_API_KEY"
    - "CLOUDFLARE_ZONE_ID"
    - "CLOUDFLARE_ACCOUNT_ID"
