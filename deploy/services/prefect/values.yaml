prefect-server:
  fullnameOverride: prefect-server

  # Disable bundled PostgreSQL - using external PlanetScale database
  postgresql:
    enabled: false

  # External database connection
  secret:
    create: false
    name: prefect-db-secret

  server:
    basicAuth:
      enabled: true
      existingSecret: prefect-secrets
    replicaCount: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    uiConfig:
      prefectUiApiUrl: "https://prefect.lazycloud.dev/api"

  ingress:
    enabled: true
    className: alb
    host:
      hostname: prefect.lazycloud.dev
      path: /
      pathType: Prefix
    annotations:
      alb.ingress.kubernetes.io/group.name: lazycloud-prod-us-east-1-alb
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      external-dns.alpha.kubernetes.io/hostname: prefect.lazycloud.dev
