prefect-server:
  fullnameOverride: prefect-server

  # Disable bundled PostgreSQL - using external PlanetScale database
  postgresql:
    enabled: false

  # External database connection
  secret:
    create: false
    name: prefect-db-secret

  server:
    basicAuth:
      enabled: true
      existingSecret: prefect-secrets
    replicaCount: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    uiConfig:
      prefectUiApiUrl: "https://prefect.lazycloud.dev/api"

  ingress:
    enabled: true
    className: nginx
    host:
      hostname: prefect.lazycloud.dev
      path: /
      pathType: Prefix
    annotations: {}
