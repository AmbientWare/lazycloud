{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: namespace-restricted
  namespace: {{ .Values.namespace.name | default .Release.Namespace }}
rules: []  # No permissions - pods cannot access any resources

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: namespace-restricted
  namespace: {{ .Values.namespace.name | default .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: namespace-restricted
subjects:
- kind: ServiceAccount
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace.name | default .Release.Namespace }}

{{- if .Values.rbac.createDenyRole }}
---
# Create a ClusterRole that explicitly denies access to sensitive resources
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "lazycloud-namespace.fullname" . }}-deny-all
  labels:
    {{- include "lazycloud-namespace.labels" . | nindent 4 }}
rules: []  # No permissions - access is denied by not granting permissions
{{- end }}
{{- end }}