{{/*
Create HorizontalPodAutoscaler for each service that has HPA enabled
*/}}
{{- range $service := .Values.services }}
{{- if and $service.enabled $service.hpa $service.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $service.name }}
  namespace: {{ include "lazycloud-compose.serviceNamespace" (dict "serviceName" $service.name "Values" $.Values "root" $) }}
  labels:
    {{- include "lazycloud-compose.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $service.name }}
    app.kubernetes.io/component: hpa
    lazycloud.io/service: {{ $service.name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: {{ $service.workloadType | default "Deployment" }}
    name: {{ $service.name }}
  minReplicas: {{ $service.hpa.minReplicas | default 1 }}
  maxReplicas: {{ $service.hpa.maxReplicas | default 10 }}
  metrics:
    {{- if $service.hpa.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $service.hpa.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if $service.hpa.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $service.hpa.targetMemoryUtilizationPercentage }}
    {{- end }}
    {{- with $service.hpa.customMetrics }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if $service.hpa.behavior }}
  behavior:
    {{- toYaml $service.hpa.behavior | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}