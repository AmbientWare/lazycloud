[project]
name = "video-highlights"
version = "0.1.0"
description = "Turn videos in your S3 bucket into chapters, highlight clips and thumbnails."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.11,<3",
]

[dependency-groups]
dev = ["lazycloud-client"]
llm = ["openai>=3.28,<4"]
transcribe = ["faster-whisper==1.2.1"]

[tool.uv]
package = false
