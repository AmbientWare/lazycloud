[project]
name = "lora-fine-tune"
version = "0.1.0"
description = "Fine-tune a small LLM for text-to-SQL with LoRA, score it against the base model, and serve both with vLLM."
requires-python = ">=3.12"
dependencies = [
    "openai>=3.28,<4",
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = ["lazycloud-client"]
data = [
    "huggingface-hub>=1,<3",
    "pyarrow>=21",
]
gpu = [
    "accelerate>=1.10,<2",
    "peft>=0.21,<0.22",
    "transformers>=5.10.4,<5.18",
    "vllm==0.30.0",
]

[tool.uv]
package = false
