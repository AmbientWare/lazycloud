[project]
name = "image-studio"
version = "0.1.0"
description = "A Next.js and FastAPI studio that generates images on a GPU, streams progress, and keeps a gallery."
requires-python = ">=3.12"
dependencies = ["fastapi==0.143.0"]

[dependency-groups]
dev = ["lazycloud-client"]
weights = ["huggingface-hub>=1.32,<2"]
gpu = [
    "accelerate==1.15.0",
    "diffusers==0.41.0",
    "torch==2.14.1",
    "transformers==5.19.0",
]

[tool.uv]
package = false
