[project]
name = "site-monitor"
version = "0.1.0"
description = "Check web pages in a real browser on a schedule, have an LLM judge each change and alert Slack."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.11,<3",
]

[dependency-groups]
check = [
    "httpx>=0.28,<1",
    "openai>=2,<3",
    "playwright>=1.55,<2",
    "trafilatura>=2,<3",
]
dev = ["lazycloud-client"]

[tool.uv]
package = false

