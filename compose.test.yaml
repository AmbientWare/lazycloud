name: lazycloud-tests

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: lazycloud
      POSTGRES_PASSWORD: lazycloud
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lazycloud -d postgres"]
      interval: 1s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 10
