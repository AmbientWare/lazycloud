# Disposable services for Go tests: LAZYCLOUD_TEST_DATABASE_URL defaults to
# this database, internal/storage/storagetest to this Garage
# (LAZYCLOUD_TEST_OBJECT_STORE_ENDPOINT, LAZYCLOUD_TEST_GARAGE_ADMIN_URL) and
# billing's Stripe tests to this stripe-mock (LAZYCLOUD_TEST_STRIPE_URL).
name: lazycloud-go-test

services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: lazycloud
      POSTGRES_PASSWORD: lazycloud
      POSTGRES_DB: postgres
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "max_connections=400"]
    # Concurrent test packages' migrations and parallel queries outgrow
    # Docker's 64 MB default.
    shm_size: 1g
    ports:
      - "127.0.0.1:15442:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lazycloud -d postgres"]
      interval: 1s
      timeout: 3s
      retries: 20

  stripe-mock:
    image: stripe/stripe-mock:v0.205.0@sha256:ff32647993847be491e68533e2881c90434fa8d5df40246ee5f7d41253422081
    ports:
      - "127.0.0.1:12111:12111"

  # Tests create their own buckets here and delete them when they end.
  object-store:
    image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
    environment:
      GARAGE_RPC_SECRET: 4c0cd1d2c1f1a6c5b0e7e9f1b3f6a2d8c4e5f7a9b1c3d5e7f9a1b3c5d7e9f1a3
      GARAGE_ADMIN_TOKEN: local-garage-admin
    volumes:
      - ./deploy/local/garage.toml:/etc/garage.toml:ro
    ports:
      - "127.0.0.1:15900:3900"
      - "127.0.0.1:15903:3903"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 1s
      timeout: 3s
      retries: 30

  # Assigns the node's layout and imports the development key, then stays up
  # healthy so that `up --wait` waits for it.
  object-store-bootstrap:
    image: curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
    init: true
    entrypoint: ["sh", "-c", "sh /bootstrap.sh && touch /tmp/ready && exec sleep 2147483647"]
    environment:
      GARAGE_ADMIN_URL: http://object-store:3903
      GARAGE_ADMIN_TOKEN: local-garage-admin
      ACCESS_KEY_ID: GK1a2b3c4d5e6f708192a3b4c5
      SECRET_ACCESS_KEY: 6c6f63616c2d6c617a79636c6f75642d6465762d7365637265742d6b65792d31
      BUCKETS: ""
    volumes:
      - ./deploy/local/garage-bootstrap.sh:/bootstrap.sh:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 1s
      timeout: 3s
      retries: 30
    depends_on:
      object-store:
        condition: service_healthy
        restart: true
