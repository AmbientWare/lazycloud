# Disposable services for Go owner tests: LAZYCLOUD_TEST_DATABASE_URL defaults
# to this database.
name: lazycloud-go-test

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: lazycloud
      POSTGRES_PASSWORD: lazycloud
      POSTGRES_DB: postgres
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "max_connections=400"]
    ports:
      - "127.0.0.1:15442:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lazycloud -d postgres"]
      interval: 1s
      timeout: 3s
      retries: 20
