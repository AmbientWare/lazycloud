[project]
name = "lazycloud"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aioboto3>=14.3.0",
    "aiohttp>=3.11.18",
    "alembic>=1.15.2",
    "asyncpg>=0.30.0",
    "beautifulsoup4>=4.13.4",
    "celery>=5.5.2",
    "docker>=7.1.0",
    "dotenv>=0.9.9",
    "fastapi>=0.115.12",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "nest-asyncio>=1.6.0",
    "pandas>=2.2.3",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.9.1",
    "redis>=6.1.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.40",
    "stripe>=12.1.0",
    "tenacity>=9.1.2",
    "typer>=0.15.4",
    "uvicorn>=0.34.2",
]

[project.scripts]
lazycloud = "lazycloud_cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lazycloud_api", "src/lazycloud_cli"]
