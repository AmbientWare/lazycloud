[project]
name = "lazycloud"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aioboto3>=14.3.0",
    "aiohttp>=3.11.18",
    "alembic>=1.15.2",
    "asyncpg>=0.30.0",
    "beautifulsoup4>=4.13.4",
    "celery>=5.5.2",
    "cryptography>=45.0.5",
    "docker>=7.1.0",
    "dotenv>=0.9.9",
    "fastapi>=0.115.12",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "importlib>=1.0.4",
    "jsondiff>=2.2.1",
    "kubernetes>=33.1.0",
    "kubernetes-asyncio>=33.3.0",
    "loguru>=0.7.3",
    "nest-asyncio>=1.6.0",
    "pandas>=2.2.3",
    "petname>=2.6",
    "polar-sdk>=0.27.3",
    "prefect>=3.4.24",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.9.1",
    "pyjwt>=2.10.1",
    "pyyaml>=6.0.2",
    "redis>=6.1.0",
    "resend>=2.19.0",
    "rich>=13.9.4",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.40",
    "sse-starlette>=3.0.2",
    "stripe>=12.1.0",
    "tenacity>=9.1.2",
    "textual>=4.0.0",
    "typer>=0.15.4",
    "uvicorn>=0.34.2",
]

[project.scripts]
lazycloud = "lazycloud_cli.main:main_cli"
update-billing = "lazycloud_api.billing.update_billing:main"
cli-console = "scripts.dev_tools:textual_console"
cli-dashboard = "scripts.dev_tools:cli_dashboard"
mk-help = "scripts.minikube_dev:help"
mk-up = "scripts.minikube_dev:main"
mk-down = "scripts.minikube_dev:main_down"
mk-dash = "scripts.minikube_dev:main_dashboard"
mk-status = "scripts.minikube_dev:main_status"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lazycloud_api", "src/lazycloud_cli", "src/scripts", "minikube"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "textual-dev>=1.8.0",
]
