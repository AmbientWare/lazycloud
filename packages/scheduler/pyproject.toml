[project]
name = "scheduler"
version = "0.1.0"
description = "Scheduler state, fleet capacity, worker assignment, pool sizing, and queueing primitives."
requires-python = ">=3.12"
dependencies = [
    "compute",
    "lazycloud-shared==0.1.0",
    "coordination",
    "database",
    "foundation",
    "identity",
    "observability",
    "pydantic>=2.8,<3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
