[project]
name = "coordination"
version = "0.1.0"
description = "Redis-backed coordination primitives for the compute platform."
requires-python = ">=3.12"
dependencies = [
    "lazycloud-shared==0.1.0",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "redis>=7,<8",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
