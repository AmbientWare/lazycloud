[project]
name = "networking"
version = "0.1.0"
description = "Network routing, backend dialing plans, and tailnet runtime helpers."
requires-python = ">=3.12"
dependencies = [
    "compute",
    "coordination",
    "lazycloud-shared==0.1.0",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
