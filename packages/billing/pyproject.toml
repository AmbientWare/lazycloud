[project]
name = "billing"
version = "0.1.0"
description = "Billing accounts, plans, and what an account owes."
requires-python = ">=3.12"
dependencies = [
    "lazycloud-shared==0.1.0",
    "database",
    "observability",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
