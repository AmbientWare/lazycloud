[project]
name = "compute"
version = "0.1.0"
description = "Provider-neutral compute, pools, machines, offers, billing, and private-agent state."
requires-python = ">=3.12"
dependencies = [
    "lazycloud-shared==0.1.0",
    "coordination",
    "database",
    "foundation",
    "observability",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
