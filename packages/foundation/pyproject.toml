[project]
name = "foundation"
version = "0.1.0"
description = "Backend-neutral primitives shared across LazyCloud packages."
requires-python = ">=3.10"
dependencies = [
    "lazycloud-shared==0.1.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
foundation = ["py.typed"]
