[project]
name = "lazycloud"
version = "0.1.0"
description = "LazyCloud Python SDK and client CLI."
requires-python = ">=3.10"
dependencies = [
    "cloudpickle>=3,<4",
    "lazycloud-shared==0.1.0",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "pyyaml>=6,<7",
    "rich>=13,<14",
    "typer>=0.26.7",
    "typing-extensions>=4.12,<5",
    "websockets>=15,<16",
]

[project.scripts]
lazycloud = "lazycloud.cli.main:start"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lazycloud = ["py.typed"]
