[project]
# Published as `lazycloud-client`; the import and the command stay `lazycloud`.
# The bare name on PyPI belongs to an unrelated project.
name = "lazycloud-client"
version = "0.1.0"
description = "LazyCloud Python SDK and client CLI."
requires-python = ">=3.10"
dependencies = [
    "cloudpickle>=3,<4",
    "lazycloud-shared==0.1.0",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "pyyaml>=6,<7",
    "rich>=15,<16",
    "typer>=0.26.7",
    "typing-extensions>=4.12,<5",
    # Floor held below 17 on purpose: this package supports Python 3.10 and
    # websockets 17 does not. A dependency that cannot install on a Python the
    # package claims to support is a broken install, not a version to chase.
    "websockets>=15,<18",
]

[project.scripts]
lazycloud = "lazycloud.cli.main:start"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lazycloud = ["py.typed"]
