[project]
name = "identity"
version = "0.1.0"
description = "Authentication, authorization, token, and workspace identity services."
requires-python = ">=3.12"
dependencies = [
    "lazycloud-shared==0.1.0",
    "coordination",
    "database",
    "pydantic>=2.8,<3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
