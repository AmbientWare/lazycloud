[project]
name = "configs"
version = "0.1.0"
description = "Shared configuration files for LazyCloud"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/configs"]
artifacts = ["src/configs/*.yaml"]