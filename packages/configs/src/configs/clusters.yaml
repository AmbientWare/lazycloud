# LazyCloud Cluster Registry
#
# This file defines all clusters and their configuration.
# Used by the API for placement decisions and routing.
#
# Hetzner limit: 100 servers per private network
# Each cluster = 1 network = max 100 nodes

clusters:
  ash-1:
    # Identity
    name: ash-1
    display_name: "US East (Ashburn)"

    # Location
    provider: hetzner
    location: ash          # Hetzner location code
    region: us-east

    # Capacity (Hetzner network limit = 100)
    max_nodes: 100
    node_types:
      platform: cpx31     # 4 vCPU, 8GB RAM (shared — LazyCloud infra)
      sandbox: ccx33       # 8 dedicated vCPU, 32GB RAM (customer workloads)

    # Networking
    network_cidr: "10.0.0.0/16"
    pod_cidr: "10.244.0.0/16"
    service_cidr: "10.96.0.0/12"

    # Endpoints (tunnel auto-created by Terraform as lazycloud-prod-{cluster_id})
    tunnel_id: "b320e1a6-4ac8-403d-8d45-846628754721"
    api_endpoint: "https://5.161.17.148:6443"

    # Status
    status: active         # active | draining | maintenance
    default: true          # Default cluster for new deployments

    # Autoscaler bounds
    autoscaler:
      min_nodes: 2
      max_nodes: 20        # Current limit, increase as needed

# Future clusters (uncomment when ready)
#
# ash-2:
#   name: ash-2
#   display_name: "US East (Ashburn) #2"
#   provider: hetzner
#   location: ash
#   region: us-east
#   max_nodes: 100
#   node_types:
#     platform: cpx31
#     sandbox: ccx33
#   network_cidr: "10.1.0.0/16"  # Different CIDR per cluster
#   pod_cidr: "10.245.0.0/16"
#   service_cidr: "10.112.0.0/12"
#   api_endpoint: "https://ash-2.internal.lazycloud.dev:6443"
#   status: planned
#   default: false
#   autoscaler:
#     min_nodes: 2
#     max_nodes: 20
#

# Region preferences for placement
regions:
  us-east:
    clusters: [ash-1]      # Add ash-2 when ready
    default: ash-1
  eu-central:
    clusters: []           # Add fsn-1 when ready
    default: null
