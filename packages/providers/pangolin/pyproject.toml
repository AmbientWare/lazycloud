[project]
name = "provider-pangolin"
version = "0.1.0"
description = "Pangolin provider adapter for private sites and public domains."
requires-python = ">=3.12"
dependencies = [
    "lazycloud-shared==0.1.0",
    "networking",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.5,<3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
