[project]
name = "provider-hyperstack"
version = "0.1.0"
description = "Hyperstack on-demand pooled compute provider."
requires-python = ">=3.12"
dependencies = ["lazycloud-shared==0.1.0", "compute", "httpx>=0.27,<1"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
