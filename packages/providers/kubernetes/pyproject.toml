[project]
name = "provider-kubernetes"
version = "0.1.0"
description = "Authenticated Kubernetes container-worker replica scaler."
requires-python = ">=3.12"
dependencies = [
    "lazycloud-shared==0.1.0",
    "kubernetes>=30,<35",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
