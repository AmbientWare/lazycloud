[project]
name = "provider-fake"
version = "0.1.0"
description = "In-memory fake pooled-capacity provider adapter for dev/test bootstrap iteration."
requires-python = ">=3.12"
dependencies = [
    "lazycloud-shared==0.1.0",
    "botocore>=1.35,<2",
    "compute",
    "pydantic>=2.8,<3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
