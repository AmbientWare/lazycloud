[project]
name = "provider-hetzner"
version = "0.1.0"
description = "Hetzner Cloud pooled compute provider."
requires-python = ">=3.12"
dependencies = [
    "lazycloud-shared==0.1.0",
    "compute",
    "coordination",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
