[project]
name = "provider-aws"
version = "0.1.0"
description = "AWS provider adapter package for the compute platform."
requires-python = ">=3.12"
dependencies = [
    "lazycloud-shared==0.1.0",
    "boto3>=1.43.69,<2",
    "botocore>=1.43.69,<2",
    "compute",
    "pydantic-settings>=2.5,<3",
    "storage-client",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
