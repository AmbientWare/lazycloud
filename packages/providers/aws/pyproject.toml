[project]
name = "provider-aws"
version = "0.1.0"
description = "AWS provider adapter package for the compute platform."
requires-python = ">=3.12"
dependencies = [
    "lazycloud-shared==0.1.0",
    "boto3>=1.35,<2",
    "botocore>=1.35,<2",
    "compute",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
