[project]
name = "notifications"
version = "0.1.0"
description = "Transactional email: the outbox the platform queues into and the drain that delivers it."
requires-python = ">=3.12"
dependencies = [
    "lazycloud-shared==0.1.0",
    "database",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
