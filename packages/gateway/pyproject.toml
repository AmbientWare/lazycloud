[project]
name = "gateway"
version = "0.1.0"
description = "Gateway shared, route dialing, private-pool views, and gateway runtime helpers."
requires-python = ">=3.12"
dependencies = [
    "compute",
    "coordination",
    "lazycloud-shared==0.1.0",
    "control",
    "database",
    "execution",
    "foundation",
    "identity",
    "networking",
    "observability",
    "operations",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "scheduler",
    "storage",
    "worker",
    "redis>=7,<8",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
