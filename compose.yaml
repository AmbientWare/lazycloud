name: lazycloud

x-local-hosts: &local-hosts
  - "host.docker.internal:host-gateway"
  - "lazycloud.localhost:host-gateway"
  - "object-store.localhost:host-gateway"

x-process-env: &process-env
  LAZYCLOUD_HOME: "${LAZYCLOUD_COMPOSE_CONTAINER_HOME:-/var/lib/lazycloud}"
  LAZYCLOUD_LOG_LEVEL: "${LAZYCLOUD_LOG_LEVEL:-INFO}"

# The host and port are literal, not `${VAR:-default}`. They are a fact of this
# file's own topology: applications use `pgbouncer`, migrations use `postgres`,
# and the cache is `redis`. The same names in `.env` carry the host-side addresses that
# `lazycloud-admin` uses to reach the same services, and a passthrough would hand
# those to the containers, where `localhost` is the container itself. The
# password is not topology, and is the one Postgres itself is initialized with,
# so it reads the same variable rather than a copy that can disagree with it.
x-database-env: &database-env
  # The default names the Compose service; a deployment supplies its own, because
  # the postgres container is not among the services it starts. Deliberately not
  # named LAZYCLOUD_DATABASE_URL: that one is the host-side value the CLI uses and
  # points at localhost, which resolves to the wrong thing inside a container.
  LAZYCLOUD_DATABASE_URL: "${LAZYCLOUD_COMPOSE_DATABASE_URL:-postgresql+psycopg://lazycloud:${POSTGRES_PASSWORD:-lazycloud}@pgbouncer:6432/lazycloud}"
  LAZYCLOUD_DATABASE_DIRECT_URL: "${LAZYCLOUD_COMPOSE_DATABASE_DIRECT_URL:-postgresql+psycopg://lazycloud:${POSTGRES_PASSWORD:-lazycloud}@postgres:5432/lazycloud}"
x-redis-env: &redis-env
  LAZYCLOUD_REDIS_URL: "redis://redis:6379/0"

# Metrics and traces are counted in each process and pushed to the collector on
# an interval. Nothing durable holds them, so a stack without a receiver records
# into instruments that go nowhere rather than failing.
x-telemetry-env: &telemetry-env
  LAZYCLOUD_TELEMETRY_ENABLED: "${LAZYCLOUD_TELEMETRY_ENABLED:-true}"
  LAZYCLOUD_TELEMETRY_ENDPOINT: "${LAZYCLOUD_TELEMETRY_ENDPOINT:-http://otel-collector:4318}"
x-gateway-env: &gateway-env
  LAZYCLOUD_GATEWAY_PUBLIC_HTTP_URL: "${LAZYCLOUD_GATEWAY_PUBLIC_HTTP_URL:-http://lazycloud.localhost:${LAZYCLOUD_COMPOSE_CONTROL_PLANE_PORT:-8000}}"

x-tunnel-env: &tunnel-env
  LAZYCLOUD_TUNNEL_HOSTNAME: "${LAZYCLOUD_TUNNEL_HOSTNAME:-tunnels.lazycloud.test}"
  LAZYCLOUD_TUNNEL_GATEWAY_BOOTSTRAP_SECRET: "${LAZYCLOUD_TUNNEL_GATEWAY_BOOTSTRAP_SECRET:?Initialize local credentials with deploy/setup-local-env.sh}"

# Credentials for the edge that terminates TLS on customer-owned hostnames. Empty
# by default: a deployment without them serves every platform hostname exactly as
# before, and only the domain operations fail, naming what is missing.
x-cloudflare-env: &cloudflare-env
  LAZYCLOUD_CLOUDFLARE_API_TOKEN: "${LAZYCLOUD_CLOUDFLARE_API_TOKEN:-}"
  LAZYCLOUD_CLOUDFLARE_ZONE_ID: "${LAZYCLOUD_CLOUDFLARE_ZONE_ID:-}"

# The payment provider customers are registered with. Empty by default: the stack
# boots and goes on metering and pricing usage, but nothing can be registered or
# charged until this is set, and both places that need it name the missing
# variable rather than going quiet — sign-in registers the customer before it
# mints a session, and the scheduler sweep that delivers priced usage says so
# every tick.
x-stripe-env: &stripe-env
  LAZYCLOUD_STRIPE_API_KEY: "${LAZYCLOUD_STRIPE_API_KEY:-}"
  LAZYCLOUD_STRIPE_WEBHOOK_SECRET: "${LAZYCLOUD_STRIPE_WEBHOOK_SECRET:-}"
  LAZYCLOUD_RESEND_API_KEY: "${LAZYCLOUD_RESEND_API_KEY:-}"
  LAZYCLOUD_RESEND_FROM_ADDRESS: "${LAZYCLOUD_RESEND_FROM_ADDRESS:-LazyCloud <noreply@lazycloud.dev>}"
  LAZYCLOUD_RESEND_WEBHOOK_SECRET: "${LAZYCLOUD_RESEND_WEBHOOK_SECRET:-}"

# The GitHub App people sign in through. Empty by default: the stack boots and
# every Compose step drives the platform with LAZYCLOUD_TOKEN, so only browser
# sign-in is unavailable, and it says which variables are missing when tried.
x-github-env: &github-env
  LAZYCLOUD_GITHUB_CLIENT_ID: "${LAZYCLOUD_GITHUB_CLIENT_ID:-}"
  LAZYCLOUD_GITHUB_CLIENT_SECRET: "${LAZYCLOUD_GITHUB_CLIENT_SECRET:-}"
  LAZYCLOUD_GITHUB_REDIRECT_URI: "${LAZYCLOUD_GITHUB_REDIRECT_URI:-http://lazycloud.localhost:${LAZYCLOUD_COMPOSE_CONTROL_PLANE_PORT:-8000}/auth/github/callback}"

x-api-env: &api-env
  LAZYCLOUD_TCP_INGRESS_ENABLED: "true"
  LAZYCLOUD_TCP_INGRESS_CERTIFICATE_FILE: "/var/lib/lazycloud/tcp-ingress/tls.crt"
  LAZYCLOUD_TCP_INGRESS_KEY_FILE: "/var/lib/lazycloud/tcp-ingress/tls.key"
  LAZYCLOUD_PUBLIC_INGRESS_CLIENT_IP_HEADER: "${LAZYCLOUD_PUBLIC_INGRESS_CLIENT_IP_HEADER:-}"
  LAZYCLOUD_TUNNEL_ISSUER_CERTIFICATE_FILE: "/run/lazycloud/tunnel-issuer/certificate.pem"
  LAZYCLOUD_TUNNEL_ISSUER_PRIVATE_KEY_FILE: "/run/lazycloud/tunnel-issuer/private-key.pem"

x-object-store-env: &object-store-env
  LAZYCLOUD_OBJECT_STORE_ENDPOINT_URL: "${LAZYCLOUD_OBJECT_STORE_ENDPOINT_URL:?Set the object storage endpoint}"
  LAZYCLOUD_OBJECT_STORE_REGION_NAME: "${LAZYCLOUD_OBJECT_STORE_REGION_NAME:?Set the object storage signing region}"
  LAZYCLOUD_OBJECT_STORE_ACCESS_KEY_ID: "${LAZYCLOUD_OBJECT_STORE_ACCESS_KEY_ID:-}"
  LAZYCLOUD_OBJECT_STORE_SECRET_ACCESS_KEY: "${LAZYCLOUD_OBJECT_STORE_SECRET_ACCESS_KEY:-}"
  LAZYCLOUD_OBJECT_STORE_FORCE_PATH_STYLE: "${LAZYCLOUD_OBJECT_STORE_FORCE_PATH_STYLE:-true}"
  LAZYCLOUD_OBJECT_STORE_BUCKET: "${LAZYCLOUD_OBJECT_STORE_BUCKET:?Set the application bucket}"
  LAZYCLOUD_OBJECT_STORE_WORKSPACE_BUCKET_PREFIX: "${LAZYCLOUD_OBJECT_STORE_WORKSPACE_BUCKET_PREFIX:?Set a unique workspace bucket prefix}"

x-workspace-storage-issuer-env: &workspace-storage-issuer-env
  LAZYCLOUD_WORKSPACE_STORAGE_ISSUER: "${LAZYCLOUD_WORKSPACE_STORAGE_ISSUER:?Select the workspace credential issuer}"
  LAZYCLOUD_AWS_WORKSPACE_STORAGE_ROLE_ARN: "${LAZYCLOUD_AWS_WORKSPACE_STORAGE_ROLE_ARN:-}"
  LAZYCLOUD_AWS_STORAGE_ACCESS_BUCKET: "${LAZYCLOUD_AWS_STORAGE_ACCESS_BUCKET:-}"
  LAZYCLOUD_AWS_STORAGE_ACCESS_QUEUE_URL: "${LAZYCLOUD_AWS_STORAGE_ACCESS_QUEUE_URL:-}"
  LAZYCLOUD_GARAGE_ADMIN_ENDPOINT_URL: "http://object-store:3903"
  LAZYCLOUD_GARAGE_ADMIN_TOKEN: "${LAZYCLOUD_GARAGE_ADMIN_TOKEN:?Run local environment setup}"

x-image-build-env: &image-build-env
  LAZYCLOUD_IMAGE_BUILD_CONTAINER_ADDRESS_WAIT_TIMEOUT_SECONDS: "120"
  LAZYCLOUD_IMAGE_BUILD_CONTAINER_ADDRESS_POLL_INTERVAL_SECONDS: "0.5"
  # Empty means the workspace compute policy chooses where builds run. Pinning a
  # pool here attaches every build to that pool and silently overrides the policy,
  # so a deployment whose capacity is a connected provider queues each build for
  # local capacity that does not exist until it hits the retry limit.

# Both bootstrap composers resolve the same complete release.
x-release-env: &release-env
  LAZYCLOUD_RELEASE_MANIFEST_URL: "${LAZYCLOUD_RELEASE_MANIFEST_URL:-}"

x-agent-binary-env: &agent-binary-env
  LAZYCLOUD_AGENT_BINARY_DIR: "${LAZYCLOUD_AGENT_BINARY_DIR:-/var/lib/lazycloud/agent-binarys}"

x-aws-compute-env: &aws-compute-env
  LAZYCLOUD_AWS_CONNECTION_CONTROL_PRINCIPAL_ARN: "${LAZYCLOUD_AWS_CONNECTION_CONTROL_PRINCIPAL_ARN:-}"
  LAZYCLOUD_PLATFORM_CAPACITY_HETZNER_IMAGES: "${LAZYCLOUD_PLATFORM_CAPACITY_HETZNER_IMAGES:-{}}"
  LAZYCLOUD_PLATFORM_CAPACITY_HETZNER_TOKENS: "${LAZYCLOUD_PLATFORM_CAPACITY_HETZNER_TOKENS:-{}}"

x-scheduler-env: &scheduler-env
  LAZYCLOUD_COMPUTE_RECLAIM_REGISTRATION_DEADLINE_SECONDS: "3600"

x-platform-aws-credentials: &platform-aws-credentials
  AWS_REGION: "${AWS_REGION:-us-east-1}"
  AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
  AWS_CONFIG_FILE: /run/lazycloud/aws/config
  AWS_SHARED_CREDENTIALS_FILE: /run/lazycloud/aws/credentials
  AWS_SDK_LOAD_CONFIG: "1"
  # Not AWS_PROFILE: boto applies that to every client in the process, and only
  # calls into a connected account belong on the control principal.
  LAZYCLOUD_AWS_CONNECTION_PROFILE: "${LAZYCLOUD_COMPOSE_AWS_PROFILE:-control}"

x-platform-aws-config: &platform-aws-config
  "${LAZYCLOUD_COMPOSE_AWS_CONFIG_DIR:-$HOME/.lazycloud/compose-aws}:/run/lazycloud/aws:ro"

x-container-service-credentials: &container-service-credentials
  LAZYCLOUD_CONTAINER_SERVICE_TOKEN: "${LAZYCLOUD_CONTAINER_SERVICE_TOKEN:-}"

x-cache-origin-registry: &cache-origin-registry
  LAZYCLOUD_IMAGE_REGISTRY_STORE: "s3"
  LAZYCLOUD_WORKLOAD_IMAGE_REGISTRY_REPOSITORY: "${LAZYCLOUD_WORKLOAD_IMAGE_REGISTRY_REPOSITORY:-localhost:5000/lazycloud/workload-images}"

x-database-bootstrap-env: &database-bootstrap-env
  LAZYCLOUD_HOME: "${LAZYCLOUD_COMPOSE_CONTAINER_HOME:-/var/lib/lazycloud}"
  LAZYCLOUD_LOG_LEVEL: "${LAZYCLOUD_LOG_LEVEL:-INFO}"
  # The default names the Compose service; a deployment supplies its own, because
  # the postgres container is not among the services it starts. Deliberately not
  # named LAZYCLOUD_DATABASE_URL: that one is the host-side value the CLI uses and
  # points at localhost, which resolves to the wrong thing inside a container.
  LAZYCLOUD_DATABASE_URL: "${LAZYCLOUD_COMPOSE_DATABASE_URL:-postgresql+psycopg://lazycloud:${POSTGRES_PASSWORD:-lazycloud}@pgbouncer:6432/lazycloud}"
  LAZYCLOUD_DATABASE_DIRECT_URL: "${LAZYCLOUD_COMPOSE_DATABASE_DIRECT_URL:-postgresql+psycopg://lazycloud:${POSTGRES_PASSWORD:-lazycloud}@postgres:5432/lazycloud}"

x-lazycloud-build-args: &lazycloud-build-args
  # An empty docs URL uses the published documentation site.
  VITE_LAZYCLOUD_DOCS_URL: "${LAZYCLOUD_DOCS_URL:-}"

x-lazycloud-depends: &lazycloud-depends
  object-store-bootstrap:
    condition: service_completed_successfully
  billing-rates:
    condition: service_completed_successfully
  pgbouncer:
    condition: service_healthy
  database-bootstrap:
    condition: service_completed_successfully
  redis:
    condition: service_healthy

x-lazycloud-role-depends: &lazycloud-role-depends
  control-plane:
    condition: service_healthy

services:
  object-store:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: "${LAZYCLOUD_GARAGE_RPC_SECRET:?Run local environment setup}"
      GARAGE_ADMIN_TOKEN: "${LAZYCLOUD_GARAGE_ADMIN_TOKEN:?Run local environment setup}"
    volumes:
      - ./deploy/garage/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    networks:
      default:
        aliases: [object-store.localhost]
    ports:
      - "${LAZYCLOUD_COMPOSE_OBJECT_STORE_PORT:-3900}:3900"
      - "127.0.0.1:${LAZYCLOUD_COMPOSE_OBJECT_STORE_ADMIN_PORT:-3903}:3903"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 3s
      retries: 10

  object-store-bootstrap:
    image: "database-bootstrap:${LAZYCLOUD_COMPOSE_IMAGE_TAG:-local}"
    extra_hosts: *local-hosts
    build:
      context: .
      dockerfile: docker/Dockerfile.control-plane
      target: database-bootstrap
      args: *lazycloud-build-args
    entrypoint: ["python", "/bootstrap.py"]
    environment:
      <<: [*object-store-env, *workspace-storage-issuer-env]
    volumes:
      - ./deploy/garage/bootstrap.py:/bootstrap.py:ro
    depends_on:
      object-store:
        condition: service_healthy

  # No health check: the image carries no shell and no HTTP client, so there is
  # nothing to exec. Nothing depends on this service either — a process whose
  # exporter cannot reach a receiver drops the batch and keeps serving.
  otel-collector:
    image: otel/opentelemetry-collector:0.119.0
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./deploy/telemetry/collector.yaml:/etc/otel/config.yaml:ro

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "lazycloud"
      POSTGRES_USER: "lazycloud"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-lazycloud}"
    ports:
      - "${LAZYCLOUD_COMPOSE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lazycloud -d lazycloud"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgbouncer:
    image: "pgbouncer:${LAZYCLOUD_COMPOSE_IMAGE_TAG:-local}"
    build:
      context: ./deploy/pgbouncer
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-lazycloud}"
    ports:
      - "127.0.0.1:${LAZYCLOUD_COMPOSE_PGBOUNCER_PORT:-6432}:6432"
    tmpfs:
      - /run/pgbouncer:uid=10001,gid=10001,mode=0700
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD="$$POSTGRES_PASSWORD" psql -X -w -h 127.0.0.1 -p 6432 -U lazycloud -d lazycloud -c 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 3s
      retries: 20

  workload-registry:
    image: registry:2.8.3
    restart: unless-stopped
    ports:
      - "${LAZYCLOUD_COMPOSE_WORKLOAD_REGISTRY_PORT:-5000}:5000"
    volumes:
      - workload-registry-data:/var/lib/registry
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/v2/ >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30

  database-bootstrap:
    image: "database-bootstrap:${LAZYCLOUD_COMPOSE_IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: docker/Dockerfile.control-plane
      target: database-bootstrap
      args: *lazycloud-build-args
    command: ["lazycloud-admin", "database", "migrate"]
    environment: *database-bootstrap-env
    depends_on:
      pgbouncer:
        condition: service_healthy

  billing-rates:
    image: "cli:${LAZYCLOUD_COMPOSE_IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: docker/Dockerfile.control-plane
      target: cli
      args: *lazycloud-build-args
    entrypoint: ["lazycloud-admin"]
    command: ["--json", "billing", "publish-rates", "--confirm"]
    environment: *database-bootstrap-env
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully

  log-retention:
    image: "cli:${LAZYCLOUD_COMPOSE_IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: docker/Dockerfile.control-plane
      target: cli
      args: *lazycloud-build-args
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        trap 'exit 0' TERM INT
        while true; do
          lazycloud-admin --json maintenance prune-logs
          touch /tmp/log-retention.heartbeat
          sleep 900 &
          wait $$!
        done
    environment: *database-env
    depends_on:
      pgbouncer:
        condition: service_healthy
      database-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "shared.process_liveness", "--max-age-seconds", "1200", "/tmp/log-retention.heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 300s

  administrator-bootstrap:
    image: "database-bootstrap:${LAZYCLOUD_COMPOSE_IMAGE_TAG:-local}"
    extra_hosts: *local-hosts
    entrypoint: ["lazycloud-admin", "--json", "auth", "bootstrap"]
    command:
      - --token-file
      - /run/secrets/lazycloud-administrator-token
      - --output
      - /var/lib/lazycloud/bootstrap/administrator-token
    environment:
      <<: [*database-bootstrap-env, *object-store-env, *gateway-env]
      LAZYCLOUD_ADMINISTRATOR_GITHUB_USER_ID: "${LAZYCLOUD_ADMINISTRATOR_GITHUB_USER_ID:-}"
    depends_on:
      object-store-bootstrap:
        condition: service_completed_successfully
      database-bootstrap:
        condition: service_completed_successfully
    volumes:
      - lazycloud-administrator-token:/var/lib/lazycloud/bootstrap
    secrets:
      - source: lazycloud-bootstrap-administrator-token
        target: lazycloud-administrator-token
        mode: 0400

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${LAZYCLOUD_COMPOSE_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  tcp-certificate:
    image: "api:${LAZYCLOUD_COMPOSE_IMAGE_TAG:-local}"
    command:
      [
        "lazycloud-tcp-certificate",
        "--certificate-file",
        "/var/lib/lazycloud/tcp-ingress/tls.crt",
        "--key-file",
        "/var/lib/lazycloud/tcp-ingress/tls.key",
        "--external-host",
        "${LAZYCLOUD_TCP_INGRESS_EXTERNAL_HOST:-tcp.localhost}",
      ]
    volumes:
      - tcp-ingress-tls:/var/lib/lazycloud/tcp-ingress

  tunnel-issuer-bootstrap:
    image: "database-bootstrap:${LAZYCLOUD_COMPOSE_IMAGE_TAG:-local}"
    command:
      - python
      - -m
      - deploy.tunnel_identity
      - local
      - --directory
      - /var/lib/lazycloud/tunnel-issuer
      - --hostname
      - "${LAZYCLOUD_TUNNEL_HOSTNAME:-tunnels.lazycloud.test}"
    volumes:
      - tunnel-issuer:/var/lib/lazycloud/tunnel-issuer

  connection-gateway: &connection-gateway
    image: "connection-gateway:${LAZYCLOUD_COMPOSE_IMAGE_TAG:-local}"
    restart: unless-stopped
    stop_grace_period: 90s
    build:
      context: .
      dockerfile: docker/Dockerfile.control-plane
      target: connection-gateway
      args: *lazycloud-build-args
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export LAZYCLOUD_CONNECTION_GATEWAY_ADVERTISED_ADDRESS="$$(hostname -i):8443"
        exec lazycloud-connection-gateway
    environment:
      <<: [*process-env, *database-env, *redis-env, *gateway-env, *tunnel-env]
      LAZYCLOUD_CONNECTION_GATEWAY_CONTROL_ADDRESS: "control-plane:9000"
      LAZYCLOUD_DATABASE_POOL_SIZE: "1"
      LAZYCLOUD_DATABASE_MAX_OVERFLOW: "0"
    extra_hosts: *local-hosts
    depends_on:
      control-plane:
        condition: service_healthy
    volumes:
      - connection-gateway-0:/var/lib/lazycloud/connection-gateway
    healthcheck:
      test: ["CMD", "python", "-m", "shared.process_liveness", "--max-age-seconds", "15", "/tmp/lazycloud-connection-gateway.ready"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  connection-gateway-1:
    <<: *connection-gateway
    volumes:
      - connection-gateway-1:/var/lib/lazycloud/connection-gateway

  connection-ingress:
    image: haproxy:3.2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - "./deploy/connection-ingress/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"
    networks:
      default:
        aliases:
          - "${LAZYCLOUD_TUNNEL_HOSTNAME:-tunnels.lazycloud.test}"
    depends_on:
      connection-gateway:
        condition: service_healthy
      connection-gateway-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "443"]
      interval: 2s
      timeout: 2s
      retries: 10

  control-plane:
    image: "api:${LAZYCLOUD_COMPOSE_IMAGE_TAG:-local}"
    extra_hosts: *local-hosts
    restart: unless-stopped
    stop_grace_period: 150s
    build:
      context: .
      dockerfile: docker/Dockerfile.control-plane
      target: api
      args: *lazycloud-build-args
    command:
      [
        "lazycloud-api",
        "--host",
        "0.0.0.0",
        "--port",
        "9000",
        "--log-level",
        "${LAZYCLOUD_LOG_LEVEL:-INFO}",
      ]
    environment:
      <<:
        [
          *process-env,
          *database-env,
          *redis-env,
          *telemetry-env,
          *gateway-env,
          *cloudflare-env,
          *stripe-env,
          *github-env,
          *api-env,
          *tunnel-env,
          *object-store-env,
          *workspace-storage-issuer-env,
          *image-build-env,
          *release-env,
          *agent-binary-env,
          *aws-compute-env,
          *platform-aws-credentials,
          *container-service-credentials,
          *cache-origin-registry,
        ]
    deploy:
      replicas: 1
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    ports:
      - "${LAZYCLOUD_COMPOSE_CONTROL_PLANE_PORT:-8000}:9000"
      - "${LAZYCLOUD_COMPOSE_TCP_INGRESS_PORT:-1995}:1995"
    depends_on:
      <<: *lazycloud-depends
      administrator-bootstrap:
        condition: service_completed_successfully
      tcp-certificate:
        condition: service_completed_successfully
      tunnel-issuer-bootstrap:
        condition: service_completed_successfully
    volumes:
      - lazycloud-files:/var/lib/lazycloud
      - "${LAZYCLOUD_COMPOSE_AGENT_BINARY_DIR:-./.lazycloud/agent-binarys}:/var/lib/lazycloud/agent-binarys:ro"
      - "./.lazycloud-release:/run/lazycloud/release:ro"
      - tcp-ingress-tls:/var/lib/lazycloud/tcp-ingress:ro
      - tunnel-issuer:/run/lazycloud/tunnel-issuer:ro
      - *platform-aws-config
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:9000/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  cli:
    profiles: ["tools"]
    image: "cli:${LAZYCLOUD_COMPOSE_IMAGE_TAG:-local}"
    extra_hosts: *local-hosts
    build:
      context: .
      dockerfile: docker/Dockerfile.control-plane
      target: cli
      args: *lazycloud-build-args
    command: ["lazycloud-admin", "--help"]
    environment:
      <<:
        [
          *process-env,
          *database-env,
          *redis-env,
          *gateway-env,
          *cloudflare-env,
          *object-store-env,
          *image-build-env,
          *agent-binary-env,
          *container-service-credentials,
        ]
    depends_on:
      control-plane:
        condition: service_healthy
    volumes:
      - lazycloud-files:/var/lib/lazycloud

  public-ingress:
    profiles:
      - public-ingress
    image: "${LAZYCLOUD_CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.7.3}"
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_healthy
    command:
      - tunnel
      - --config
      - /etc/cloudflared/cloudflared.yml
      - run
    volumes:
      # The route allowlist is reviewed in this repository, not held in the
      # Cloudflare dashboard: the tunnel is created with `config_src: local`, so
      # the edge pushes no ingress configuration and this file is the only
      # source of what is exposed.
      - "./deploy/public-ingress/cloudflared.yml:/etc/cloudflared/cloudflared.yml:ro"
      - "${LAZYCLOUD_PUBLIC_INGRESS_CREDENTIALS_FILE:-/dev/null}:/etc/cloudflared/credentials.json:ro"
    environment:
      TUNNEL_METRICS: "127.0.0.1:20241"

  agent-join-token:
    image: "cli:${LAZYCLOUD_COMPOSE_IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: docker/Dockerfile.control-plane
      target: cli
      args: *lazycloud-build-args
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        state_dir="${LAZYCLOUD_COMPOSE_AGENT_STATE_DIR:-/var/lib/lazycloud/agent}"
        token_path="$$state_dir/join-token"
        mkdir -p "$$state_dir"
        chmod 0700 "$$state_dir"
        export GATEWAY_TOKEN="$$(cat /run/secrets/lazycloud-administrator-token)"
        # The credential belongs to the customer even though the administrator mints
        # it: the enrollment names whoever asked, and placement compares that account
        # against the one the work belongs to. An administrator-owned token would make
        # the machine the platform's and prove nothing about tenancy.
        customer_name="${LAZYCLOUD_COMPOSE_CUSTOMER_NAME:-customer}"
        customer_id="$$(lazycloud-admin --json user list \
          | python -c 'import json,sys; n=sys.argv[1]; print(next((u["user"]["id"] for u in json.load(sys.stdin) if u["user"]["display_name"]==n), ""))' \
              "$$customer_name")"
        if [ -z "$$customer_id" ]; then
          customer_id="$$(lazycloud-admin --json user create --name "$$customer_name" --administrator \
            | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
        fi
        customer_token="$$(lazycloud-admin --json token create compose-agent-join --user "$$customer_id" \
          | python -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
        export GATEWAY_TOKEN="$$customer_token"
        lazycloud-admin --json workspace show "${LAZYCLOUD_COMPOSE_CUSTOMER_WORKSPACE:-tenant-customer}" >/dev/null 2>&1 \
          || lazycloud-admin --json workspace create "${LAZYCLOUD_COMPOSE_CUSTOMER_WORKSPACE:-tenant-customer}" >/dev/null
        lazycloud-admin --json compute policy update \
          --workspace "${LAZYCLOUD_COMPOSE_CUSTOMER_WORKSPACE:-tenant-customer}" \
          --default-pool "${LAZYCLOUD_COMPOSE_SELF_HOSTED_POOL:-self-hosted}" >/dev/null
        temporary="$${token_path}.tmp"
        rm -f "$$temporary"
        # Retried, because health is a lagging signal: the ingress reports what
        # was true at its last probe, and a replica recreated since then refuses
        # until it is listening. One attempt turns that window into a stack with
        # no join credential and an agent that never arrives.
        attempt=1
        until lazycloud-admin --json machine join-token --pool "${LAZYCLOUD_COMPOSE_SELF_HOSTED_POOL:-self-hosted}" --ttl 15m \
          | python -c \
              'import json, pathlib, sys; pathlib.Path(sys.argv[1]).write_text(json.load(sys.stdin)["token"], encoding="utf-8")' \
              "$$temporary"
        do
          if [ "$$attempt" -ge 30 ]; then
            echo "no control plane issued a join credential after $$attempt attempts" >&2
            exit 1
          fi
          attempt=$$((attempt + 1))
          sleep 2
        done
        chmod 0600 "$$temporary"
        mv "$$temporary" "$$token_path"
        echo "compose agent one-use join credential initialized"
    environment:
      GATEWAY_HTTP_URL: "http://control-plane:9000"
      WORKSPACE_ID: "${LAZYCLOUD_COMPOSE_CUSTOMER_WORKSPACE:-tenant-customer}"
    depends_on:
      control-plane:
        condition: service_healthy
    volumes:
      - "${LAZYCLOUD_COMPOSE_AGENT_STATE_DIR:-/var/lib/lazycloud/agent}:${LAZYCLOUD_COMPOSE_AGENT_STATE_DIR:-/var/lib/lazycloud/agent}"
    secrets:
      - source: lazycloud-bootstrap-administrator-token
        target: lazycloud-administrator-token
        mode: 0400

  agent:
    image: "agent:${LAZYCLOUD_COMPOSE_IMAGE_TAG:-local}"
    restart: unless-stopped
    init: true
    stop_grace_period: 90s
    privileged: true
    build:
      context: .
      dockerfile: deploy/agent-binary/Dockerfile
      target: agent-runtime
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        children=()
        cleanup() {
          trap - EXIT TERM INT
          kill -TERM "$${children[@]}" 2>/dev/null || true
          wait "$${children[@]}" 2>/dev/null || true
        }
        trap cleanup EXIT
        trap 'exit 143' TERM
        trap 'exit 130' INT
        socat TCP-LISTEN:5000,bind=127.0.0.1,fork,reuseaddr TCP:workload-registry:5000 &
        children+=("$$!")
        compose_gateway="$$(ip -4 route show default | awk '/default/ {print $$3; exit}')"
        if [ -z "$$compose_gateway" ]; then
          echo "Docker gateway is required for the agent-managed worker" >&2
          exit 2
        fi
        gateway_url="http://$${compose_gateway}:${LAZYCLOUD_COMPOSE_CONTROL_PLANE_PORT:-8000}"
        lazycloud-agent join \
          --gateway "$$gateway_url" \
          --join-token-file "${LAZYCLOUD_COMPOSE_AGENT_STATE_DIR:-/var/lib/lazycloud/agent}/join-token" \
          --state-dir "${LAZYCLOUD_COMPOSE_AGENT_STATE_DIR:-/var/lib/lazycloud/agent}" \
          --hostname "${LAZYCLOUD_COMPOSE_AGENT_HOSTNAME:-compose-agent}" \
          --machine-fingerprint "${LAZYCLOUD_COMPOSE_AGENT_MACHINE_FINGERPRINT:-compose-agent}" \
          --worker-image "container-worker:${LAZYCLOUD_COMPOSE_IMAGE_TAG:-local}" \
          --worker-network "container:$$HOSTNAME" \
          --worker-bridge-name "${LAZYCLOUD_COMPOSE_AGENT_WORKER_BRIDGE:-rt_br0}" \
          --worker-bridge-subnet "${LAZYCLOUD_COMPOSE_AGENT_WORKER_SUBNET:-192.168.0.0/20}" \
          --worker-bridge-ipv6-subnet "${LAZYCLOUD_COMPOSE_AGENT_WORKER_IPV6_SUBNET:-fd00:abcd::/64}" \
          --max-cpu "${LAZYCLOUD_COMPOSE_AGENT_MAX_CPU_CORES:-4}" \
          --max-memory "${LAZYCLOUD_COMPOSE_AGENT_MAX_MEMORY_MIB:-8192}MiB" \
          --stream-interval-seconds "${LAZYCLOUD_COMPOSE_AGENT_STREAM_INTERVAL_SECONDS:-1}" &
        children+=("$$!")
        wait -n "$${children[@]}"
    extra_hosts: *local-hosts
    devices:
      - /dev/fuse:/dev/fuse
    depends_on:
      agent-join-token:
        condition: service_completed_successfully
      cache-server:
        condition: service_healthy
      connection-ingress:
        condition: service_healthy
      workload-registry:
        condition: service_healthy
    volumes:
      - "${LAZYCLOUD_COMPOSE_AGENT_STATE_DIR:-/var/lib/lazycloud/agent}:${LAZYCLOUD_COMPOSE_AGENT_STATE_DIR:-/var/lib/lazycloud/agent}"
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/run/netns:/var/run/netns
    healthcheck:
      test:
        [
          "CMD",
          "test",
          "-s",
          "${LAZYCLOUD_COMPOSE_AGENT_STATE_DIR:-/var/lib/lazycloud/agent}/runtime-ready.json",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  scheduler:
    image: "scheduler:${LAZYCLOUD_COMPOSE_IMAGE_TAG:-local}"
    extra_hosts: *local-hosts
    # Two, like the control plane. The work that spends money already
    # serialises on a Redis key per capacity owner; what needed fixing was the
    # orphan confirmation window and pod expiry, both of which decided from
    # process-local state.
    deploy:
      replicas: 2
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile.control-plane
      target: scheduler
      args: *lazycloud-build-args
    command:
      [
        "lazycloud-scheduler",
        "--container-limit",
        "${LAZYCLOUD_COMPOSE_SCHEDULER_CONTAINER_LIMIT:-100}",
      ]
    environment:
      <<:
        [
          *process-env,
          *database-env,
          *redis-env,
          *telemetry-env,
          *gateway-env,
          *cloudflare-env,
          # The scheduler drains the meter outbox, so it holds the payment
          # credential the control plane holds. Without it this process runs and
          # never delivers, which is metered usage nobody is charged for.
          *stripe-env,
          *object-store-env,
          *workspace-storage-issuer-env,
          *release-env,
          *agent-binary-env,
          *aws-compute-env,
          *scheduler-env,
          *platform-aws-credentials,
          *container-service-credentials,
        ]
    depends_on: *lazycloud-role-depends
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "scheduler_app.health",
          "--max-age-seconds",
          "${LAZYCLOUD_COMPOSE_SCHEDULER_LIVENESS_MAX_AGE_SECONDS:-300}",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    volumes:
      - lazycloud-files:/var/lib/lazycloud
      - *platform-aws-config
      - "./.lazycloud-release:/run/lazycloud/release:ro"

  container-worker:
    profiles: [build]
    image: "container-worker:${LAZYCLOUD_COMPOSE_IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      target: container-worker
      args: *lazycloud-build-args

  cache-token:
    image: "cache-server:${LAZYCLOUD_COMPOSE_IMAGE_TAG:-local}"
    command:
      - python
      - -c
      - "from pathlib import Path; import secrets; p=Path('/var/lib/lazycloud/tokens/cache-service-token'); p.parent.mkdir(parents=True, exist_ok=True); existing=p.read_text(encoding='utf-8').strip() if p.exists() else ''; p.write_text(existing or secrets.token_urlsafe(48), encoding='utf-8'); p.chmod(0o400)"
    volumes:
      - lazycloud-cache-token:/var/lib/lazycloud/tokens

  cache-server:
    image: "cache-server:${LAZYCLOUD_COMPOSE_IMAGE_TAG:-local}"
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile.control-plane
      target: cache-server
      args: *lazycloud-build-args
    command:
      [
        "lazycloud-cache-server",
        "--host",
        "0.0.0.0",
        "--port",
        "7900",
        "--root",
        "/var/lib/lazycloud/cache",
      ]
    environment:
      LAZYCLOUD_HOME: "${LAZYCLOUD_COMPOSE_CONTAINER_HOME:-/var/lib/lazycloud}"
      LAZYCLOUD_CACHE_SERVICE_TOKEN: "${LAZYCLOUD_CACHE_SERVICE_TOKEN:-}"
      LAZYCLOUD_CACHE_SERVICE_TOKEN_FILE: "${LAZYCLOUD_CACHE_SERVICE_TOKEN_FILE:-/var/lib/lazycloud/tokens/cache-service-token}"
      LAZYCLOUD_CACHE_SERVICE_PREVIOUS_TOKEN: "${LAZYCLOUD_CACHE_SERVICE_PREVIOUS_TOKEN:-}"
      LAZYCLOUD_CACHE_MAX_CONTENT_BYTES: "21474836480"
      LAZYCLOUD_CACHE_MAX_OBJECT_BYTES: "8589934592"
      LAZYCLOUD_CACHE_MAX_METADATA_ENTRIES: "100000"
      LAZYCLOUD_CACHE_MAX_PATH_BYTES: "4096"
      LAZYCLOUD_CACHE_DISK_MAX_USAGE_PCT: "0.90"
      LAZYCLOUD_CACHE_DISK_EVICT_WATERMARK_PCT: "0.85"
    depends_on:
      <<: *lazycloud-role-depends
      cache-token:
        condition: service_completed_successfully
    volumes:
      - lazycloud-files:/var/lib/lazycloud
      - lazycloud-cache-token:/var/lib/lazycloud/tokens:ro
      - lazycloud-cache:/var/lib/lazycloud/cache
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 7900), timeout=3).close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  garage-data:
  postgres-data:
  redis-data:
  lazycloud-files:
  lazycloud-administrator-token:
  lazycloud-cache-token:
  lazycloud-cache:
  workload-registry-data:
  tcp-ingress-tls:
  tunnel-issuer:
  connection-gateway-0:
  connection-gateway-1:

secrets:
  lazycloud-bootstrap-administrator-token:
    environment: LAZYCLOUD_TOKEN
