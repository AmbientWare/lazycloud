x-image-build-env: &image-build-env
  LAZYCLOUD_IMAGE_BUILD_EXECUTOR: "${LAZYCLOUD_IMAGE_BUILD_EXECUTOR:-build-container}"
  LAZYCLOUD_IMAGE_BUILD_DOCKER_BINARY: "${LAZYCLOUD_IMAGE_BUILD_DOCKER_BINARY:-docker}"
  LAZYCLOUD_IMAGE_BUILD_CONTAINER_ADDRESS_WAIT_TIMEOUT_SECONDS: "${LAZYCLOUD_IMAGE_BUILD_CONTAINER_ADDRESS_WAIT_TIMEOUT_SECONDS:-120}"
  LAZYCLOUD_IMAGE_BUILD_CONTAINER_ADDRESS_POLL_INTERVAL_SECONDS: "${LAZYCLOUD_IMAGE_BUILD_CONTAINER_ADDRESS_POLL_INTERVAL_SECONDS:-0.5}"
  # Empty means the workspace compute policy chooses where builds run. Pinning a
  # pool here attaches every build to that pool and silently overrides the policy,
  # so a deployment whose capacity is a connected provider queues each build for
  # local capacity that does not exist until it hits the retry limit.
  LAZYCLOUD_IMAGE_BUILD_CONTAINER_POOL_SELECTOR: "${LAZYCLOUD_IMAGE_BUILD_CONTAINER_POOL_SELECTOR:-}"
  LAZYCLOUD_IMAGE_BUILD_CONTAINER_CPU_MILLICORES: "${LAZYCLOUD_IMAGE_BUILD_CONTAINER_CPU_MILLICORES:-1000}"
