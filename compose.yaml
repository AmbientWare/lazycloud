  LAZYCLOUD_IMAGE_BUILD_REGISTRY_TARGET_REF: "${LAZYCLOUD_IMAGE_BUILD_REGISTRY_TARGET_REF:-}"
  LAZYCLOUD_IMAGE_BUILD_REGISTRY_DOCKER_BINARY: "${LAZYCLOUD_IMAGE_BUILD_REGISTRY_DOCKER_BINARY:-}"
  LAZYCLOUD_IMAGE_BUILD_REGISTRY_INSPECT_BINARY: "${LAZYCLOUD_IMAGE_BUILD_REGISTRY_INSPECT_BINARY:-skopeo}"
  LAZYCLOUD_IMAGE_BUILD_REGISTRY_INSPECT_TIMEOUT_SECONDS: "${LAZYCLOUD_IMAGE_BUILD_REGISTRY_INSPECT_TIMEOUT_SECONDS:-30}"
  LAZYCLOUD_IMAGE_BUILD_REGISTRY_INSPECT_TLS_VERIFY: "${LAZYCLOUD_IMAGE_BUILD_REGISTRY_INSPECT_TLS_VERIFY:-true}"

