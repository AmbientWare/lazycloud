name: lazycloud

x-process-env: &process-env
  LAZYCLOUD_HOME: "${LAZYCLOUD_COMPOSE_CONTAINER_HOME:-/var/lib/lazycloud}"
  LAZYCLOUD_LOG_LEVEL: "${LAZYCLOUD_LOG_LEVEL:-INFO}"

# The host and port are literal, not `${VAR:-default}`. They are a fact of this
# file's own topology: inside the stack the database is `postgres` and the cache
# is `redis`. The same names in `.env` carry the host-side addresses that
# `lazycloud-admin` uses to reach the same services, and a passthrough would hand
# those to the containers, where `localhost` is the container itself. The
# password is not topology, and is the one Postgres itself is initialized with,
# so it reads the same variable rather than a copy that can disagree with it.
x-database-env: &database-env
  LAZYCLOUD_DATABASE_URL: "postgresql+psycopg://lazycloud:${POSTGRES_PASSWORD:-lazycloud}@postgres:5432/lazycloud"
x-redis-env: &redis-env
  LAZYCLOUD_REDIS_URL: "redis://redis:6379/0"
x-gateway-env: &gateway-env
  LAZYCLOUD_GATEWAY_PUBLIC_HTTP_URL: "${LAZYCLOUD_GATEWAY_PUBLIC_HTTP_URL:-http://localhost:${LAZYCLOUD_COMPOSE_CONTROL_PLANE_PORT:-8000}}"
  LAZYCLOUD_GATEWAY_RUNTIME_HTTP_URL: "${LAZYCLOUD_GATEWAY_RUNTIME_HTTP_URL:-http://control-plane:9000}"

# Credentials for the edge that terminates TLS on customer-owned hostnames. Empty
# by default: a deployment without them serves every platform hostname exactly as
# before, and only the domain operations fail, naming what is missing.
x-cloudflare-env: &cloudflare-env
  LAZYCLOUD_CLOUDFLARE_API_TOKEN: "${LAZYCLOUD_CLOUDFLARE_API_TOKEN:-}"
  LAZYCLOUD_CLOUDFLARE_ZONE_ID: "${LAZYCLOUD_CLOUDFLARE_ZONE_ID:-}"

x-api-env: &api-env
  LAZYCLOUD_TCP_INGRESS_ENABLED: "true"
  LAZYCLOUD_TCP_INGRESS_CERTIFICATE_FILE: "/var/lib/lazycloud/tcp-ingress/tls.crt"
  LAZYCLOUD_TCP_INGRESS_KEY_FILE: "/var/lib/lazycloud/tcp-ingress/tls.key"
  LAZYCLOUD_PUBLIC_INGRESS_CLIENT_IP_HEADER: "${LAZYCLOUD_PUBLIC_INGRESS_CLIENT_IP_HEADER:-}"

x-object-store-env: &object-store-env
  LAZYCLOUD_OBJECT_STORE_BUCKET: "${LAZYCLOUD_OBJECT_STORE_BUCKET:-lazycloud-objects}"
  LAZYCLOUD_OBJECT_STORE_ENDPOINT_URL: "${LAZYCLOUD_OBJECT_STORE_ENDPOINT_URL:-http://object-store:9000}"
  # Empty is meaningful and distinct from omitted: a connected-cloud deployment
  # sets these to "" so the object store resolves the platform role through the
  # SDK credential chain and presigns against the storage endpoint itself.
  # Use "${VAR-default}" (not ":-") so an explicit empty value survives.
  LAZYCLOUD_OBJECT_STORE_PRESIGNED_ENDPOINT_URL: "${LAZYCLOUD_OBJECT_STORE_PRESIGNED_ENDPOINT_URL-http://object-store.localhost:${LAZYCLOUD_COMPOSE_OBJECT_STORE_PORT:-9002}}"
  LAZYCLOUD_OBJECT_STORE_REGION_NAME: "${LAZYCLOUD_OBJECT_STORE_REGION_NAME:-us-east-1}"
  LAZYCLOUD_OBJECT_STORE_ACCESS_KEY_ID: "${LAZYCLOUD_OBJECT_STORE_ACCESS_KEY_ID-lazycloud-local}"
  LAZYCLOUD_OBJECT_STORE_SECRET_ACCESS_KEY: "${LAZYCLOUD_OBJECT_STORE_SECRET_ACCESS_KEY-lazycloud-local-secret}"
  LAZYCLOUD_OBJECT_STORE_FORCE_PATH_STYLE: "${LAZYCLOUD_OBJECT_STORE_FORCE_PATH_STYLE:-true}"

x-image-build-env: &image-build-env
  LAZYCLOUD_IMAGE_BUILD_EXECUTOR: "build-container"
  LAZYCLOUD_IMAGE_BUILD_CONTAINER_ADDRESS_WAIT_TIMEOUT_SECONDS: "120"
  LAZYCLOUD_IMAGE_BUILD_CONTAINER_ADDRESS_POLL_INTERVAL_SECONDS: "0.5"
  # Empty means the workspace compute policy chooses where builds run. Pinning a
  # pool here attaches every build to that pool and silently overrides the policy,
  # so a deployment whose capacity is a connected provider queues each build for
  # local capacity that does not exist until it hits the retry limit.

# The release a deployment points at publishes the agent artifact version and
# digest, the URL serving it, the container-worker image, the customer
# authorization template, and the baked CPU AMIs. Every process that composes a
# pool bootstrap needs the same one.
x-release-env: &release-env
  LAZYCLOUD_RELEASE_MANIFEST_URL: "${LAZYCLOUD_RELEASE_MANIFEST_URL:-}"

x-agent-binary-env: &agent-binary-env
  LAZYCLOUD_AGENT_BINARY_DIR: "${LAZYCLOUD_AGENT_BINARY_DIR:-/var/lib/lazycloud/agent-binarys}"

x-aws-compute-env: &aws-compute-env
  LAZYCLOUD_AWS_CONNECTION_ENABLED: "${LAZYCLOUD_AWS_CONNECTION_ENABLED:-false}"
  LAZYCLOUD_AWS_CONNECTION_CONTROL_PRINCIPAL_ARN: "${LAZYCLOUD_AWS_CONNECTION_CONTROL_PRINCIPAL_ARN:-}"
  LAZYCLOUD_AWS_CAPACITY_INSTANCE_HOURLY_MICROS: "${LAZYCLOUD_AWS_CAPACITY_INSTANCE_HOURLY_MICROS:-{}}"

x-scheduler-env: &scheduler-env
  LAZYCLOUD_COMPUTE_RECLAIM_REGISTRATION_DEADLINE_SECONDS: "3600"

x-tailnet-env: &tailnet-env
  # The deployment's tailnet posture, not one process's: the control plane
  # runs the daemon, and the scheduler refuses to start a connected
  # deployment that declares no tailnet. Constructing a runtime is what
  # starts a daemon, and only the control plane does that.
  LAZYCLOUD_TAILNET_MODE: "${LAZYCLOUD_TAILNET_MODE:-managed}"
  LAZYCLOUD_TAILNET_OAUTH_CLIENT_ID: "${LAZYCLOUD_TAILNET_OAUTH_CLIENT_ID:-}"
  LAZYCLOUD_TAILNET_AGENT_TAG: "${LAZYCLOUD_TAILNET_AGENT_TAG:-tag:lazycloud-agent}"
  LAZYCLOUD_TAILNET_CONTROL_PLANE_TAG: "${LAZYCLOUD_TAILNET_CONTROL_PLANE_TAG:-tag:lazycloud-control-plane}"
  LAZYCLOUD_TAILNET_AUTH_KEY_TTL_SECONDS: "${LAZYCLOUD_TAILNET_AUTH_KEY_TTL_SECONDS:-300}"
  LAZYCLOUD_TAILNET_CONTROL_URL: "${LAZYCLOUD_TAILNET_CONTROL_URL:-}"

x-usage-credentials: &usage-credentials
  LAZYCLOUD_USAGE_METRICS_OPENMETER_API_KEY: "${LAZYCLOUD_USAGE_METRICS_OPENMETER_API_KEY:-}"

x-platform-aws-credentials: &platform-aws-credentials
  AWS_REGION: "${AWS_REGION:-us-east-1}"
  AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
  AWS_CONFIG_FILE: /run/lazycloud/aws/config
  AWS_SHARED_CREDENTIALS_FILE: /run/lazycloud/aws/credentials
  AWS_SDK_LOAD_CONFIG: "1"
  AWS_PROFILE: "${LAZYCLOUD_COMPOSE_AWS_PROFILE:-compose-control}"

x-platform-aws-config: &platform-aws-config
  "${LAZYCLOUD_COMPOSE_AWS_CONFIG_DIR:-$HOME/.lazycloud/compose-aws}:/run/lazycloud/aws:ro"

x-tailnet-control-credentials: &tailnet-control-credentials
  LAZYCLOUD_TAILNET_OAUTH_CLIENT_SECRET: "${LAZYCLOUD_TAILNET_OAUTH_CLIENT_SECRET:-}"

x-backend-route-credentials: &backend-route-credentials
  LAZYCLOUD_BACKEND_ROUTE_AUTH_KEY: "${LAZYCLOUD_BACKEND_ROUTE_AUTH_KEY:-}"

x-container-service-credentials: &container-service-credentials
  LAZYCLOUD_CONTAINER_SERVICE_TOKEN: "${LAZYCLOUD_CONTAINER_SERVICE_TOKEN:-}"

x-cache-origin-registry: &cache-origin-registry
  LAZYCLOUD_IMAGE_REGISTRY_STORE: "s3"
  LAZYCLOUD_BUILD_REGISTRY: "${LAZYCLOUD_BUILD_REGISTRY:-}"
  LAZYCLOUD_BUILD_REGISTRY_CREDENTIALS: "${LAZYCLOUD_BUILD_REGISTRY_CREDENTIALS:-}"
  LAZYCLOUD_BUILD_REGISTRY_CREDENTIALS_SECRET: "${LAZYCLOUD_BUILD_REGISTRY_CREDENTIALS_SECRET:-}"

x-database-bootstrap-env: &database-bootstrap-env
  LAZYCLOUD_HOME: "${LAZYCLOUD_COMPOSE_CONTAINER_HOME:-/var/lib/lazycloud}"
  LAZYCLOUD_LOG_LEVEL: "${LAZYCLOUD_LOG_LEVEL:-INFO}"
  LAZYCLOUD_DATABASE_URL: "postgresql+psycopg://lazycloud:${POSTGRES_PASSWORD:-lazycloud}@postgres:5432/lazycloud"

x-lazycloud-build-args: &lazycloud-build-args
  TAILSCALE_IMAGE: "${LAZYCLOUD_TAILSCALE_IMAGE:-tailscale/tailscale:v1.98.8}"

x-lazycloud-depends: &lazycloud-depends
  postgres:
    condition: service_healthy
  database-bootstrap:
    condition: service_completed_successfully
  redis:
    condition: service_healthy
  object-store:
    condition: service_healthy
  object-store-bucket:
    condition: service_completed_successfully

x-lazycloud-role-depends: &lazycloud-role-depends
  control-plane:
    condition: service_healthy

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "lazycloud"
      POSTGRES_USER: "lazycloud"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-lazycloud}"
    ports:
      - "${LAZYCLOUD_COMPOSE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lazycloud -d lazycloud"]
      interval: 5s
      timeout: 3s
      retries: 20

  database-bootstrap:
    image: database-bootstrap:local
    build:
      context: .
      dockerfile: docker/Dockerfile.control-plane
      target: database-bootstrap
      args: *lazycloud-build-args
    command: ["lazycloud-admin", "database", "initialize"]
    environment: *database-bootstrap-env
    depends_on:
      postgres:
        condition: service_healthy

  administrator-bootstrap:
    image: database-bootstrap:local
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        token_path=/var/lib/lazycloud/bootstrap/administrator-token
        umask 077
        lazycloud-admin --json auth bootstrap \
          --username "$${LAZYCLOUD_ADMINISTRATOR_USERNAME:-admin}" \
          --password-file /run/secrets/lazycloud-administrator-password \
          --token-file /run/secrets/lazycloud-administrator-token \
          --output "$$token_path"
        if test -e "$$token_path"; then
          test "$$(stat -c '%a' "$$token_path")" = "600"
        fi
    environment:
      <<: [*database-bootstrap-env, *object-store-env]
      LAZYCLOUD_ADMINISTRATOR_USERNAME: "${LAZYCLOUD_ADMINISTRATOR_USERNAME:-admin}"
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
      object-store-bucket:
        condition: service_completed_successfully
    volumes:
      - lazycloud-administrator-token:/var/lib/lazycloud/bootstrap
    secrets:
      - source: lazycloud-bootstrap-administrator-token
        target: lazycloud-administrator-token
        mode: 0400
      - source: lazycloud-bootstrap-administrator-password
        target: lazycloud-administrator-password
        mode: 0400

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${LAZYCLOUD_COMPOSE_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  object-store:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_BUCKET: "lazycloud-objects"
      GARAGE_DEFAULT_ACCESS_KEY: "lazycloud-local"
      GARAGE_DEFAULT_SECRET_KEY: "lazycloud-local-secret"
    ports:
      - "${LAZYCLOUD_COMPOSE_OBJECT_STORE_PORT:-9002}:9000"
      - "${LAZYCLOUD_COMPOSE_OBJECT_STORE_ADMIN_PORT:-3903}:3903"
    volumes:
      - ./deploy/garage/garage.toml:/etc/garage.toml:ro
      - object-store-data:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 3s
      retries: 20

  object-store-bucket:
    image: amazon/aws-cli:2.28.3
    depends_on:
      object-store:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: "lazycloud-local"
      AWS_SECRET_ACCESS_KEY: "lazycloud-local-secret"
      AWS_DEFAULT_REGION: "us-east-1"
      AWS_EC2_METADATA_DISABLED: "true"
      GARAGE_ENDPOINT_URL: "http://object-store:9000"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for bucket in lazycloud-objects default lazycloud-data lazycloud-source-packages; do
          if aws --endpoint-url "$$GARAGE_ENDPOINT_URL" s3api head-bucket --bucket "$$bucket" >/dev/null 2>&1; then
            continue
          fi
          aws --endpoint-url "$$GARAGE_ENDPOINT_URL" s3api create-bucket --bucket "$$bucket" \
            || aws --endpoint-url "$$GARAGE_ENDPOINT_URL" s3api head-bucket --bucket "$$bucket" >/dev/null
        done

  tcp-certificate:
    image: api:local
    command:
      [
        "lazycloud-tcp-certificate",
        "--certificate-file",
        "/var/lib/lazycloud/tcp-ingress/tls.crt",
        "--key-file",
        "/var/lib/lazycloud/tcp-ingress/tls.key",
        "--external-host",
        "${LAZYCLOUD_TCP_INGRESS_EXTERNAL_HOST:-tcp.localhost}",
      ]
    volumes:
      - tcp-ingress-tls:/var/lib/lazycloud/tcp-ingress

  control-plane:
    image: api:local
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile.control-plane
      target: api
      args: *lazycloud-build-args
    command:
      [
        "lazycloud-api",
        "--host",
        "0.0.0.0",
        "--port",
        "9000",
        "--log-level",
        "${LAZYCLOUD_LOG_LEVEL:-INFO}",
      ]
    environment:
      <<:
        [
          *process-env,
          *database-env,
          *redis-env,
          *gateway-env,
          *cloudflare-env,
          *api-env,
          *object-store-env,
          *image-build-env,
          *release-env,
          *agent-binary-env,
          *aws-compute-env,
          *usage-credentials,
          *tailnet-env,
          *platform-aws-credentials,
          *tailnet-control-credentials,
          *backend-route-credentials,
          *container-service-credentials,
          *cache-origin-registry,
        ]
      # Each replica keeps its own device name and none of them is the address:
      # callers are given the Tailscale Service every replica advertises, so a
      # suffixed device name costs nothing and no caller holds one.
      LAZYCLOUD_TAILNET_HOSTNAME: "${LAZYCLOUD_TAILNET_REPLICA_HOSTNAME:-lazycloud-control-plane-replica}"
      # Container-local, never a shared volume: replicas would otherwise open the
      # same tailscaled socket and all but the first would fail to start.
      LAZYCLOUD_TAILNET_STATE_DIR: "/run/lazycloud/tailnet"
      # The device goes away with the replica. Nothing was ever given its
      # address, and a durable one would leave a dead peer per restart.
      LAZYCLOUD_TAILNET_EPHEMERAL_DEVICE: "true"
    # One here only because this service publishes fixed host ports, which Compose
    # cannot hand to a second container. Nothing in the process is singular: the
    # tailnet service accepts as many advertisers as start, and the deployment
    # scales by running this image somewhere that does not need a host port.
    deploy:
      replicas: 1
    ports:
      - "${LAZYCLOUD_COMPOSE_CONTROL_PLANE_PORT:-8000}:9000"
      - "${LAZYCLOUD_COMPOSE_TCP_INGRESS_PORT:-1995}:1995"
    depends_on:
      <<: *lazycloud-depends
      administrator-bootstrap:
        condition: service_completed_successfully
      tcp-certificate:
        condition: service_completed_successfully
    # The control plane runs its own tailscaled rather than borrowing a sidecar's
    # network namespace. These are the same grants every agent already holds, and
    # a real TUN device is required: workers reach this process inbound by its
    # tailnet name, which userspace networking cannot bind.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - lazycloud-files:/var/lib/lazycloud
      - "${LAZYCLOUD_COMPOSE_AGENT_BINARY_DIR:-./.lazycloud/agent-binarys}:/var/lib/lazycloud/agent-binarys:ro"
      - tcp-ingress-tls:/var/lib/lazycloud/tcp-ingress:ro
      - *platform-aws-config
    healthcheck:
      # Loopback rather than the advertised address: a replica has to prove it
      # serves before it can be one of the things that address resolves to, so a
      # check that went out through the tailnet could never pass on a cold start.
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:9000/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  cli:
    profiles: ["tools"]
    image: cli:local
    build:
      context: .
      dockerfile: docker/Dockerfile.control-plane
      target: cli
      args: *lazycloud-build-args
    command: ["lazycloud-admin", "--help"]
    environment:
      <<:
        [
          *process-env,
          *database-env,
          *redis-env,
          *gateway-env,
          *cloudflare-env,
          *object-store-env,
          *image-build-env,
          *agent-binary-env,
          *usage-credentials,
          *tailnet-env,
          *tailnet-control-credentials,
          *backend-route-credentials,
          *container-service-credentials,
        ]
    depends_on:
      control-plane:
        condition: service_healthy
    volumes:
      - lazycloud-files:/var/lib/lazycloud

  public-ingress:
    profiles:
      - public-ingress
    image: "${LAZYCLOUD_CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.7.3}"
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_healthy
    command:
      - tunnel
      - --config
      - /etc/cloudflared/cloudflared.yml
      - run
    volumes:
      # The route allowlist is reviewed in this repository, not held in the
      # Cloudflare dashboard: the tunnel is created with `config_src: local`, so
      # the edge pushes no ingress configuration and this file is the only
      # source of what is exposed.
      - "./deploy/public-ingress/cloudflared.yml:/etc/cloudflared/cloudflared.yml:ro"
      - "${LAZYCLOUD_PUBLIC_INGRESS_CREDENTIALS_FILE:-/dev/null}:/etc/cloudflared/credentials.json:ro"
    environment:
      TUNNEL_METRICS: "127.0.0.1:20241"

  agent-join-token:
    image: cli:local
    build:
      context: .
      dockerfile: docker/Dockerfile.control-plane
      target: cli
      args: *lazycloud-build-args
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        state_dir="${LAZYCLOUD_COMPOSE_AGENT_STATE_DIR:-/var/lib/lazycloud/agent}"
        token_path="$$state_dir/join-token"
        mkdir -p "$$state_dir"
        chmod 0700 "$$state_dir"
        export GATEWAY_TOKEN="$$(cat /run/secrets/lazycloud-administrator-token)"
        temporary="$${token_path}.tmp"
        rm -f "$$temporary"
        # Retried, because health is a lagging signal: the ingress reports what
        # was true at its last probe, and a replica recreated since then refuses
        # until it is listening. One attempt turns that window into a stack with
        # no join credential and an agent that never arrives.
        attempt=1
        until lazycloud-admin --json machine join-token --pool "${LAZYCLOUD_COMPOSE_CONTAINER_WORKER_POOL:-lazycloud}" --ttl 15m \
          | python -c \
              'import json, pathlib, sys; pathlib.Path(sys.argv[1]).write_text(json.load(sys.stdin)["token"], encoding="utf-8")' \
              "$$temporary"
        do
          if [ "$$attempt" -ge 30 ]; then
            echo "no control plane issued a join credential after $$attempt attempts" >&2
            exit 1
          fi
          attempt=$$((attempt + 1))
          sleep 2
        done
        chmod 0600 "$$temporary"
        mv "$$temporary" "$$token_path"
        echo "compose agent one-use join credential initialized"
    environment:
      GATEWAY_HTTP_URL: "http://control-plane:9000"
      WORKSPACE_ID: "default"
    depends_on:
      control-plane:
        condition: service_healthy
    volumes:
      - "${LAZYCLOUD_COMPOSE_AGENT_STATE_DIR:-/var/lib/lazycloud/agent}:${LAZYCLOUD_COMPOSE_AGENT_STATE_DIR:-/var/lib/lazycloud/agent}"
    secrets:
      - source: lazycloud-bootstrap-administrator-token
        target: lazycloud-administrator-token
        mode: 0400

  agent:
    image: agent:local
    restart: unless-stopped
    init: true
    privileged: true
    build:
      context: .
      dockerfile: deploy/agent-binary/Dockerfile
      target: agent-runtime
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        compose_gateway="$$(ip -4 route show default | awk '/default/ {print $$3; exit}')"
        if [ -z "$$compose_gateway" ]; then
          echo "Docker gateway is required for the agent-managed worker" >&2
          exit 2
        fi
        gateway_url="http://$${compose_gateway}:${LAZYCLOUD_COMPOSE_CONTROL_PLANE_PORT:-8000}"
        exec lazycloud-agent join \
          --gateway "$$gateway_url" \
          --join-token-file "${LAZYCLOUD_COMPOSE_AGENT_STATE_DIR:-/var/lib/lazycloud/agent}/join-token" \
          --state-dir "${LAZYCLOUD_COMPOSE_AGENT_STATE_DIR:-/var/lib/lazycloud/agent}" \
          --hostname "${LAZYCLOUD_COMPOSE_AGENT_HOSTNAME:-compose-agent}" \
          --machine-fingerprint "${LAZYCLOUD_COMPOSE_AGENT_MACHINE_FINGERPRINT:-compose-agent}" \
          --worker-image "container-worker:local" \
          --worker-route-target "$$compose_gateway" \
          --worker-runtime-http-url "$$gateway_url" \
          --worker-network "host" \
          --worker-bridge-name "${LAZYCLOUD_COMPOSE_AGENT_WORKER_BRIDGE:-rt_br0}" \
          --worker-bridge-subnet "${LAZYCLOUD_COMPOSE_AGENT_WORKER_SUBNET:-192.168.0.0/20}" \
          --worker-bridge-ipv6-subnet "${LAZYCLOUD_COMPOSE_AGENT_WORKER_IPV6_SUBNET:-fd00:abcd::/64}" \
          --worker-host-alias "object-store.localhost:host-gateway" \
          --max-cpu "${LAZYCLOUD_COMPOSE_AGENT_MAX_CPU_CORES:-4}" \
          --max-memory "${LAZYCLOUD_COMPOSE_CONTAINER_WORKER_MEMORY_MIB:-8192}MiB" \
          --stream-interval-seconds "${LAZYCLOUD_COMPOSE_AGENT_STREAM_INTERVAL_SECONDS:-1}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    devices:
      - /dev/fuse:/dev/fuse
    environment:
      # Forwarded to worker slots so they can back platform volumes. Platform
      # deployments set these; agents on customer infrastructure do not, and
      # their slots refuse volume work instead of writing to disposable disk.
      DATA_STORAGE_BUCKET: "lazycloud-data"
      DATA_STORAGE_ENDPOINT_URL: "http://object-store:9000"
      DATA_STORAGE_REGION_NAME: "us-east-1"
      DATA_STORAGE_ACCESS_KEY_ID: "lazycloud-local"
      DATA_STORAGE_SECRET_ACCESS_KEY: "${DATA_STORAGE_SECRET_ACCESS_KEY:-lazycloud-local-secret}"
      DATA_STORAGE_FORCE_PATH_STYLE: "true"
    depends_on:
      agent-join-token:
        condition: service_completed_successfully
      cache-server:
        condition: service_healthy
    volumes:
      - "${LAZYCLOUD_COMPOSE_AGENT_STATE_DIR:-/var/lib/lazycloud/agent}:${LAZYCLOUD_COMPOSE_AGENT_STATE_DIR:-/var/lib/lazycloud/agent}"
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/run/netns:/var/run/netns
    healthcheck:
      test:
        [
          "CMD",
          "test",
          "-s",
          "${LAZYCLOUD_COMPOSE_AGENT_STATE_DIR:-/var/lib/lazycloud/agent}/runtime-ready.json",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  workspace-bootstrap:
    # The second tenant. `administrator-bootstrap` creates `default` and cannot run
    # twice, and `workspace set` records a storage document without creating the
    # bucket it describes, so this is the only route to a workspace that can run
    # anything.
    image: cli:local
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export GATEWAY_TOKEN="$$(cat /run/secrets/lazycloud-administrator-token)"
        name="${LAZYCLOUD_COMPOSE_AGENT_2_WORKSPACE:-tenant-b}"
        pool="${LAZYCLOUD_COMPOSE_AGENT_2_POOL:-lazycloud-b}"
        lazycloud-admin --json workspace show "$$name" >/dev/null 2>&1 \
          || lazycloud-admin --json workspace create "$$name" >/dev/null
        # Every workspace defaults to the same pool name, which is the first agent's.
        # Left alone this tenant's work is placed on the other tenant's machine, and
        # the worker that owns it refuses the request on arrival.
        lazycloud-admin --json compute policy update \
          --workspace "$$name" --default-pool "$$pool" >/dev/null
        echo "compose second workspace ready: $$name in pool $$pool"
    environment:
      GATEWAY_HTTP_URL: "http://control-plane:9000"
    depends_on:
      control-plane:
        condition: service_healthy
    secrets:
      - source: lazycloud-bootstrap-administrator-token
        target: lazycloud-administrator-token
        mode: 0400

  agent-join-token-2:
    image: cli:local
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        state_dir="${LAZYCLOUD_COMPOSE_AGENT_2_STATE_DIR:-/var/lib/lazycloud/agent-2}"
        token_path="$$state_dir/join-token"
        mkdir -p "$$state_dir"
        chmod 0700 "$$state_dir"
        export GATEWAY_TOKEN="$$(cat /run/secrets/lazycloud-administrator-token)"
        temporary="$${token_path}.tmp"
        rm -f "$$temporary"
        attempt=1
        until lazycloud-admin --json machine join-token --pool "${LAZYCLOUD_COMPOSE_AGENT_2_POOL:-lazycloud-b}" --ttl 15m \
          | python -c \
              'import json, pathlib, sys; pathlib.Path(sys.argv[1]).write_text(json.load(sys.stdin)["token"], encoding="utf-8")' \
              "$$temporary"
        do
          if [ "$$attempt" -ge 30 ]; then
            echo "no control plane issued a join credential after $$attempt attempts" >&2
            exit 1
          fi
          attempt=$$((attempt + 1))
          sleep 2
        done
        chmod 0600 "$$temporary"
        mv "$$temporary" "$$token_path"
        echo "compose second-tenant agent one-use join credential initialized"
    environment:
      GATEWAY_HTTP_URL: "http://control-plane:9000"
      # The workspace this credential is minted in, and so the workspace the machine
      # joining with it belongs to. Read from the environment by the admin client and
      # sent as a query parameter; the bootstrap administrator token is the one
      # credential authorized to mint across workspaces.
      WORKSPACE_ID: "${LAZYCLOUD_COMPOSE_AGENT_2_WORKSPACE:-tenant-b}"
    depends_on:
      control-plane:
        condition: service_healthy
      workspace-bootstrap:
        condition: service_completed_successfully
    volumes:
      - "${LAZYCLOUD_COMPOSE_AGENT_2_STATE_DIR:-/var/lib/lazycloud/agent-2}:${LAZYCLOUD_COMPOSE_AGENT_2_STATE_DIR:-/var/lib/lazycloud/agent-2}"
    secrets:
      - source: lazycloud-bootstrap-administrator-token
        target: lazycloud-administrator-token
        mode: 0400

  agent-2:
    # The second tenant's capacity, so multi-tenant behaviour is exercised by the
    # ordinary stack rather than assembled by hand for one test. Same image and same
    # flags as `agent`; what differs is the five values that must, because nothing
    # coordinates two agents sharing a host. The fingerprint decides the machine id,
    # so a shared one makes the agents evict each other's credentials. The bridge
    # decides which addresses its workers hand out, and each agent allocates inside
    # its own control-plane scope, so a shared bridge is two allocators issuing one
    # address with no lock between them.
    image: agent:local
    restart: unless-stopped
    init: true
    privileged: true
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        compose_gateway="$$(ip -4 route show default | awk '/default/ {print $$3; exit}')"
        if [ -z "$$compose_gateway" ]; then
          echo "Docker gateway is required for the agent-managed worker" >&2
          exit 2
        fi
        gateway_url="http://$${compose_gateway}:${LAZYCLOUD_COMPOSE_CONTROL_PLANE_PORT:-8000}"
        exec lazycloud-agent join \
          --gateway "$$gateway_url" \
          --join-token-file "${LAZYCLOUD_COMPOSE_AGENT_2_STATE_DIR:-/var/lib/lazycloud/agent-2}/join-token" \
          --state-dir "${LAZYCLOUD_COMPOSE_AGENT_2_STATE_DIR:-/var/lib/lazycloud/agent-2}" \
          --hostname "${LAZYCLOUD_COMPOSE_AGENT_2_HOSTNAME:-compose-agent-2}" \
          --machine-fingerprint "${LAZYCLOUD_COMPOSE_AGENT_2_MACHINE_FINGERPRINT:-compose-agent-2}" \
          --worker-image "container-worker:local" \
          --worker-route-target "$$compose_gateway" \
          --worker-runtime-http-url "$$gateway_url" \
          --worker-network "host" \
          --worker-bridge-name "${LAZYCLOUD_COMPOSE_AGENT_2_WORKER_BRIDGE:-rt_br1}" \
          --worker-bridge-subnet "${LAZYCLOUD_COMPOSE_AGENT_2_WORKER_SUBNET:-192.168.16.0/20}" \
          --worker-bridge-ipv6-subnet "${LAZYCLOUD_COMPOSE_AGENT_2_WORKER_IPV6_SUBNET:-fd00:abce::/64}" \
          --worker-host-alias "object-store.localhost:host-gateway" \
          --max-cpu "${LAZYCLOUD_COMPOSE_AGENT_2_MAX_CPU_CORES:-4}" \
          --max-memory "${LAZYCLOUD_COMPOSE_AGENT_2_MEMORY_MIB:-8192}MiB" \
          --stream-interval-seconds "${LAZYCLOUD_COMPOSE_AGENT_STREAM_INTERVAL_SECONDS:-1}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    devices:
      - /dev/fuse:/dev/fuse
    environment:
      DATA_STORAGE_BUCKET: "lazycloud-data"
      DATA_STORAGE_ENDPOINT_URL: "http://object-store:9000"
      DATA_STORAGE_REGION_NAME: "us-east-1"
      DATA_STORAGE_ACCESS_KEY_ID: "lazycloud-local"
      DATA_STORAGE_SECRET_ACCESS_KEY: "${DATA_STORAGE_SECRET_ACCESS_KEY:-lazycloud-local-secret}"
      DATA_STORAGE_FORCE_PATH_STYLE: "true"
    depends_on:
      agent-join-token-2:
        condition: service_completed_successfully
      cache-server:
        condition: service_healthy
    volumes:
      - "${LAZYCLOUD_COMPOSE_AGENT_2_STATE_DIR:-/var/lib/lazycloud/agent-2}:${LAZYCLOUD_COMPOSE_AGENT_2_STATE_DIR:-/var/lib/lazycloud/agent-2}"
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/run/netns:/var/run/netns
    healthcheck:
      test:
        [
          "CMD",
          "test",
          "-s",
          "${LAZYCLOUD_COMPOSE_AGENT_2_STATE_DIR:-/var/lib/lazycloud/agent-2}/runtime-ready.json",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  scheduler:
    image: scheduler:local
    # Two, like the control plane. The work that spends money already
    # serialises on a Redis key per capacity owner; what needed fixing was the
    # orphan confirmation window and pod expiry, both of which decided from
    # process-local state.
    deploy:
      replicas: 2
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile.control-plane
      target: scheduler
      args: *lazycloud-build-args
    command:
      [
        "lazycloud-scheduler",
        "--interval-seconds",
        "${LAZYCLOUD_COMPOSE_SCHEDULER_INTERVAL_SECONDS:-1.0}",
        "--container-limit",
        "${LAZYCLOUD_COMPOSE_SCHEDULER_CONTAINER_LIMIT:-100}",
      ]
    environment:
      <<:
        [
          *process-env,
          *database-env,
          *redis-env,
          *gateway-env,
          *cloudflare-env,
          *object-store-env,
          *release-env,
          *agent-binary-env,
          *aws-compute-env,
          *usage-credentials,
          *scheduler-env,
          *tailnet-env,
          *platform-aws-credentials,
          *tailnet-control-credentials,
          *backend-route-credentials,
          *container-service-credentials,
        ]
    depends_on: *lazycloud-role-depends
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "shared.process_liveness",
          "/tmp/lazycloud-scheduler.heartbeat",
          "--max-age-seconds",
          "${LAZYCLOUD_COMPOSE_SCHEDULER_LIVENESS_MAX_AGE_SECONDS:-120}",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - lazycloud-files:/var/lib/lazycloud
      - *platform-aws-config

  container-worker:
    # Built here, run by the agent. Every worker container is created by the
    # agent from this image with the identity, capacity, and credentials the
    # control plane assigned that slot, so nothing here can be a second worker:
    # a replica count of zero is what makes `up` produce the image without also
    # starting a process that has no slot to serve.
    image: container-worker:local
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      target: container-worker
      args: *lazycloud-build-args
    deploy:
      replicas: 0

  cache-token:
    image: cache-server:local
    command:
      - python
      - -c
      - "from pathlib import Path; import secrets; p=Path('/var/lib/lazycloud/tokens/cache-service-token'); p.parent.mkdir(parents=True, exist_ok=True); existing=p.read_text(encoding='utf-8').strip() if p.exists() else ''; p.write_text(existing or secrets.token_urlsafe(48), encoding='utf-8'); p.chmod(0o400)"
    volumes:
      - lazycloud-cache-token:/var/lib/lazycloud/tokens

  cache-server:
    image: cache-server:local
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile.control-plane
      target: cache-server
      args: *lazycloud-build-args
    command:
      [
        "lazycloud-cache-server",
        "--host",
        "0.0.0.0",
        "--port",
        "7900",
        "--root",
        "/var/lib/lazycloud/cache",
      ]
    environment:
      LAZYCLOUD_HOME: "${LAZYCLOUD_COMPOSE_CONTAINER_HOME:-/var/lib/lazycloud}"
      LAZYCLOUD_CACHE_SERVICE_TOKEN: "${LAZYCLOUD_CACHE_SERVICE_TOKEN:-}"
      LAZYCLOUD_CACHE_SERVICE_TOKEN_FILE: "${LAZYCLOUD_CACHE_SERVICE_TOKEN_FILE:-/var/lib/lazycloud/tokens/cache-service-token}"
      LAZYCLOUD_CACHE_SERVICE_PREVIOUS_TOKEN: "${LAZYCLOUD_CACHE_SERVICE_PREVIOUS_TOKEN:-}"
      LAZYCLOUD_CACHE_MAX_CONTENT_BYTES: "21474836480"
      LAZYCLOUD_CACHE_MAX_OBJECT_BYTES: "8589934592"
      LAZYCLOUD_CACHE_MAX_METADATA_ENTRIES: "100000"
      LAZYCLOUD_CACHE_MAX_PATH_BYTES: "4096"
      LAZYCLOUD_CACHE_DISK_MAX_USAGE_PCT: "0.90"
      LAZYCLOUD_CACHE_DISK_EVICT_WATERMARK_PCT: "0.85"
    depends_on:
      <<: *lazycloud-role-depends
      cache-token:
        condition: service_completed_successfully
    volumes:
      - lazycloud-files:/var/lib/lazycloud
      - lazycloud-cache-token:/var/lib/lazycloud/tokens:ro
      - lazycloud-cache:/var/lib/lazycloud/cache
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 7900), timeout=3).close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
  object-store-data:
  lazycloud-files:
  lazycloud-administrator-token:
  lazycloud-cache-token:
  lazycloud-cache:
  tcp-ingress-tls:

secrets:
  lazycloud-bootstrap-administrator-token:
    environment: LAZYCLOUD_TOKEN
  lazycloud-bootstrap-administrator-password:
    environment: LAZYCLOUD_ADMINISTRATOR_PASSWORD
