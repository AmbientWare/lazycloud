[project]
name = "infrastructure"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aws-cdk-lambda-layer-kubectl-v32>=2.1.0",
    "aws-cdk-lib>=2.231.0",
    "constructs>=10.4.3",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "ruff>=0.14.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infrastructure"]
