# Talos sandbox worker node patch for LazyCloud on Hetzner Cloud
# Sandbox pool: runs customer gVisor workloads on dedicated vCPU (CCX33)
# Platform pool uses a separate Talos config (no gVisor, instance-class=platform)
# Storage: JuiceFS CSI (runs as pods, needs FUSE — built into Talos kernel)

machine:
  # Extensions: gVisor runtime
  install:
    extensions:
      - image: ghcr.io/siderolabs/gvisor:20240826.0-v1.8.0
  # Kubelet configuration
  kubelet:
    extraArgs:
      cloud-provider: external
      register-with-taints: "instance-class=sandbox:NoSchedule"
    nodeIP:
      validSubnets:
        - 10.0.1.0/24
  # Node labels for workload scheduling
  nodeLabels:
    instance-class: sandbox
    runtime: gvisor
  # Network configuration
  network:
    hostname: ""  # Set by Terraform
    nameservers:
      - 1.1.1.1
      - 8.8.8.8
    interfaces:
      - deviceSelector:
          physical: true
        dhcp: true
  # Time synchronization
  time:
    servers:
      - time.cloudflare.com
